# .github/workflows/backtest_bench.yml
# Разовый стенд бэктеста скоринга. Запуск ТОЛЬКО руками (workflow_dispatch).
# Бота не трогает, Gist не пишет, ключ CoinGecko не нужен.
name: Backtest bench (ручной запуск)

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Глубина истории в годах (3 = ~156 дат)"
        default: "3"
      source:
        description: "auto | vision | dataapi | binance | cg"
        default: "auto"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        # Без pipefail связка `python ... | tee` возвращает код tee, то есть
        # ноль, и упавший шаг выглядит успешным. Прогон 10.08 так и выглядел.
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install numpy requests

      - uses: actions/cache@v4
        with:
          path: bench/cache
          key: bench-${{ inputs.source }}-${{ inputs.years }}y-v2

      # 20 секунд: какие источники вообще отвечают с этого раннера.
      - name: Диагностика источников
        run: cd bench && python backtest_bench.py --probe 2>&1 | tee probe.txt

      - name: Самопроверка стенда (офлайн)
        run: |
          cd bench
          python backtest_bench.py --selftest --seeds 10 \
            --html ../index.html --bot ../main.py 2>&1 | tee selftest.txt

      - name: Закачка истории
        run: |
          cd bench
          python backtest_bench.py --fetch --source ${{ inputs.source }} \
            --years ${{ inputs.years }} --html ../index.html --bot ../main.py \
            2>&1 | tee fetch.txt

      - name: Сверка восстановления с живым coeffs.json
        run: cd bench && python backtest_bench.py --verify --bot ../main.py 2>&1 | tee verify.txt

      - name: Прогон
        run: |
          cd bench
          for H in 3 7 14; do
            python backtest_bench.py --run --horizon $H --step 7 \
              --html ../index.html --bot ../main.py 2>&1 | tee -a report.txt
          done

      # Артефакт нужен именно тогда, когда что-то упало.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-report
          path: |
            bench/probe.txt
            bench/selftest.txt
            bench/fetch.txt
            bench/verify.txt
            bench/report.txt
            bench/run_raw.json
          if-no-files-found: warn
