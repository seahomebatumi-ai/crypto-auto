# .github/workflows/bench.yml
# Ворота стендов. Гоняет ТОЛЬКО те стенды, которым не нужен внешний архив
# data.binance.vision и прогретый кэш. Бота не запускает, Gist не пишет,
# ключ CoinGecko не нужен.
#
# Вне этих ворот намеренно оставлены:
#   backtest_bench.py  — нужен архив/кэш, обслуживается backtest_bench.yml
#   badge_bench.js     — читает index.html.prev, которого в репозитории нет
#   clean_bench.py     — требует два позиционных HTML (before/after), их нет
#   direction_bench.py --identity  — читает orig.html, которого нет
name: Bench gate

on:
  push:
    # ТЗ-07 §6. Ветка без pull request исполняла ворота НИ РАЗУ: триггеры были
    # `push` в main и `pull_request`, и 1 199 724 проверки ТЗ-06 не прошли ни
    # на одном раннере до слияния. `claude/**` закрывает ровно эту дыру.
    # Шире (`'**'`) не берём сознательно: суточные коммиты журнала уже
    # отсечены paths-ignore, а лишние ветки — это минуты раннера без покрытия.
    branches: [ main, 'claude/**' ]
    # Журнал коммитит СВОИ данные в main раз в сутки (journal.yml). Гонять по
    # ним весь набор стендов не за чем: ни одна строка кода при этом не
    # меняется. Стенд самого журнала при правке journal/write.js всё равно
    # запустится — путь bench/journal_bench.js под этот игнор не попадает.
    paths-ignore:
      - 'journal/data/**'
      - 'journal/out/**'
      - 'journal/runs.jsonl'
      - 'analyst/**'
  pull_request:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # Без pipefail связка `python ... | tee` возвращает код tee, то есть
        # ноль, и упавший шаг выглядит успешным (инв. 25). Здесь конвейеров
        # нет вовсе, так что код интерпретатора доходит до раннера напрямую.
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # verify_bench.py импортирует backtest_bench.py, а тот тянет numpy и
      # requests на уровне модуля. Сеть при этом не используется: requests
      # подменяется заглушкой внутри стенда.
      - name: Зависимости
        run: pip install numpy requests

      - name: Доска 19.08 против продакшн-математики (verify_board.js)
        run: node bench/verify_board.js

      - name: Доска 20.08, LONG + SHORT + два экрана (board2_bench.js)
        run: node bench/board2_bench.js

      - name: Блок «ЗАЩИТА ПОЗИЦИИ» + фаззинг доски (prot_bench.js)
        run: node bench/prot_bench.js index.html

      - name: Офлайн-набор для --verify (verify_bench.py)
        run: python3 bench/verify_bench.py

      # --identity исключён намеренно, причина в шапке файла. --display с ТЗ-07
      # стоит в воротах отдельным шагом ниже.
      - name: Движок направления (direction_bench.py)
        run: python3 bench/direction_bench.py --props --fixtures --control --sim

      # ТЗ-05 §7. Оба стенда были вне ворот и потому контролем не являлись:
      # fresh_bench.js простоял неподключённым с ТЗ-04 (инв. 37). Строка
      # shell здесь дублирует defaults.run.shell выше СОЗНАТЕЛЬНО — ТЗ-05
      # требует pipefail на каждом из этих двух шагов поимённо (инв. 25).
      - name: Свежесть данных — пауза расписания против сбоя (fresh_bench.js)
        shell: bash -euo pipefail {0}
        run: node bench/fresh_bench.js

      - name: Журнал вердиктов, офлайн (journal_bench.js)
        shell: bash -euo pipefail {0}
        run: node bench/journal_bench.js

      # ТЗ-06 §2.6. Слой катализаторов — единственный, умеющий ЗАКРЫТЬ сторону,
      # и правка кворума ломается молча: неподтверждённая запись, снова
      # получившая право вето, ничем себя не выдаёт (инв. 39, 40).
      - name: Слой катализаторов (catalyst_bench.js)
        shell: bash -euo pipefail {0}
        run: node bench/catalyst_bench.js

      # ТЗ-07 §5. Контракт отображения (инв. 33, 34) — самый видимый Боссу и
      # переписанный дважды за два дня после двух живых ошибок чтения — не имел
      # ни одного исполняющегося контроля: все три стенда стояли вне ворот как
      # «красные на текущем index.html». Красными они были на УСТАРЕВШИХ
      # ожиданиях редакции 19.08 (3), а не на дефекте продукта; ожидания
      # приведены к действующему контракту, и стенды встают в ворота.
      - name: Бейдж и нумерация карточек (display_bench.py)
        shell: bash -euo pipefail {0}
        run: python3 bench/display_bench.py

      - name: Отрисовка списка целиком (render_bench.py)
        shell: bash -euo pipefail {0}
        run: python3 bench/render_bench.py

      - name: Отображение и порядок (direction_bench.py --display)
        shell: bash -euo pipefail {0}
        run: python3 bench/direction_bench.py --display

      # ТЗ-10 §5. Новый измеритель списка и баннер режима. Стенд держит
      # три вещи: тождество dayRangeRatio замкнутой форме, кворум
      # listExhaustion и то, что измеритель НИКУДА не доходит: доска
      # при abnormal === false байт в байт та же. exhaustion_calib.py в ворота
      # НЕ ставится сознательно (ТЗ-10 §4): это разовая калибровка,
      # ей нужен внешний архив и прогретый кэш, а не контроль.
      - name: Истощение списка и баннер режима (exhaustion_bench.js)
        shell: bash -euo pipefail {0}
        run: node bench/exhaustion_bench.js

      # ТЗ-17 §6. Ворота живых данных аналитика. Сети шагу не нужно: стенд
      # строит фикстуры во временном каталоге и гоняет их через ТОТ ЖЕ
      # проверяющий код, что и настоящий payload (инв. 21). Стенд вне ворот
      # контролем не является (инв. 37) — потому шаг стоит здесь, а не в
      # инструкции по запуску.
      - name: Ворота живых данных аналитика (live-gate.sh --selftest)
        shell: bash -euo pipefail {0}
        run: bash analyst/live-gate.sh --selftest
