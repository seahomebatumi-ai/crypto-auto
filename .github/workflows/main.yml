name: Update Crypto Data

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests pycoingecko numpy

      - name: Run script
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          # Прямой поиск файла и его выполнение без привязки к папкам
          FILE=$(find . -name "main.py" | head -n 1)
          echo "Найден файл: $FILE"
          python3 "$FILE"
