name: Crypto Update

on:
  # Расписания здесь намеренно НЕТ. Cron жил в этом файле с 12.06 по 15.06
  # (последняя редакция — дважды в час, '5 * * * *' и '35 * * * *',
  # «чтобы гарантировать выполнение») и был снят Боссом 16.06 в acd4315:
  # часовой прогон приходит извне, вызовом workflow_dispatch с iPhone.
  # Возврат cron 20.08 давал ДВА источника обновления вместо одного (:00 из
  # репозитория и :50 с телефона) — около 43k запросов CoinGecko в месяц при
  # бюджете ~21.6k из §1 карты. Первичным оставлен телефон, cron снят снова.
  push:
    branches: [ main ]
    # Список РАЗРЕШАЮЩИЙ (paths), а не запрещающий: всё неназванное бота
    # не запускает. Он ВЫВЕДЕН из main.py (TZ-23), а не выбран: в main.py нет ни
    # одного open( / Path( / json.load( / __file__ / os.path — ноль вхождений;
    # импорты (строки 1-8) — только stdlib и PyPI, os.environ (13, 17) держит
    # секреты, а не пути. Бот читает CoinGecko и Gist по HTTP и НИ ОДНОГО файла
    # репозитория: catalysts.json читают фронт и journal/write.js, но не он. Отсюда
    # ровно два входа — сам main.py и main.yml (его триггер и определение job).
    #
    # workflow_dispatch НЕ фильтруется: 17 ежедневных запусков с iPhone идут мимо
    # этого списка, и остановить их он не может.
    #
    # СВЯЗЬ, названная связью: разрешающий список обязан РАСТИ, как только у бота
    # появляется новый вход. Забытая запись в paths-ignore жгла минуты runner'а
    # громко (inv. 53); забытая запись здесь тихо не даёт боту запуститься —
    # coeffs.json стареет, и на экране ничего об этом не скажет. Это направление
    # хуже, и ради него комментарий здесь и стоит.
    paths:
      - 'main.py'
      - '.github/workflows/main.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pycoingecko numpy

      - name: Run script with fail-safe logic
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          # Пытаемся запустить скрипт. Если он упал - ждем 60 секунд и пробуем еще раз.
          python main.py || (echo "First attempt failed, retrying in 60s..." && sleep 60 && python main.py)
