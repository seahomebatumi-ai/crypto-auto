name: Update Crypto Data

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug and Execute
        run: |
          echo "--- ТЕКУЩАЯ ПАПКА ---"
          pwd
          echo "--- СПИСОК ВСЕХ ФАЙЛОВ ---"
          find . -maxdepth 3 -not -path '*/.*'
          echo "--- ПОИСК main.py ---"
          FILE_PATH=$(find . -name "main.py" | head -n 1)
          if [ -f "$FILE_PATH" ]; then
            echo "Файл найден здесь: $FILE_PATH"
            python3 "$FILE_PATH"
          else
            echo "ФАЙЛ НЕ НАЙДЕН!"
            exit 1
          fi
