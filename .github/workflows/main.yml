name: Crypto Update

on:
  push:
    branches: [ main ]
  schedule:
    # Запуск в 05 минут каждого часа. 
    # Если GitHub "усыпил" репозиторий, ручной запуск (workflow_dispatch) 
    # или любой push мгновенно его "разбудит".
    - cron: '5 * * * *' 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Увеличим лимит времени до 15 минут, чтобы бот точно успел 
    # достучаться до CoinGecko, даже если сеть будет медленной.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pycoingecko numpy
          
      - name: Run script
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python main.py
