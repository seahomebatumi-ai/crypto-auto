Name: Crypto Update

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pycoingecko numpy

      - name: Run script with fail-safe logic
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          # Скрипт будет запускаться ТОЛЬКО когда ты вызываешь его с iPhone (workflow_dispatch)
          # или при пуше в репозиторий. GitHub сам больше не будет его «дергать».
          python main.py || (echo "First attempt failed, retrying in 60s..." && sleep 60 && python main.py)
