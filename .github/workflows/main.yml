name: Crypto Update
on:
  push:
    branches: [ main ]  # Теперь бот будет запускаться сам при каждом сохранении кода!
  schedule:
    - cron: '0 * * * *' # Запуск каждый час
  workflow_dispatch:     # Кнопка ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests pycoingecko numpy
      - name: Run script
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python main.py
