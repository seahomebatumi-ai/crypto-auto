name: Update Crypto Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests pycoingecko numpy

      - name: Run script
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          # Переходим в нужную папку, если мы не в ней, или запускаем из корня
          if [ -d "crypto-auto" ]; then
            cd crypto-auto
          fi
          python3 main.py
