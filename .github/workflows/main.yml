name: Update Crypto Data

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests pycoingecko numpy

      - name: Run script
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          # 1. Выводим текущую директорию для диагностики
          echo "Текущая директория:"
          pwd
          # 2. Ищем, где физически лежит main.py
          FILE_PATH=$(find . -maxdepth 2 -name "main.py")
          echo "Найденный путь: $FILE_PATH"
          # 3. Запускаем файл, используя найденный путь
          if [ -f "$FILE_PATH" ]; then
            python3 "$FILE_PATH"
          else
            echo "Ошибка: файл main.py не найден в текущей директории"
            exit 1
          fi
