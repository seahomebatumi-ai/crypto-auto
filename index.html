// ── Управление входом ───────────────────────────────────────────────────────
function entryOf(sym) { return entryState[sym] || null; }

// Положение цены в 90д-диапазоне, 0-100. null, если данных нет.
function rangePos(cd, cur) {
    if (!has(cd.min_price) || !has(cd.max_price)) return null;
    if (!(cd.max_price > cd.min_price) || !(cur > 0)) return null;
    return Math.max(0, Math.min(100, (cur - cd.min_price) / (cd.max_price - cd.min_price) * 100));
}
// Релевантна ли сторона при текущем положении в диапазоне.
function sideRelevant(pos, isLong) {
    if (pos === null) return true;
    return isLong ? (pos <= REL_HIGH) : (pos >= REL_LOW);
}

function openEntry(sym, cur, side) {
    entryState[sym] = { open: true, price: cur };
    if (side) boardSide = side;
    else if (currentSide !== 'none') boardSide = currentSide;
    boardSym = sym;
    update();
}
function closeEntry(sym) {
    delete entryState[sym];
    if (boardSym === sym) boardSym = null;
    document.body.style.overflow = '';
    update();
}
function setMargin(v) {
    v = parseFloat(v);
    if (isFinite(v) && v > 0) { posMargin = v; update(); }
}
function nudgeMargin(mult) {
    var v = posMargin * mult;
    setMargin(v >= 10 ? Math.round(v) : Math.round(v * 100) / 100);
}
function askMargin() {
    var v = prompt('\u041C\u0430\u0440\u0436\u0430 \u0432 USDT', String(posMargin));
    if (v === null) return;
    setMargin(String(v).replace(',', '.'));
}
// Переключение единицы размера. Объём позиции при этом НЕ меняется: второе
// число пересчитывается из первого по тождеству qty·E = маржа·L.
// E приходит атрибутом из доски: цена входа живёт в entryState по монете.
function setSizeMode(m, sym) {
    if (m === sizeMode) return;
    // Цена входа берётся из entryState по монете — точная, без округления
    // атрибутом. Доска открыта => запись в entryState существует всегда.
    var st = entryOf(sym);
    var E  = st ? st.price : 0;
    if (m === 'coin') {
        if (isFinite(E) && E > 0 && currentLev > 0) posQty = posMargin * currentLev / E;
    } else {
        if (isFinite(E) && E > 0 && currentLev > 0 && posQty > 0) posMargin = posQty * E / currentLev;
    }
    sizeMode = m;
    update();
}
function setQty(v) {
    v = parseFloat(v);
    if (isFinite(v) && v > 0) { posQty = v; update(); }
}
// Шаг −/+ и карандаш работают с той единицей, которая сейчас выбрана.
function nudgeSize(mult) {
    if (sizeMode !== 'coin') { nudgeMargin(mult); return; }
    if (!(posQty > 0)) return;
    var q = posQty * mult;
    setQty(q >= 10 ? Math.round(q) : Math.round(q * 10000) / 10000);
}
function askSize(sym) {
    if (sizeMode !== 'coin') { askMargin(); return; }
    var v = prompt('\u041A\u043E\u043B\u0438\u0447\u0435\u0441\u0442\u0432\u043E ' + sym, String(posQty));
    if (v === null) return;
    setQty(String(v).replace(',', '.'));
}
// Деньги: два знака, разряды пробелом — как в отчёте, а не как цена монеты.
function fmtUsd(x) {
    if (!isFinite(x)) return '?';
    var neg = x < 0, a = Math.abs(x);
    var t = a.toFixed(2).split('.');
    t[0] = t[0].replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
    return (neg ? '\u2212$' : '$') + t[0] + '.' + t[1];
}

// Переключение стороны ВНУТРИ доски: список не трогаем.
function setBoardSide(s) { boardSide = s; update(); }
function toggleOff() { showOff = !showOff; update(); }
function setEntry(sym, price) {
    if (!(price > 0)) return;
    entryState[sym] = { open: true, price: price };
    update();
}
function nudgeEntry(sym, mult) {
    var e = entryOf(sym); if (!e) return;
    setEntry(sym, e.price * mult);
}
// prompt() вместо <input>: карточки перерисовываются каждые 30 с по тикеру,
// поле ввода теряло бы фокус прямо во время набора.
function askEntry(sym) {
    var e = entryOf(sym); if (!e) return;
    var v = prompt('Цена входа для ' + sym, String(e.price));
    if (v === null) return;
    v = parseFloat(String(v).replace(',', '.'));
    if (isFinite(v) && v > 0) setEntry(sym, v);
}

// ── Математика риска ────────────────────────────────────────────────────────
function normCdf(x) {
    // Abramowitz-Stegun 7.1.26, точность ~1.5e-7
    var s = x < 0 ? -1 : 1, ax = Math.abs(x) / Math.sqrt(2);
    var t = 1 / (1 + 0.3275911 * ax);
    var y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t
                  - 0.284496736) * t + 0.254829592) * t * Math.exp(-ax * ax);
    return 0.5 * (1 + s * y);
}

function sigmaDay(vol) { return vol * Math.sqrt(24); }

// Композитная оценка доверия к МОДЕЛИ карточки (0-100): 45% R2 текущего
// направления (14d), 25% R2 (90d), 20% согласованность бет, 10% штраф за
// волатильность. Отсутствующие компоненты выпадают с перенормировкой.
function confidenceScore(r2_14, r2_90, rawBeta, beta90, volatility) {
    var parts = [], weights = [];
    if (has(r2_14)) { parts.push(clamp01(r2_14)); weights.push(0.45); }
    if (has(r2_90)) { parts.push(clamp01(r2_90)); weights.push(0.25); }
    if (has(beta90) && has(rawBeta)) {
        var div90 = Math.abs(rawBeta - beta90) / (Math.abs(beta90) || 1);
        parts.push(1 - Math.min(div90, 1)); weights.push(0.20);
    }
    var volPct = (volatility || 0) * 100;
    parts.push(1 - Math.min(volPct / 3, 1)); weights.push(0.10);
    var acc = 0, wsum = 0;
    for (var i = 0; i < parts.length; i++) { acc += parts[i] * weights[i]; wsum += weights[i]; }
    return wsum > 0 ? Math.round(100 * acc / wsum) : null;
}

// Светофор доверия к модели: можно ли использовать прогноз/бету карточки.
// Чисто отображение, ни один расчёт не меняет.
function gateState(conf, r2dir, corr90) {
    if (!has(conf) || conf < 40) return 'red';
    if (!has(r2dir) || r2dir < 0.25) return 'red';
    if (has(corr90) && Math.abs(corr90) < 0.5) return 'red';
    if (conf < 70) return 'yellow';
    return 'green';
}

function liqPrice(E, L, isLong) {
    return isLong ? E * (1 - 1 / L + LIQ_MMR) : E * (1 + 1 / L - LIQ_MMR);
}

// Probability of TOUCHING a level b log-units away within `hours`
// (reflection principle, zero drift). Extracted from liqTouchProb so that the
// break-even stop (§3.11) and the liquidation ladder (§3.3) cannot drift apart:
// the formula now lives in exactly one place.
function touchProb(vol, b, hours) {
    if (!has(vol) || vol <= 0 || !has(b) || b < 0) return null;
    var q = vol * Math.sqrt(hours);
    if (!(q > 0)) return 0;
    return Math.max(0, Math.min(1, 2 * (1 - normCdf(b / q))));
}

// Вероятность КАСАНИЯ ликвидации за hours часов (без стопа, без долива).
function liqTouchProb(vol, L, isLong, hours) {
    if (!has(vol) || vol <= 0) return null;
    var d = 1 / L - LIQ_MMR;
    if (!(d > 0)) return 1;
    var b;
    if (isLong) { if (d >= 1) return 1; b = -Math.log(1 - d); }
    else        { b = Math.log(1 + d); }
    return touchProb(vol, b, hours);
}

// Потолок по СТРУКТУРЕ: ликвидация обязана лежать за уровнем инвалидации
// плюс запас на реакцию (движение за H_REACT часов с вероятностью 90%).
function lStruct(dist, vol) {
    var den = dist + RISK_Z * vol * Math.sqrt(H_REACT) + LIQ_MMR;
    return den > 0 ? 1 / den : null;
}

// Потолок по ШУМУ: 10% вероятности касания за 7 суток, если не выйти вовсе.
function lNoise(vol, isLong) {
    var q = RISK_Z * vol * Math.sqrt(H_NOISE);
    var need = isLong ? (1 - Math.exp(-q)) : (Math.exp(q) - 1);
    var den = need + LIQ_MMR;
    return den > 0 ? 1 / den : null;
}

// Бета для проверки обвала BTC. Для ЛОНГа опасно падение BTC (down-бета),
// для ШОРТа — рост (up-бета). 90д-окно предпочтительнее 14д: 2160 точек
// против 336. Хвостовая бета шумная (типичный R2 < 0.05, ошибка ±30%),
// поэтому она может только УЖЕСТОЧИТЬ проверку и только при R2 >= 0.10.
function advBeta(cd, isLong) {
    var base = isLong ? firstNum(cd.down_beta_90, cd.down_beta)
                      : firstNum(cd.up_beta_90,   cd.up_beta);
    if (base === null) return null;
    var b = Math.abs(base);
    if (has(cd.tail_beta) && has(cd.tail_r2) && cd.tail_r2 >= 0.10) {
        b = Math.max(b, Math.abs(cd.tail_beta));
    }
    return b;
}

// Потолок по ОБВАЛУ BTC: переживёт ли позиция движение BTC на 2 сигмы
// за те же 7 суток. Считается молча, срабатывает редко — только на монетах
// с бетой примерно от 2.
function lBtcCheck(beta, isLong, btcVol) {
    if (!has(beta) || !has(btcVol) || btcVol <= 0) return null;
    var D = 2 * btcVol * Math.sqrt(H_BTC);
    var r = isLong ? -D : D;
    var move = Math.abs(Math.pow(Math.max(1 + r, 1e-9), beta) - 1);
    var den = move + LIQ_MMR;
    return den > 0 ? 1 / den : null;
}

function volRegime(cd) {
    if (!has(cd.vol7) || !has(cd.volatility) || cd.volatility <= 0) return null;
    return cd.vol7 / cd.volatility;
}

// ── Остаточная доходность к BTC за 7 дней (§10 п.1) ─────────────────────────
// Недельный ход монеты раскладывается ТОЧНО на две части:
//     r7 = mkt + own,   mkt = β₉₀·btc.r7,   own = res7
// Счёт никогда не задавал этот вопрос: он сравнивал монету только с ней самой
// (r7 против темпа r30). Для контр-трендового лонга у минимума «упала вместе
// с BTC» и «упала сама» — две разные сделки.
//
// БЕТА — по знаку РЕАЛИЗОВАННОГО btc.r7, а не по слайдеру: res7 замеряет
// прошедшие 7 суток, и гипотетический сценарий BTC на замер прошлого влиять
// не имеет права. Разрыва в нуле нет — там сам множитель β·btc.r7 → 0.
// Разложение пути (up_β по плюсовым часам + dn_β по минусовым) отклонено в
// §10 п.1: на флэтовом BTC оно даёт фиктивный дрейф из асимметрии бет.
//
// МЕРА — сигма ОСТАТКА, а не полная сигма монеты. Из тождества однофакторной
// регрессии Var(ε) = Var(r)·(1−R²), значит σ_ост = σ·√(1−R²). Полная сигма
// систематически занижала бы |z| и глушила реальные идиосинкратические ходы
// (при R²=0.42 — на 24%). R² берётся ПАРНЫЙ к использованной бете: по §2
// up_beta_90/up_r2_90 и down_* всегда парны, поэтому если бета есть, то есть
// и R². Потолок 0.90 — защита от деления на почти ноль, в живых данных не
// срабатывает (R²₉₀ альтов к BTC = 0.2–0.6). Нет R² — откат на полную сигму:
// оценка выходит консервативной, ложных «своим ходом» не добавляет.
// Горизонт — H_NOISE, тот же, на котором считается плечо: одна неделя везде.
//
// В scoreCandidate НЕ входит (§10 п.1) — до стенда бэктеста это был бы ещё
// один непроверенный приор поверх непроверенных весов.
// Нет r7, нет btc.r7 или нет нужной беты -> null -> блок не рисуется
// (инвариант 9: старый coeffs.json без btc.* переживается молча).
function residual7(cd, btcStats) {
    if (!cd || !btcStats) return null;
    if (!has(cd.r7) || !has(btcStats.r7)) return null;
    var up = btcStats.r7 >= 0;
    var b  = up ? cd.up_beta_90 : cd.down_beta_90;
    if (!has(b)) return null;
    var mkt = b * btcStats.r7;
    var own = cd.r7 - mkt;
    var z = null;
    if (has(cd.volatility) && cd.volatility > 0) {
        var r2 = up ? cd.up_r2_90 : cd.down_r2_90;
        var k  = has(r2) ? Math.sqrt(1 - Math.max(0, Math.min(RES_R2_CAP, r2))) : 1;
        z = own / (cd.volatility * Math.sqrt(H_NOISE) * k);
    }
    // Три состояния, и каждая подпись обязана быть верной при ЛЮБЫХ знаках:
    //   own    — остаток крупнее обычного недельного разброса монеты;
    //   market — остаток мелкий И меньше рыночной части: ход объясняется BTC;
    //   quiet  — остаток мелкий, но рыночной части почти нет (BTC стоял).
    // Разделение own/market по одной лишь доле отвергнуто: на флэтовом BTC
    // доля остатка вырождается в 100% у любой монеты.
    var cls;
    if (z === null)                            cls = 'unknown';
    else if (Math.abs(z) >= RES_Z)             cls = 'own';
    else if (Math.abs(own) < Math.abs(mkt))    cls = 'market';
    else                                       cls = 'quiet';
    return { own: own, mkt: mkt, b: b, up: up, z: z, cls: cls };
}
// Цвет = значимость, а не сторона сделки: серый — своего хода нет.
function residColor(r) {
    if (!r || r.cls !== 'own') return '#8f8fa0';
    return r.own >= 0 ? 'var(--green)' : 'var(--red)';
}

// ── Созревание шорта ────────────────────────────────────────────────────────
// «ШОРТ СОЗРЕЕТ, КОГДА» — два условия ТЕМПА, которые прямо сейчас режут счёт
// шорт-кандидата в scoreCandidate. Раньше Босс проверял эти два числа глазами.
// Ноль новых запросов: eff14, r7, r30 и volatility уже приходят от бота.
// Нет ни одного из двух наборов -> null -> блок не рисуется (инвариант 9).
function shortMaturity(cd) {
    var rows = [], done = 0, known = 0;

    // Условие 1. Прямолинейность роста за 14д. Выше EFF_TREND тренд вверх не
    // сломан, и счёт шорта умножается на 0.5 — это самый дорогой штраф.
    if (has(cd.eff14)) {
        var okEff = cd.eff14 <= EFF_TREND;
        known++; if (okEff) done++;
        rows.push({ k: '\u0422\u0440\u0435\u043D\u0434 \u0432\u0432\u0435\u0440\u0445 \u0441\u043B\u043E\u043C\u0430\u0435\u0442\u0441\u044F', ok: okEff,
                    now: cd.eff14.toFixed(2),
                    need: '\u2264' + EFF_TREND.toFixed(2),
                    d: 'eff14 \u2014 \u043D\u0430\u0441\u043A\u043E\u043B\u044C\u043A\u043E \u043F\u0440\u044F\u043C\u043E\u0439 \u043B\u0438\u043D\u0438\u0435\u0439 \u0448\u0451\u043B \u0440\u043E\u0441\u0442 \u0437\u0430 14 \u0434\u043D\u0435\u0439. \u0412\u044B\u0448\u0435 ' + EFF_TREND.toFixed(2) + ' \u0441\u0447\u0451\u0442 \u0448\u043E\u0440\u0442\u0430 \u0434\u0435\u043B\u0438\u0442\u0441\u044F \u043D\u0430 2' });
    } else {
        rows.push({ k: '\u0422\u0440\u0435\u043D\u0434 \u0432\u0432\u0435\u0440\u0445 \u0441\u043B\u043E\u043C\u0430\u0435\u0442\u0441\u044F', ok: null, now: '\u2014', need: '\u2014', d: '\u0431\u043E\u0442 \u043D\u0435 \u0434\u0430\u043B eff14 \u2014 \u0443\u0441\u043B\u043E\u0432\u0438\u0435 \u043D\u0435 \u043F\u0440\u043E\u0432\u0435\u0440\u0435\u043D\u043E' });
    }

    // Условие 2. Темп недели против темпа месяца. Порог тот же, по которому
    // карточка уже пишет «рост выдыхается»: z <= -PACE_Z.
    if (has(cd.r7) && has(cd.r30) && has(cd.volatility) && cd.volatility > 0) {
        var sd7    = sigmaDay(cd.volatility) * Math.sqrt(7);
        var pace   = cd.r30 * (7 / 30);
        var needR7 = pace - PACE_Z * sd7;
        var okPace = cd.r7 <= needR7;
        known++; if (okPace) done++;
        rows.push({ k: '\u0420\u043E\u0441\u0442 \u0432\u044B\u0434\u043E\u0445\u043D\u0435\u0442\u0441\u044F', ok: okPace,
                    now: pctTxt(cd.r7), need: '\u2264' + pctTxt(needR7),
                    d: 'r7 \u043F\u0440\u043E\u0442\u0438\u0432 \u0442\u0435\u043C\u043F\u0430 r30, \u043F\u0435\u0440\u0435\u0441\u0447\u0438\u0442\u0430\u043D\u043D\u043E\u0433\u043E \u043D\u0430 \u0442\u0443 \u0436\u0435 \u043D\u0435\u0434\u0435\u043B\u044E (' + pctTxt(pace) + '), \u0441 \u0437\u0430\u043F\u0430\u0441\u043E\u043C \u0432 \u0447\u0435\u0442\u0432\u0435\u0440\u0442\u044C \u043D\u0435\u0434\u0435\u043B\u044C\u043D\u043E\u0439 \u0441\u0438\u0433\u043C\u044B' });
    } else {
        rows.push({ k: '\u0420\u043E\u0441\u0442 \u0432\u044B\u0434\u043E\u0445\u043D\u0435\u0442\u0441\u044F', ok: null, now: '\u2014', need: '\u2014', d: '\u0431\u043E\u0442 \u043D\u0435 \u0434\u0430\u043B r7/r30 \u2014 \u0443\u0441\u043B\u043E\u0432\u0438\u0435 \u043D\u0435 \u043F\u0440\u043E\u0432\u0435\u0440\u0435\u043D\u043E' });
    }

    if (!known) return null;
    return { rows: rows, done: done, known: known };
}

// ── Уровень инвалидации ─────────────────────────────────────────────────────
// Опора — экстремум последних 30 дней (при их отсутствии в coeffs.json —
// 90-дневный, инвариант 9), сдвинутый на полсигмы за него. Пол 2 дневные
// сигмы обязателен: движение меньше двух сигм — это шум, а не поломка идеи,
// и утверждать, что выйдешь по нему, нельзя.
// Потолок по ДЕНЬГАМ: выход по структурному стопу не должен стоить
// больше MAX_MARGIN_LOSS маржи. ЕДИНСТВЕННОЕ место этого деления
// (инв. 20): leverageDecision, карточка и доска читают отсюда.
function lMoney(dist) {
    return (has(dist) && dist > 0) ? MAX_MARGIN_LOSS / dist : null;
}

function invalidationInfo(cd, E, isLong) {
    var vol = cd.volatility;
    if (!has(vol) || vol <= 0 || !(E > 0)) return null;
    var sd  = sigmaDay(vol);
    var ref, src;
    if (isLong) {
        ref = firstNum(cd.min30, cd.min_price);
        src = has(cd.min30) ? 'мин30' : 'мин90';
        if (ref !== null && ref > E) { ref = E; src = 'вход'; }
    } else {
        ref = firstNum(cd.max30, cd.max_price);
        src = has(cd.max30) ? 'макс30' : 'макс90';
        if (ref !== null && ref < E) { ref = E; src = 'вход'; }
    }
    if (ref === null || !(ref > 0)) return null;
    var structPrice = isLong ? ref * (1 - 0.5 * sd) : ref * (1 + 0.5 * sd);
    var dStruct = isLong ? (E - structPrice) / E : (structPrice - E) / E;
    var floorD  = INV_FLOOR_SD * sd;
    var capD    = INV_CAP_SD * sd;
    var capped  = dStruct > capD;
    var dist    = Math.max(Math.min(dStruct, capD), floorD);
    var price   = isLong ? E * (1 - dist) : E * (1 + dist);
    return { dist: dist, price: price, dStruct: dStruct, capped: capped,
             floored: dist > dStruct + 1e-12, sd: sd, ref: ref, src: src };
}

// ── Решение по плечу ────────────────────────────────────────────────────────
function leverageDecision(cd, E, isLong, btcStats) {
    var out = { ok: false, L: null, msg: '', warn: [], parts: null, inv: null,
                binding: '', fix: '', moneyHard: false, moneyBelowMin: false };
    var vol = cd.volatility;
    if (!has(vol) || vol <= 0) { out.msg = 'Бот не дал волатильность'; return out; }
    if (vol >= VOL_STOP) {
        out.msg = 'Волатильность ' + (vol * 100).toFixed(2) + '%/ч — плечо не выдаётся';
        return out;
    }
    var inv = invalidationInfo(cd, E, isLong);
    if (!inv) { out.msg = 'Нет данных для уровня инвалидации'; return out; }
    out.inv = inv;

    var Ls = lStruct(inv.dist, vol);
    var Ln = lNoise(vol, isLong);
    var bA = advBeta(cd, isLong);
    var Lb = lBtcCheck(bA, isLong, btcStats ? btcStats.volatility : null);

    // §10 п.1 — четвёртый потолок СТАЛ ЖЁСТКИМ. Условие ровно одно:
    // дистанция НЕ обрезана потолком 6σ. При capped уровень нарисованный —
    // денежное правило к нему неприменимо, строка остаётся справочной.
    // Пол 2σ, наоборот, входит: тише шума стоп поставить нельзя,
    // значит это честная минимальная дистанция, и деньги по ней законны.
    // src === '\u0432ход' из условия ИСКЛЮЧЁН сознательно: там dist всегда
    // упирается в тот же пол 2σ, что и при близкой опоре — стоп
    // математически тот же, и разное поведение было бы произволом.
    var Lm = lMoney(inv.dist);
    var moneyHard = (Lm !== null) && !inv.capped;
    var cands = [{ n: 'структура', v: Ls }, { n: 'шум 7д', v: Ln }];
    if (Lb !== null) cands.push({ n: 'обвал BTC', v: Lb });
    // Денежный потолок не имеет права убить сделку целиком.
    // Отношение убыток/маржа = dist·L не зависит от размера, поэтому
    // это правило про ДОЛЮ СЧЁТА, а не про выживание позиции.
    // Пустить его ниже L_MIN значило бы превратить правило размера
    // в запрет торговать — убивать сделку могут только три первых потолка.
    if (moneyHard) cands.push({ n: '\u0440\u0438\u0441\u043A \u043C\u0430\u0440\u0436\u0438', v: Math.max(Lm, L_MIN) });
    var best = cands[0];
    for (var i = 1; i < cands.length; i++) if (cands[i].v < best.v) best = cands[i];
    out.parts = { struct: Ls, noise: Ln, btc: Lb, money: Lm };
    out.moneyHard = moneyHard;
    // Стоп не укладывается в порог даже на L_MIN — вопрос доли счёта.
    out.moneyBelowMin = moneyHard && Lm < L_MIN;
    out.binding = best.n;

    var cap = L_CAP;
    var vr = volRegime(cd);
    if (vr !== null && vr > VOL_ABNORMAL) {
        cap = Math.min(cap, 3);
        out.warn.push('Волатильность за 7д выросла в ' + vr.toFixed(1) + '\u00D7 — потолок 3X');
    }
    if (vol >= VOL_HARD) {
        cap = Math.min(cap, 2);
        out.warn.push('Волатильность ' + (vol * 100).toFixed(2) + '%/ч — потолок 2X');
    }

    var L = Math.floor(Math.min(best.v, cap, L_CAP));
    if (L < L_MIN) {
        out.msg = 'БЕЗ БЕЗОПАСНОГО ПЛЕЧА';
        out.fix = fixHint(cd, E, isLong, best.n, vol, inv);
        return out;
    }
    out.ok = true;
    out.L  = L;
    return out;
}

// Что именно должно измениться, чтобы сетап стал торгуемым.
function fixHint(cd, E, isLong, binding, vol, inv) {
    if (binding === 'структура') {
        if (inv.capped) return 'Опоры рядом нет — вход не спасает, нужен ручной стоп.';
        var buf   = RISK_Z * vol * Math.sqrt(H_REACT);
        var need  = 1 / L_MIN - buf - LIQ_MMR;   // требуемая дистанция для 2X
        if (!(need > 0)) return 'Запас на реакцию уже съедает всё плечо — только спот.';
        var ref = inv.ref;
        var target = isLong ? ref * (1 - 0.5 * inv.sd) / (1 - need)
                            : ref * (1 + 0.5 * inv.sd) / (1 + need);
        if (!(target > 0) || !isFinite(target)) return 'Вход слишком далеко от структуры.';
        return 'Станет 2X при входе ' + (isLong ? 'от ' : 'до ') + fmtP(target) + '.';
    }
    if (binding === 'шум 7д') {
        var q  = -Math.log(1 - (1 / L_MIN - LIQ_MMR));
        var qs = Math.log(1 + (1 / L_MIN - LIQ_MMR));
        var needVol = (isLong ? q : qs) / (RISK_Z * Math.sqrt(H_NOISE));
        return 'Дело в волатильности монеты, вход не поможет: нужна Vol \u2264 '
             + (needVol * 100).toFixed(2) + '%/ч, сейчас ' + (vol * 100).toFixed(2) + '%/ч.';
    }
    return 'Монета слишком резко ходит за BTC — только спот или меньший размер.';
}

// ── Position protection (§3.11) ─────────────────────────────────────────────
// Everything else on the board answers "may I open this, and how big".
// This answers the question that starts the moment the position exists:
// when does the trade stop being able to lose money, and what does that cost.
//
// THREE NUMBERS, all of them already measured elsewhere in the system:
//   break-even  = entry moved by round-trip fee + funding over the 7-day
//                 horizon. Funding is signed: when it pays the position, the
//                 break-even sits BEFORE the entry, and the block says so.
//   arm price   = entry +- ARM_R * dist, dist = distance to the structural
//                 stop (invalidationInfo). Never closer than break-even: a
//                 stop below break-even locks in a loss, not a scratch.
//   scratch     = touchProb(be), i.e. the chance ordinary noise drags price
//                 back to break-even within H_NOISE and closes the trade flat.
//
// The scratch probability is the POINT of the block, not decoration: moving a
// stop to break-even is normally sold as free, and it is not - on a 2-sigma
// stop it scratches the trade in roughly half of the weeks. No threshold and
// no traffic light is attached to it deliberately: the trade-off depends on
// the Boss's own hit rate, which the system has never measured (see §8, "TP
// before SL"). It prints the price and leaves the call.
//
// Nothing here feeds scoreCandidate, the leverage engine or the ranking, and
// no field is read from the bot that was not already on the board: pure
// display over existing measurements, zero new API calls.
// Missing volatility -> probabilities are null and their rows disappear;
// missing invalidation level -> break-even alone survives (invariant 9).
function protectionPlan(E, cur, isLong, vol, inv, fr, notional, mrg, qty, L, capL) {
    if (!has(E) || E <= 0 || !has(cur) || cur <= 0) return null;
    var feeFrac = 2 * FEE_TAKER;
    var fundFrac = 0, fundKnown = false;
    if (has(fr)) {
        fundKnown = true;
        // Sign is the economic direction for THIS side, same rule as the
        // funding block: negative rate pays a long, positive pays a short.
        var payMe = isLong ? (fr < 0) : (fr > 0);
        fundFrac = (payMe ? -1 : 1) * Math.abs(fr) * FUND_PAY_7D;
    }
    // Clamp guards a pathological rate only (|fr| above ~4%/8h would push a
    // short break-even to zero or below). Never binds on live data.
    var costFrac = Math.max(-0.9, Math.min(0.9, feeFrac + fundFrac));
    var be = isLong ? E * (1 + costFrac) : E * (1 - costFrac);
    var hasSize = has(qty) && qty > 0 && has(notional) && notional > 0;
    var hasMrg  = hasSize && has(mrg) && mrg > 0;
    var out = {
        fundKnown: fundKnown, costFrac: costFrac, be: be,
        costUsd: hasSize ? costFrac * notional : null,
        moveFrac: isLong ? (cur / E - 1) : (1 - cur / E),
        arm: null, armAtBe: false, capped: !!(inv && inv.capped),
        pArm: null, pNow: null, riskUsd: null, riskPct: null,
        stage: 'wait', addMargin: null, addLiq: null
    };
    if (inv && has(inv.dist) && inv.dist > 0) {
        var arm = isLong ? E * (1 + ARM_R * inv.dist) : E * (1 - ARM_R * inv.dist);
        if (isLong ? (arm <= be) : (arm >= be)) { arm = be; out.armAtBe = true; }
        out.arm  = arm;
        out.pArm = touchProb(vol, Math.abs(Math.log(arm / be)), H_NOISE);
        // Same money the block «ЕСЛИ ИДЕЯ НЕ СРАБОТАЕТ» already prints; kept as
        // a share of margin only, so the two blocks do not restate each other.
        if (hasSize && has(inv.price)) out.riskUsd = qty * Math.abs(E - inv.price);
        if (hasMrg && out.riskUsd !== null) out.riskPct = out.riskUsd / mrg;
    }
    var passedBe = isLong ? (cur >= be) : (cur <= be);
    if (!passedBe) {
        out.stage = 'cost';
    } else {
        out.pNow  = touchProb(vol, Math.abs(Math.log(cur / be)), H_NOISE);
        out.stage = (out.arm !== null && (isLong ? cur >= out.arm : cur <= out.arm))
                  ? 'armed' : 'wait';
    }
    // The only lever an ALREADY OPEN position still has: leverage is fixed at
    // entry, effective leverage is not. Adding margin to an isolated position
    // moves the liquidation price exactly as if it had been opened at capL.
    if (has(capL) && capL > 0 && has(L) && L > capL && hasMrg) {
        var need = notional / capL - mrg;
        if (need > 0) { out.addMargin = need; out.addLiq = liqPrice(E, capL, isLong); }
    }
    return out;
}

// ── Скоринг кандидатов ──────────────────────────────────────────────────────
// ВАЖНО: это инструмент СОРТИРОВКИ внимания («на какие три монеты смотреть
// первыми»), а НЕ сигнал входа. Веса — обоснованный приор, не результат
// бэктеста: исторических данных для проверки в системе пока нет.
function scoreCandidate(cd, sym, cur, p24, qv, isLong) {
    var vol = cd.volatility;
    if (!has(vol) || vol <= 0) return null;
    var mn = cd.min_price, mx = cd.max_price;
    if (!has(mn) || !has(mx) || !(mx > mn) || !(mn > 0) || !(cur > 0)) return null;

    var sd = sigmaDay(vol);
    var parts = [], ws = [], reasons = [];

    if (isLong) {
        // Главный принцип Босса: ближе к минимуму — выше. Меряется в ДНЕВНЫХ
        // СИГМАХ, а не в процентах: 5% над минимумом при sigma 2% — это далеко,
        // при sigma 8% — это фактически на минимуме.
        var dLow = Math.max(0, ((cur - mn) / cur) / sd);
        var pPos = Math.exp(-dLow / 3);
        parts.push(pPos); ws.push(0.50);
        reasons.push({ w: pPos * 0.50, s: dLow < 0.5
            ? 'на минимуме 90д'
            : '+' + ((cur / mn - 1) * 100).toFixed(1) + '% над мин90 (' + dLow.toFixed(1) + '\u03C3)' });
    } else {
        var run  = cur / mn - 1;
        var pRun = clamp01(run / 1.0);
        parts.push(pRun); ws.push(0.35);
        reasons.push({ w: pRun * 0.35, s: '+' + (run * 100).toFixed(0) + '% от мин90' });
        var dHigh = Math.max(0, ((mx - cur) / cur) / sd);
        var pHigh = Math.exp(-dHigh / 3);
        parts.push(pHigh); ws.push(0.20);
        reasons.push({ w: pHigh * 0.20, s: dHigh < 0.5
            ? 'у максимума 90д' : dHigh.toFixed(1) + '\u03C3 до макс90' });
    }

    // Разворот (ЛОНГ) / истощение (ШОРТ): идёт ли движение с прежним темпом.
    if (has(cd.r7) && has(cd.r30)) {
        var pace = cd.r30 * (7 / 30);
        var z    = (cd.r7 - pace) / (sd * Math.sqrt(7));
        var raw  = isLong ? z : -z;
        var pEx  = clamp01((Math.max(-1, Math.min(1, raw)) + 1) / 2);
        parts.push(pEx); ws.push(0.25);
        reasons.push({ w: pEx * 0.25, s: isLong
            ? (raw > PACE_Z ? 'падение замедлилось' : (raw < -PACE_Z ? 'падение ускоряется' : 'темп падения ровный'))
            : (raw > PACE_Z ? 'рост выдыхается'     : (raw < -PACE_Z ? 'рост ускоряется'    : 'темп роста ровный')) });
    }
    // Дивергенция оборота: цена растёт, а оборот ниже нормы — топливо кончается.
    if (!isLong && has(cd.vol_ratio) && has(cd.r7) && cd.r7 > 0 && cd.vol_ratio < 0.9) {
        reasons.push({ w: 0.01, s: 'оборот ниже нормы при росте' });
    }

    return scoreFinish(cd, sym, p24, qv, sd, isLong, parts, ws, reasons, true);
}

// ── Общий хвост обоих каналов (§3.12) ──────────────────────────────────────
// Вынесен из scoreCandidate БЕЗ единого изменения арифметики: канал
// продолжения обязан штрафоваться теми же числами, иначе пороги разъедутся
// (инв. 20). Тождество старого и нового scoreCandidate доказано в
// bench/direction_bench.js на 200 000 случайных входов.
// trendPenalty снимает РОВНО два штрафа по eff14 и только их: они
// противоположны по смыслу для канала продолжения, который хочет, чтобы
// тренд был цел, а не сломан.
function qualityScore(cd, qv) {
    var qp = [], qw = [];
    if (has(qv) && qv > 0) { qp.push(clamp01(Math.log(qv / 1e6) / Math.log(100))); qw.push(0.4); }
    if (has(cd.rank))      { qp.push(clamp01(1 - (cd.rank - 1) / 150));            qw.push(0.3); }
    var vr = volRegime(cd);
    if (vr !== null)       { qp.push(clamp01(1 - (vr - 1) / 1.5));                 qw.push(0.3); }
    if (!qp.length) return null;
    var qa = 0, qs2 = 0;
    for (var k = 0; k < qp.length; k++) { qa += qp[k] * qw[k]; qs2 += qw[k]; }
    return qa / qs2;
}

function scoreFinish(cd, sym, p24, qv, sd, isLong, parts, ws, reasons, trendPenalty) {
    var q = qualityScore(cd, qv);
    if (q !== null) { parts.push(q); ws.push(isLong ? 0.25 : 0.20); }

    var acc = 0, wsum = 0;
    for (var i = 0; i < parts.length; i++) { acc += parts[i] * ws[i]; wsum += ws[i]; }
    if (wsum <= 0) return null;
    var score = 100 * acc / wsum;

    // Штрафы — множители: один фатальный дефект обязан убивать кандидата,
    // а не вычитать из него несколько баллов.
    var mult = 1, flags = [];
    var vr = volRegime(cd);
    if (vr !== null && vr > VOL_ABNORMAL) { mult *= 0.5; flags.push('\u0432\u043e\u043b\u0430\u0442\u0438\u043b\u044c\u043d\u043e\u0441\u0442\u044c \u00D7' + vr.toFixed(1)); }
    if (trendPenalty && has(cd.eff14)) {
        if (isLong && cd.eff14 < -EFF_TREND)  { mult *= 0.6; flags.push('\u043f\u0430\u0434\u0430\u0435\u0442 \u043f\u0440\u044f\u043c\u043e\u0439 \u043b\u0438\u043d\u0438\u0435\u0439'); }
        if (!isLong && cd.eff14 > EFF_TREND)  { mult *= 0.5; flags.push('\u0442\u0440\u0435\u043d\u0434 \u0432\u0432\u0435\u0440\u0445 \u043d\u0435 \u0441\u043b\u043e\u043c\u0430\u043d'); }
    }
    if (isLong && has(cd.fdv_mc) && cd.fdv_mc > 3) {
        mult *= 0.7; flags.push('FDV ' + cd.fdv_mc.toFixed(1) + '\u00D7 \u2014 \u043f\u0440\u043e\u0432\u0435\u0440\u0438\u0442\u044c \u0440\u0430\u0437\u043b\u043e\u043a\u0438');
    }
    if (isLong && has(cd.rank) && has(cd.rank_prev) && (cd.rank - cd.rank_prev) >= 5) {
        mult *= 0.8; flags.push('\u0440\u0430\u043d\u0433 \u043f\u0430\u0434\u0430\u0435\u0442');
    }
    if (has(p24)) {
        var m24 = (p24 / 100) / sd;
        if (isLong && m24 < -3)  { mult *= 0.6; flags.push(p24.toFixed(0) + '% \u0437\u0430 24\u0447 \u2014 \u043d\u043e\u0436 \u0435\u0449\u0451 \u043b\u0435\u0442\u0438\u0442'); }
        if (!isLong && m24 > 3)  { mult *= 0.7; flags.push('+' + p24.toFixed(0) + '% \u0437\u0430 24\u0447 \u2014 \u0432\u0435\u0440\u0442\u0438\u043a\u0430\u043b\u044c'); }
    }
    var fr = cachedFunding[sym];
    if (!isLong && has(fr) && fr > 0.0005) { mult *= 1.05; flags.push('\u043b\u043e\u043d\u0433\u0438 \u043f\u0435\u0440\u0435\u043f\u043e\u043b\u043d\u0435\u043d\u044b'); }

    score = Math.max(0, Math.min(100, score * mult));
    reasons.sort(function(a, b) { return b.w - a.w; });
    var top = [];
    for (var r = 0; r < reasons.length && top.length < 2; r++) top.push(reasons[r].s);
    for (var f = 0; f < flags.length && top.length < 4; f++) top.push(flags[f]);
    return { score: score, reasons: top };
}

// Слова тира называют ОЧЕРЕДЬ ВНИМАНИЯ, а не качество сделки. Прежние
// «Сильный / Средний / Кандидат» читались как рекомендация войти, хотя счёт —
// это приор сортировки с измеренной нулевой предсказательной силой (§10) и
// МДЛ ✕ на всех карточках. Разрешение на сделку живёт ТОЛЬКО в глифе.
// Арифметика счёта, пороги тиров и порядок списка не тронуты.
function tierOf(s) {
    if (s >= TIER_STRONG) return { n: '\u0421\u0438\u043b\u044c\u043d\u044b\u0439',  c: 'var(--green)' };
    if (s >= TIER_MID)    return { n: '\u0421\u0440\u0435\u0434\u043d\u0438\u0439',  c: 'var(--cyan)' };
    if (s >= TIER_MIN)    return { n: '\u041a\u0430\u043d\u0434\u0438\u0434\u0430\u0442', c: 'var(--accent)' };
    return { n: '\u0424\u043e\u043d', c: '#888' };
}

// ── Слой 0. Режим рынка ────────────────────────────────────────────────────
// Один на все карточки. Решает не «куда пойдёт рынок», а какой ПРИОР сейчас
// допущен: возврат к среднему живёт в диапазоне и умирает в тренде, импульс —
// наоборот. Без переключателя один из двух приоров всегда неправ, и какой
// именно — меняется без предупреждения.
// Формула eff — ровно та, которой бот считает eff14 монеты: r14 делится на
// сигму за 14 суток, sqrt(2*H_NOISE) = sqrt(336). Порог тот же EFF_TREND.
// Нет статистики BTC -> mode 'range', known=false. Это ТОЧНО прежнее
// поведение продакшна (всегда возврат к среднему): отсутствие новых полей
// не меняет ничего (инв. 9).
function marketRegime(btcStats) {
    var out = { mode: 'range', dir: 0, eff: null, z: null, known: false };
    if (!btcStats || !has(btcStats.volatility) || btcStats.volatility <= 0) return out;
    var v = btcStats.volatility;
    out.known = true;
    if (has(btcStats.r7)) {
        var zz = btcStats.r7 / (v * Math.sqrt(H_NOISE));
        if (isFinite(zz)) out.z = zz;
    }
    if (has(btcStats.r14)) {
        var e = btcStats.r14 / (v * Math.sqrt(2 * H_NOISE));
        if (isFinite(e)) out.eff = Math.max(-3, Math.min(3, e));
    }
    if (v >= VOL_HARD || (out.z !== null && out.z <= -REG_STRESS_Z)) {
        out.mode = 'stress';
        return out;
    }
    if (out.eff !== null && Math.abs(out.eff) >= EFF_TREND) {
        out.mode = 'trend';
        out.dir  = out.eff > 0 ? 1 : -1;
    }
    return out;
}

// ── Слой 1. Геометрия сделки — вето без единого прогноза ───────────────────
// Считает ровно те числа, которые доска УЖЕ печатает, и превращает их из
// справки в запрет. Цель — экстремум 90д (та же строка «ЕСЛИ СРАБОТАЕТ»),
// риск — dist из invalidationInfo, денежное вето — dec.moneyBelowMin, чтобы
// порог MAX_MARGIN_LOSS жил в одном месте (инв. 20).
// Дисциплина входа: опора — 24ч-минимум для лонга и 24ч-максимум для шорта.
// Работает в ОБОИХ каналах, потому что запрещает не «покупать дорого», а
// «покупать ПОСЛЕ движения» — то есть погоню, а не силу.
function tradeGeometry(cd, E, isLong, dec, hi24, lo24) {
    var vol = cd.volatility;
    if (!has(vol) || vol <= 0 || !(E > 0)) return null;
    if (!dec || !dec.inv) return null;
    var inv = dec.inv;
    var g = { rr: null, tgtSig: null, reward: null, risk: inv.dist,
              sd: inv.sd, veto: [], wait: null };
    var tgt = isLong ? cd.max_price : cd.min_price;
    if (!has(tgt) || !(tgt > 0) || (isLong ? tgt <= E : tgt >= E)) {
        g.veto.push('\u0446\u0435\u043b\u044c 90\u0434 \u043f\u0440\u043e\u0439\u0434\u0435\u043d\u0430');
        return g;
    }
    g.reward = isLong ? (tgt - E) / E : (E - tgt) / E;
    if (g.risk > 0) g.rr = g.reward / g.risk;
    g.tgtSig = g.reward / (vol * Math.sqrt(H_NOISE));
    if (g.rr !== null && g.rr < RR_MIN) g.veto.push('\u0440\u0438\u0441\u043a/\u043f\u0440\u0438\u0431\u044b\u043b\u044c 1:' + g.rr.toFixed(1));
    if (g.tgtSig < TGT_SIGMA_MIN)       g.veto.push('\u0446\u0435\u043b\u044c \u0432\u043d\u0443\u0442\u0440\u0438 \u043d\u0435\u0434\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u0448\u0443\u043c\u0430');
    if (dec.moneyBelowMin)              g.veto.push('\u0441\u0442\u043e\u043f \u0434\u043e\u0440\u043e\u0436\u0435 ' + Math.round(MAX_MARGIN_LOSS * 100) + '% \u043c\u0430\u0440\u0436\u0438');
    if (!dec.ok)                        g.veto.push('\u0431\u0435\u0437 \u0431\u0435\u0437\u043e\u043f\u0430\u0441\u043d\u043e\u0433\u043e \u043f\u043b\u0435\u0447\u0430');
    var anchor = isLong ? lo24 : hi24;
    if (has(anchor) && anchor > 0 && has(inv.sd)) {
        var lim = isLong ? anchor * (1 + ENTRY_CHASE_SD * inv.sd)
                         : anchor * (1 - ENTRY_CHASE_SD * inv.sd);
        if (isLong ? E > lim : E < lim) g.wait = lim;
    }
    return g;
}

// ── Слой 2. Канал продолжения ──────────────────────────────────────────────
// Второй приор, зеркальный к scoreCandidate. Складывать их запрещено: именно
// сложение противоположных приоров рождало «GRAM лонг» и «GRAM шорт»
// одновременно. Режим выбирает ОДИН канал; второй в этот момент не считается.
// Качество и штрафы — общие со scoreCandidate через qualityScore/scoreFinish,
// чтобы пороги жили по одному числу на систему (инв. 20).
// Штраф eff14 сюда не приходит по построению (trendPenalty=false): канал
// продолжения хочет, чтобы тренд был ЦЕЛ, а канал возврата — чтобы сломан.
function momentumScore(cd, sym, cur, p24, qv, rc7, isLong) {
    var vol = cd.volatility;
    if (!has(vol) || vol <= 0) return null;
    if (!has(cd.eff14)) return null;
    var sd = sigmaDay(vol);
    var parts = [], ws = [], reasons = [];

    var eff  = isLong ? cd.eff14 : -cd.eff14;
    var pEff = clamp01((eff + EFF_TREND) / (2 * EFF_TREND));
    parts.push(pEff); ws.push(0.35);
    reasons.push({ w: pEff * 0.35, s: eff >= EFF_TREND
        ? '\u0442\u0440\u0435\u043d\u0434 \u0438\u0434\u0451\u0442 \u043f\u0440\u044f\u043c\u043e\u0439 \u043b\u0438\u043d\u0438\u0435\u0439'
        : (eff <= -EFF_TREND ? '\u0442\u0440\u0435\u043d\u0434 \u043f\u0440\u043e\u0442\u0438\u0432 \u0441\u0442\u043e\u0440\u043e\u043d\u044b' : '\u0442\u0440\u0435\u043d\u0434 \u043d\u0435 \u0432\u044b\u0440\u0430\u0436\u0435\u043d') });

    var zOwn = (rc7 && rc7.z !== null) ? (isLong ? rc7.z : -rc7.z) : 0;
    var pOwn = clamp01((zOwn + RES_Z) / (2 * RES_Z));
    parts.push(pOwn); ws.push(0.25);
    if (zOwn >= RES_Z)       reasons.push({ w: pOwn * 0.25, s: '\u0441\u0438\u043b\u044c\u043d\u0435\u0435 \u0440\u044b\u043d\u043a\u0430 \u0441\u0432\u043e\u0438\u043c \u0445\u043e\u0434\u043e\u043c' });
    else if (zOwn <= -RES_Z) reasons.push({ w: pOwn * 0.25, s: '\u0441\u043b\u0430\u0431\u0435\u0435 \u0440\u044b\u043d\u043a\u0430 \u0441\u0432\u043e\u0438\u043c \u0445\u043e\u0434\u043e\u043c' });

    var pAcc = 0.5;
    if (has(cd.r7) && has(cd.r30)) {
        var z   = (cd.r7 - cd.r30 * (7 / 30)) / (sd * Math.sqrt(7));
        var raw = isLong ? z : -z;
        pAcc = clamp01((Math.max(-1, Math.min(1, raw)) + 1) / 2);
        if (raw > PACE_Z) reasons.push({ w: pAcc * 0.20, s: '\u0442\u0435\u043c\u043f \u043d\u0435\u0434\u0435\u043b\u0438 \u0441\u0438\u043b\u044c\u043d\u0435\u0435 \u043c\u0435\u0441\u044f\u0447\u043d\u043e\u0433\u043e' });
    }
    parts.push(pAcc); ws.push(0.20);

    return scoreFinish(cd, sym, p24, qv, sd, isLong, parts, ws, reasons, false);
}

// ── Слой 3. Катализаторы ───────────────────────────────────────────────────
// Только вето. Совпавшее по стороне событие возвращается как подпись и НИКАК
// не влияет на счёт: иначе внешний ввод начал бы двигать ранжирование, а это
// ровно то, что запрещено §3.10b.
function catalystCheck(sym, isLong, nowMs) {
    var out = { veto: null, note: null };
    var list = CATALYSTS[sym];
    if (!list || !list.length) return out;
    var t0 = has(nowMs) ? nowMs : Date.now();
    var mine = isLong ? 'long' : 'short';
    for (var i = 0; i < list.length; i++) {
        var c = list[i];
        var t = Date.parse(c.d + 'T00:00:00Z');
        if (!isFinite(t)) continue;
        var days = (t - t0) / 86400000;
        if (days < -1 || days > CAT_WINDOW_D) continue;
        // Inv. 39. An unverified entry may ANNOTATE and may never close a side.
        // The window, the -1 back edge, the first-note-wins rule and the early
        // return on veto are untouched: only the source of the authority to
        // veto changed, not one number of the arithmetic around it.
        if (c.conf !== 'confirmed') {
            if (c.dir === mine && !out.note) out.note = c.t;
            continue;
        }
        if (c.dir !== mine) { out.veto = c.t; return out; }
        if (!out.note) out.note = c.t;
    }
    return out;
}

// ── Слой 4. Единый вердикт ─────────────────────────────────────────────────
// По умолчанию — НЕТ СДЕЛКИ. Сторона выдаётся, только когда сошлось всё:
// режим допускает приор -> канал ранжирует монету -> геометрия прошла ->
// катализатор не ветировал -> вход не является погоней.
// Гарантия связности — СТРУКТУРНАЯ, а не эмпирическая:
//   stress -> ни одной стороны;
//   trend  -> только сторона по направлению рынка;
//   range  -> только сторона с БОЛЬШИМ счётом возврата (равенство -> ни одной).
// Поэтому одна монета физически не может получить и ЛОНГ, и ШОРТ.
function directionVerdict(cd, pair, name, cur, p24, qv, isLong, reg, dec, hi24, lo24, rc7, nowMs) {
    var v = { action: 'none', score: null, why: '', wait: null,
              ch: '', reasons: [], geo: null, note: null };

    // Счёт считается ВСЕГДА и при ЛЮБОМ исходе. Карточка без счёта невидима
    // для сортировки, а ранжирование строго по фактическому счёту —
    // требование Босса от 19.08. Запрет торговать живёт в action, а не в
    // отсутствии числа: инвариант 30 держится action'ом, а не немотой.
    var mr = scoreCandidate(cd, pair, cur, p24, qv, isLong);
    var mo = (reg.mode === 'trend')
           ? momentumScore(cd, pair, cur, p24, qv, rc7, isLong) : null;
    var use = mo || mr;
    v.ch = mo ? '\u0438\u043c\u043f\u0443\u043b\u044c\u0441' : '\u0432\u043e\u0437\u0432\u0440\u0430\u0442';
    if (use && has(use.score)) { v.score = use.score; v.reasons = use.reasons; }

    if (reg.mode === 'stress') { v.why = '\u0441\u0442\u0440\u0435\u0441\u0441 \u0440\u044b\u043d\u043a\u0430'; return v; }
    if (reg.mode === 'trend') {
        if (reg.dir !== (isLong ? 1 : -1)) { v.why = '\u043f\u0440\u043e\u0442\u0438\u0432 \u0442\u0440\u0435\u043d\u0434\u0430 \u0440\u044b\u043d\u043a\u0430'; return v; }
        if (!mo || !has(mo.score)) { v.why = '\u043d\u0435\u0442 \u0434\u0430\u043d\u043d\u044b\u0445 \u0434\u043b\u044f \u0438\u043c\u043f\u0443\u043b\u044c\u0441\u0430'; return v; }
    } else {
        var other = scoreCandidate(cd, pair, cur, p24, qv, !isLong);
        if (mr && other && has(mr.score) && has(other.score)
            && mr.score <= other.score) { v.why = '\u043e\u0431\u0440\u0430\u0442\u043d\u0430\u044f \u0441\u0442\u043e\u0440\u043e\u043d\u0430 \u0441\u0438\u043b\u044c\u043d\u0435\u0435'; return v; }
    }
    if (!has(v.score)) { v.why = '\u043d\u0435\u0442 \u043c\u0435\u0442\u0440\u0438\u043a'; return v; }

    var geo = tradeGeometry(cd, cur, isLong, dec, hi24, lo24);
    if (!geo) { v.why = '\u043d\u0435\u0442 \u0433\u0435\u043e\u043c\u0435\u0442\u0440\u0438\u0438'; return v; }
    v.geo = geo;
    if (geo.veto.length) { v.why = geo.veto[0]; return v; }

    var cat = catalystCheck(name, isLong, nowMs);
    if (cat.veto) { v.why = cat.veto; return v; }
    v.note = cat.note;

    if (geo.wait !== null) { v.action = 'wait'; v.wait = geo.wait; return v; }
    v.action = 'trade';
    return v;
}

// ── Порядок и нумерация списка (правка Босса 19.08) ────────────────────────
// Сортировка — СТРОГО по фактическому счёту, без приоритета состояния.
// Прежний порядок «сначала торгуемые» ронял лучшего кандидата вниз, если
// его вход требовал отката: LIT со счётом выше ETH стоял под ним.
function byScore(a, b) {
    var ga = (a.sc && has(a.sc.score)) ? a.sc.score : -1;
    var gb = (b.sc && has(b.sc.score)) ? b.sc.score : -1;
    if (Math.abs(gb - ga) > 0.05) return gb - ga;
    var ra = (a.cd && has(a.cd.rank)) ? a.cd.rank : 9999;
    var rb = (b.cd && has(b.cd.rank)) ? b.cd.rank : 9999;
    if (ra !== rb) return ra - rb;
    var va = (a.cd && has(a.cd.volatility)) ? a.cd.volatility : 9;
    var vb = (b.cd && has(b.cd.volatility)) ? b.cd.volatility : 9;
    return va - vb;
}

// Номер = МЕСТО В РЕЙТИНГЕ ПО СЧЁТУ, и он есть у КАЖДОЙ карточки со счётом
// (правка Босса 19.08, третья редакция). Прежняя версия нумеровала только
// торгуемые: список был отсортирован верно, но доказательство порядка было
// стёрто с 80% карточек, и рейтинг читался как случайная россыпь.
// Состояние сделки номера больше не отнимает — оно живёт в глифе бейджа и в
// .reason-line. Нумерация СПЛОШНАЯ 1..N по уже отсортированному списку.
// Свёрнутые как нерелевантные стороне (r.off) номера не получают: они вне
// рейтинга этой стороны, и сквозной номер у них лгал бы о месте.
function assignRanks(rows) {
    var n = 0;
    for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        r.no = (r.sc && has(r.sc.score) && !r.off) ? (++n) : 0;
    }
    return n;
}

// Глиф состояния входа. ОДИН источник на карточку и на доску: две
// поверхности обязаны говорить одним словарём, иначе доска молча
// «разрешает» то, что карточка запретила.
//   ''  сделка · '~' ждать откат (пульсирует) · '✕' сделки нет
// Словарь взят у МДЛ (✓ / ~ / ✕), который уже стоит на карточке.
function stateMark(row) {
    var act = row.vd ? row.vd.action : 'none';
    if (act === 'trade') return '';
    if (act === 'wait') {
        // Правка Босса 19.08: глиф несёт исполняемое число. «~ $1.0089» само
        // сообщает «сетап годен, вход по этой цене» — слово «ждать» лишнее и
        // убрано из verdictNote, чтобы цена не печаталась дважды.
        var px = (row.vd && has(row.vd.wait)) ? ' ' + fmtP(row.vd.wait) : '';
        return ' <span class="light-blink" style="color:var(--orange);">\u007E' + px + '</span>';
    }
    return ' <span style="color:var(--red);">\u2715</span>';
}

// Бейдж кандидата — один канал на один смысл.
//   ЧИСЛО и СЛОВО и ЦВЕТ  -> место в рейтинге и качество счёта;
//   ГЛИФ                  -> состояние входа (stateMark).
// Причина отказа и цена отката печатаются в .reason-line — в бейдже они не
// дублируются. Пульс остаётся только на '~': единственный глиф, требующий
// действия.
function tierBadge(row) {
    if (!row.sc || !has(row.sc.score)) return '';
    var tier = tierOf(row.sc.score);
    // Цвет — самый громкий канал на телефоне. Зелёный бейдж над красным ✕
    // читался как разрешение войти. На запрещённой карточке бейдж гаснет:
    // цвет тира остаётся только там, где сделка разрешена или ждёт отката.
    var act = row.vd ? row.vd.action : 'none';
    return '<span class="tier-badge" style="color:' + (act === 'none' ? '#888' : tier.c) + ';">'
         + tier.n + (row.no > 0 ? ' #' + row.no : '')
         + ' \u2014 ' + Math.round(row.sc.score) + stateMark(row) + '</span>';
}

// Одна строка над списком: какой приор сейчас разрешён и открыта ли сторона.
// Ничего не считает — только называет уже вычисленный marketRegime (инв. 15).
function regimeBanner(reg, isLong) {
    var txt, col;
    if (!reg || !reg.known) {
        txt = '\u0420\u0415\u0416\u0418\u041c \u041d\u0415\u0418\u0417\u0412\u0415\u0421\u0422\u0415\u041d \u2014 \u043d\u0435\u0442 \u0441\u0442\u0430\u0442\u0438\u0441\u0442\u0438\u043a\u0438 BTC';
        col = '#888';
    } else if (reg.mode === 'stress') {
        txt = '\u0421\u0422\u0420\u0415\u0421\u0421 \u0420\u042b\u041d\u041a\u0410 \u2014 \u0441\u0434\u0435\u043b\u043e\u043a \u043d\u0435\u0442 \u043d\u0438 \u043d\u0430 \u043e\u0434\u043d\u043e\u0439 \u0441\u0442\u043e\u0440\u043e\u043d\u0435';
        col = 'var(--red)';
    } else if (reg.mode === 'trend') {
        var up = reg.dir > 0;
        var dirTxt = up
            ? '\u0422\u0420\u0415\u041d\u0414 \u0412\u0412\u0415\u0420\u0425'
            : '\u0422\u0420\u0415\u041d\u0414 \u0412\u041d\u0418\u0417';
        if (up === isLong) {
            txt = dirTxt + ' \u2014 \u0441\u0447\u0451\u0442 \u043f\u043e \u043a\u0430\u043d\u0430\u043b\u0443 \u0438\u043c\u043f\u0443\u043b\u044c\u0441\u0430';
            col = 'var(--green)';
        } else {
            txt = dirTxt + ' \u2014 \u0432\u0441\u044f \u044d\u0442\u0430 \u0441\u0442\u043e\u0440\u043e\u043d\u0430 \u0437\u0430\u043a\u0440\u044b\u0442\u0430, \u0441\u0447\u0451\u0442 \u2014 \u0442\u043e\u043b\u044c\u043a\u043e \u043e\u0447\u0435\u0440\u0435\u0434\u044c \u0432\u043d\u0438\u043c\u0430\u043d\u0438\u044f';
            col = 'var(--red)';
        }
    } else {
        txt = '\u0414\u0418\u0410\u041f\u0410\u0417\u041e\u041d \u2014 \u0441\u0447\u0451\u0442 \u043f\u043e \u043a\u0430\u043d\u0430\u043b\u0443 \u0432\u043e\u0437\u0432\u0440\u0430\u0442\u0430';
        col = 'var(--accent)';
    }
    return '<div style="margin:2px 0 8px;padding:6px 10px;border-left:3px solid ' + col
         + ';font-size:0.82em;letter-spacing:0.04em;color:' + col + ';">' + txt + '</div>';
}

// Строка плана сделки. Печатается ТОЛЬКО когда модель сделку разрешила
// (`trade` или `wait`) и только для тиров Сильный/Средний — требование Босса
// 20.08. Ни одно число здесь не вычисляется заново: цель — тот же экстремум
// 90д, что берёт `tradeGeometry`, стоп — тот же `dec.inv.price`, что печатает
// доска, R:R — тот же `geo.rr` (инв. 20). При `action === 'none'` строка пуста:
// печатать «вход» там, где движок отказал, значило бы выдумать рекомендацию.
function planLine(row, isLong) {
    if (!row.vd || !row.sc || !has(row.sc.score)) return '';
    if (row.sc.score < TIER_MID) return '';
    var act = row.vd.action;
    if (act !== 'trade' && act !== 'wait') return '';
    var geo = row.vd.geo;
    if (!geo) return '';
    var tgt = isLong ? row.cd.max_price : row.cd.min_price;
    if (!has(tgt) || !(tgt > 0) || (isLong ? tgt <= 0 : false)) return '';
    var out = [];
    if (act === 'trade') {
        out.push('<span class="light-blink" style="color:var(--green);font-weight:800;">'
               + '\u0412\u0425\u041e\u0414 \u0421\u0415\u0419\u0427\u0410\u0421</span>');
    } else {
        if (!has(row.vd.wait)) return '';
        out.push('<span class="light-blink" style="color:var(--orange);font-weight:800;">'
               + '\u0412\u0425\u041e\u0414 ' + fmtP(row.vd.wait) + '</span>');
    }
    out.push('<span style="color:var(--green);">\u0426\u0415\u041b\u042c ' + fmtP(tgt) + '</span>');
    if (row.dec && row.dec.inv && has(row.dec.inv.price) && row.dec.inv.price > 0) {
        out.push('<span style="color:var(--red);">\u0421\u0422\u041e\u041f ' + fmtP(row.dec.inv.price) + '</span>');
    }
    if (has(geo.rr)) out.push('<span style="color:#9a9aa8;">R:R 1:' + geo.rr.toFixed(1) + '</span>');
    return '<div style="font-size:0.78em;font-weight:700;letter-spacing:0.02em;'
         + 'margin:3px 0 5px;line-height:1.5;">' + out.join(' \u00B7 ') + '</div>';
}

// Режим последнего рендера — читается доской, не пересчитывается там (инв. 15).
var lastRegime = null;

// Строка причин карточки. Вердикт идёт ПЕРВЫМ: причина запрета важнее
// причин счёта. Новых блоков и классов не добавляется — та же .reason-line.
// Состояние сделки одной фразой. Отделено от verdictLine, чтобы доска могла
// напечатать ТУ ЖЕ фразу, не потянув за собой причины счёта (они на доске уже
// есть отдельной строкой). Один текст — два места, без дублирования кода.
function verdictNote(row) {
    var v = row.vd;
    if (!v) return '';
    // Цена отката печатается здесь: это исполняемое число, ему место в строке
    // причин, а не в бейдже качества. Формулировка одна на обе стороны —
    // «суточная опора» это минимум 24ч для лонга и максимум для шорта; старый
    // текст «вход выше…» был верен только для лонга.
    if (v.action === 'wait') return '\u0432\u0445\u043e\u0434 \u0434\u0430\u043b\u0435\u043a\u043e \u043e\u0442 \u0441\u0443\u0442\u043e\u0447\u043d\u043e\u0439 \u043e\u043f\u043e\u0440\u044b';
    if (v.action === 'none' && v.why) return '\u043d\u0435\u0442 \u0441\u0434\u0435\u043b\u043a\u0438: ' + v.why;
    if (v.action === 'trade' && v.note) return '\u043a\u0430\u0442\u0430\u043b\u0438\u0437\u0430\u0442\u043e\u0440: ' + v.note;
    return '';
}

function verdictLine(row) {
    var out = [], note = verdictNote(row);
    if (note) out.push(note);
    if (row.sc && row.sc.reasons.length) out = out.concat(row.sc.reasons);
    return out.join(' \u00B7 ');
}

// ── Полноэкранная доска CRYPTO FUTURE ───────────────────────────────────────
// Заменяет блок входа внутри карточки. Карточка в режиме ЛОНГ/ШОРТ остаётся
// витриной, доска — рабочим столом: дублирования информации нет по построению.
// Вся математика (leverageDecision / invalidationInfo / liqPrice / liqTouchProb)
// вызывается без изменений — переехало только место отрисовки.
var lastCtx = null;   // снимок сценария последнего рендера (BTC, ratio, стресс)

// Цена без знака доллара — для узких колонок (шесть плеч в ряд).
function fmtPBare(x) {
    var s = fmtP(x);
    return s.charAt(0) === '$' ? s.substring(1) : s;
}

function probColor(p) {
    return p <= 0.10 ? 'var(--green)' : (p <= 0.25 ? 'var(--accent)' : 'var(--red)');
}

// One place that turns a probability into text: the liquidation ladder and
// the break-even stop must round and clip the same way (inv. 20).
function probTxt(p) {
    return p < 0.005 ? '&lt;1%' : Math.round(p * 100) + '%';
}

function probRow(label, p) {
    if (p === null) return '';
    var c = probColor(p);
    var w = Math.max(2, Math.min(100, Math.round(p * 100)));
    return '<div class="bd-prow">'
         + '<div class="bd-plab">' + label + '</div>'
         + '<div class="bd-track"><div class="bd-fill" style="width:' + w + '%;background:' + c + ';"></div></div>'
         + '<div class="bd-pval" style="color:' + c + ';">'
         + probTxt(p) + '</div>'
         + '</div>';
}

function r2Color(v) {
    if (!has(v)) return '#888';
    return v < 0.30 ? 'var(--red)' : (v < 0.60 ? 'var(--accent)' : 'var(--green)');
}

// Совпадает ли сторона доски с режимом списка (тогда row.sc уже посчитан).
function sideAligned(row) {
    return row.sc && currentSide !== 'none' && (currentSide === boardSide);
}

function boardHtml(row, pos) {
    var cd   = row.cd, t = row.t, coin = row.coin;
    var sym  = t.name, pair = t.s;
    var cur  = parseFloat(coin.lastPrice);
    var p24  = parseFloat(coin.priceChangePercent);
    var isLong    = (boardSide === 'long');
    var btcStats  = lastCtx.btcStats;
    var sideName  = isLong ? 'ЛОНГ' : 'ШОРТ';
    var sideColor = isLong ? 'var(--green)' : 'var(--red)';
