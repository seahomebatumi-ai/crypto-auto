<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="image.PNG">
    <title>Pro Crypto Toll</title>
    <style>
        :root {
            --bg: #0f0f12; --card: #1a1a20; --accent: #f3ba2f;
            --lilac: #bf5af2; --cyan: #0ad1c8; --red: #ff453a;
            --green: #30d158; --text: #ffffff;
        }
        body {
            background-color: var(--bg); color: var(--text);
            font-family: -apple-system, sans-serif; margin: 0;
            padding-top: calc(env(safe-area-inset-top) + 10px);
            padding-left: 10px; padding-right: 10px;
            padding-bottom: calc(env(safe-area-inset-bottom) + 10px);
        }
        .control {
            background: var(--card); padding: 15px; border-radius: 16px;
            border: 1px solid #333; margin-bottom: 15px;
        }
        .btc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        @keyframes rainbow { 0%{filter:hue-rotate(0deg)} 100%{filter:hue-rotate(360deg)} }
        .btc-logo { font-size: 2.4em; color: var(--accent); font-weight: bold; transition: 0.3s; }
        .btc-logo.loading { animation: rainbow 1s linear infinite; }
        @keyframes priceRainbow {
            0%   { color: #f3ba2f; }
            20%  { color: #30d158; }
            40%  { color: #0ad1c8; }
            60%  { color: #bf5af2; }
            80%  { color: #ff453a; }
            100% { color: #f3ba2f; }
        }
        .btc-price.loading { animation: priceRainbow 1.2s linear infinite; }
        .btc-price { color: var(--text); font-size: 1.6em; font-weight: 800; }
        .card {
            background: var(--card); padding: 14px; border-radius: 12px;
            margin-bottom: 8px; border: 1px solid #333; position: relative;
        }
        /* Бегущая линия по контуру при достижении краёв диапазона (1% / 99%) */
        .card.edge-min, .card.edge-max {
            border: 1px solid transparent;
            background-clip: padding-box;
        }
        .card.edge-min::before, .card.edge-max::before {
            content: ''; position: absolute; inset: 0;
            border-radius: 12px; padding: 2px;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            pointer-events: none;
        }
        @keyframes runBorderRed {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        @keyframes runBorderGreen {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .card.edge-min::before {
            background: linear-gradient(90deg, rgba(255,69,58,0) 0%, rgba(255,69,58,1) 25%, rgba(255,255,255,0.9) 50%, rgba(255,69,58,1) 75%, rgba(255,69,58,0) 100%);
            background-size: 200% 100%;
            animation: runBorderRed 1.5s linear infinite;
        }
        .card.edge-max::before {
            background: linear-gradient(90deg, rgba(48,209,88,0) 0%, rgba(48,209,88,1) 25%, rgba(255,255,255,0.9) 50%, rgba(48,209,88,1) 75%, rgba(48,209,88,0) 100%);
            background-size: 200% 100%;
            animation: runBorderGreen 1.5s linear infinite;
        }
        .no-data-card {
            background: var(--card); padding: 14px; border-radius: 12px;
            margin-bottom: 8px; border: 1px solid #333; border-left: 4px solid var(--red);
        }
        .token-name { font-size: 1.2em; font-weight: 800; color: var(--lilac); }
        .row { display: flex; justify-content: space-between; align-items: center; }
        #slider { width: 100%; margin: 10px 0; transition: accent-color 0.3s ease; }
        .lev-container {
            display: grid; grid-template-columns: repeat(6,1fr);
            gap: 4px; margin-bottom: 6px;
        }
        .lev-btn {
            background: #2c2c31; border: none; color: white;
            padding: 8px 0; border-radius: 6px; font-size: 12px; cursor: pointer;
        }
        .lev-btn.active { background: var(--accent); color: #000; font-weight: bold; }
        .stress-container { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; }
        .stress-btn {
            border: none; color: #aaa; padding: 7px 0; border-radius: 6px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            background: #2c2c31; transition: all 0.2s;
        }
        .stress-btn.s-normal { color: #000; background: var(--green); }
        .stress-btn.s-panic  { color: #000; background: var(--accent); }
        .stress-btn.s-crash  { color: #fff; background: var(--red); }
        /* Сторона сделки — единственный явный вход «лонг/шорт» в систему.
           Направление слайдера = сценарий BTC, оно НЕ равно стороне позиции. */
        .side-container { display: grid; grid-template-columns: repeat(2,1fr); gap: 4px; margin-bottom: 6px; }
        .side-btn {
            border: none; color: #aaa; padding: 8px 0; border-radius: 6px;
            font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
            cursor: pointer; background: #2c2c31; transition: all 0.2s;
        }
        .side-btn.a-long  { color: #000; background: var(--green); }
        .side-btn.a-short { color: #fff; background: var(--red); }
        .pin-btn {
            width: 100%; margin-top: 6px; box-sizing: border-box;
            background: #2c2c31; border: 1px solid #444; color: #ccc;
            padding: 9px 6px; border-radius: 8px;
            font-size: 12px; font-weight: 700; cursor: pointer;
        }
        .pin-btn.armed { background: #241f16; border-color: var(--accent); color: var(--accent); }
        .pin-btn.auto-on { background: #16241f; border-color: var(--cyan); color: var(--cyan); }
        .btn-row2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 6px; }
        .btn-row2 .pin-btn { margin-top: 6px; }
        /* Строка «рекомендуемое плечо + риск ликвидации». padding-right — как
           у .lev-block: держит текст левее абсолютного правого столбца. */
        .rec-line { padding-right: 100px; font-size: 0.8em; font-weight: 700; margin: 3px 0 1px; }
        /* Блок расчёта плеча. padding-right держит текст левее абсолютного
           правого столбца карточки (прогноз/цена/Vol) — пересечений нет. */
        .lev-block { padding-right: 100px; margin: 6px 0 4px; line-height: 1.45; }
        .lev-head  { font-size: 0.95em; font-weight: 800; letter-spacing: 0.02em; }
        .lev-sub   { font-size: 0.78em; color: #aaa; }
        .lev-res   { font-size: 0.82em; font-weight: 700; }
        .nav-btn {
            background: #444; border: none; color: #fff;
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        .pct-24h { font-size: 0.6em; font-weight: bold; }
        @keyframes blink { 0%{opacity:1} 50%{opacity:0.2} 100%{opacity:1} }
        .blink-text { animation: blink 1s linear infinite; font-weight: 900; }
        @keyframes lightBlink { 0%{opacity:1} 50%{opacity:0.5} 100%{opacity:1} }
        .light-blink { animation: lightBlink 1.5s ease-in-out infinite; }
        .extra-data { font-size: 0.85em; color: var(--accent); margin-top: 8px; font-style: italic; }
        /* Диапазон BTC 90д — занимает строку, освобождённую штампом обновления */
        .btc-range { font-size: 0.8em; color: var(--accent); font-style: italic; margin-bottom: 10px; }
        /* Компактный штамп свежести данных бота в правом верхнем углу */
        .upd-stamp { font-size: 0.62em; line-height: 1; white-space: nowrap; color: #888; }
        /* Ранг — левый верхний угол карточки. position:absolute => вне потока,
           высота карточки не меняется. left:14px совпадает с padding: бейдж
           стоит ровно над именем монеты и над строкой Min/Max. Заголовочная
           строка выровнена по центру трёхстрочного правого блока (цена/Conf/
           MDL), поэтому имя стоит на своём прежнем месте, ниже бейджа. */
        .rank-badge {
            position: absolute; top: 10px; left: 14px;
            font-size: 0.74em; font-weight: 700; line-height: 1;
            letter-spacing: 0.02em; pointer-events: none;
        }
        .vol-value {
            position: absolute; bottom: 42px; right: 14px;
            font-size: 0.9em; font-weight: bold; font-style: italic;
        }
        @keyframes blinkRed {
            0%  { opacity:1; }
            50% { opacity:0.15; }
            100%{ opacity:1; }
        }
        @keyframes blinkGreen {
            0%  { opacity:1; }
            50% { opacity:0.4; }
            100%{ opacity:1; }
        }
        .icon-warn {
            display:inline-block;
            color: var(--red) !important;
            animation: blinkRed 0.9s linear infinite;
            font-weight: bold;
        }
        .icon-ok {
            display:inline-block;
            color: var(--green) !important;
            animation: blinkGreen 2s ease-in-out infinite;
        }
        /* Экран ввода пароля */
        #lock-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px;
        }
        #lock-screen .lock-box {
            background: var(--card); border: 1px solid #333;
            border-radius: 16px; padding: 28px 22px;
            width: 100%; max-width: 360px; text-align: center;
        }
        #lock-screen .lock-logo { font-size: 2.6em; color: var(--accent); font-weight: bold; margin-bottom: 6px; }
        #lock-screen .lock-title {
            font-size: 1.15em; font-weight: 700; margin-bottom: 18px;
            color: var(--text); letter-spacing: 0.02em;
            word-break: keep-all; line-height: 1.35;
        }
        #lock-input {
            width: 100%; box-sizing: border-box;
            background: #2c2c31; border: 1px solid #444;
            color: var(--text); font-size: 1.1em;
            padding: 12px 14px; border-radius: 10px;
            text-align: center; letter-spacing: 0.05em;
            margin-bottom: 12px; outline: none;
        }
        #lock-input:focus { border-color: var(--accent); }
        #lock-btn {
            width: 100%; background: var(--accent); color: #000;
            font-size: 1.05em; font-weight: 700; border: none;
            padding: 12px; border-radius: 10px; cursor: pointer;
        }
        #lock-error { color: var(--red); font-size: 0.85em; margin-top: 10px; min-height: 18px; }
    </style>
</head>
<body>

<div id="lock-screen">
    <div class="lock-box">
        <div class="lock-logo">&#8383;</div>
        <div class="lock-title">🜲 𝒫𝓇ℴ⇝𝒞𝓇𝒾𝓅𝓉ℴ⇝𝒯ℴ𝓁𝓁 🜲</div>
        <input type="password" id="lock-input" placeholder="Введите код доступа" autocomplete="off" inputmode="text">
        <button id="lock-btn">Войти</button>
        <div id="lock-error"></div>
    </div>
</div>

<div class="control">
    <div class="btc-header">
        <span id="btc-logo" class="btc-logo">&#8383;</span>
        <span id="btc-cur" class="btc-price">...</span>
        <span id="btc-24h" style="font-weight:bold;">0.00%</span>
        <div style="margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
            <div id="last-update" class="upd-stamp">...</div>
            <div id="status-dot" style="width:12px;height:12px;border-radius:50%;background:#666;"></div>
        </div>
    </div>
    <div class="row" style="margin-bottom:4px;">
        <div style="font-weight:600;">
            <span id="btc-target">Прогноз BTC: ...</span><span id="btc-target-arrow" style="font-size:1.3em;font-weight:700;line-height:1;vertical-align:-2px;margin-left:4px;"></span>
        </div>
        <div style="text-align:right;">
            <div id="btc-pct" style="font-weight:bold;color:#ffffff;">0.00%</div>
            <div id="dir-indicator" style="font-size:0.75em;font-weight:800;color:#888;">&#8212;&#8212;</div>
        </div>
    </div>
    <div id="btc-range" class="btc-range">Диапазон BTC 90д: ...</div>
    <div style="display:flex;align-items:center;gap:6px;margin:6px 0;">
        <button id="btn-minus" style="
            background:#2c1f1f;border:1px solid var(--red);color:var(--red);
            font-size:1.4em;font-weight:900;width:38px;height:38px;
            border-radius:8px;cursor:pointer;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;
            line-height:1;">&#8722;</button>
        <input type="range" id="slider" min="20000" max="150000" step="100"
               style="flex:1;margin:0;">
        <button id="btn-plus" style="
            background:#1a2a1f;border:1px solid var(--green);color:var(--green);
            font-size:1.4em;font-weight:900;width:38px;height:38px;
            border-radius:8px;cursor:pointer;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;
            line-height:1;">&#43;</button>
    </div>
    <div class="side-container" id="sideContainer"></div>
    <div class="lev-container" id="levContainer"></div>
    <div class="stress-container" id="stressContainer"></div>
    <div class="btn-row2">
        <button id="pin-btn" class="pin-btn">Зафиксировать вход</button>
        <button id="auto-btn" class="pin-btn">АВТО-СТРЕСС: выкл</button>
    </div>
</div>

<div id="results">Загрузка данных...</div>

<script>
// ── Защита паролем ──────────────────────────────────────────────────────────
// Пароль запоминается на устройстве через localStorage: вводится один раз,
// потом калькулятор открывается сразу. На чужом устройстве (где localStorage
// пустой) без пароля доступа нет.
(function() {
    var ACCESS_CODE = 'AV777SA';
    var LS_KEY = 'cryptoEngineAccess';

    function unlock() {
        var ls = document.getElementById('lock-screen');
        if (ls) ls.style.display = 'none';
    }

    // Уже разблокировано на этом устройстве?
    try {
        if (localStorage.getItem(LS_KEY) === ACCESS_CODE) {
            unlock();
        }
    } catch(e) {}

    function tryLogin() {
        var inp = document.getElementById('lock-input');
        var err = document.getElementById('lock-error');
        if (!inp) return;
        if (inp.value === ACCESS_CODE) {
            try { localStorage.setItem(LS_KEY, ACCESS_CODE); } catch(e) {}
            if (err) err.innerText = '';
            unlock();
        } else {
            if (err) err.innerText = 'Неверный код, попробуйте снова';
            inp.value = '';
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        var btn = document.getElementById('lock-btn');
        var inp = document.getElementById('lock-input');
        if (btn) btn.addEventListener('click', tryLogin);
        if (inp) inp.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') tryLogin();
        });
    });
})();

// ── Константы ──────────────────────────────────────────────────────────────
var currentLev    = 3;
var currentStress = 'normal';
// Сторона сделки задаётся ЯВНО, а не выводится из направления слайдера:
// слайдер вниз — это сценарий падения BTC, а не «шорт» (так ищут вход в лонг).
var currentSide   = 'long';
// Зафиксированный сценарий входа. Храним УРОВЕНЬ BTC + режим стресса, а не
// цену: живая цена сокращается в отношении S/E, поэтому фиксация не портится
// от тиков рынка. Намеренно НЕ пишется в localStorage — вчерашний вход с
// сегодняшними бетами опаснее ручного счёта.
var pinned = null;   // { btc: <уровень слайдера>, stress: 'normal'|'panic'|'crash' }

var STRESS_MULT  = { normal: 1.0, panic: 1.3, crash: 1.8 };
var STRESS_BADGE = { normal: '',   panic: 'b*1.3', crash: 'b*1.8' };
var STRESS_NAME  = { normal: 'Normal', panic: 'Panic', crash: 'Crash' };

// Maintenance margin (Binance USDT-M, нижний тир для большинства альтов ~1%).
// Реальная ликвидация ближе ко входу, чем наивное pred*(1 -/+ 1/L).
var LIQ_MMR = 0.01;

// ── Горизонт риска ──────────────────────────────────────────────────────────
// 720 ч = 30 суток — базовый срок удержания Босса (позиция живёт 2-3 недели+).
// Все вероятностные расчёты ведутся ИМЕННО на этом горизонте; при другом
// сроке риск масштабируется как sqrt(H): 7 суток = делить сигму на 2.07.
var RISK_HORIZON_H = 720;
// z = 1.645 => 10% вероятность КАСАНИЯ ликвидации за горизонт (принцип
// отражения: касание вдвое вероятнее конечного значения ниже уровня).
var RISK_Z         = 1.645;
// Пороги зоны риска для ВЫБРАННОГО плеча (вероятность касания за 30д).
var RISK_OK_P      = 0.10;
var RISK_WARN_P    = 0.25;

// ── Авто-стресс ─────────────────────────────────────────────────────────────
// Просадка BTC = 2 sigma за тот же горизонт 30д, считается из btc.volatility
// (часовая волатильность BTC за 90д, уже приходит в coeffs.json и до сих пор
// не использовалась фронтом). Clamp защищает от режима сверхнизкой/бешеной
// волатильности. Реакция альта берётся с множителем Panic 1.3: часовая
// down-бета недооценивает многодневный обвал, в котором корреляции растут.
var AUTO_SIGMA     = 2.0;
var AUTO_D_MIN     = 0.15;
var AUTO_D_MAX     = 0.35;
var AUTO_D_FALLBACK = 0.20;   // старый coeffs.json без btc.volatility
var AUTO_MODE      = 'panic';
var autoStress     = false;

var botData          = { analysis_data: [], generated_at: null };
var cachedMarketData = [];
var cachedFunding    = {};
var sliderInitialized = false;

var GIST_URL       = 'https://gist.githubusercontent.com/seahomebatumi-ai/3f50574a29bc37434c18cc8480779ccb/raw/coeffs.json';
var STALE_WARN_MIN = 75;
var STALE_CRIT_MIN = 130;

var tokens = [
    {name:'SUI',    s:'SUIUSDT'},   {name:'ONDO',   s:'ONDOUSDT'},
    {name:'LINK',   s:'LINKUSDT'},  {name:'RENDER', s:'RENDERUSDT'},
    {name:'NEAR',   s:'NEARUSDT'},  {name:'YFI',    s:'YFIUSDT'},
    {name:'AAVE',   s:'AAVEUSDT'},  {name:'AVAX',   s:'AVAXUSDT'},
    {name:'FET',    s:'FETUSDT'},   {name:'ENA',    s:'ENAUSDT'},
    {name:'TAO',    s:'TAOUSDT'},   {name:'GRAM',   s:'GRAMUSDT'},
    {name:'XRP',    s:'XRPUSDT'},   {name:'ADA',    s:'ADAUSDT'},
    {name:'TRX',    s:'TRXUSDT'},   {name:'SOL',    s:'SOLUSDT'},
    {name:'BCH',    s:'BCHUSDT'},   {name:'HYPE',   s:'HYPEUSDT', fut:true},
    {name:'SKY',    s:'SKYUSDT'},   {name:'ETH',    s:'ETHUSDT'},
    {name:'HBAR',   s:'HBARUSDT'},  {name:'XLM',    s:'XLMUSDT'},
    {name:'ALGO',   s:'ALGOUSDT'},  {name:'BNB',    s:'BNBUSDT'},
    // Добавлены 2026-08-07.
    // ZEC / UNI — спот-пары Binance есть, идут в ?symbols= штатно.
    // XMR — спот делистнут Binance (2024, регуляторка) => fut:true.
    // LIT — статус спот-пары не подтверждён (возможен ребрендинг) => fut:true.
    // Правило: неподтверждённый символ НИКОГДА не кладём в спот-?symbols=
    // (HTTP 400 роняет ВЕСЬ спот-тикер на 1.2 МБ — инвариант 5).
    {name:'ZEC',    s:'ZECUSDT'},   {name:'UNI',    s:'UNIUSDT'},
    {name:'XMR',    s:'XMRUSDT', fut:true},
    {name:'LIT',    s:'LITUSDT', fut:true}
];

// ── Тикер только по нужным парам ────────────────────────────────────────────
// Полный /ticker/24hr = ~1.2 МБ каждые 30с; ?symbols= = ~12 КБ (weight 40 vs 80).
// При HTTP 400 (например, символ делистнут) откатываемся на полный тикер
// до перезагрузки страницы — поведение идентично старому.
var useSymbolsParam = true;

function marketTickerUrl() {
    if (!useSymbolsParam) return 'https://api.binance.com/api/v3/ticker/24hr';
    var syms = ['BTCUSDT'];
    for (var i = 0; i < tokens.length; i++) {
        // fut:true = пары нет на споте (есть только перп на fapi).
        // Такой символ в ?symbols= даёт HTTP 400 на ВЕСЬ запрос и молча
        // ронял приложение на полный тикер 1.2МБ каждую сессию.
        if (tokens[i].fut) continue;
        if (syms.indexOf(tokens[i].s) === -1) syms.push(tokens[i].s);
    }
    return 'https://api.binance.com/api/v3/ticker/24hr?symbols='
        + encodeURIComponent(JSON.stringify(syms));
}

// ── Порядок карточек ────────────────────────────────────────────────────────
var ORDER_KEY = 'cryptoEngineTokenOrder';

function applySavedOrder() {
    try {
        var saved = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
        if (!Array.isArray(saved) || !saved.length) return;
        var map = {};
        tokens.forEach(function(t) { map[t.name] = t; });
        var out = [];
        saved.forEach(function(n) { if (map[n]) { out.push(map[n]); delete map[n]; } });
        Object.keys(map).forEach(function(n) { out.push(map[n]); });
        tokens = out;
    } catch(e) {}
}

// Цена берётся по одному запросу /fapi/v1/ticker/24hr?symbol=... (weight 1).
// В ответе fapi нет bidPrice/askPrice — детектор мёртвого рынка работает по
// count (отсутствующие поля = NaN = карточка жива, поведение по спецификации).
// Любой сбой = карточка «НЕТ ПАРЫ», как раньше: регресс невозможен по построению.
var cachedFutTickers = {};

function refreshFuturesTickers() {
    tokens.forEach(function(t) {
        if (!t.fut) return;
        fetch('https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=' + t.s)
            .then(function(res) {
                if (!res.ok) throw new Error('http ' + res.status);
                return res.json();
            })
            .then(function(d) {
                if (d && d.symbol) { cachedFutTickers[d.symbol] = d; update(); }
            })
            .catch(function() {});
    });
}

function updateFreshnessDisplay() {
    var el = document.getElementById('last-update');
    if (!el) return;
    if (!botData.generated_at) {
        el.innerText   = 'Нет данных';
        el.style.color = 'var(--red)';
        return;
    }
    var genDate = new Date(botData.generated_at);
    var ageMin  = (Date.now() - genDate.getTime()) / 60000;
    var mins    = Math.max(0, Math.round(ageMin));
    // Компактный штамп: одна строка, без часов — влезает над точкой статуса.
    // Пороги свежести те же (STALE_WARN 75 / STALE_CRIT 130), меняется только текст.
    if (ageMin > STALE_CRIT_MIN) {
        el.innerText   = '! Молчит ' + mins + ' мин';
        el.style.color = 'var(--red)';
    } else if (ageMin > STALE_WARN_MIN) {
        el.innerText   = 'Обновлено ' + mins + ' мин';
        el.style.color = 'var(--accent)';
    } else {
        el.innerText   = ageMin < 1 ? 'Обновлено сейчас' : 'Обновлено ' + mins + ' мин';
        el.style.color = '#888';
    }
}

function refreshMarketData(isRetry) {
    var logo = document.getElementById('btc-logo');
    var priceEl = document.getElementById('btc-cur');
    if (logo) logo.classList.add('loading');
    if (priceEl) priceEl.classList.add('loading');
    var wasSymbols = useSymbolsParam;
    fetch(marketTickerUrl())
        .then(function(res) {
            // HTTP-ошибка (напр. 400: невалидный символ в ?symbols=) → в catch
            if (!res.ok) throw new Error('http ' + res.status);
            return res.json();
        })
        .then(function(data) {
            // Тикер обязан быть массивом (а не объектом ошибки Binance)
            if (!data || typeof data.length !== 'number') throw new Error('bad ticker payload');
            cachedMarketData = data;
            if (!sliderInitialized && data.length > 0) {
                var btcObj = null;
                for (var i = 0; i < data.length; i++) {
                    if (data[i].symbol === 'BTCUSDT') { btcObj = data[i]; break; }
                }
                if (btcObj) {
                    document.getElementById('slider').value = Math.round(parseFloat(btcObj.lastPrice));
                    sliderInitialized = true;
                }
            }
            update();
        })
        .catch(function() {
            // ЛЮБОЙ сбой варианта ?symbols= — HTTP 400, ответ об ошибке без
            // CORS-заголовков (fetch тогда падает сразу сюда, минуя .then),
            // сбой сети — один повтор ПОЛНЫМ тикером и залипание на нём до
            // перезагрузки. Худший случай = ровно старое поведение.
            if (wasSymbols && !isRetry) {
                useSymbolsParam = false;
                refreshMarketData(true);
            }
        })
        .finally(function() {
            setTimeout(function() {
                if (logo) logo.classList.remove('loading');
                if (priceEl) priceEl.classList.remove('loading');
            }, 500);
        });
}

// ── Confidence Score ────────────────────────────────────────────────────────
// Композитная оценка доверия к прогнозу (0-100) из уже имеющихся метрик:
// 45% R2 текущего направления (14d), 25% R2 (90d), 20% согласованность
// бет 14d/90d, 10% штраф за волатильность. Отсутствующие компоненты
// исключаются с перенормировкой весов (например, пока нет 90d-данных).
function confidenceScore(r2_14, r2_90, rawBeta, beta90, volatility) {
    function c01(x) { return Math.max(0, Math.min(1, x)); }
    var parts = [], weights = [];
    if (r2_14 !== null && r2_14 !== undefined) { parts.push(c01(r2_14)); weights.push(0.45); }
    if (r2_90 !== null && r2_90 !== undefined) { parts.push(c01(r2_90)); weights.push(0.25); }
    if (beta90 !== null && beta90 !== undefined && rawBeta !== null && rawBeta !== undefined) {
        var div90 = Math.abs(rawBeta - beta90) / (Math.abs(beta90) || 1);
        parts.push(1 - Math.min(div90, 1)); weights.push(0.20);
    }
    var volPct = (volatility || 0) * 100;
    parts.push(1 - Math.min(volPct / 3, 1)); weights.push(0.10);
    var acc = 0, wsum = 0;
    for (var i = 0; i < parts.length; i++) { acc += parts[i] * weights[i]; wsum += weights[i]; }
    return wsum > 0 ? Math.round(100 * acc / wsum) : null;
}

// ── Gate: светофор доверия к МОДЕЛИ карточки (НЕ сигнал входа) ─────────────
// Отвечает на один вопрос: можно ли использовать прогноз/бету этой карточки
// в решении. red = цифрам не доверять (вход только по графику/катализатору),
// yellow = использовать с половинным размером, green = модель рабочая.
// Чисто отображение: не меняет ни одного расчёта. Старый coeffs.json без
// corr_90 обрабатывается (undefined = без штрафа) — инвариант 9 соблюдён.
function gateState(conf, r2dir, corr90) {
    if (conf === null || conf === undefined || conf < 40) return 'red';
    if (r2dir === null || r2dir === undefined || r2dir < 0.25) return 'red';
    if (corr90 !== null && corr90 !== undefined && Math.abs(corr90) < 0.5) return 'red';
    if (conf < 70) return 'yellow';
    return 'green';
}

// ── Вероятностный риск ликвидации и РЕКОМЕНДУЕМОЕ плечо ────────────────────
// Модель: цена монеты — броуновское движение с сигмой = Vol (часовая
// волатильность за 90д, уже считается ботом). Ликвидация — событие КАСАНИЯ
// уровня за время удержания, а не конечного значения, поэтому вероятность
// вдвое выше наивной (принцип отражения для процесса без сноса):
//     P(касание) = 2 * (1 - Phi(b / (Vol * sqrt(H))))
// где b — расстояние до ликвидации В ЛОГАРИФМАХ (асимметрично по сторонам:
// вверх цена не ограничена, поэтому шорт при том же плече рискованнее).
// R2 сюда СОЗНАТЕЛЬНО не входит: позиция не захеджирована против BTC, значит
// ликвидацию вызывает ПОЛНОЕ движение монеты, а не только идиосинкратическое.
function normCdf(x) {
    // Abramowitz-Stegun 7.1.26, точность ~1.5e-7 — с запасом для процентов.
    var s = x < 0 ? -1 : 1, ax = Math.abs(x) / Math.sqrt(2);
    var t = 1 / (1 + 0.3275911 * ax);
    var y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t
                  - 0.284496736) * t + 0.254829592) * t * Math.exp(-ax * ax);
    return 0.5 * (1 + s * y);
}

function liqLogDist(L, isLong) {
    var d = 1 / L - LIQ_MMR;              // доля хода цены до ликвидации
    if (!(d > 0)) return null;
    // d >= 1 невозможно для лонга (цена не падает более чем на 100%),
    // но штатно для шорта: рост на 120% — обычное событие. Раньше общий
    // guard обнулял шорт при L < 1 и ломал инверсию РЕК <-> вероятность.
    if (isLong) return d >= 1 ? null : -Math.log(1 - d);
    return Math.log(1 + d);
}

// Вероятность касания ликвидации за RISK_HORIZON_H при данном плече.
function liqTouchProb(vol, L, isLong) {
    if (vol === null || vol === undefined || !isFinite(vol) || vol <= 0) return null;
    var b = liqLogDist(L, isLong);
    if (b === null) return 1;
    var q = vol * Math.sqrt(RISK_HORIZON_H);
    if (!(q > 0)) return 0;
    var p = 2 * (1 - normCdf(b / q));
    return Math.max(0, Math.min(1, p));
}

// Обратная задача: плечо, при котором вероятность касания = 10% за 30д.
// LONG:  1/L - MMR = 1 - exp(-q)      SHORT: 1/L - MMR = exp(q) - 1
function recommendedLeverage(vol, isLong) {
    if (vol === null || vol === undefined || !isFinite(vol) || vol <= 0) return null;
    var q    = RISK_Z * vol * Math.sqrt(RISK_HORIZON_H);
    var need = isLong ? (1 - Math.exp(-q)) : (Math.exp(q) - 1);
    var den  = need + LIQ_MMR;
    if (!(den > 0)) return null;
    var L = 1 / den;
    return isFinite(L) ? L : null;
}

function riskColor(p) {
    if (p === null || p === undefined) return '#888';
    if (p <= RISK_OK_P)   return 'var(--green)';
    if (p <= RISK_WARN_P) return 'var(--accent)';
    return 'var(--red)';
}

// Строка «РЕК Nx · выбрано LX — риск ликв P%». Возвращает '' если нет Vol.
// nested=true — строка уже внутри .lev-block, у которого свой padding-right;
// повторный отступ сдвинул бы текст на 200px и порвал вёрстку.
function recLineHtml(vol, isLong, L, nested) {
    var rec = recommendedLeverage(vol, isLong);
    var p   = liqTouchProb(vol, L, isLong);
    if (rec === null || p === null) return '';
    var recTxt = rec < 1 ? '&lt;1X' : Math.floor(rec) + 'X';
    var col    = riskColor(p);
    var zone   = p <= RISK_OK_P ? '\u2713' : (p <= RISK_WARN_P ? '\u007E' : '\u2715');
    var pTxt   = p < 0.001 ? '&lt;0.1' : (p * 100).toFixed(p < 0.1 ? 1 : 0);
    var cls    = nested ? 'lev-res' : 'rec-line';
    return '<div class="' + cls + '" style="color:' + col + ';">'
         + 'РЕК ' + recTxt + ' <span style="color:#666;font-weight:400;">(30д, '
         + (isLong ? 'лонг' : 'шорт') + ')</span> &middot; ' + L + 'X: риск ликв '
         + pTxt + '% ' + zone + '</div>';
}

// ── Авто-стресс: просадка BTC из его же волатильности ───────────────────────
function autoStressDrop() {
    var bs = botData.btc;
    var v  = bs ? bs.volatility : null;
    if (v === null || v === undefined || !isFinite(v) || v <= 0) {
        return { d: AUTO_D_FALLBACK, auto: false };
    }
    var d = AUTO_SIGMA * v * Math.sqrt(RISK_HORIZON_H);
    if (d < AUTO_D_MIN) d = AUTO_D_MIN;
    if (d > AUTO_D_MAX) d = AUTO_D_MAX;
    return { d: d, auto: true };
}

// ── Расчёт допустимого плеча ────────────────────────────────────────────────
// Та же степенная модель, что и в основном рендере: growth = (1+ratio)^(b*стресс).
// Бета выбирается по направлению движения BTC в КОНКРЕТНОМ сценарии, поэтому
// вход и стресс могут опираться на разные беты — это корректно.
function scenarioGrowth(coinData, btcNow, btcTarget, stressMode) {
    if (!(btcNow > 0) || !isFinite(btcTarget)) return null;
    var r   = (btcTarget - btcNow) / btcNow;
    var raw = r >= 0 ? coinData.up_beta : coinData.down_beta;
    if (raw === null || raw === undefined || !isFinite(raw)) return null;
    var g = Math.pow(Math.max(1 + r, 1e-9), raw * STRESS_MULT[stressMode]);
    return (isFinite(g) && g > 0) ? g : null;
}

function fmtUsd(x) {
    if (!isFinite(x)) return '?';
    return x < 0.0001 ? '&lt;0.0001' : '$' + x.toFixed(4);
}

// Возвращает '' пока не зафиксирован вход И выключен авто-стресс
// => карточка рисуется байт в байт как раньше.
function leverageBlock(coinData, cur, btcNow, target) {
    if (!pinned && !autoStress) return '';

    // Вход: зафиксированный уровень, иначе (только в авто-режиме) — рынок.
    var entryBtc  = pinned ? pinned.btc : btcNow;
    var isL       = currentSide === 'long';
    var sideName  = isL ? 'ЛОНГ' : 'ШОРТ';
    var sideColor = isL ? 'var(--green)' : 'var(--red)';

    function box(head, body) {
        return '<div class="lev-block">'
             + '<div class="lev-head" style="color:' + sideColor + ';">' + head + '</div>'
             + body + '</div>';
    }
    function note(msg) {
        return box(sideName + ' &middot; плечо: н/д',
                   '<div class="lev-sub" style="color:var(--accent);">' + msg + '</div>');
    }

    // Источник стресс-сценария: авто (2 sigma BTC от уровня входа, реакция
    // Panic) или ручной (слайдер + выбранный режим) — формула МАКС не меняется.
    var ad         = autoStress ? autoStressDrop() : null;
    var stressBtc  = autoStress ? (isL ? entryBtc * (1 - ad.d) : entryBtc * (1 + ad.d)) : target;
    var stressMode = autoStress ? AUTO_MODE : currentStress;

    var gE = scenarioGrowth(coinData, btcNow, entryBtc, 'normal');
    var gS = scenarioGrowth(coinData, btcNow, stressBtc, stressMode);
    if (gE === null) return note('Нет беты для сценария входа');
    if (gS === null) return note('Нет беты для стресс-сценария');

    // Живая цена сокращается: k = S/E = gS/gE. Фиксация не портится тиками рынка.
    var k = gS / gE;
    var E = cur * gE;
    var S = cur * gS;

    if (isL  && k >= 1) return note(autoStress
        ? 'Авто-стресс не ниже входа &mdash; бета монеты отрицательна в этом сценарии'
        : 'Стресс не ниже входа &mdash; двинь слайдер НИЖЕ $' + entryBtc.toLocaleString());
    if (!isL && k <= 1) return note(autoStress
        ? 'Авто-стресс не выше входа &mdash; бета монеты отрицательна в этом сценарии'
        : 'Стресс не выше входа &mdash; двинь слайдер ВЫШЕ $' + entryBtc.toLocaleString());

    var denom = isL ? (1.01 - 0.87 * k) : (1.13 * k - 0.99);
    if (!(denom > 0)) return note('Сценарий слишком жёсткий &mdash; безопасного плеча нет даже на 1x');

    var lmaxRaw = 1 / denom;
    if (lmaxRaw < 1) return note('Сценарий слишком жёсткий &mdash; безопасного плеча нет даже на 1x');
    // Знаменатель строго > 0.14 (k по нужную сторону от 1), поэтому
    // L_max < 7.15 всегда: floor даёт 1..7, ветка «10x+» недостижима.
    var lmaxTxt = Math.floor(lmaxRaw) + 'x';

    // Ликвидация и запас — для ВЫБРАННОГО сейчас плеча, от цены входа E.
    var L   = currentLev;
    var liq = isL ? E * (1 - 1 / L + LIQ_MMR) : E * (1 + 1 / L - LIQ_MMR);
    var buf = isL ? (S - liq) / S : (liq - S) / S;   // доля от стресс-уровня
    var pass = isFinite(buf) && buf >= 0.13;         // тот же критерий, что и формула L_max

    var resColor = pass ? 'var(--green)' : 'var(--red)';
    var resMark  = pass ? '\u2713 ПРОХОДИТ' : '\u2715 НЕ ПРОХОДИТ';
    var dPct     = (k - 1) * 100;

    // Мелкий сдвиг слайдера даёт формально большое «безопасное» плечо —
    // это ложный комфорт, а не запас прочности. Подписываем явно.
    var softHtml = Math.abs(dPct) < 5
        ? ' <span style="color:var(--accent);">&mdash; сценарий мягкий</span>' : '';
    // Абсурдные отрицательные значения (ликвидация далеко внутри стресса)
    // не несут информации сверх факта «пробито».
    var bufTxt = buf < -0.999 ? '&lt;\u2212100%' : (buf * 100).toFixed(1) + '%';

    // Строка сценариев: видно, ЧТО с ЧЕМ сравнивается. Видео-прогон 08.08
    // показал чтение плеча при несдвинутом слайдере (стресс = только множитель
    // режима на том же уровне BTC) — теперь совпадение уровней подписано.
    var scenHtml;
    if (autoStress) {
        scenHtml = '<div class="lev-sub">АВТО: BTC $' + Math.round(entryBtc).toLocaleString()
            + (pinned ? '' : ' <span style="color:#666;">(рынок)</span>')
            + ' &rarr; $' + Math.round(stressBtc).toLocaleString()
            + ' (' + (isL ? '\u2212' : '+') + (ad.d * 100).toFixed(1) + '%, реакция \u00D71.3)'
            + (ad.auto ? '' : ' <span style="color:var(--accent);">&mdash; фикс. 20%, нет vol BTC</span>')
            + '</div>';
    } else {
        // Видео-прогон 08.08: чтение плеча при несдвинутом слайдере — подписано.
        var sameLevel = Math.abs(target - entryBtc) < 1;
        scenHtml = '<div class="lev-sub">BTC $' + entryBtc.toLocaleString()
            + ' (Normal) &rarr; $' + target.toLocaleString()
            + ' (' + STRESS_NAME[currentStress] + ')'
            + (sameLevel ? ' <span style="color:var(--accent);">&mdash; слайдер не сдвинут</span>' : '')
            + '</div>';
    }

    // РЕК — независимая вероятностная оценка (Vol + горизонт 30д), она НЕ
    // зависит от сценария BTC. Итоговый потолок = min(МАКС, РЕК): сценарный
    // предел и статистический предел должны выполняться оба.
    var recRaw  = recommendedLeverage(coinData.volatility, isL);
    var recTxt  = recRaw === null ? '' : (recRaw < 1 ? '&lt;1x' : Math.floor(recRaw) + 'x');
    var headRec = recTxt ? ' <span style="color:var(--cyan);">&middot; РЕК ' + recTxt + '</span>' : '';

    return box(
        sideName + ' &middot; МАКС ' + lmaxTxt + headRec,
        scenHtml
        + '<div class="lev-sub">Вход ' + fmtUsd(E) + ' &rarr; стресс ' + fmtUsd(S)
            + ' (' + (dPct >= 0 ? '+' : '') + dPct.toFixed(1) + '%)' + softHtml + '</div>'
        + '<div class="lev-res" style="color:' + resColor + ';">Выбрано ' + L + 'X &middot; ликв '
            + fmtUsd(liq) + ' &middot; запас ' + bufTxt + ' ' + resMark + '</div>'
        + recLineHtml(coinData.volatility, isL, L, true)
    );
}

// ── Главный рендер ──────────────────────────────────────────────────────────
function update() {
    if (!cachedMarketData.length) return;
    var btcObj = null;
    for (var i = 0; i < cachedMarketData.length; i++) {
        if (cachedMarketData[i].symbol === 'BTCUSDT') { btcObj = cachedMarketData[i]; break; }
    }
    if (!btcObj) return;

    var btc    = parseFloat(btcObj.lastPrice);
    var btc24h = parseFloat(btcObj.priceChangePercent);
    var target = parseFloat(document.getElementById('slider').value);
    var ratio  = (target - btc) / btc;

    var slider = document.getElementById('slider');
    if (slider) slider.style.accentColor = ratio > 0 ? 'var(--green)' : (ratio < 0 ? 'var(--red)' : 'var(--accent)');

    var elCur = document.getElementById('btc-cur');
    if (elCur) elCur.innerText = '$' + Math.round(btc).toLocaleString();

    var el24h = document.getElementById('btc-24h');
    if (el24h) {
        el24h.innerText   = (btc24h >= 0 ? '+' : '') + btc24h.toFixed(2) + '%';
        el24h.style.color = btc24h >= 0 ? 'var(--green)' : 'var(--red)';
    }

    var btcDirColor = ratio >= 0 ? 'var(--green)' : 'var(--red)';
    var btcDirArrow = ratio >= 0 ? '\u219F' : '\u21A1';

    var elTarget = document.getElementById('btc-target');
    if (elTarget) {
        elTarget.innerText = 'Прогноз BTC: $' + target.toLocaleString();
        elTarget.style.color = btcDirColor;
    }
    var elTargetArrow = document.getElementById('btc-target-arrow');
    if (elTargetArrow) {
        elTargetArrow.innerText = btcDirArrow;
        elTargetArrow.style.color = btcDirColor;
    }

    var elPct = document.getElementById('btc-pct');
    if (elPct) {
        elPct.innerText   = (ratio >= 0 ? '+' : '') + (ratio * 100).toFixed(2) + '%';
        elPct.style.color = ratio > 0 ? 'var(--green)' : (ratio < 0 ? 'var(--red)' : '#ffffff');
    }

    // Диапазон BTC за 90д (min / позиция / max) — данные из coeffs.json.
    // Мигание на порогах 25%/75% — как в карточках монет.
    // Старый coeffs.json без поля btc => честная надпись, без падения (инв. 9).
    var brEl = document.getElementById('btc-range');
    if (brEl) {
        var bs = botData.btc;
        if (bs && bs.max_price > bs.min_price) {
            var bPos = Math.max(0, Math.min(100, (btc - bs.min_price) / (bs.max_price - bs.min_price) * 100));
            var bMinCls = bPos <= 25 ? 'light-blink' : '';
            var bMinCol = bPos <= 25 ? 'var(--red)' : 'var(--accent)';
            var bMaxCls = bPos >= 75 ? 'light-blink' : '';
            var bMaxCol = bPos >= 75 ? 'var(--green)' : 'var(--accent)';
            brEl.innerHTML = 'Min: <span class="' + bMinCls + '" style="color:' + bMinCol + ';">$'
                + Math.round(bs.min_price).toLocaleString() + '</span>'
                + ' | <span style="color:#fff;font-size:1.05em;font-weight:bold;font-family:monospace;margin:0 4px;">'
                + bPos.toFixed(0) + '%</span> | '
                + 'Max: <span class="' + bMaxCls + '" style="color:' + bMaxCol + ';">$'
                + Math.round(bs.max_price).toLocaleString() + '</span>'
                + ' <span style="color:#666;font-size:0.8em;font-style:normal;">90д</span>';
        } else {
            brEl.innerHTML = '<span style="color:#666;">Диапазон BTC 90д: нет данных бота</span>';
        }
    }

    // Индикатор LONG / SHORT — с защитой от null
    var dirEl = document.getElementById('dir-indicator');
    if (dirEl) {
        // Это направление СЦЕНАРИЯ BTC, а не сторона позиции: сторона задаётся
        // кнопками ЛОНГ/ШОРТ. Слайдер вниз — штатный способ искать вход в лонг.
        if (ratio > 0.005)       { dirEl.innerText = 'BTC ВВЕРХ'; dirEl.style.color = 'var(--green)'; }
        else if (ratio < -0.005) { dirEl.innerText = 'BTC ВНИЗ';  dirEl.style.color = 'var(--red)'; }
        else                     { dirEl.innerText = '--';        dirEl.style.color = '#888'; }
    }

    // Цвет символов кнопок синхронно со слайдером
    var btnM = document.getElementById('btn-minus');
    var btnP = document.getElementById('btn-plus');
    if (btnM && btnP) {
        if (ratio < -0.005) {
            btnM.style.color='var(--red)';   btnM.style.borderColor='var(--red)';
            btnP.style.color='#444';         btnP.style.borderColor='#444';
        } else if (ratio > 0.005) {
            btnP.style.color='var(--green)'; btnP.style.borderColor='var(--green)';
            btnM.style.color='#444';         btnM.style.borderColor='#444';
        } else {
            btnM.style.color='#777'; btnM.style.borderColor='#555';
            btnP.style.color='#777'; btnP.style.borderColor='#555';
        }
    }

    var stressMult  = STRESS_MULT[currentStress];
    var stressBadge = STRESS_BADGE[currentStress];
    var badgeColor  = currentStress === 'panic' ? 'var(--accent)' : 'var(--red)';

    var html = '';

    tokens.forEach(function(t, i) {
        var coin = null;
        if (t.fut) {
            coin = cachedFutTickers[t.s] || null;
        } else {
            for (var j = 0; j < cachedMarketData.length; j++) {
                if (cachedMarketData[j].symbol === t.s) { coin = cachedMarketData[j]; break; }
            }
        }
        if (!coin) {
            // Пара исчезла из тикера Binance (делистинг / смена тикера при
            // ребрендинге): раньше карточка молча пропадала — теперь видно.
            html += '<div class="no-data-card">'
                + '<div class="token-name">' + t.name + ' <span style="color:var(--red);font-size:0.7em;">НЕТ ПАРЫ</span></div>'
                + '<div style="font-size:0.85em;color:#888;margin-top:4px;">' + t.s + ' отсутствует в тикере Binance &mdash; делистинг или смена тикера</div>'
                + '</div>';
            return;
        }

        // Детектор мёртвого рынка (остановка торгов / делистинг / миграция
        // тикера): 0 сделок за 24ч или пустой стакан => lastPrice заморожен.
        // Расчёты по замороженной цене ОТКЛЮЧАЮТСЯ полностью — для фьючерсов
        // прогноз/ликвидации от неё опасны. У живых пар count всегда >> 0;
        // если полей нет в ответе (NaN) — поведение как раньше, карточка живая.
        var trades24 = parseFloat(coin.count);
        var bidP     = parseFloat(coin.bidPrice);
        var askP     = parseFloat(coin.askPrice);
        if (trades24 === 0 || (bidP === 0 && askP === 0)) {
            var frozenP = parseFloat(coin.lastPrice);
            html += '<div class="no-data-card">'
                + '<div class="token-name">' + t.name + ' <span class="light-blink" style="color:var(--red);font-size:0.7em;">ТОРГИ ОСТАНОВЛЕНЫ</span></div>'
                + '<div style="font-size:0.85em;color:#888;margin-top:4px;">Цена заморожена: $' + (isFinite(frozenP) ? frozenP.toFixed(4) : '?')
                + ' &mdash; прогноз и ликвидации отключены (0 сделок / пустой стакан). Возможна миграция тикера.</div>'
                + '</div>';
            return;
        }

        var coinData = null;
        if (botData.analysis_data) {
            for (var k = 0; k < botData.analysis_data.length; k++) {
                if (botData.analysis_data[k].symbol === t.name) { coinData = botData.analysis_data[k]; break; }
            }
        }

        if (!coinData || coinData.error) {
            html += '<div class="no-data-card">'
                + '<div class="token-name">' + t.name + ' <span style="color:var(--red);font-size:0.7em;">NO DATA</span></div>'
                + '<div style="font-size:0.85em;color:#888;margin-top:4px;">Бот не дал валидной беты</div>'
                + '</div>';
            return;
        }

        // Бета с учётом стресс-режима
        var rawBeta = ratio >= 0 ? coinData.up_beta : coinData.down_beta;
        // Guard: бета может быть null при error=false (мало точек в нужном
        // направлении) — раньше это молча рисовало прогноз 0%
        if (rawBeta === null || rawBeta === undefined || !isFinite(rawBeta)) {
            html += '<div class="no-data-card">'
                + '<div class="token-name">' + t.name + ' <span style="color:var(--red);font-size:0.7em;">NO BETA</span></div>'
                + '<div style="font-size:0.85em;color:#888;margin-top:4px;">Нет валидной беты для текущего направления</div>'
                + '</div>';
            return;
        }
        var beta    = rawBeta * stressMult;
        var r2_14   = ratio >= 0 ? coinData.up_r2 : coinData.down_r2;

        // 90-дневная бета (справочная)
        var beta90 = ratio >= 0 ? coinData.up_beta_90 : coinData.down_beta_90;
        var r2_90  = ratio >= 0 ? coinData.up_r2_90   : coinData.down_r2_90;

        var cur  = parseFloat(coin.lastPrice);
        var p24h = parseFloat(coin.priceChangePercent);

        // Сверка источников: живая цена Binance против 90д-диапазона бота
        // (CoinGecko). Выход далеко за диапазон (×1.5 вверх / ×0.5 вниз) =>
        // либо пара и CoinGecko-id смотрят на РАЗНЫЕ активы (ошибка миграции),
        // либо экстремальное движение за <1ч — в обоих случаях смотреть руками.
        var srcMismatch = (coinData.max_price > 0)
            && (cur > coinData.max_price * 1.5 || cur < coinData.min_price * 0.5);
        var mismatchHtml = srcMismatch
            ? '<div style="color:#f3ba2f;font-weight:600;font-size:0.75em;margin:2px 0;">&#9888; Расхождение источников: цена вне 90д-диапазона бота &mdash; проверь пару/ID</div>'
            : '';

        // Степенная агрегация беты: часовая бета накапливается по пути
        // мультипликативно, поэтому прогноз = cur * (1+ratio)^beta.
        // На малых ходах совпадает с прежним линейным cur*(1+ratio*beta),
        // на больших не даёт цен ниже нуля и clamp-артефактов.
        // 1+ratio = target/btc > 0 всегда; Math.max — защитный пояс.
        var growth = Math.pow(Math.max(1 + ratio, 1e-9), beta);
        var pPct   = (growth - 1) * 100;

        // Позиция в 90-дневном диапазоне (по живой цене; бот считает min/max за DAYS_WINDOW=90)
        var minP = coinData.min_price, maxP = coinData.max_price;
        var dynPos = (maxP - minP) > 0
            ? Math.max(0, Math.min(100, ((cur - minP) / (maxP - minP)) * 100))
            : 0;

        // Прогнозная цена (куда пойдёт монета)
        var pred     = Math.max(cur * growth, 0.00000001);
        var predText = pred < 0.0001 ? '&lt;0.0001' : '$' + pred.toFixed(4);

        // ── ЛИКВИДАЦИЯ ────────────────────────────────────────────────────
        var isLong   = ratio >= 0;
        // Ликвидация считается от ПРОГНОЗНОЙ цены (pred) — точки планируемого входа.
        // Логика калькулятора: "BTC пойдёт туда → альт будет по pred → по этой цене входим".
        // Учитывается maintenance margin (LIQ_MMR): реальная ликвидация ближе
        // ко входу, чем наивное pred*(1 -/+ 1/L). Комиссии/funding не учтены.
        // LONG:  liq = pred * (1 - 1/L + MMR)  — ниже входа
        // SHORT: liq = pred * (1 + 1/L - MMR)  — выше входа
        var liqLong    = pred * (1 - 1/currentLev + LIQ_MMR);
        var liqLongTxt = liqLong  < 0.0001 ? '&lt;0.0001' : '$' + liqLong.toFixed(4);
        var liqShort   = pred * (1 + 1/currentLev - LIQ_MMR);
        var liqShortTxt= liqShort < 0.0001 ? '&lt;0.0001' : '$' + liqShort.toFixed(4);

        // Цвета
        var p24hColor = p24h >= 0 ? 'var(--green)' : 'var(--red)';
        var r2Color   = r2_14 < 0.30 ? 'var(--red)' : (r2_14 < 0.60 ? '#f3ba2f' : 'var(--green)');
        var volPct    = coinData.volatility * 100;
        var volColor  = volPct > 1.5 ? 'var(--lilac)' : (volPct > 1.0 ? 'var(--cyan)' : '#888');
        var predColor = ratio >= 0 ? 'var(--green)' : 'var(--red)';
        var predArrow = ratio >= 0 ? '\u219F' : '\u21A1';

        // Строка 90d беты + индикатор согласованности + корреляция BTC/ALT
        var line90 = '';
        if (beta90 !== null && beta90 !== undefined && r2_90 !== null) {
            // Иконка ok/! удалена: расхождение бет 14д/90д уже входит в Conf/МДЛ,
            // а сами беты теперь видны рядом числами (b= в строке R2 и 90d: b=).
            var r90Color = r2_90 < 0.30 ? 'var(--red)' : (r2_90 < 0.60 ? '#f3ba2f' : 'var(--green)');
            // corr_90 — опциональное поле (старый coeffs.json его не содержит)
            var corr90   = coinData.corr_90;
            var corrHtml = '';
            if (corr90 !== null && corr90 !== undefined) {
                var corrColor = Math.abs(corr90) >= 0.75 ? 'var(--green)'
                    : (Math.abs(corr90) >= 0.5 ? '#f3ba2f' : 'var(--red)');
                corrHtml = ' / <span style="color:' + corrColor + '">\u03C1=' + corr90.toFixed(2) + '</span>';
            }
            line90 = '<div style="font-size:0.78em;color:#666;margin:2px 0 3px;">'
                + '90d: b=' + beta90.toFixed(2)
                + ' / <span style="color:' + r90Color + '">R2=' + r2_90.toFixed(2) + '</span>'
                + corrHtml
                + '</div>';
        }

        // Confidence Score по метрикам текущего направления
        var conf = confidenceScore(r2_14, r2_90, rawBeta, beta90, coinData.volatility);
        var confColor = conf === null ? '#888'
            : (conf >= 70 ? 'var(--green)' : (conf >= 40 ? 'var(--accent)' : 'var(--red)'));

        // Funding Rate
        var fundRate = cachedFunding[t.s];
        var fundHtml = '';
        if (fundRate !== undefined) {
            // Правило Босса: зелёный = мне платят, красный = я плачу.
            // Funding > 0: лонги платят шортам; < 0: шорты платят лонгам.
            // Сторона берётся из кнопок ЛОНГ/ШОРТ, а НЕ из направления слайдера:
            // при замере риска слайдер смотрит против сделки, и старый цвет
            // инвертировался ровно в этот момент.
            var fundColor = (currentSide === 'long')
                ? (fundRate > 0 ? 'var(--red)' : 'var(--green)')
                : (fundRate > 0 ? 'var(--green)' : 'var(--red)');
            fundHtml = '<span style="color:' + fundColor + ';font-size:0.8em;font-style:italic;margin-left:8px;">'
                + 'Fund: ' + (fundRate >= 0 ? '+' : '') + (fundRate * 100).toFixed(4) + '%/8h'
                + '</span>';
        }

        // Ранг по капитализации + дельта за 24ч (поля опциональные — инв. 9).
        // Серый = без изменений, зелёный = поднялся, красный = опустился.
        var badgeInner = '';
        if (coinData.rank !== null && coinData.rank !== undefined) {
            var rPrev = coinData.rank_prev;
            var rColor = '#ccc', rArrow = '';
            if (rPrev !== null && rPrev !== undefined && rPrev !== coinData.rank) {
                var rDelta = rPrev - coinData.rank;   // > 0 => поднялся в рейтинге
                if (rDelta > 0) { rColor = 'var(--green)'; rArrow = '\u2191' + rDelta; }
                else            { rColor = 'var(--red)';   rArrow = '\u2193' + (-rDelta); }
            }
            badgeInner += '<span style="color:' + rColor + ';">#'
                + coinData.rank + rArrow + '</span>';
        }
        // FDV/MC — во сколько раз полная эмиссия больше обращающейся.
        // Контекст риска разлоков, НЕ самостоятельный сигнал лонг/шорт.
        // Поле опционально: нет max supply (ETH, XMR) => null, ничего не рисуем.
        var fdv = coinData.fdv_mc;
        if (fdv !== null && fdv !== undefined && isFinite(fdv)) {
            var fColor = fdv > 3 ? 'var(--red)' : (fdv >= 1.5 ? 'var(--accent)' : '#888');
            badgeInner += '<span style="color:' + fColor + ';margin-left:6px;">FDV '
                + fdv.toFixed(1) + '\u00D7</span>';
        }
        var rankHtml = badgeInner
            ? '<span class="rank-badge">' + badgeInner + '</span>' : '';

        // Стресс-бейдж
        var badgeHtml = stressBadge
            ? '<span style="font-size:0.6em;color:' + badgeColor + ';font-weight:bold;margin-left:5px;">' + stressBadge + '</span>'
            : '';

        // Min/Max с мигающей анимацией у порогов 25% и 75%
        var minClass  = dynPos <= 25 ? 'light-blink' : '';
        var minColor  = dynPos <= 25 ? 'var(--red)' : 'var(--accent)';
        var maxClass  = dynPos >= 75 ? 'light-blink' : '';
        var maxColor  = dynPos >= 75 ? 'var(--green)' : 'var(--accent)';

        // Блок допустимого плеча ('' пока вход не зафиксирован)
        var levHtml = leverageBlock(coinData, cur, btc, target);

        // Мерцающая рамка только на самых краях диапазона: <=1% или >=99%
        // Подсветка по тому же округлённому %, что видит пользователь
        var dynPosRounded = Math.round(dynPos);
        var edgeClass = '';
        if (dynPosRounded <= 1)       edgeClass = ' edge-min';
        else if (dynPosRounded >= 99) edgeClass = ' edge-max';

        html += '<div class="card' + edgeClass + '" style="border-left:4px solid ' + p24hColor + ';">'

            // Ранг в левом верхнем углу (абсолютное позиционирование — вне потока)
            + rankHtml

            // Заголовок карточки
            + '<div class="row">'
            +   '<span class="token-name">' + t.name + badgeHtml
            +     ' <span class="pct-24h" style="color:' + p24hColor + ';">'
            +       (p24h > 0 ? '+' : '') + p24h.toFixed(2) + '%'
            +     '</span>'
            +   '</span>'
            +   '<div style="text-align:right;">'
            +     '<div>$' + cur.toFixed(4) + '</div>'
            +     (conf === null ? '' :
                   '<div style="font-size:0.72em;font-weight:700;color:' + confColor + ';">Conf ' + conf + '%</div>')
            +     (function() {
                       var g = gateState(conf, r2_14, coinData.corr_90);
                       var gc = g === 'green' ? 'var(--green)' : (g === 'yellow' ? 'var(--accent)' : 'var(--red)');
                       var gl = g === 'green' ? 'MDL \u2713' : (g === 'yellow' ? 'MDL \u007E' : 'MDL \u2715');
                       return '<div style="font-size:0.66em;font-weight:800;letter-spacing:0.04em;color:' + gc + ';">' + gl + '</div>';
                   })()
            +   '</div>'
            + '</div>'

            // Жёлтое предупреждение о расхождении источников (пусто в норме)
            + mismatchHtml

            // R² 14d + Funding
            + '<div style="font-size:1.1em;font-weight:bold;font-style:italic;margin:4px 0;color:' + r2Color + ';">'
            +   '<span style="color:#ccc;">b=' + rawBeta.toFixed(2) + '</span> / R2: ' + (r2_14 !== null ? r2_14.toFixed(2) : 'N/A') + fundHtml
            + '</div>'

            // 90d строка
            + line90

            // Вход зафиксирован -> блок допустимого плеча (одна база расчёта:
            // цена входа E). Не зафиксирован -> прежние две строки ликвидации,
            // байт в байт как раньше.
            + (levHtml ? levHtml :
                 '<div style="font-size:0.9em;font-weight:600;color:var(--accent);">'
               +   '<span style="color:var(--green);">LONG </span>'
               +   currentLev + 'X: ' + liqLongTxt
               + '</div>'
               + '<div style="font-size:0.9em;font-weight:600;color:var(--accent);">'
               +   '<span style="color:var(--red);">SHORT </span>'
               +   currentLev + 'X: ' + liqShortTxt
               + '</div>'
                 // РЕК не зависит от сценария BTC — показывается всегда, для
                 // НАЖАТОЙ стороны сделки. Нет Vol => строка пустая (инв. 9).
               + recLineHtml(coinData.volatility, currentSide === 'long', currentLev, false))

            // Диапазон Min / Pos% / Max
            + '<div class="extra-data">'
            +   'Min: <span class="' + minClass + '" style="color:' + minColor + ';">$' + minP.toFixed(4) + '</span>'
            +   ' | <span style="color:#fff;font-size:1.1em;font-weight:bold;font-family:monospace;margin:0 4px;">'
            +     dynPos.toFixed(0) + '%'
            +   '</span> | '
            +   'Max: <span class="' + maxClass + '" style="color:' + maxColor + ';">$' + maxP.toFixed(4) + '</span>'
            + '</div>'

            // Прогнозная цена — над волатильностью, цвет по направлению слайдера
            // Процент изменения — над прогнозной ценой, тем же шрифтом
            + '<div style="position:absolute;bottom:90px;right:14px;font-size:0.9em;font-weight:bold;font-style:italic;color:' + (pPct >= 0 ? 'var(--green)' : 'var(--red)') + ';"'
            +   ' class="' + (beta < 0 ? 'blink-text' : '') + '">'
            +   (pPct >= 0 ? '+' : '') + pPct.toFixed(2) + '%'
            + '</div>'
            // Прогнозная цена со стрелкой
            + '<div style="position:absolute;bottom:66px;right:14px;font-size:0.9em;font-weight:bold;font-style:italic;color:' + predColor + ';">'
            +   '<span style="font-size:1.5em;font-weight:700;line-height:1;vertical-align:-2px;">' + predArrow + '</span> ' + predText
            + '</div>'

            // Волатильность
            + '<div class="vol-value" style="color:' + volColor + ';">Vol: ' + volPct.toFixed(2) + '%</div>'

            // Кнопки перестановки
            + '<div style="position:absolute;bottom:10px;right:10px;">'
            +   '<button class="nav-btn" onclick="move(' + i + ',-1)">&#8593;</button>'
            +   '<button class="nav-btn" onclick="move(' + i + ',1)" style="margin-left:5px;">&#8595;</button>'
            + '</div>'

        + '</div>';
    });

    var resultsEl = document.getElementById('results');
    if (resultsEl) resultsEl.innerHTML = html;
}

document.getElementById('slider').oninput = update;

// Кнопки точной настройки цены
// Шаг $500 — достаточно мелко для точного прицеливания,
// достаточно крупно чтобы за 1-2 нажатия перейти на нужный уровень.
var STEP_BTN = 500;

document.getElementById('btn-minus').addEventListener('click', function() {
    var s   = document.getElementById('slider');
    var val = parseInt(s.value, 10) - STEP_BTN;
    if (val < parseInt(s.min, 10)) val = parseInt(s.min, 10);
    s.value = val;
    update();
});

document.getElementById('btn-plus').addEventListener('click', function() {
    var s   = document.getElementById('slider');
    var val = parseInt(s.value, 10) + STEP_BTN;
    if (val > parseInt(s.max, 10)) val = parseInt(s.max, 10);
    s.value = val;
    update();
});

// Удержание кнопки: автоповтор через 400мс с интервалом 100мс
function setupHold(btnId, delta) {
    var btn = document.getElementById(btnId);
    var timer = null;
    var interval = null;
    btn.addEventListener('mousedown',  startHold);
    btn.addEventListener('touchstart', startHold, {passive:true});
    btn.addEventListener('mouseup',    stopHold);
    btn.addEventListener('mouseleave', stopHold);
    btn.addEventListener('touchend',   stopHold);
    function startHold(e) {
        timer = setTimeout(function() {
            interval = setInterval(function() {
                var s   = document.getElementById('slider');
                var val = parseInt(s.value, 10) + delta;
                if (val < parseInt(s.min,10)) val = parseInt(s.min,10);
                if (val > parseInt(s.max,10)) val = parseInt(s.max,10);
                s.value = val;
                update();
            }, 100);
        }, 400);
    }
    function stopHold() {
        clearTimeout(timer);
        clearInterval(interval);
        timer = null; interval = null;
    }
}
setupHold('btn-minus', -STEP_BTN);
setupHold('btn-plus',  +STEP_BTN);

init();
</script>
</body>
</html>
