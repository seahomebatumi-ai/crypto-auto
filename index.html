<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="image.PNG">
    <title>Pro Crypto Engine</title>
    <style>
        :root {
            --bg: #0f0f12; --card: #1a1a20; --accent: #f3ba2f;
            --lilac: #bf5af2; --cyan: #0ad1c8; --red: #ff453a;
            --green: #30d158; --text: #ffffff;
        }
        body {
            background-color: var(--bg); color: var(--text);
            font-family: -apple-system, sans-serif; margin: 0;
            padding-top: calc(env(safe-area-inset-top) + 10px);
            padding-left: 10px; padding-right: 10px;
            padding-bottom: calc(env(safe-area-inset-bottom) + 10px);
        }
        .control {
            background: var(--card); padding: 15px; border-radius: 16px;
            border: 1px solid #333; margin-bottom: 15px;
        }
        .btc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        @keyframes rainbow { 0%{filter:hue-rotate(0deg)} 100%{filter:hue-rotate(360deg)} }
        .btc-logo { font-size: 2.4em; color: var(--accent); font-weight: bold; transition: 0.3s; }
        .btc-logo.loading { animation: rainbow 1s linear infinite; }
        .btc-price { color: var(--accent); font-size: 1.6em; font-weight: 800; }
        .card {
            background: var(--card); padding: 14px; border-radius: 12px;
            margin-bottom: 8px; border: 1px solid #333; position: relative;
        }
        .no-data-card {
            background: var(--card); padding: 14px; border-radius: 12px;
            margin-bottom: 8px; border: 1px solid #333; border-left: 4px solid var(--red);
        }
        .token-name { font-size: 1.2em; font-weight: 800; color: var(--lilac); }
        .row { display: flex; justify-content: space-between; align-items: center; }
        #slider { width: 100%; margin: 10px 0; transition: accent-color 0.3s ease; }
        .lev-container {
            display: grid; grid-template-columns: repeat(7,1fr);
            gap: 4px; margin-bottom: 6px;
        }
        .lev-btn {
            background: #2c2c31; border: none; color: white;
            padding: 8px 0; border-radius: 6px; font-size: 12px; cursor: pointer;
        }
        .lev-btn.active { background: var(--accent); color: #000; font-weight: bold; }
        .stress-container { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; }
        .stress-btn {
            border: none; color: #aaa; padding: 7px 0; border-radius: 6px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            background: #2c2c31; transition: all 0.2s;
        }
        .stress-btn.s-normal { color: #000; background: var(--green); }
        .stress-btn.s-panic  { color: #000; background: var(--accent); }
        .stress-btn.s-crash  { color: #fff; background: var(--red); }
        .nav-btn {
            background: #444; border: none; color: #fff;
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        .pct-24h { font-size: 0.6em; font-weight: bold; }
        @keyframes blink { 0%{opacity:1} 50%{opacity:0.2} 100%{opacity:1} }
        .blink-text { animation: blink 1s linear infinite; font-weight: 900; }
        @keyframes lightBlink { 0%{opacity:1} 50%{opacity:0.5} 100%{opacity:1} }
        .light-blink { animation: lightBlink 1.5s ease-in-out infinite; }
        .extra-data { font-size: 0.85em; color: var(--accent); margin-top: 8px; font-style: italic; }
        .vol-value {
            position: absolute; bottom: 42px; right: 14px;
            font-size: 0.9em; font-weight: bold; font-style: italic;
        }
    </style>
</head>
<body>

<div class="control">
    <div class="btc-header">
        <span id="btc-logo" class="btc-logo">&#8383;</span>
        <span id="btc-cur" class="btc-price">...</span>
        <span id="btc-24h" style="font-weight:bold;">0.00%</span>
        <div id="status-dot" style="width:12px;height:12px;border-radius:50%;background:#666;margin-left:auto;"></div>
    </div>
    <div class="row" style="margin-bottom:4px;">
        <div id="btc-target" style="font-weight:600;">Прогноз BTC: ...</div>
        <div style="text-align:right;">
            <div id="btc-pct" style="font-weight:bold;color:#ffffff;">0.00%</div>
            <div id="dir-indicator" style="font-size:0.75em;font-weight:800;color:#888;">&#8212;&#8212;</div>
        </div>
    </div>
    <div id="last-update" style="font-size:0.7em;color:#888;margin-bottom:10px;">Данные бота: ожидание...</div>
    <div style="display:flex;align-items:center;gap:6px;margin:6px 0;">
        <button id="btn-minus" style="
            background:#2c2c31;border:none;color:#ffffff;
            font-size:1.3em;font-weight:700;width:36px;height:36px;
            border-radius:8px;cursor:pointer;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;
            line-height:1;">&#8722;</button>
        <input type="range" id="slider" min="20000" max="150000" step="100"
               style="flex:1;margin:0;">
        <button id="btn-plus" style="
            background:#2c2c31;border:none;color:#ffffff;
            font-size:1.3em;font-weight:700;width:36px;height:36px;
            border-radius:8px;cursor:pointer;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;
            line-height:1;">&#43;</button>
    </div>
    <div class="lev-container" id="levContainer"></div>
    <div class="stress-container" id="stressContainer"></div>
</div>

<div id="results">Загрузка данных...</div>

<script>
// ── Константы ──────────────────────────────────────────────────────────────
var currentLev    = 3;
var currentStress = 'normal';

var STRESS_MULT  = { normal: 1.0, panic: 1.3, crash: 1.8 };
var STRESS_BADGE = { normal: '',   panic: 'b*1.3', crash: 'b*1.8' };

var botData          = { analysis_data: [], generated_at: null };
var cachedMarketData = [];
var cachedFunding    = {};
var sliderInitialized = false;

var GIST_URL       = 'https://gist.githubusercontent.com/seahomebatumi-ai/3f50574a29bc37434c18cc8480779ccb/raw/coeffs.json';
var STALE_WARN_MIN = 75;
var STALE_CRIT_MIN = 130;

var tokens = [
    {name:'SUI',    s:'SUIUSDT'},   {name:'ONDO',   s:'ONDOUSDT'},
    {name:'LINK',   s:'LINKUSDT'},  {name:'RENDER', s:'RENDERUSDT'},
    {name:'NEAR',   s:'NEARUSDT'},  {name:'YFI',    s:'YFIUSDT'},
    {name:'AAVE',   s:'AAVEUSDT'},  {name:'AVAX',   s:'AVAXUSDT'},
    {name:'FET',    s:'FETUSDT'},   {name:'ENA',    s:'ENAUSDT'},
    {name:'TAO',    s:'TAOUSDT'},   {name:'TON',    s:'TONUSDT'},
    {name:'XRP',    s:'XRPUSDT'},   {name:'ADA',    s:'ADAUSDT'},
    {name:'TRX',    s:'TRXUSDT'},   {name:'SOL',    s:'SOLUSDT'},
    {name:'BCH',    s:'BCHUSDT'},   {name:'HYPE',   s:'HYPEUSDT'},
    {name:'SKY',    s:'SKYUSDT'},   {name:'ETH',    s:'ETHUSDT'}
];

// ── Порядок карточек ────────────────────────────────────────────────────────
var ORDER_KEY = 'cryptoEngineTokenOrder';

function applySavedOrder() {
    try {
        var saved = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
        if (!Array.isArray(saved) || !saved.length) return;
        var map = {};
        tokens.forEach(function(t) { map[t.name] = t; });
        var out = [];
        saved.forEach(function(n) { if (map[n]) { out.push(map[n]); delete map[n]; } });
        Object.keys(map).forEach(function(n) { out.push(map[n]); });
        tokens = out;
    } catch(e) {}
}

function saveOrder() {
    try {
        localStorage.setItem(ORDER_KEY, JSON.stringify(tokens.map(function(t){ return t.name; })));
    } catch(e) {}
}

// ── Сетевые запросы ─────────────────────────────────────────────────────────
document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
        fetchBotData();
        refreshMarketData();
        fetchFundingRates();
    }
});

function fetchBotData() {
    fetch(GIST_URL + '?t=' + Date.now())
        .then(function(res) { return res.json(); })
        .then(function(data) {
            botData = data;
            document.getElementById('status-dot').style.backgroundColor = 'var(--green)';
            updateFreshnessDisplay();
            update();
        })
        .catch(function() {
            document.getElementById('status-dot').style.backgroundColor = 'var(--red)';
        });
}

function fetchFundingRates() {
    fetch('https://fapi.binance.com/fapi/v1/premiumIndex')
        .then(function(res) { return res.json(); })
        .then(function(data) {
            cachedFunding = {};
            data.forEach(function(item) {
                cachedFunding[item.symbol] = parseFloat(item.lastFundingRate);
            });
            update();
        })
        .catch(function() {});
}

function updateFreshnessDisplay() {
    var el = document.getElementById('last-update');
    if (!el) return;
    if (!botData.generated_at) {
        el.innerText = 'Данные бота: нет timestamp';
        el.style.color = '#888';
        return;
    }
    var genDate = new Date(botData.generated_at);
    var ageMin  = (Date.now() - genDate.getTime()) / 60000;
    var ageText = ageMin < 1 ? 'меньше минуты назад' : Math.round(ageMin) + ' мин назад';
    var color = '#888', prefix = 'Бета обновлена: ';
    if (ageMin > STALE_CRIT_MIN)      { color = 'var(--red)';    prefix = '! Бот давно молчит. Бета: '; }
    else if (ageMin > STALE_WARN_MIN) { color = 'var(--accent)'; prefix = 'Бета (устаревает): '; }
    el.innerText   = prefix + ageText + ' (' + genDate.toLocaleTimeString() + ')';
    el.style.color = color;
}

function refreshMarketData() {
    var logo = document.getElementById('btc-logo');
    if (logo) logo.classList.add('loading');
    fetch('https://api.binance.com/api/v3/ticker/24hr')
        .then(function(res) { return res.json(); })
        .then(function(data) {
            cachedMarketData = data;
            if (!sliderInitialized && data.length > 0) {
                var btcObj = null;
                for (var i = 0; i < data.length; i++) {
                    if (data[i].symbol === 'BTCUSDT') { btcObj = data[i]; break; }
                }
                if (btcObj) {
                    document.getElementById('slider').value = Math.round(parseFloat(btcObj.lastPrice));
                    sliderInitialized = true;
                }
            }
            update();
        })
        .catch(function() {})
        .finally(function() {
            setTimeout(function() { if (logo) logo.classList.remove('loading'); }, 500);
        });
}

// ── UI ──────────────────────────────────────────────────────────────────────
function move(idx, dir) {
    var n = idx + dir;
    if (n >= 0 && n < tokens.length) {
        var tmp = tokens[idx]; tokens[idx] = tokens[n]; tokens[n] = tmp;
        saveOrder();
        update();
    }
}

function renderButtons() {
    var lc = document.getElementById('levContainer');
    [2,3,4,5,6,8,10].forEach(function(l) {
        var b = document.createElement('button');
        b.className = 'lev-btn' + (currentLev === l ? ' active' : '');
        b.innerText = l + 'X';
        b.onclick = function() {
            currentLev = l;
            document.querySelectorAll('.lev-btn').forEach(function(x) { x.classList.remove('active'); });
            b.classList.add('active');
            update();
        };
        lc.appendChild(b);
    });

    var sc = document.getElementById('stressContainer');
    [['normal','Normal'],['panic','Panic'],['crash','Crash']].forEach(function(pair) {
        var mode = pair[0], label = pair[1];
        var b = document.createElement('button');
        b.className = 'stress-btn' + (currentStress === mode ? ' s-' + mode : '');
        b.innerText = label;
        b.onclick = function() {
            currentStress = mode;
            document.querySelectorAll('.stress-btn').forEach(function(x) { x.className = 'stress-btn'; });
            b.className = 'stress-btn s-' + mode;
            update();
        };
        sc.appendChild(b);
    });
}

function init() {
    applySavedOrder();
    renderButtons();
    fetchBotData();
    refreshMarketData();
    fetchFundingRates();
    setInterval(refreshMarketData,    30000);
    setInterval(fetchBotData,    300000);
    setInterval(fetchFundingRates,   300000);
    setInterval(updateFreshnessDisplay, 30000);
}

// ── Главный рендер ──────────────────────────────────────────────────────────
function update() {
    if (!cachedMarketData.length) return;
    var btcObj = null;
    for (var i = 0; i < cachedMarketData.length; i++) {
        if (cachedMarketData[i].symbol === 'BTCUSDT') { btcObj = cachedMarketData[i]; break; }
    }
    if (!btcObj) return;

    var btc    = parseFloat(btcObj.lastPrice);
    var btc24h = parseFloat(btcObj.priceChangePercent);
    var target = parseFloat(document.getElementById('slider').value);
    var ratio  = (target - btc) / btc;

    var slider = document.getElementById('slider');
    if (slider) slider.style.accentColor = ratio > 0 ? 'var(--green)' : (ratio < 0 ? 'var(--red)' : 'var(--accent)');

    var elCur = document.getElementById('btc-cur');
    if (elCur) elCur.innerText = '$' + Math.round(btc).toLocaleString();

    var el24h = document.getElementById('btc-24h');
    if (el24h) {
        el24h.innerText   = (btc24h >= 0 ? '+' : '') + btc24h.toFixed(2) + '%';
        el24h.style.color = btc24h >= 0 ? 'var(--green)' : 'var(--red)';
    }

    var elTarget = document.getElementById('btc-target');
    if (elTarget) elTarget.innerText = 'Прогноз BTC: $' + target.toLocaleString();

    var elPct = document.getElementById('btc-pct');
    if (elPct) {
        elPct.innerText   = (ratio >= 0 ? '+' : '') + (ratio * 100).toFixed(2) + '%';
        elPct.style.color = ratio > 0 ? 'var(--green)' : (ratio < 0 ? 'var(--red)' : '#ffffff');
    }

    // Индикатор LONG / SHORT — с защитой от null
    var dirEl = document.getElementById('dir-indicator');
    if (dirEl) {
        if (ratio > 0.005)       { dirEl.innerText = 'LONG';  dirEl.style.color = 'var(--green)'; }
        else if (ratio < -0.005) { dirEl.innerText = 'SHORT'; dirEl.style.color = 'var(--red)'; }
        else                     { dirEl.innerText = '--';     dirEl.style.color = '#888'; }
    }

    var stressMult  = STRESS_MULT[currentStress];
    var stressBadge = STRESS_BADGE[currentStress];
    var badgeColor  = currentStress === 'panic' ? 'var(--accent)' : 'var(--red)';

    var html = '';

    tokens.forEach(function(t, i) {
        var coin = null;
        for (var j = 0; j < cachedMarketData.length; j++) {
            if (cachedMarketData[j].symbol === t.s) { coin = cachedMarketData[j]; break; }
        }
        if (!coin) return;

        var coinData = null;
        if (botData.analysis_data) {
            for (var k = 0; k < botData.analysis_data.length; k++) {
                if (botData.analysis_data[k].symbol === t.name) { coinData = botData.analysis_data[k]; break; }
            }
        }

        if (!coinData || coinData.error) {
            html += '<div class="no-data-card">'
                + '<div class="token-name">' + t.name + ' <span style="color:var(--red);font-size:0.7em;">NO DATA</span></div>'
                + '<div style="font-size:0.85em;color:#888;margin-top:4px;">Бот не дал валидной беты</div>'
                + '</div>';
            return;
        }

        // Бета с учётом стресс-режима
        var rawBeta = ratio >= 0 ? coinData.up_beta : coinData.down_beta;
        var beta    = rawBeta * stressMult;
        var r2_14   = ratio >= 0 ? coinData.up_r2 : coinData.down_r2;

        // 90-дневная бета (справочная)
        var beta90 = ratio >= 0 ? coinData.up_beta_90 : coinData.down_beta_90;
        var r2_90  = ratio >= 0 ? coinData.up_r2_90   : coinData.down_r2_90;

        var cur  = parseFloat(coin.lastPrice);
        var p24h = parseFloat(coin.priceChangePercent);
        var pPct = ratio * beta * 100;

        // Позиция в 14-дневном диапазоне (по живой цене)
        var minP = coinData.min_price, maxP = coinData.max_price;
        var dynPos = (maxP - minP) > 0
            ? Math.max(0, Math.min(100, ((cur - minP) / (maxP - minP)) * 100))
            : 0;

        // Прогнозная цена (куда пойдёт монета)
        var pred     = Math.max(cur * (1 + ratio * beta), 0.00000001);
        var predText = pred < 0.0001 ? '&lt;0.0001' : '$' + pred.toFixed(4);

        // ── ЛИКВИДАЦИЯ ────────────────────────────────────────────────────
        // Считается от ТЕКУЩЕЙ цены (точки входа), НЕ от прогнозной.
        // LONG  → ликвидация НИЖЕ входа: cur * (1 - 1/L)
        // SHORT → ликвидация ВЫШЕ входа: cur * (1 + 1/L)
        var isLong   = ratio >= 0;
        var liq      = isLong ? cur * (1 - 1/currentLev) : cur * (1 + 1/currentLev);
        var liqText  = liq < 0.0001 ? '&lt;0.0001' : '$' + liq.toFixed(4);
        var liqLabel = isLong ? ('LONG ' + currentLev + 'X') : ('SHORT ' + currentLev + 'X');
        var liqArrow = isLong ? 'v ' : '^ ';
        var liqColor = isLong ? 'var(--red)' : '#ff8c00';

        // Цвета
        var p24hColor = p24h >= 0 ? 'var(--green)' : 'var(--red)';
        var r2Color   = r2_14 < 0.30 ? 'var(--red)' : (r2_14 < 0.60 ? '#f3ba2f' : 'var(--green)');
        var volPct    = coinData.volatility * 100;
        var volColor  = volPct > 1.5 ? 'var(--lilac)' : (volPct > 1.0 ? 'var(--cyan)' : '#888');

        // Строка 90d беты + индикатор согласованности
        var line90 = '';
        if (beta90 !== null && beta90 !== undefined && r2_90 !== null) {
            var div90    = Math.abs(rawBeta - beta90) / (Math.abs(beta90) || 1);
            var aligned  = div90 < 0.25;
            var icon90   = aligned ? ' ok' : ' !';
            var icon90c  = aligned ? 'var(--green)' : 'var(--accent)';
            var r90Color = r2_90 < 0.30 ? 'var(--red)' : (r2_90 < 0.60 ? '#f3ba2f' : 'var(--green)');
            line90 = '<div style="font-size:0.78em;color:#666;margin:2px 0 3px;">'
                + '90d: b=' + beta90.toFixed(2)
                + ' / R2=<span style="color:' + r90Color + '">' + r2_90.toFixed(2) + '</span>'
                + '<span style="color:' + icon90c + ';font-weight:bold;margin-left:4px;">' + icon90 + '</span>'
                + '</div>';
        }

        // Funding Rate
        var fundRate = cachedFunding[t.s];
        var fundHtml = '';
        if (fundRate !== undefined) {
            var fundColor = isLong
                ? (fundRate > 0 ? 'var(--red)' : 'var(--green)')
                : (fundRate < 0 ? 'var(--green)' : 'var(--red)');
            fundHtml = '<span style="color:' + fundColor + ';font-size:0.8em;font-style:italic;margin-left:8px;">'
                + 'Fund: ' + (fundRate >= 0 ? '+' : '') + (fundRate * 100).toFixed(4) + '%/8h'
                + '</span>';
        }

        // Стресс-бейдж
        var badgeHtml = stressBadge
            ? '<span style="font-size:0.6em;color:' + badgeColor + ';font-weight:bold;margin-left:5px;">' + stressBadge + '</span>'
            : '';

        // Min/Max с мигающей анимацией у порогов 25% и 75%
        var minClass  = dynPos <= 25 ? 'light-blink' : '';
        var minColor  = dynPos <= 25 ? 'var(--red)' : 'var(--accent)';
        var maxClass  = dynPos >= 75 ? 'light-blink' : '';
        var maxColor  = dynPos >= 75 ? 'var(--green)' : 'var(--accent)';

        html += '<div class="card" style="border-left:4px solid ' + p24hColor + ';">'

            // Заголовок карточки
            + '<div class="row">'
            +   '<span class="token-name">' + t.name + badgeHtml
            +     ' <span class="pct-24h" style="color:' + p24hColor + ';">'
            +       (p24h > 0 ? '+' : '') + p24h.toFixed(2) + '%'
            +     '</span>'
            +   '</span>'
            +   '<div style="text-align:right;">'
            +     '<div>$' + cur.toFixed(4) + '</div>'
            +     '<div style="color:' + (pPct >= 0 ? 'var(--green)' : 'var(--red)') + ';"'
            +       ' class="' + (beta < 0 ? 'blink-text' : '') + '">'
            +       (pPct >= 0 ? '+' : '') + pPct.toFixed(2) + '%'
            +     '</div>'
            +   '</div>'
            + '</div>'

            // R² 14d + Funding
            + '<div style="font-size:1.1em;font-weight:bold;font-style:italic;margin:4px 0;color:' + r2Color + ';">'
            +   'R2: ' + (r2_14 !== null ? r2_14.toFixed(2) : 'N/A') + fundHtml
            + '</div>'

            // 90d строка
            + line90

            // Прогнозная цена
            + '<div style="margin-top:2px;font-size:0.9em;">Прогноз: <b>' + predText + '</b></div>'

            // Ликвидация с меткой LONG/SHORT
            + '<div style="font-size:0.9em;font-weight:600;color:' + liqColor + ';">'
            +   'Ликв ' + liqArrow + liqLabel + ': ' + liqText
            + '</div>'

            // Диапазон Min / Pos% / Max
            + '<div class="extra-data">'
            +   'Min: <span class="' + minClass + '" style="color:' + minColor + ';">$' + minP.toFixed(4) + '</span>'
            +   ' | <span style="color:#fff;font-size:1.1em;font-weight:bold;font-family:monospace;margin:0 4px;">'
            +     dynPos.toFixed(0) + '%'
            +   '</span> | '
            +   'Max: <span class="' + maxClass + '" style="color:' + maxColor + ';">$' + maxP.toFixed(4) + '</span>'
            + '</div>'

            // Волатильность
            + '<div class="vol-value" style="color:' + volColor + ';">Vol: ' + volPct.toFixed(2) + '%</div>'

            // Кнопки перестановки
            + '<div style="position:absolute;bottom:10px;right:10px;">'
            +   '<button class="nav-btn" onclick="move(' + i + ',-1)">&#8593;</button>'
            +   '<button class="nav-btn" onclick="move(' + i + ',1)" style="margin-left:5px;">&#8595;</button>'
            + '</div>'

        + '</div>';
    });

    var resultsEl = document.getElementById('results');
    if (resultsEl) resultsEl.innerHTML = html;
}

document.getElementById('slider').oninput = update;

// Кнопки точной настройки цены
// Шаг $500 — достаточно мелко для точного прицеливания,
// достаточно крупно чтобы за 1-2 нажатия перейти на нужный уровень.
var STEP_BTN = 500;

document.getElementById('btn-minus').addEventListener('click', function() {
    var s   = document.getElementById('slider');
    var val = parseInt(s.value, 10) - STEP_BTN;
    if (val < parseInt(s.min, 10)) val = parseInt(s.min, 10);
    s.value = val;
    update();
});

document.getElementById('btn-plus').addEventListener('click', function() {
    var s   = document.getElementById('slider');
    var val = parseInt(s.value, 10) + STEP_BTN;
    if (val > parseInt(s.max, 10)) val = parseInt(s.max, 10);
    s.value = val;
    update();
});

// Удержание кнопки: автоповтор через 400мс с интервалом 100мс
function setupHold(btnId, delta) {
    var btn = document.getElementById(btnId);
    var timer = null;
    var interval = null;
    btn.addEventListener('mousedown',  startHold);
    btn.addEventListener('touchstart', startHold, {passive:true});
    btn.addEventListener('mouseup',    stopHold);
    btn.addEventListener('mouseleave', stopHold);
    btn.addEventListener('touchend',   stopHold);
    function startHold(e) {
        timer = setTimeout(function() {
            interval = setInterval(function() {
                var s   = document.getElementById('slider');
                var val = parseInt(s.value, 10) + delta;
                if (val < parseInt(s.min,10)) val = parseInt(s.min,10);
                if (val > parseInt(s.max,10)) val = parseInt(s.max,10);
                s.value = val;
                update();
            }, 100);
        }, 400);
    }
    function stopHold() {
        clearTimeout(timer);
        clearInterval(interval);
        timer = null; interval = null;
    }
}
setupHold('btn-minus', -STEP_BTN);
setupHold('btn-plus',  +STEP_BTN);

init();
</script>
</body>
</html>
