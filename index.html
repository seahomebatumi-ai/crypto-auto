<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="image.PNG">
    <title>Pro Crypto Toll</title>
    <style>
        :root {
            --bg: #0f0f12; --card: #1a1a20; --accent: #f3ba2f;
            --lilac: #bf5af2; --cyan: #0ad1c8; --red: #ff453a;
            --green: #30d158; --text: #ffffff;
        }
        body {
            background-color: var(--bg); color: var(--text);
            font-family: -apple-system, sans-serif; margin: 0;
            padding-top: calc(env(safe-area-inset-top) + 10px);
            padding-left: 10px; padding-right: 10px;
            padding-bottom: calc(env(safe-area-inset-bottom) + 10px);
        }
        .control {
            background: var(--card); padding: 15px; border-radius: 16px;
            border: 1px solid #333; margin-bottom: 15px;
        }
        .btc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        @keyframes rainbow { 0%{filter:hue-rotate(0deg)} 100%{filter:hue-rotate(360deg)} }
        .btc-logo { font-size: 2.4em; color: var(--accent); font-weight: bold; transition: 0.3s; }
        .btc-logo.loading { animation: rainbow 1s linear infinite; }
        @keyframes priceRainbow {
            0%   { color: #f3ba2f; }
            20%  { color: #30d158; }
            40%  { color: #0ad1c8; }
            60%  { color: #bf5af2; }
            80%  { color: #ff453a; }
            100% { color: #f3ba2f; }
        }
        .btc-price.loading { animation: priceRainbow 1.2s linear infinite; }
        .btc-price { color: var(--text); font-size: 1.6em; font-weight: 800; }
        .card {
            background: var(--card); padding: 14px; border-radius: 12px;
            margin-bottom: 8px; border: 1px solid #333; position: relative;
        }
        /* Бегущая линия по контуру при достижении краёв диапазона (1% / 99%) */
        .card.edge-min, .card.edge-max {
            border: 1px solid transparent;
            background-clip: padding-box;
        }
        .card.edge-min::before, .card.edge-max::before {
            content: ''; position: absolute; inset: 0;
            border-radius: 12px; padding: 2px;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            pointer-events: none;
        }
        @keyframes runBorderRed {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        @keyframes runBorderGreen {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .card.edge-min::before {
            background: linear-gradient(90deg, rgba(255,69,58,0) 0%, rgba(255,69,58,1) 25%, rgba(255,255,255,0.9) 50%, rgba(255,69,58,1) 75%, rgba(255,69,58,0) 100%);
            background-size: 200% 100%;
            animation: runBorderRed 1.5s linear infinite;
        }
        .card.edge-max::before {
            background: linear-gradient(90deg, rgba(48,209,88,0) 0%, rgba(48,209,88,1) 25%, rgba(255,255,255,0.9) 50%, rgba(48,209,88,1) 75%, rgba(48,209,88,0) 100%);
            background-size: 200% 100%;
            animation: runBorderGreen 1.5s linear infinite;
        }
        .no-data-card {
            background: var(--card); padding: 14px; border-radius: 12px;
            margin-bottom: 8px; border: 1px solid #333; border-left: 4px solid var(--red);
        }
        .token-name { font-size: 1.2em; font-weight: 800; color: var(--lilac); }
        .row { display: flex; justify-content: space-between; align-items: center; }
        #slider { width: 100%; margin: 10px 0; transition: accent-color 0.3s ease; }
        .lev-container {
            display: grid; grid-template-columns: repeat(7,1fr);
            gap: 4px; margin-bottom: 6px;
        }
        .lev-btn {
            background: #2c2c31; border: none; color: white;
            padding: 8px 0; border-radius: 6px; font-size: 12px; cursor: pointer;
        }
        .lev-btn.active { background: var(--accent); color: #000; font-weight: bold; }
        .stress-container { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; }
        .stress-btn {
            border: none; color: #aaa; padding: 7px 0; border-radius: 6px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            background: #2c2c31; transition: all 0.2s;
        }
        .stress-btn.s-normal { color: #000; background: var(--green); }
        .stress-btn.s-panic  { color: #000; background: var(--accent); }
        .stress-btn.s-crash  { color: #fff; background: var(--red); }
        .nav-btn {
            background: #444; border: none; color: #fff;
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        .pct-24h { font-size: 0.6em; font-weight: bold; }
        @keyframes blink { 0%{opacity:1} 50%{opacity:0.2} 100%{opacity:1} }
        .blink-text { animation: blink 1s linear infinite; font-weight: 900; }
        @keyframes lightBlink { 0%{opacity:1} 50%{opacity:0.5} 100%{opacity:1} }
        .light-blink { animation: lightBlink 1.5s ease-in-out infinite; }
        .extra-data { font-size: 0.85em; color: var(--accent); margin-top: 8px; font-style: italic; }
        .vol-value {
            position: absolute; bottom: 42px; right: 14px;
            font-size: 0.9em; font-weight: bold; font-style: italic;
        }
        @keyframes blinkRed {
            0%  { opacity:1; }
            50% { opacity:0.15; }
            100%{ opacity:1; }
        }
        @keyframes blinkGreen {
            0%  { opacity:1; }
            50% { opacity:0.4; }
            100%{ opacity:1; }
        }
        .icon-warn {
            display:inline-block;
            color: var(--red) !important;
            animation: blinkRed 0.9s linear infinite;
            font-weight: bold;
        }
        .icon-ok {
            display:inline-block;
            color: var(--green) !important;
            animation: blinkGreen 2s ease-in-out infinite;
        }
        /* Экран ввода пароля */
        #lock-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px;
        }
        #lock-screen .lock-box {
            background: var(--card); border: 1px solid #333;
            border-radius: 16px; padding: 28px 22px;
            width: 100%; max-width: 360px; text-align: center;
        }
        #lock-screen .lock-logo { font-size: 2.6em; color: var(--accent); font-weight: bold; margin-bottom: 6px; }
        #lock-screen .lock-title {
            font-size: 1.15em; font-weight: 700; margin-bottom: 18px;
            color: var(--text); letter-spacing: 0.02em;
            word-break: keep-all; line-height: 1.35;
        }
        #lock-input {
            width: 100%; box-sizing: border-box;
            background: #2c2c31; border: 1px solid #444;
            color: var(--text); font-size: 1.1em;
            padding: 12px 14px; border-radius: 10px;
            text-align: center; letter-spacing: 0.05em;
            margin-bottom: 12px; outline: none;
        }
        #lock-input:focus { border-color: var(--accent); }
        #lock-btn {
            width: 100%; background: var(--accent); color: #000;
            font-size: 1.05em; font-weight: 700; border: none;
            padding: 12px; border-radius: 10px; cursor: pointer;
        }
        #lock-error { color: var(--red); font-size: 0.85em; margin-top: 10px; min-height: 18px; }
    </style>
</head>
<body>

<div id="lock-screen">
    <div class="lock-box">
        <div class="lock-logo">&#8383;</div>
        <div class="lock-title">🜲 𝒫𝓇ℴ⇝𝒞𝓇𝒾𝓅𝓉ℴ⇝𝒯ℴ𝓁𝓁 🜲</div>
        <input type="password" id="lock-input" placeholder="Введите код доступа" autocomplete="off" inputmode="text">
        <button id="lock-btn">Войти</button>
        <div id="lock-error"></div>
    </div>
</div>

<div class="control">
    <div class="btc-header">
        <span id="btc-logo" class="btc-logo">&#8383;</span>
        <span id="btc-cur" class="btc-price">...</span>
        <span id="btc-24h" style="font-weight:bold;">0.00%</span>
        <div id="status-dot" style="width:12px;height:12px;border-radius:50%;background:#666;margin-left:auto;"></div>
    </div>
    <div class="row" style="margin-bottom:4px;">
        <div style="font-weight:600;">
            <span id="btc-target">Прогноз BTC: ...</span><span id="btc-target-arrow" style="font-size:1.3em;font-weight:700;line-height:1;vertical-align:-2px;margin-left:4px;"></span>
        </div>
        <div style="text-align:right;">
            <div id="btc-pct" style="font-weight:bold;color:#ffffff;">0.00%</div>
            <div id="dir-indicator" style="font-size:0.75em;font-weight:800;color:#888;">&#8212;&#8212;</div>
        </div>
    </div>
    <div id="last-update" style="font-size:0.7em;color:#888;margin-bottom:10px;">Данные бота: ожидание...</div>
    <div style="display:flex;align-items:center;gap:6px;margin:6px 0;">
        <button id="btn-minus" style="
            background:#2c1f1f;border:1px solid var(--red);color:var(--red);
            font-size:1.4em;font-weight:900;width:38px;height:38px;
            border-radius:8px;cursor:pointer;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;
            line-height:1;">&#8722;</button>
        <input type="range" id="slider" min="20000" max="150000" step="100"
               style="flex:1;margin:0;">
        <button id="btn-plus" style="
            background:#1a2a1f;border:1px solid var(--green);color:var(--green);
            font-size:1.4em;font-weight:900;width:38px;height:38px;
            border-radius:8px;cursor:pointer;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;
            line-height:1;">&#43;</button>
    </div>
    <div class="lev-container" id="levContainer"></div>
    <div class="stress-container" id="stressContainer"></div>
</div>

<div id="results">Загрузка данных...</div>

<script>
// ── Защита паролем ──────────────────────────────────────────────────────────
// Пароль запоминается на устройстве через localStorage: вводится один раз,
// потом калькулятор открывается сразу. На чужом устройстве (где localStorage
// пустой) без пароля доступа нет.
(function() {
    var ACCESS_CODE = 'AV777SA';
    var LS_KEY = 'cryptoEngineAccess';

    function unlock() {
        var ls = document.getElementById('lock-screen');
        if (ls) ls.style.display = 'none';
    }

    // Уже разблокировано на этом устройстве?
    try {
        if (localStorage.getItem(LS_KEY) === ACCESS_CODE) {
            unlock();
        }
    } catch(e) {}

    function tryLogin() {
        var inp = document.getElementById('lock-input');
        var err = document.getElementById('lock-error');
        if (!inp) return;
        if (inp.value === ACCESS_CODE) {
            try { localStorage.setItem(LS_KEY, ACCESS_CODE); } catch(e) {}
            if (err) err.innerText = '';
            unlock();
        } else {
            if (err) err.innerText = 'Неверный код, попробуйте снова';
            inp.value = '';
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        var btn = document.getElementById('lock-btn');
        var inp = document.getElementById('lock-input');
        if (btn) btn.addEventListener('click', tryLogin);
        if (inp) inp.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') tryLogin();
        });
    });
})();

// ── Константы ──────────────────────────────────────────────────────────────
var currentLev    = 3;
var currentStress = 'normal';

var STRESS_MULT  = { normal: 1.0, panic: 1.3, crash: 1.8 };
var STRESS_BADGE = { normal: '',   panic: 'b*1.3', crash: 'b*1.8' };

// Maintenance margin (Binance USDT-M, нижний тир для большинства альтов ~1%).
// Реальная ликвидация ближе ко входу, чем наивное pred*(1 -/+ 1/L).
var LIQ_MMR = 0.01;

var botData          = { analysis_data: [], generated_at: null };
var cachedMarketData = [];
var cachedFunding    = {};
var sliderInitialized = false;

var GIST_URL       = 'https://gist.githubusercontent.com/seahomebatumi-ai/3f50574a29bc37434c18cc8480779ccb/raw/coeffs.json';
var STALE_WARN_MIN = 75;
var STALE_CRIT_MIN = 130;

var tokens = [
    {name:'SUI',    s:'SUIUSDT'},   {name:'ONDO',   s:'ONDOUSDT'},
    {name:'LINK',   s:'LINKUSDT'},  {name:'RENDER', s:'RENDERUSDT'},
    {name:'NEAR',   s:'NEARUSDT'},  {name:'YFI',    s:'YFIUSDT'},
    {name:'AAVE',   s:'AAVEUSDT'},  {name:'AVAX',   s:'AVAXUSDT'},
    {name:'FET',    s:'FETUSDT'},   {name:'ENA',    s:'ENAUSDT'},
    {name:'TAO',    s:'TAOUSDT'},   {name:'TON',    s:'TONUSDT'},
    {name:'XRP',    s:'XRPUSDT'},   {name:'ADA',    s:'ADAUSDT'},
    {name:'TRX',    s:'TRXUSDT'},   {name:'SOL',    s:'SOLUSDT'},
    {name:'BCH',    s:'BCHUSDT'},   {name:'HYPE',   s:'HYPEUSDT'},
    {name:'SKY',    s:'SKYUSDT'},   {name:'ETH',    s:'ETHUSDT'},
    {name:'HBAR',   s:'HBARUSDT'},  {name:'XLM',    s:'XLMUSDT'},
    {name:'ALGO',   s:'ALGOUSDT'}
];

// ── Тикер только по нужным парам ────────────────────────────────────────────
// Полный /ticker/24hr = ~1.2 МБ каждые 30с; ?symbols= = ~12 КБ (weight 40 vs 80).
// При HTTP 400 (например, символ делистнут) откатываемся на полный тикер
// до перезагрузки страницы — поведение идентично старому.
var useSymbolsParam = true;

function marketTickerUrl() {
    if (!useSymbolsParam) return 'https://api.binance.com/api/v3/ticker/24hr';
    var syms = ['BTCUSDT'];
    for (var i = 0; i < tokens.length; i++) {
        if (syms.indexOf(tokens[i].s) === -1) syms.push(tokens[i].s);
    }
    return 'https://api.binance.com/api/v3/ticker/24hr?symbols='
        + encodeURIComponent(JSON.stringify(syms));
}

// ── Порядок карточек ────────────────────────────────────────────────────────
var ORDER_KEY = 'cryptoEngineTokenOrder';

function applySavedOrder() {
    try {
        var saved = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
        if (!Array.isArray(saved) || !saved.length) return;
        var map = {};
        tokens.forEach(function(t) { map[t.name] = t; });
        var out = [];
        saved.forEach(function(n) { if (map[n]) { out.push(map[n]); delete map[n]; } });
        Object.keys(map).forEach(function(n) { out.push(map[n]); });
        tokens = out;
    } catch(e) {}
}

function saveOrder() {
    try {
        localStorage.setItem(ORDER_KEY, JSON.stringify(tokens.map(function(t){ return t.name; })));
    } catch(e) {}
}

// ── Сетевые запросы ─────────────────────────────────────────────────────────
document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
        fetchBotData();
        refreshMarketData();
        fetchFundingRates();
    }
});

function fetchBotData() {
    fetch(GIST_URL + '?t=' + Date.now())
        .then(function(res) { return res.json(); })
        .then(function(data) {
            botData = data;
            document.getElementById('status-dot').style.backgroundColor = 'var(--green)';
            updateFreshnessDisplay();
            update();
        })
        .catch(function() {
            document.getElementById('status-dot').style.backgroundColor = 'var(--red)';
        });
}

function fetchFundingRates() {
    fetch('https://fapi.binance.com/fapi/v1/premiumIndex')
        .then(function(res) { return res.json(); })
        .then(function(data) {
            cachedFunding = {};
            data.forEach(function(item) {
                cachedFunding[item.symbol] = parseFloat(item.lastFundingRate);
            });
            update();
        })
        .catch(function() {});
}

function updateFreshnessDisplay() {
    var el = document.getElementById('last-update');
    if (!el) return;
    if (!botData.generated_at) {
        el.innerText = 'Данные бота: нет timestamp';
        el.style.color = '#888';
        return;
    }
    var genDate = new Date(botData.generated_at);
    var ageMin  = (Date.now() - genDate.getTime()) / 60000;
    var ageText = ageMin < 1 ? 'меньше минуты назад' : Math.round(ageMin) + ' мин назад';
    var color = '#888', prefix = 'Бета обновлена: ';
    if (ageMin > STALE_CRIT_MIN)      { color = 'var(--red)';    prefix = '! Бот давно молчит. Бета: '; }
    else if (ageMin > STALE_WARN_MIN) { color = 'var(--accent)'; prefix = 'Бета (устаревает): '; }
    el.innerText   = prefix + ageText + ' (' + genDate.toLocaleTimeString() + ')';
    el.style.color = color;
}

function refreshMarketData(isRetry) {
    var logo = document.getElementById('btc-logo');
    var priceEl = document.getElementById('btc-cur');
    if (logo) logo.classList.add('loading');
    if (priceEl) priceEl.classList.add('loading');
    fetch(marketTickerUrl())
        .then(function(res) {
            // 400 = невалидный символ в ?symbols= → залипаем на полный тикер
            // и сразу повторяем один раз (без рекурсии при сетевых ошибках)
            if (res.status === 400 && useSymbolsParam && !isRetry) {
                useSymbolsParam = false;
                refreshMarketData(true);
                throw new Error('retry-full-ticker');
            }
            return res.json();
        })
        .then(function(data) {
            cachedMarketData = data;
            if (!sliderInitialized && data.length > 0) {
                var btcObj = null;
                for (var i = 0; i < data.length; i++) {
                    if (data[i].symbol === 'BTCUSDT') { btcObj = data[i]; break; }
                }
                if (btcObj) {
                    document.getElementById('slider').value = Math.round(parseFloat(btcObj.lastPrice));
                    sliderInitialized = true;
                }
            }
            update();
        })
        .catch(function() {})
        .finally(function() {
            setTimeout(function() {
                if (logo) logo.classList.remove('loading');
                if (priceEl) priceEl.classList.remove('loading');
            }, 500);
        });
}

// ── UI ──────────────────────────────────────────────────────────────────────
function move(idx, dir) {
    var n = idx + dir;
    if (n >= 0 && n < tokens.length) {
        var tmp = tokens[idx]; tokens[idx] = tokens[n]; tokens[n] = tmp;
        saveOrder();
        update();
    }
}

function renderButtons() {
    var lc = document.getElementById('levContainer');
    [2,3,4,5,6,8,10].forEach(function(l) {
        var b = document.createElement('button');
        b.className = 'lev-btn' + (currentLev === l ? ' active' : '');
        b.innerText = l + 'X';
        b.onclick = function() {
            currentLev = l;
            document.querySelectorAll('.lev-btn').forEach(function(x) { x.classList.remove('active'); });
            b.classList.add('active');
            update();
        };
        lc.appendChild(b);
    });

    var sc = document.getElementById('stressContainer');
    [['normal','Normal'],['panic','Panic'],['crash','Crash']].forEach(function(pair) {
        var mode = pair[0], label = pair[1];
        var b = document.createElement('button');
        b.className = 'stress-btn' + (currentStress === mode ? ' s-' + mode : '');
        b.innerText = label;
        b.onclick = function() {
            currentStress = mode;
            document.querySelectorAll('.stress-btn').forEach(function(x) { x.className = 'stress-btn'; });
            b.className = 'stress-btn s-' + mode;
            update();
        };
        sc.appendChild(b);
    });
}

function init() {
    applySavedOrder();
    renderButtons();
    fetchBotData();
    refreshMarketData();
    fetchFundingRates();
    setInterval(refreshMarketData,    30000);
    setInterval(fetchBotData,    300000);
    setInterval(fetchFundingRates,   300000);
    setInterval(updateFreshnessDisplay, 30000);
}

// ── Confidence Score ────────────────────────────────────────────────────────
// Композитная оценка доверия к прогнозу (0-100) из уже имеющихся метрик:
// 45% R2 текущего направления (14d), 25% R2 (90d), 20% согласованность
// бет 14d/90d, 10% штраф за волатильность. Отсутствующие компоненты
// исключаются с перенормировкой весов (например, пока нет 90d-данных).
function confidenceScore(r2_14, r2_90, rawBeta, beta90, volatility) {
    function c01(x) { return Math.max(0, Math.min(1, x)); }
    var parts = [], weights = [];
    if (r2_14 !== null && r2_14 !== undefined) { parts.push(c01(r2_14)); weights.push(0.45); }
    if (r2_90 !== null && r2_90 !== undefined) { parts.push(c01(r2_90)); weights.push(0.25); }
    if (beta90 !== null && beta90 !== undefined && rawBeta !== null && rawBeta !== undefined) {
        var div90 = Math.abs(rawBeta - beta90) / (Math.abs(beta90) || 1);
        parts.push(1 - Math.min(div90, 1)); weights.push(0.20);
    }
    var volPct = (volatility || 0) * 100;
    parts.push(1 - Math.min(volPct / 3, 1)); weights.push(0.10);
    var acc = 0, wsum = 0;
    for (var i = 0; i < parts.length; i++) { acc += parts[i] * weights[i]; wsum += weights[i]; }
    return wsum > 0 ? Math.round(100 * acc / wsum) : null;
}

// ── Главный рендер ──────────────────────────────────────────────────────────
function update() {
    if (!cachedMarketData.length) return;
    var btcObj = null;
    for (var i = 0; i < cachedMarketData.length; i++) {
        if (cachedMarketData[i].symbol === 'BTCUSDT') { btcObj = cachedMarketData[i]; break; }
    }
    if (!btcObj) return;

    var btc    = parseFloat(btcObj.lastPrice);
    var btc24h = parseFloat(btcObj.priceChangePercent);
    var target = parseFloat(document.getElementById('slider').value);
    var ratio  = (target - btc) / btc;

    var slider = document.getElementById('slider');
    if (slider) slider.style.accentColor = ratio > 0 ? 'var(--green)' : (ratio < 0 ? 'var(--red)' : 'var(--accent)');

    var elCur = document.getElementById('btc-cur');
    if (elCur) elCur.innerText = '$' + Math.round(btc).toLocaleString();

    var el24h = document.getElementById('btc-24h');
    if (el24h) {
        el24h.innerText   = (btc24h >= 0 ? '+' : '') + btc24h.toFixed(2) + '%';
        el24h.style.color = btc24h >= 0 ? 'var(--green)' : 'var(--red)';
    }

    var btcDirColor = ratio >= 0 ? 'var(--green)' : 'var(--red)';
    var btcDirArrow = ratio >= 0 ? '\u219F' : '\u21A1';

    var elTarget = document.getElementById('btc-target');
    if (elTarget) {
        elTarget.innerText = 'Прогноз BTC: $' + target.toLocaleString();
        elTarget.style.color = btcDirColor;
    }
    var elTargetArrow = document.getElementById('btc-target-arrow');
    if (elTargetArrow) {
        elTargetArrow.innerText = btcDirArrow;
        elTargetArrow.style.color = btcDirColor;
    }

    var elPct = document.getElementById('btc-pct');
    if (elPct) {
        elPct.innerText   = (ratio >= 0 ? '+' : '') + (ratio * 100).toFixed(2) + '%';
        elPct.style.color = ratio > 0 ? 'var(--green)' : (ratio < 0 ? 'var(--red)' : '#ffffff');
    }

    // Индикатор LONG / SHORT — с защитой от null
    var dirEl = document.getElementById('dir-indicator');
    if (dirEl) {
        if (ratio > 0.005)       { dirEl.innerText = 'LONG';  dirEl.style.color = 'var(--green)'; }
        else if (ratio < -0.005) { dirEl.innerText = 'SHORT'; dirEl.style.color = 'var(--red)'; }
        else                     { dirEl.innerText = '--';     dirEl.style.color = '#888'; }
    }

    // Цвет символов кнопок синхронно со слайдером
    var btnM = document.getElementById('btn-minus');
    var btnP = document.getElementById('btn-plus');
    if (btnM && btnP) {
        if (ratio < -0.005) {
            btnM.style.color='var(--red)';   btnM.style.borderColor='var(--red)';
            btnP.style.color='#444';         btnP.style.borderColor='#444';
        } else if (ratio > 0.005) {
            btnP.style.color='var(--green)'; btnP.style.borderColor='var(--green)';
            btnM.style.color='#444';         btnM.style.borderColor='#444';
        } else {
            btnM.style.color='#777'; btnM.style.borderColor='#555';
            btnP.style.color='#777'; btnP.style.borderColor='#555';
        }
    }

    var stressMult  = STRESS_MULT[currentStress];
    var stressBadge = STRESS_BADGE[currentStress];
    var badgeColor  = currentStress === 'panic' ? 'var(--accent)' : 'var(--red)';

    var html = '';

    tokens.forEach(function(t, i) {
        var coin = null;
        for (var j = 0; j < cachedMarketData.length; j++) {
            if (cachedMarketData[j].symbol === t.s) { coin = cachedMarketData[j]; break; }
        }
        if (!coin) return;

        var coinData = null;
        if (botData.analysis_data) {
            for (var k = 0; k < botData.analysis_data.length; k++) {
                if (botData.analysis_data[k].symbol === t.name) { coinData = botData.analysis_data[k]; break; }
            }
        }

        if (!coinData || coinData.error) {
            html += '<div class="no-data-card">'
                + '<div class="token-name">' + t.name + ' <span style="color:var(--red);font-size:0.7em;">NO DATA</span></div>'
                + '<div style="font-size:0.85em;color:#888;margin-top:4px;">Бот не дал валидной беты</div>'
                + '</div>';
            return;
        }

        // Бета с учётом стресс-режима
        var rawBeta = ratio >= 0 ? coinData.up_beta : coinData.down_beta;
        // Guard: бета может быть null при error=false (мало точек в нужном
        // направлении) — раньше это молча рисовало прогноз 0%
        if (rawBeta === null || rawBeta === undefined || !isFinite(rawBeta)) {
            html += '<div class="no-data-card">'
                + '<div class="token-name">' + t.name + ' <span style="color:var(--red);font-size:0.7em;">NO BETA</span></div>'
                + '<div style="font-size:0.85em;color:#888;margin-top:4px;">Нет валидной беты для текущего направления</div>'
                + '</div>';
            return;
        }
        var beta    = rawBeta * stressMult;
        var r2_14   = ratio >= 0 ? coinData.up_r2 : coinData.down_r2;

        // 90-дневная бета (справочная)
        var beta90 = ratio >= 0 ? coinData.up_beta_90 : coinData.down_beta_90;
        var r2_90  = ratio >= 0 ? coinData.up_r2_90   : coinData.down_r2_90;

        var cur  = parseFloat(coin.lastPrice);
        var p24h = parseFloat(coin.priceChangePercent);

        // Степенная агрегация беты: часовая бета накапливается по пути
        // мультипликативно, поэтому прогноз = cur * (1+ratio)^beta.
        // На малых ходах совпадает с прежним линейным cur*(1+ratio*beta),
        // на больших не даёт цен ниже нуля и clamp-артефактов.
        // 1+ratio = target/btc > 0 всегда; Math.max — защитный пояс.
        var growth = Math.pow(Math.max(1 + ratio, 1e-9), beta);
        var pPct   = (growth - 1) * 100;

        // Позиция в 90-дневном диапазоне (по живой цене; бот считает min/max за DAYS_WINDOW=90)
        var minP = coinData.min_price, maxP = coinData.max_price;
        var dynPos = (maxP - minP) > 0
            ? Math.max(0, Math.min(100, ((cur - minP) / (maxP - minP)) * 100))
            : 0;

        // Прогнозная цена (куда пойдёт монета)
        var pred     = Math.max(cur * growth, 0.00000001);
        var predText = pred < 0.0001 ? '&lt;0.0001' : '$' + pred.toFixed(4);

        // ── ЛИКВИДАЦИЯ ────────────────────────────────────────────────────
        var isLong   = ratio >= 0;
        // Ликвидация считается от ПРОГНОЗНОЙ цены (pred) — точки планируемого входа.
        // Логика калькулятора: "BTC пойдёт туда → альт будет по pred → по этой цене входим".
        // Учитывается maintenance margin (LIQ_MMR): реальная ликвидация ближе
        // ко входу, чем наивное pred*(1 -/+ 1/L). Комиссии/funding не учтены.
        // LONG:  liq = pred * (1 - 1/L + MMR)  — ниже входа
        // SHORT: liq = pred * (1 + 1/L - MMR)  — выше входа
        var liqLong    = pred * (1 - 1/currentLev + LIQ_MMR);
        var liqLongTxt = liqLong  < 0.0001 ? '&lt;0.0001' : '$' + liqLong.toFixed(4);
        var liqShort   = pred * (1 + 1/currentLev - LIQ_MMR);
        var liqShortTxt= liqShort < 0.0001 ? '&lt;0.0001' : '$' + liqShort.toFixed(4);

        // Цвета
        var p24hColor = p24h >= 0 ? 'var(--green)' : 'var(--red)';
        var r2Color   = r2_14 < 0.30 ? 'var(--red)' : (r2_14 < 0.60 ? '#f3ba2f' : 'var(--green)');
        var volPct    = coinData.volatility * 100;
        var volColor  = volPct > 1.5 ? 'var(--lilac)' : (volPct > 1.0 ? 'var(--cyan)' : '#888');
        var predColor = ratio >= 0 ? 'var(--green)' : 'var(--red)';
        var predArrow = ratio >= 0 ? '\u219F' : '\u21A1';

        // Строка 90d беты + индикатор согласованности + корреляция BTC/ALT
        var line90 = '';
        if (beta90 !== null && beta90 !== undefined && r2_90 !== null) {
            var div90    = Math.abs(rawBeta - beta90) / (Math.abs(beta90) || 1);
            var aligned  = div90 < 0.25;
            var icon90    = aligned ? 'ok' : '!';
            var icon90cls = aligned ? 'icon-ok' : 'icon-warn';
            var icon90c   = aligned ? 'var(--green)' : 'var(--red)';
            var r90Color = r2_90 < 0.30 ? 'var(--red)' : (r2_90 < 0.60 ? '#f3ba2f' : 'var(--green)');
            // corr_90 — опциональное поле (старый coeffs.json его не содержит)
            var corr90   = coinData.corr_90;
            var corrHtml = '';
            if (corr90 !== null && corr90 !== undefined) {
                var corrColor = Math.abs(corr90) >= 0.75 ? 'var(--green)'
                    : (Math.abs(corr90) >= 0.5 ? '#f3ba2f' : 'var(--red)');
                corrHtml = ' / <span style="color:' + corrColor + '">\u03C1=' + corr90.toFixed(2) + '</span>';
            }
            line90 = '<div style="font-size:0.78em;color:#666;margin:2px 0 3px;">'
                + '90d: b=' + beta90.toFixed(2)
                + ' / <span style="color:#f3ba2f">R2=' + r2_90.toFixed(2) + '</span>'
                + corrHtml
                + '<span class="' + icon90cls + '" style="color:' + icon90c + ';font-weight:bold;font-size:1.25em;margin-left:5px;vertical-align:-1px;">' + icon90 + '</span>'
                + '</div>';
        }

        // Confidence Score по метрикам текущего направления
        var conf = confidenceScore(r2_14, r2_90, rawBeta, beta90, coinData.volatility);
        var confColor = conf === null ? '#888'
            : (conf >= 70 ? 'var(--green)' : (conf >= 40 ? 'var(--accent)' : 'var(--red)'));

        // Funding Rate
        var fundRate = cachedFunding[t.s];
        var fundHtml = '';
        if (fundRate !== undefined) {
            var fundColor = isLong
                ? (fundRate > 0 ? 'var(--red)' : 'var(--green)')
                : (fundRate < 0 ? 'var(--green)' : 'var(--red)');
            fundHtml = '<span style="color:' + fundColor + ';font-size:0.8em;font-style:italic;margin-left:8px;">'
                + 'Fund: ' + (fundRate >= 0 ? '+' : '') + (fundRate * 100).toFixed(4) + '%/8h'
                + '</span>';
        }

        // Стресс-бейдж
        var badgeHtml = stressBadge
            ? '<span style="font-size:0.6em;color:' + badgeColor + ';font-weight:bold;margin-left:5px;">' + stressBadge + '</span>'
            : '';

        // Min/Max с мигающей анимацией у порогов 25% и 75%
        var minClass  = dynPos <= 25 ? 'light-blink' : '';
        var minColor  = dynPos <= 25 ? 'var(--red)' : 'var(--accent)';
        var maxClass  = dynPos >= 75 ? 'light-blink' : '';
        var maxColor  = dynPos >= 75 ? 'var(--green)' : 'var(--accent)';

        // Мерцающая рамка только на самых краях диапазона: <=1% или >=99%
        // Подсветка по тому же округлённому %, что видит пользователь
        var dynPosRounded = Math.round(dynPos);
        var edgeClass = '';
        if (dynPosRounded <= 1)       edgeClass = ' edge-min';
        else if (dynPosRounded >= 99) edgeClass = ' edge-max';

        html += '<div class="card' + edgeClass + '" style="border-left:4px solid ' + p24hColor + ';">'

            // Заголовок карточки
            + '<div class="row">'
            +   '<span class="token-name">' + t.name + badgeHtml
            +     ' <span class="pct-24h" style="color:' + p24hColor + ';">'
            +       (p24h > 0 ? '+' : '') + p24h.toFixed(2) + '%'
            +     '</span>'
            +   '</span>'
            +   '<div style="text-align:right;">'
            +     '<div>$' + cur.toFixed(4) + '</div>'
            +     (conf === null ? '' :
                   '<div style="font-size:0.72em;font-weight:700;color:' + confColor + ';">Conf ' + conf + '%</div>')
            +   '</div>'
            + '</div>'

            // R² 14d + Funding
            + '<div style="font-size:1.1em;font-weight:bold;font-style:italic;margin:4px 0;color:' + r2Color + ';">'
            +   'R2: ' + (r2_14 !== null ? r2_14.toFixed(2) : 'N/A') + fundHtml
            + '</div>'

            // 90d строка
            + line90

            // Прогнозная цена
            + '<div style="font-size:0.9em;font-weight:600;color:var(--accent);">'
            +   '<span style="color:var(--green);">LONG </span>'
            +   currentLev + 'X: ' + liqLongTxt
            + '</div>'
            + '<div style="font-size:0.9em;font-weight:600;color:var(--accent);">'
            +   '<span style="color:var(--red);">SHORT </span>'
            +   currentLev + 'X: ' + liqShortTxt
            + '</div>'

            // Диапазон Min / Pos% / Max
            + '<div class="extra-data">'
            +   'Min: <span class="' + minClass + '" style="color:' + minColor + ';">$' + minP.toFixed(4) + '</span>'
            +   ' | <span style="color:#fff;font-size:1.1em;font-weight:bold;font-family:monospace;margin:0 4px;">'
            +     dynPos.toFixed(0) + '%'
            +   '</span> | '
            +   'Max: <span class="' + maxClass + '" style="color:' + maxColor + ';">$' + maxP.toFixed(4) + '</span>'
            + '</div>'

            // Прогнозная цена — над волатильностью, цвет по направлению слайдера
            // Процент изменения — над прогнозной ценой, тем же шрифтом
            + '<div style="position:absolute;bottom:90px;right:14px;font-size:0.9em;font-weight:bold;font-style:italic;color:' + (pPct >= 0 ? 'var(--green)' : 'var(--red)') + ';"'
            +   ' class="' + (beta < 0 ? 'blink-text' : '') + '">'
            +   (pPct >= 0 ? '+' : '') + pPct.toFixed(2) + '%'
            + '</div>'
            // Прогнозная цена со стрелкой
            + '<div style="position:absolute;bottom:66px;right:14px;font-size:0.9em;font-weight:bold;font-style:italic;color:' + predColor + ';">'
            +   '<span style="font-size:1.5em;font-weight:700;line-height:1;vertical-align:-2px;">' + predArrow + '</span> ' + predText
            + '</div>'

            // Волатильность
            + '<div class="vol-value" style="color:' + volColor + ';">Vol: ' + volPct.toFixed(2) + '%</div>'

            // Кнопки перестановки
            + '<div style="position:absolute;bottom:10px;right:10px;">'
            +   '<button class="nav-btn" onclick="move(' + i + ',-1)">&#8593;</button>'
            +   '<button class="nav-btn" onclick="move(' + i + ',1)" style="margin-left:5px;">&#8595;</button>'
            + '</div>'

        + '</div>';
    });

    var resultsEl = document.getElementById('results');
    if (resultsEl) resultsEl.innerHTML = html;
}

document.getElementById('slider').oninput = update;

// Кнопки точной настройки цены
// Шаг $500 — достаточно мелко для точного прицеливания,
// достаточно крупно чтобы за 1-2 нажатия перейти на нужный уровень.
var STEP_BTN = 500;

document.getElementById('btn-minus').addEventListener('click', function() {
    var s   = document.getElementById('slider');
    var val = parseInt(s.value, 10) - STEP_BTN;
    if (val < parseInt(s.min, 10)) val = parseInt(s.min, 10);
    s.value = val;
    update();
});

document.getElementById('btn-plus').addEventListener('click', function() {
    var s   = document.getElementById('slider');
    var val = parseInt(s.value, 10) + STEP_BTN;
    if (val > parseInt(s.max, 10)) val = parseInt(s.max, 10);
    s.value = val;
    update();
});

// Удержание кнопки: автоповтор через 400мс с интервалом 100мс
function setupHold(btnId, delta) {
    var btn = document.getElementById(btnId);
    var timer = null;
    var interval = null;
    btn.addEventListener('mousedown',  startHold);
    btn.addEventListener('touchstart', startHold, {passive:true});
    btn.addEventListener('mouseup',    stopHold);
    btn.addEventListener('mouseleave', stopHold);
    btn.addEventListener('touchend',   stopHold);
    function startHold(e) {
        timer = setTimeout(function() {
            interval = setInterval(function() {
                var s   = document.getElementById('slider');
                var val = parseInt(s.value, 10) + delta;
                if (val < parseInt(s.min,10)) val = parseInt(s.min,10);
                if (val > parseInt(s.max,10)) val = parseInt(s.max,10);
                s.value = val;
                update();
            }, 100);
        }, 400);
    }
    function stopHold() {
        clearTimeout(timer);
        clearInterval(interval);
        timer = null; interval = null;
    }
}
setupHold('btn-minus', -STEP_BTN);
setupHold('btn-plus',  +STEP_BTN);

init();
</script>
</body>
</html>
