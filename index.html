            sWin += '<div class="bd-note">\u0426\u0435\u043B\u044C \u2014 \u0441\u0442\u0440\u0443\u043A\u0442\u0443\u0440\u043D\u044B\u0439 \u043E\u0440\u0438\u0435\u043D\u0442\u0438\u0440 (\u044D\u043A\u0441\u0442\u0440\u0435\u043C\u0443\u043C 90\u0434), \u0430 \u041D\u0415 \u043F\u0440\u043E\u0433\u043D\u043E\u0437. '
               + '\u041E\u0442\u043D\u043E\u0448\u0435\u043D\u0438\u0435 \u043D\u0438\u0436\u0435 1:2 \u043E\u0437\u043D\u0430\u0447\u0430\u0435\u0442, \u0447\u0442\u043E \u0441\u0434\u0435\u043B\u043A\u0430 \u0434\u043E\u043B\u0436\u043D\u0430 \u0443\u0433\u0430\u0434\u044B\u0432\u0430\u0442\u044C \u0447\u0430\u0449\u0435, \u0447\u0435\u043C \u043E\u0448\u0438\u0431\u0430\u0442\u044C\u0441\u044F.</div>';
        } else {
            sWin += '<div class="bd-note">\u0426\u0435\u043D\u0430 \u0443\u0436\u0435 \u0437\u0430 \u044D\u043A\u0441\u0442\u0440\u0435\u043C\u0443\u043C\u043E\u043C 90 \u0434\u043D\u0435\u0439 \u2014 \u0441\u0442\u0440\u0443\u043A\u0442\u0443\u0440\u043D\u043E\u0433\u043E \u043E\u0440\u0438\u0435\u043D\u0442\u0438\u0440\u0430 \u0434\u043B\u044F \u0446\u0435\u043B\u0438 \u043D\u0435\u0442. '
               + '\u0412\u044B\u0445\u043E\u0434 \u043F\u043B\u0430\u043D\u0438\u0440\u0443\u0439 \u0432\u0440\u0443\u0447\u043D\u0443\u044E.</div>';

    var sBounds = '';
    // ── 5. Границы сделки ──
    var liqSel = liqPrice(E, currentLev, isLong);
    sBounds += '<div class="bd-sec"><div class="bd-h">\u0413\u0420\u0410\u041D\u0418\u0426\u042B \u0421\u0414\u0415\u041B\u041A\u0418</div><div class="bd-lad">'
       + '<div class="bd-node n-acc"><div class="bd-nl">\u0412\u0425\u041E\u0414</div>'

    if (dec.inv) {
        var invLbl = dec.inv.capped ? '\u043E\u043F\u043E\u0440\u044B \u0440\u044F\u0434\u043E\u043C \u043D\u0435\u0442, \u0432\u0437\u044F\u0442\u043E 6\u03C3'

    sBounds += '</div>';

    var sLev = '';
    // ── 6. Выбор плеча ──
    var lh = '';
    for (var L = 2; L <= 7; L++) {
        var okL = dec.ok && L <= dec.L;
        // Цвет = проходит/не проходит. Заливка = выбрано. Два признака не
        // смешиваются: раньше выбор перекрашивал кнопку в золото и терял смысл.
        var cls = 'bd-lev ' + (okL ? 'ok' : 'bad') + (L === currentLev ? ' sel' : '');
        lh += '<button class="' + cls + '" onclick="setLev(' + L + ')">' + L + 'X'
            + '<span class="lp">' + fmtPBare(liqPrice(E, L, isLong)) + '</span></button>';
    }
    var okSel = dec.ok && currentLev <= dec.L;
    sLev += '<div class="bd-sec"><div class="bd-h">\u0412\u042B\u0411\u041E\u0420 \u041F\u041B\u0415\u0427\u0410</div>'
       + '<div class="bd-levs">' + lh + '</div>'
       + '<div class="bd-kv" style="margin-top:11px;"><span class="bd-k">\u0412\u044B\u0431\u0440\u0430\u043D\u043E ' + currentLev + 'X</span>'
       + '<span class="bd-v" style="color:' + (okSel ? 'var(--green)' : 'var(--red)') + ';">'
       + (okSel ? '\u2713 \u043F\u0440\u043E\u0445\u043E\u0434\u0438\u0442' : '\u2715 \u0432\u044B\u0448\u0435 \u0434\u043E\u043F\u0443\u0441\u0442\u0438\u043C\u043E\u0433\u043E') + '</span></div>'
       + '<div class="bd-note">\u041F\u043E\u0434 \u043A\u0430\u0436\u0434\u043E\u0439 \u043A\u043D\u043E\u043F\u043A\u043E\u0439 \u2014 \u0446\u0435\u043D\u0430 \u043B\u0438\u043A\u0432\u0438\u0434\u0430\u0446\u0438\u0438 \u043E\u0442 \u0442\u0435\u043A\u0443\u0449\u0435\u0433\u043E \u0432\u0445\u043E\u0434\u0430. '
       + '\u0417\u0435\u043B\u0451\u043D\u044B\u0435 \u2014 \u0432 \u043F\u0440\u0435\u0434\u0435\u043B\u0430\u0445 \u0418\u0422\u041E\u0413\u0410, \u043A\u0440\u0430\u0441\u043D\u044B\u0435 \u2014 \u0437\u0430 \u043D\u0438\u043C.</div>'
       + '</div>';

    var sTime = '';
    // ── 7. Цена времени ──
    // БАГ 09.08 (найден Боссом): здесь стояло dec.ok ? dec.L : currentLev.
    // При выданном вердикте раздел молча считал ИТОГ, игнорируя нажатую кнопку:
    // 4X->3X менял только цену ликвидации, а вероятности и funding оставались
    // от 4X. Всё, чем управляет Босс, обязано идти от currentLev.
    var Lp = currentLev;
    var p7  = liqTouchProb(cd.volatility, Lp, isLong, 168);
    var p14 = liqTouchProb(cd.volatility, Lp, isLong, 336);
    var p30 = liqTouchProb(cd.volatility, Lp, isLong, 720);
    if (p7 !== null) {
        sTime += '<div class="bd-sec"><div class="bd-h">\u0426\u0415\u041D\u0410 \u0412\u0420\u0415\u041C\u0415\u041D\u0418</div>'
           + '<div class="bd-kv" style="margin-top:0;"><span class="bd-k">\u0428\u0430\u043D\u0441 \u0437\u0430\u0434\u0435\u0442\u044C \u043B\u0438\u043A\u0432\u0438\u0434\u0430\u0446\u0438\u044E \u043F\u0440\u0438 ' + Lp + 'X</span></div>'
           + probRow('7 \u0434\u043D\u0435\u0439',  p7)
           + probRow('14 \u0434\u043D\u0435\u0439', p14)
           + probRow('30 \u0434\u043D\u0435\u0439', p30)
           + '<div class="bd-note">\u0411\u0435\u0437 \u0441\u0442\u043E\u043F\u0430 \u0438 \u0431\u0435\u0437 \u0434\u043E\u043B\u0438\u0432\u0430 \u043C\u0430\u0440\u0436\u0438. \u0421\u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044F \u041A\u0410\u0421\u0410\u041D\u0418\u0415 \u0446\u0435\u043D\u044B \u0445\u043E\u0442\u044F \u0431\u044B \u0440\u0430\u0437, \u0430 \u043D\u0435 \u0446\u0435\u043D\u0430 \u043D\u0430 \u0432\u044B\u0445\u043E\u0434\u0435: '
           + '\u0444\u0438\u0442\u0438\u043B\u044F \u0434\u043E\u0441\u0442\u0430\u0442\u043E\u0447\u043D\u043E. \u041F\u043B\u0435\u0447\u043E \u043F\u043E\u0434\u043E\u0431\u0440\u0430\u043D\u043E \u043F\u043E\u0434 \u0433\u043E\u0440\u0438\u0437\u043E\u043D\u0442 7 \u0434\u043D\u0435\u0439 \u2014 \u0434\u0430\u043B\u044C\u0448\u0435 \u0440\u0438\u0441\u043A \u0440\u0430\u0441\u0442\u0451\u0442 \u043D\u0435\u043B\u0438\u043D\u0435\u0439\u043D\u043E.</div>';
        var fr = cachedFunding[pair];
        if (has(fr)) {
            var payMe = isLong ? (fr < 0) : (fr > 0);
            var cost  = Math.abs(fr) * 21 * Lp * 100;
            // Деньги, а не только проценты (правка Босса 10.08). 21 = 3 выплаты
            // в сутки x 7 дней. Ставка берётся от ОБЪЁМА позиции, поэтому
            // costUsd = |fr| * 21 * notional; это ровно cost% от маржи.
            var costUsd = Math.abs(fr) * 21 * notional;
            // Весь блок одним цветом: зелёный — платят мне, красный — плачу я

            var fCol  = payMe ? 'var(--green)' : 'var(--red)';
            sTime += '<div class="bd-kv" style="border-top:1px solid #2b2b34;padding-top:9px;margin-top:11px;">'
               + '<span class="bd-k" style="color:' + fCol + ';">Funding ' + (fr >= 0 ? '+' : '')
               + (fr * 100).toFixed(4) + '%/8\u0447</span>'
               + '<span class="bd-v" style="color:' + fCol + ';">'
               + (payMe ? '+' : '\u2212') + fmtUsd(costUsd) + ' / 7\u0434</span></div>'
               + '<div class="bd-kv" style="margin-top:0;"><span class="bd-k"></span>'
               + '<span class="bd-v" style="color:' + fCol + ';font-size:0.9em;">'
               + (payMe ? '+' : '\u2212') + cost.toFixed(2) + '% \u043C\u0430\u0440\u0436\u0438</span></div>'
               + '<div class="bd-note" style="color:' + fCol + ';opacity:0.82;">'
               + (payMe ? '\u041F\u043B\u0430\u0442\u044F\u0442 \u043C\u043D\u0435' : '\u041F\u043B\u0430\u0447\u0443 \u044F')
               + ' \u2014 \u0437\u0430 \u043D\u0435\u0434\u0435\u043B\u044E \u0443\u0434\u0435\u0440\u0436\u0430\u043D\u0438\u044F ' + qtyTxt + ' ' + sym
               + ' \u043F\u0440\u0438 ' + Lp + 'X. \u0421\u0442\u0430\u0432\u043A\u0430 \u043F\u043B\u0430\u0432\u0430\u044E\u0449\u0430\u044F \u2014 \u044D\u0442\u043E \u043E\u0446\u0435\u043D\u043A\u0430 \u043F\u043E \u0442\u0435\u043A\u0443\u0449\u0435\u0439.</div>';
        }
        sTime += '</div>';
    }

    var sSrc = '';
    // ── 8. Откуда плечо ──
    if (dec.parts) {
        var caps = [{ n: '\u0421\u0442\u0440\u0443\u043A\u0442\u0443\u0440\u0430', v: dec.parts.struct,
                      d: '\u043B\u0438\u043A\u0432\u0438\u0434\u0430\u0446\u0438\u044F \u0434\u043E\u043B\u0436\u043D\u0430 \u043B\u0435\u0436\u0430\u0442\u044C \u0437\u0430 \u0443\u0440\u043E\u0432\u043D\u0435\u043C \u0432\u044B\u0445\u043E\u0434\u0430 + 12\u0447 \u043D\u0430 \u0440\u0435\u0430\u043A\u0446\u0438\u044E', k: '\u0441\u0442\u0440\u0443\u043A\u0442\u0443\u0440\u0430' },
                     { n: '\u0428\u0443\u043C 7\u0434',     v: dec.parts.noise,
                      d: '10% \u0448\u0430\u043D\u0441\u0430 \u0432\u044B\u043B\u0435\u0442\u0435\u0442\u044C \u0437\u0430 \u043D\u0435\u0434\u0435\u043B\u044E \u043F\u0440\u043E\u0441\u0442\u043E \u043E\u0442 \u0431\u043E\u043B\u0442\u0430\u043D\u043A\u0438', k: '\u0448\u0443\u043C 7\u0434' },
                     { n: '\u041E\u0431\u0432\u0430\u043B BTC',  v: dec.parts.btc,
                      d: '\u043F\u0435\u0440\u0435\u0436\u0438\u0432\u0451\u0442 \u043B\u0438 \u043F\u043E\u0437\u0438\u0446\u0438\u044F \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435 BTC \u043D\u0430 2\u03C3', k: '\u043E\u0431\u0432\u0430\u043B BTC' }];
        sSrc += '<div class="bd-sec"><div class="bd-h">\u041E\u0422\u041A\u0423\u0414\u0410 \u041F\u041B\u0415\u0427\u041E</div>';
        for (var ci = 0; ci < caps.length; ci++) {
            if (caps[ci].v === null || caps[ci].v === undefined) continue;
            var bind = (dec.binding === caps[ci].k);
            sSrc += '<div class="bd-kv" style="margin-bottom:1px;">'
               + '<span class="bd-k" style="' + (bind ? 'color:var(--accent);font-weight:700;' : '') + '">'
               + caps[ci].n + (bind ? ' \u2190 \u043E\u0433\u0440\u0430\u043D\u0438\u0447\u0438\u0442\u0435\u043B\u044C' : '') + '</span>'
               + '<span class="bd-v" style="color:' + (bind ? 'var(--accent)' : '#6f6f7e') + ';">'
               + caps[ci].v.toFixed(1) + 'X</span></div>'
               + '<div class="bd-nd" style="margin-bottom:8px;">' + caps[ci].d + '</div>';
        }
        // Четвёртый ограничитель — по цене стопа в марже. Показывается СПРАВОЧНО
        // и в ИТОГ не входит: он систематически строже трёх остальных, и его
        // включение меняет каждую рекомендацию системы (инвариант 13).
        if (dec.inv && dec.inv.dist > 0) {
            var Lm = MAX_MARGIN_LOSS / dec.inv.dist;
            sSrc += '<div class="bd-kv" style="margin-bottom:1px;border-top:1px solid #2b2b34;padding-top:9px;">'
               + '<span class="bd-k">\u0420\u0438\u0441\u043A \u043C\u0430\u0440\u0436\u0438 \u00B7 \u0441\u043F\u0440\u0430\u0432\u043E\u0447\u043D\u043E</span>'
               + '<span class="bd-v" style="color:#8f8fa0;">' + Lm.toFixed(1) + 'X</span></div>'
               + '<div class="bd-nd" style="margin-bottom:8px;">\u043F\u0440\u0438 \u043A\u0430\u043A\u043E\u043C \u043F\u043B\u0435\u0447\u0435 \u0432\u044B\u0445\u043E\u0434 \u043F\u043E \u0441\u0442\u043E\u043F\u0443 \u0441\u0442\u043E\u0438\u0442 \u0440\u043E\u0432\u043D\u043E '
               + Math.round(MAX_MARGIN_LOSS * 100) + '% \u043C\u0430\u0440\u0436\u0438</div>';
        }
        sSrc += '<div class="bd-note">\u0422\u0440\u0438 \u043D\u0435\u0437\u0430\u0432\u0438\u0441\u0438\u043C\u044B\u0445 \u043F\u043E\u0442\u043E\u043B\u043A\u0430, \u0431\u0435\u0440\u0451\u0442\u0441\u044F \u0441\u0430\u043C\u044B\u0439 \u043D\u0438\u0437\u043A\u0438\u0439 \u0438 \u043E\u043A\u0440\u0443\u0433\u043B\u044F\u0435\u0442\u0441\u044F \u0432\u043D\u0438\u0437. \u0427\u0435\u0442\u0432\u0451\u0440\u0442\u0430\u044F \u0441\u0442\u0440\u043E\u043A\u0430 \u0432 \u0418\u0422\u041E\u0413 \u043F\u043E\u043A\u0430 \u041D\u0415 \u0432\u0445\u043E\u0434\u0438\u0442.</div></div>';
    }

    var sRange = '';
    // ── 9. Диапазон 90 дней ──
    var mn = cd.min_price, mx = cd.max_price;
    if (has(mn) && has(mx) && mx > mn && mn > 0) {
        var rp = Math.max(0, Math.min(100, (cur - mn) / (mx - mn) * 100));
        // Шкала цены, а не качества сделки: низ диапазона красный, верх зелёный
        // (правка Босса 09.08). Одинаково для лонга и шорта — цвет обязан
        // означать одно и то же в обоих режимах.
        var grad = 'linear-gradient(90deg, rgba(255,69,58,0.9) 0%, '
                 + 'rgba(243,186,47,0.75) 50%, rgba(48,209,88,0.9) 100%)';
        var upMin = (cur / mn - 1) * 100;
        var dnMax = (1 - cur / mx) * 100;
        var mnCls = rp <= 25 ? 'light-blink' : '';
        var mxCls = rp >= 75 ? 'light-blink' : '';
        var mnCol = 'var(--red)';
        var mxCol = 'var(--green)';
        sRange += '<div class="bd-sec"><div class="bd-h bd-center">\u0414\u0418\u0410\u041F\u0410\u0417\u041E\u041D 90 \u0414\u041D\u0415\u0419</div>'
           + '<div class="bd-rpct">' + rp.toFixed(0) + '<span class="bd-rpct-s">%</span></div>'
           + '<div class="bd-rng" style="background:' + grad + ';">'
           +   '<div class="bd-rmark" style="left:' + rp.toFixed(1) + '%;"></div>'
           + '</div>'
           + '<div class="bd-rends">'
           +   '<div class="bd-rend"><div class="bd-rcap" style="color:' + mnCol + ';">\u041C\u0418\u041D</div>'
           +     '<div class="bd-rnum ' + mnCls + '" style="color:' + mnCol + ';">' + fmtP(mn) + '</div>'
           +     '<div class="bd-rsub">\u0446\u0435\u043D\u0430 \u0432\u044B\u0448\u0435 \u043D\u0430 ' + upMin.toFixed(1) + '%</div></div>'
           +   '<div class="bd-rend" style="text-align:right;"><div class="bd-rcap" style="color:' + mxCol + ';">\u041C\u0410\u041A\u0421</div>'
           +     '<div class="bd-rnum ' + mxCls + '" style="color:' + mxCol + ';">' + fmtP(mx) + '</div>'
           +     '<div class="bd-rsub">\u0446\u0435\u043D\u0430 \u043D\u0438\u0436\u0435 \u043D\u0430 ' + dnMax.toFixed(1) + '%</div></div>'
           + '</div></div>';
    }

    var sTrust = '';
    // ── 10. Доверие к модели ──
    var rawBeta = lastCtx.ratio >= 0 ? cd.up_beta : cd.down_beta;
    var r14     = lastCtx.ratio >= 0 ? cd.up_r2   : cd.down_r2;
    var beta90  = lastCtx.ratio >= 0 ? cd.up_beta_90 : cd.down_beta_90;
    var r90     = lastCtx.ratio >= 0 ? cd.up_r2_90   : cd.down_r2_90;
    var conf    = confidenceScore(r14, r90, rawBeta, beta90, cd.volatility);
    var gs      = gateState(conf, r14, cd.corr_90);
    var gc      = gs === 'green' ? 'var(--green)' : (gs === 'yellow' ? 'var(--accent)' : 'var(--red)');
    sTrust += '<div class="bd-sec"><div class="bd-h">\u0414\u041E\u0412\u0415\u0420\u0418\u0415 \u041A \u041C\u041E\u0414\u0415\u041B\u0418</div>';
    if (has(conf)) {
        sTrust += '<div class="bd-conf">'
           + '<div class="bd-cbar"><div class="bd-fill" style="width:' + Math.max(2, Math.min(100, conf))
           + '%;background:' + gc + ';"></div></div>'
           + '<div class="bd-cnum" style="color:' + gc + ';">' + conf + '%</div></div>';
    }
    sTrust += '<div class="bd-kv" style="margin-top:11px;"><span class="bd-k">\u0421\u0432\u044F\u0437\u044C \u0441 BTC, 14 \u0434\u043D\u0435\u0439</span>'
       + '<span class="bd-v">b=' + (has(rawBeta) ? rawBeta.toFixed(2) : '\u043D/\u0434')
       + '<i class="bd-msep"></i><span style="color:' + r2Color(r14) + ';">R\u00B2=' + (has(r14) ? r14.toFixed(2) : '\u043D/\u0434') + '</span></span></div>'
       + '<div class="bd-kv"><span class="bd-k">\u0421\u0432\u044F\u0437\u044C \u0441 BTC, 90 \u0434\u043D\u0435\u0439</span>'
       + '<span class="bd-v">b=' + (has(beta90) ? beta90.toFixed(2) : '\u043D/\u0434')
       + '<i class="bd-msep"></i><span style="color:' + r2Color(r90) + ';">R\u00B2=' + (has(r90) ? r90.toFixed(2) : '\u043D/\u0434') + '</span>'
       + (has(cd.corr_90) ? '<i class="bd-msep"></i><span style="color:' + (Math.abs(cd.corr_90) >= 0.75 ? 'var(--green)'
            : (Math.abs(cd.corr_90) >= 0.5 ? 'var(--accent)' : 'var(--red)')) + ';">\u03C1='
            + cd.corr_90.toFixed(2) + '</span>' : '') + '</span></div>';
    if (has(rawBeta)) {
        var gr = Math.pow(Math.max(1 + lastCtx.ratio, 1e-9), rawBeta * lastCtx.stressMult);
        sTrust += '<div class="bd-kv"><span class="bd-k">\u0415\u0441\u043B\u0438 BTC \u043F\u0440\u0438\u0434\u0451\u0442 \u043D\u0430 $'
           + Math.round(lastCtx.target).toLocaleString() + '</span>'
           + '<span class="bd-v" style="color:' + (gr >= 1 ? 'var(--green)' : 'var(--red)') + ';">'
           + fmtP(Math.max(cur * gr, 1e-8)) + ' (' + pctTxt(gr - 1, 2) + ')</span></div>';
    }
    if (gs === 'red') {
        sTrust += '<div class="bd-bad">\u26A0 \u041C\u043E\u0434\u0435\u043B\u044C \u043D\u0435\u043D\u0430\u0434\u0451\u0436\u043D\u0430 (MDL \u2715): \u043F\u0440\u043E\u0433\u043D\u043E\u0437 \u043F\u043E BTC \u2014 \u0448\u0443\u043C. '
           + '\u0420\u0430\u0431\u043E\u0442\u0430\u044E\u0442 \u0442\u043E\u043B\u044C\u043A\u043E \u0446\u0438\u0444\u0440\u044B \u0432\u044B\u0448\u0435: \u043E\u043D\u0438 \u0441\u0447\u0438\u0442\u0430\u044E\u0442\u0441\u044F \u043E\u0442 \u0441\u043E\u0431\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u0439 \u0432\u043E\u043B\u0430\u0442\u0438\u043B\u044C\u043D\u043E\u0441\u0442\u0438 \u043C\u043E\u043D\u0435\u0442\u044B, \u0430 \u043D\u0435 \u043E\u0442 \u0431\u0435\u0442\u044B. '
           + '\u041D\u0430\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435 \u0431\u0435\u0440\u0438 \u0438\u0437 \u043A\u0430\u0442\u0430\u043B\u0438\u0437\u0430\u0442\u043E\u0440\u043E\u0432, \u043D\u0435 \u0438\u0437 \u043F\u0440\u043E\u0433\u043D\u043E\u0437\u0430.</div>';
    }
    sTrust += '</div>';

    // Порядок блоков задан Боссом 09.08 и живёт ТОЛЬКО здесь: сами блоки
    // считаются выше в прежнем порядке (зависимости по переменным не тронуты),
    // переставляется только склейка. Сторона/внимание идут сразу за вердиктом:
    // это тревоги, а не разделы, и появляются редко.
    h += sHero + sRel + sWarn      //  1. ИТОГ · СТОРОНА · ПОТОЛОК
       + sWhy                      //  2. ПОЧЕМУ ЭТА МОНЕТА
       + sRange                    //  3. ДИАПАЗОН 90 ДНЕЙ
       + sEntry                    //  4. ТОЧКА ВХОДА
       + sLev                      //  5. ВЫБОР ПЛЕЧА
       + sSize                     //  6. РАЗМЕР ПОЗИЦИИ
       + sBounds                   //  7. ГРАНИЦЫ СДЕЛКИ
       + sTime                     //  8. ЦЕНА ВРЕМЕНИ
       + sLoss                     //  9. ЕСЛИ ИДЕЯ НЕ СРАБОТАЕТ
       + sWin                      // 10. ЕСЛИ СРАБОТАЕТ
       + sSrc                      // 11. ОТКУДА ПЛЕЧО
       + sTrust;                   // 12. ДОВЕРИЕ К МОДЕЛИ

    h += '<button class="qbtn wide" style="margin-top:14px;" onclick="closeEntry(\'' + sym + '\')">\u0417\u0410\u041A\u0420\u042B\u0422\u042C</button>';
    h += '</div>';
    return h;
}

// ── Якорь прокрутки доски ───────────────────────────────────────────────────
// БАГ 10.08 (найден Боссом на видео): при нажатии любой кнопки экран прыгал.
// Причина — доска перерисовывается целиком через innerHTML, а восстанавливался
// АБСОЛЮТНЫЙ scrollTop. Между двумя рендерами высота блоков ВЫШЕ точки чтения
// меняется: появляется/исчезает «ВНИМАНИЕ», вердикт переключается между ИТОГ NX
// и «БЕЗ БЕЗОПАСНОГО ПЛЕЧА», в «ЕСЛИ ИДЕЯ НЕ СРАБОТАЕТ» всплывает предупреждение
// о пороге маржи. Тот же пиксель после этого показывает уже другое место.
// Решение: запоминаем не пиксель, а СЕКЦИЮ под верхом экрана и её смещение —
// блок, на который смотрит Босс, остаётся под пальцем при любой смене высот.
function boardKey(sec) {
    var hh = sec.getElementsByClassName('bd-h');
    return hh.length ? hh[0].innerHTML : '';
}
function boardAnchorGet(el) {
    var top = el.scrollTop;
    if (top < 4) return null;                       // у самого верха якорь не нужен
    var secs = el.getElementsByClassName('bd-sec');
    for (var i = 0; i < secs.length; i++) {
        if (secs[i].offsetTop + secs[i].offsetHeight > top + 4) {
            var k = boardKey(secs[i]);
            return k ? { key: k, off: secs[i].offsetTop - top } : null;
        }
    }
    return null;
}
function boardAnchorSet(el, a, fallback) {
    if (a) {
        var secs = el.getElementsByClassName('bd-sec');
        for (var i = 0; i < secs.length; i++) {
            if (boardKey(secs[i]) === a.key) {
                el.scrollTop = Math.max(0, secs[i].offsetTop - a.off);
                return;
            }
        }
    }
    el.scrollTop = fallback;                        // секция исчезла — старое поведение
}

// Перерисовка доски. Вызывается из update() вместе со списком: тикер обновляется
// каждые 30 с, поэтому позиция прокрутки сохраняется через якорь.
function renderBoard() {
    var el = document.getElementById('board');
    if (!el) return;

    var row = null, pos = 0;
    if (boardSym && lastCtx) {
        for (var i = 0; i < lastRows.length; i++) {
            if (lastRows[i].t.name === boardSym) { row = lastRows[i]; break; }
        }
        pos = lastShownSyms.indexOf(boardSym);
    }
    if (!row) {
        if (el.style.display === 'block') {
            el.style.display = 'none';
            el.innerHTML = '';
            document.body.style.overflow = '';
        }
        return;
    }

    var keep   = el.scrollTop;
    var anchor = boardAnchorGet(el);
    if (row.state === 'ok') {
        el.innerHTML = boardHtml(row, pos);
    } else {
        el.innerHTML = '<div class="bd-top">'
            + '<button class="bd-x" onclick="closeEntry(\'' + boardSym + '\')">\u2715</button>'
            + '<div class="bd-title">' + boardSym + '</div></div>'
            + '<div class="bd-wrap"><div class="bd-sec">'
            + '<div class="bd-h">\u0414\u0410\u041D\u041D\u042B\u0415 \u041D\u0415\u0414\u041E\u0421\u0422\u0423\u041F\u041D\u042B</div>'
            + '<div class="bd-vwhy">\u041C\u043E\u043D\u0435\u0442\u0430 \u043F\u0435\u0440\u0435\u0448\u043B\u0430 \u0432 \u0437\u0430\u0449\u0438\u0442\u043D\u043E\u0435 \u0441\u043E\u0441\u0442\u043E\u044F\u043D\u0438\u0435 (\u043D\u0435\u0442 \u043F\u0430\u0440\u044B, \u0442\u043E\u0440\u0433\u0438 \u043E\u0441\u0442\u0430\u043D\u043E\u0432\u043B\u0435\u043D\u044B '
            + '\u0438\u043B\u0438 \u0431\u043E\u0442 \u043D\u0435 \u0434\u0430\u043B \u043C\u0435\u0442\u0440\u0438\u043A). \u0420\u0430\u0441\u0447\u0451\u0442\u044B \u043E\u0442\u043A\u043B\u044E\u0447\u0435\u043D\u044B \u043D\u0430\u043C\u0435\u0440\u0435\u043D\u043D\u043E.</div></div>'
            + '<button class="qbtn wide" style="margin-top:14px;" onclick="closeEntry(\'' + boardSym + '\')">\u0417\u0410\u041A\u0420\u042B\u0422\u042C</button>'
            + '</div>';
    }
    if (el.style.display !== 'block') {
        el.style.display = 'block';
        document.body.style.overflow = 'hidden';
        el.scrollTop = 0;
    } else {
        boardAnchorSet(el, anchor, keep);
    }
}

// ── Главный рендер ──────────────────────────────────────────────────────────
function update() {
    if (!cachedMarketData.length) return;
    var btcObj = null;
    for (var i = 0; i < cachedMarketData.length; i++) {
        if (cachedMarketData[i].symbol === 'BTCUSDT') { btcObj = cachedMarketData[i]; break; }
    }
    if (!btcObj) return;

    var btc    = parseFloat(btcObj.lastPrice);
    var btc24h = parseFloat(btcObj.priceChangePercent);
    var slider = document.getElementById('slider');
    var target = slider ? parseFloat(slider.value) : btc;
    if (!isFinite(target) || target <= 0) target = btc;
    var ratio  = (target - btc) / btc;

    if (slider) slider.style.accentColor = ratio > 0 ? 'var(--green)' : (ratio < 0 ? 'var(--red)' : 'var(--accent)');

    var elCur = document.getElementById('btc-cur');
    if (elCur) elCur.innerText = '$' + Math.round(btc).toLocaleString();

    var el24h = document.getElementById('btc-24h');
    if (el24h) {
        el24h.innerText   = (btc24h >= 0 ? '+' : '') + btc24h.toFixed(2) + '%';
        el24h.style.color = btc24h >= 0 ? 'var(--green)' : 'var(--red)';
    }

    var btcDirColor = ratio >= 0 ? 'var(--green)' : 'var(--red)';
    var elTarget = document.getElementById('btc-target');
    if (elTarget) {
        elTarget.innerText   = 'Прогноз BTC: $' + target.toLocaleString();
        elTarget.style.color = btcDirColor;
    }
    var elTargetArrow = document.getElementById('btc-target-arrow');
    if (elTargetArrow) {
        elTargetArrow.innerText   = ratio >= 0 ? '\u219F' : '\u21A1';
        elTargetArrow.style.color = btcDirColor;
    }
    var elPct = document.getElementById('btc-pct');
    if (elPct) {
        elPct.innerText   = (ratio >= 0 ? '+' : '') + (ratio * 100).toFixed(2) + '%';
        elPct.style.color = ratio > 0 ? 'var(--green)' : (ratio < 0 ? 'var(--red)' : '#ffffff');
    }
    var dirEl = document.getElementById('dir-indicator');
    if (dirEl) {
        if (ratio > 0.005)       { dirEl.innerText = 'BTC ВВЕРХ'; dirEl.style.color = 'var(--green)'; }
        else if (ratio < -0.005) { dirEl.innerText = 'BTC ВНИЗ';  dirEl.style.color = 'var(--red)'; }
        else                     { dirEl.innerText = '--';        dirEl.style.color = '#888'; }
    }
    var btnM = document.getElementById('btn-minus');
    var btnP = document.getElementById('btn-plus');
    if (btnM && btnP) {
        if (ratio < -0.005) {
            btnM.style.color='var(--red)';   btnM.style.borderColor='var(--red)';
            btnP.style.color='#444';         btnP.style.borderColor='#444';
        } else if (ratio > 0.005) {
            btnP.style.color='var(--green)'; btnP.style.borderColor='var(--green)';
            btnM.style.color='#444';         btnM.style.borderColor='#444';
        } else {
            btnM.style.color='#777'; btnM.style.borderColor='#555';
            btnP.style.color='#777'; btnP.style.borderColor='#555';
        }
    }

    // Диапазон BTC 90д — данные бота, старый coeffs.json переживается (инв. 9).
    var btcStats = botData.btc || null;
    var brEl = document.getElementById('btc-range');
    if (brEl) {
        if (btcStats && btcStats.max_price > btcStats.min_price) {
            var bPos = Math.max(0, Math.min(100, (btc - btcStats.min_price) / (btcStats.max_price - btcStats.min_price) * 100));
            var bMinCls = bPos <= 25 ? 'light-blink' : '';
            var bMinCol = bPos <= 25 ? 'var(--red)' : 'var(--accent)';
            var bMaxCls = bPos >= 75 ? 'light-blink' : '';
            var bMaxCol = bPos >= 75 ? 'var(--green)' : 'var(--accent)';
            brEl.innerHTML = 'Min: <span class="' + bMinCls + '" style="color:' + bMinCol + ';">$'
                + Math.round(btcStats.min_price).toLocaleString() + '</span>'
                + ' | <span style="color:#fff;font-size:1.05em;font-weight:bold;font-family:monospace;margin:0 4px;">'
                + bPos.toFixed(0) + '%</span> | '
                + 'Max: <span class="' + bMaxCls + '" style="color:' + bMaxCol + ';">$'
                + Math.round(btcStats.max_price).toLocaleString() + '</span>'
                + ' <span style="color:#666;font-size:0.8em;font-style:normal;">90д</span>';
        } else {
            brEl.innerHTML = '<span style="color:#666;">Диапазон BTC 90д: нет данных бота</span>';
        }
    }

    var isLong = currentSide === 'long';
    var sideOn = currentSide !== 'none';

    // --- Сбор строк ---
    var rows = [];
    tokens.forEach(function(t, idx) {
        var coin = null;
        if (t.fut) {
            coin = cachedFutTickers[t.s] || null;
        } else {
            for (var j = 0; j < cachedMarketData.length; j++) {
                if (cachedMarketData[j].symbol === t.s) { coin = cachedMarketData[j]; break; }
            }
        }
        var row = { t: t, idx: idx, coin: coin, cd: null, state: 'ok', sc: null };
        if (!coin) { row.state = 'nopair'; rows.push(row); return; }

        var trades24 = parseFloat(coin.count);
        var bidP     = parseFloat(coin.bidPrice);
        var askP     = parseFloat(coin.askPrice);
        if (trades24 === 0 || (bidP === 0 && askP === 0)) { row.state = 'dead'; rows.push(row); return; }

        if (botData.analysis_data) {
            for (var k = 0; k < botData.analysis_data.length; k++) {
                if (botData.analysis_data[k].symbol === t.name) { row.cd = botData.analysis_data[k]; break; }
            }
        }
        if (!row.cd || row.cd.error) { row.state = 'nodata'; rows.push(row); return; }

        if (sideOn) {
            row.sc = scoreCandidate(row.cd, t.s, parseFloat(coin.lastPrice),
                                    parseFloat(coin.priceChangePercent),
                                    parseFloat(coin.quoteVolume), isLong);
        }
        rows.push(row);
    });

    // Сортировка по силе кандидата. Проблемные карточки уходят вниз.
    if (sideOn) {
        rows.sort(function(a, b) {
            var ga = (a.sc && has(a.sc.score)) ? a.sc.score : -1;
            var gb = (b.sc && has(b.sc.score)) ? b.sc.score : -1;
            if (Math.abs(gb - ga) > 0.05) return gb - ga;
            var ra = (a.cd && has(a.cd.rank)) ? a.cd.rank : 9999;
            var rb = (b.cd && has(b.cd.rank)) ? b.cd.rank : 9999;
            if (ra !== rb) return ra - rb;
            var va = (a.cd && has(a.cd.volatility)) ? a.cd.volatility : 9;
            var vb = (b.cd && has(b.cd.volatility)) ? b.cd.volatility : 9;
            return va - vb;
        });
    }

    var stressMult  = STRESS_MULT[currentStress];
    // Снимок сценария и строк — доска читает их, а не пересчитывает список.
    lastRows = rows;
    // Отсев нерелевантной стороны (правка Босса 09.08): в ЛОНГЕ прячем монеты
    // у верхнего края диапазона, в ШОРТЕ — у нижнего. Не удаляем, а сворачиваем
    // в полосу с раскрытием: молча исчезнувшая монета опаснее лишней строки.
    var shownRows = rows, offRows = [];
    if (sideOn) {
        shownRows = [];
        for (var oi = 0; oi < rows.length; oi++) {
            var orow = rows[oi];
            if (orow.state === 'ok' && orow.cd && orow.coin) {
                var orp = rangePos(orow.cd, parseFloat(orow.coin.lastPrice));
                if (!sideRelevant(orp, isLong)) { orow.offPos = orp; offRows.push(orow); continue; }
            }
            shownRows.push(orow);
        }
        if (showOff) shownRows = shownRows.concat(offRows);
    }
    lastShownSyms = [];
    for (var si = 0; si < shownRows.length; si++) lastShownSyms.push(shownRows[si].t.name);
    lastCtx  = { isLong: isLong, btcStats: btcStats, ratio: ratio,
                 stressMult: stressMult, target: target, btc: btc };
    var stressBadge = STRESS_BADGE[currentStress];
    var badgeColor  = currentStress === 'panic' ? 'var(--accent)' : 'var(--red)';
    var html = '';

    shownRows.forEach(function(row, pos) {
        var t = row.t;
        if (row.state === 'nopair') {
            html += '<div class="no-data-card">'
                + '<div class="token-name">' + t.name + ' <span style="color:var(--red);font-size:0.7em;">НЕТ ПАРЫ</span></div>'
                + '<div style="font-size:0.85em;color:#888;margin-top:4px;">' + t.s + ' отсутствует в тикере Binance &mdash; делистинг или смена тикера</div>'
                + '</div>';
            return;
        }
        if (row.state === 'dead') {
            var frozenP = parseFloat(row.coin.lastPrice);
            html += '<div class="no-data-card">'
                + '<div class="token-name">' + t.name + ' <span class="light-blink" style="color:var(--red);font-size:0.7em;">ТОРГИ ОСТАНОВЛЕНЫ</span></div>'
                + '<div style="font-size:0.85em;color:#888;margin-top:4px;">Цена заморожена: $' + (isFinite(frozenP) ? frozenP.toFixed(4) : '?')
                + ' &mdash; расчёты отключены (0 сделок / пустой стакан). Возможна миграция тикера.</div>'
                + '</div>';
            return;
        }
        if (row.state === 'nodata') {
            html += '<div class="no-data-card">'
                + '<div class="token-name">' + t.name + ' <span style="color:var(--red);font-size:0.7em;">НЕТ ДАННЫХ</span></div>'
                + '<div style="font-size:0.85em;color:#888;margin-top:4px;">Бот не дал валидных метрик</div>'
                + '</div>';
            return;
        }

        var cd   = row.cd;
        var coin = row.coin;
        var cur  = parseFloat(coin.lastPrice);
        var p24  = parseFloat(coin.priceChangePercent);
        var minP = cd.min_price, maxP = cd.max_price;

        var srcMismatch = has(maxP) && maxP > 0
            && (cur > maxP * 1.5 || cur < minP * 0.5);
        var mismatchHtml = srcMismatch
            ? '<div style="color:#f3ba2f;font-weight:600;font-size:0.75em;margin:2px 0;">&#9888; Расхождение источников: цена вне 90д-диапазона бота &mdash; проверь пару/ID</div>'
            : '';

        var dynPos = (has(minP) && has(maxP) && (maxP - minP) > 0)
            ? Math.max(0, Math.min(100, ((cur - minP) / (maxP - minP)) * 100)) : 0;

        // --- Диагностика: бета, прогноз, доверие (как было на карточке) ---
        var rawBeta = ratio >= 0 ? cd.up_beta : cd.down_beta;
        var r2_14   = ratio >= 0 ? cd.up_r2   : cd.down_r2;
        var beta90  = ratio >= 0 ? cd.up_beta_90 : cd.down_beta_90;
        var r2_90   = ratio >= 0 ? cd.up_r2_90   : cd.down_r2_90;
        var hasBeta = has(rawBeta);
        var beta    = hasBeta ? rawBeta * stressMult : null;
        var growth  = hasBeta ? Math.pow(Math.max(1 + ratio, 1e-9), beta) : null;
        var pPct    = hasBeta ? (growth - 1) * 100 : null;
        var pred    = hasBeta ? Math.max(cur * growth, 1e-8) : cur;

        var conf = confidenceScore(r2_14, r2_90, rawBeta, beta90, cd.volatility);
        var confColor = !has(conf) ? '#888'
            : (conf >= 70 ? 'var(--green)' : (conf >= 40 ? 'var(--accent)' : 'var(--red)'));
        var g  = gateState(conf, r2_14, cd.corr_90);
        var gc = g === 'green' ? 'var(--green)' : (g === 'yellow' ? 'var(--accent)' : 'var(--red)');
        var gl = g === 'green' ? 'MDL \u2713' : (g === 'yellow' ? 'MDL \u007E' : 'MDL \u2715');

        // Бейдж слева сверху: ранг всегда, FDV — только в режимах ЛОНГ/ШОРТ.
        // В ОБЗОРЕ FDV переехал на строку «b= / R2» (правка Босса 09.08).
        var fdvColor = has(cd.fdv_mc)
            ? (cd.fdv_mc > 3 ? 'var(--red)' : (cd.fdv_mc >= 1.5 ? 'var(--accent)' : '#888')) : '#888';
        var badgeInner = '';
        if (has(cd.rank)) {
            var rPrev = cd.rank_prev, rColor = '#ccc', rArrow = '';
            if (has(rPrev) && rPrev !== cd.rank) {
                var rDelta = rPrev - cd.rank;
                if (rDelta > 0) { rColor = 'var(--green)'; rArrow = '\u2191' + rDelta; }
                else            { rColor = 'var(--red)';   rArrow = '\u2193' + (-rDelta); }
            }
            badgeInner += '<span style="color:' + rColor + ';">#' + cd.rank + rArrow + '</span>';
        }
        // FDV в ЛОНГ/ШОРТ вынесен из бейджа в правый нижний угол карточки
        // (правка Босса 09.08): там свободно, стрелок перестановки в этом
        // режиме нет.
        var fdvAbs = (sideOn && has(cd.fdv_mc))
            ? '<span class="fdv-abs" style="color:' + fdvColor + ';">FDV '
              + cd.fdv_mc.toFixed(1) + '\u00D7</span>'
            : '';
        var rankHtml = badgeInner ? '<span class="rank-badge">' + badgeInner + '</span>' : '';

        // Тир кандидата — по центру верха карточки, вне потока.
        var tierHtml = '';
        if (sideOn && row.sc) {
            var tier = tierOf(row.sc.score);
            tierHtml = '<span class="tier-badge" style="color:' + tier.c + ';">#'
                + (pos + 1) + ' ' + tier.n + ' ' + Math.round(row.sc.score) + '</span>';
        }

        var badgeHtml = stressBadge
            ? '<span style="font-size:0.6em;color:' + badgeColor + ';font-weight:bold;margin-left:5px;">' + stressBadge + '</span>'
            : '';

        var p24hColor = p24 >= 0 ? 'var(--green)' : 'var(--red)';
        var r2Color   = !has(r2_14) ? '#888' : (r2_14 < 0.30 ? 'var(--red)' : (r2_14 < 0.60 ? '#f3ba2f' : 'var(--green)'));
        var volPct    = has(cd.volatility) ? cd.volatility * 100 : null;
        var volColor  = volPct === null ? '#888'
            : (volPct > 1.5 ? 'var(--lilac)' : (volPct > 1.0 ? 'var(--cyan)' : '#888'));
        var predColor = ratio >= 0 ? 'var(--green)' : 'var(--red)';
        var predArrow = ratio >= 0 ? '\u219F' : '\u21A1';

        // Строка 90д — как была.
        var line90 = '';
        if (has(beta90)) {
            var r90Color = !has(r2_90) ? '#888' : (r2_90 < 0.30 ? 'var(--red)' : (r2_90 < 0.60 ? '#f3ba2f' : 'var(--green)'));
            var corrHtml = has(cd.corr_90)
                ? ' / <span style="color:' + (Math.abs(cd.corr_90) >= 0.75 ? 'var(--green)'
                    : (Math.abs(cd.corr_90) >= 0.5 ? '#f3ba2f' : 'var(--red)')) + '">\u03C1='
                    + cd.corr_90.toFixed(2) + '</span>' : '';
            line90 = '<div style="font-size:0.78em;color:#666;margin:2px 0 3px;">'
                + '90d: b=' + beta90.toFixed(2)
                + ' / <span style="color:' + r90Color + '">R2=' + (has(r2_90) ? r2_90.toFixed(2) : 'н/д') + '</span>'
                + corrHtml + '</div>';
        }

        // Funding — цвет по НАЖАТОЙ стороне. В ОБЗОРЕ стороны нет, значит нет и
        // экономического смысла: строка убрана, её место занимает FDV.
        var fundRate = cachedFunding[t.s];
        var fundHtml = '';
        if (sideOn && has(fundRate)) {
            var fundColor = isLong ? (fundRate > 0 ? 'var(--red)' : 'var(--green)')
                                   : (fundRate > 0 ? 'var(--green)' : 'var(--red)');
            fundHtml = '<span style="color:' + fundColor + ';font-size:0.8em;font-style:italic;margin-left:8px;">'
                + 'Fund: ' + (fundRate >= 0 ? '+' : '') + (fundRate * 100).toFixed(4) + '%/8h</span>';
        } else if (!sideOn && has(cd.fdv_mc)) {
            fundHtml = '<span style="color:#5f5f6c;font-size:0.8em;font-style:italic;margin-left:6px;">/</span>'
                + '<span style="color:' + fdvColor + ';font-size:0.8em;font-style:italic;margin-left:5px;">'
                + 'FDV ' + cd.fdv_mc.toFixed(1) + '\u00D7</span>';
        }

        // Ликвидации по ВЫБРАННОМУ вручную плечу, от прогнозной цены.
        var liqHtml = '';
        if (hasBeta) {
            liqHtml = '<div style="font-size:0.62em;font-weight:800;letter-spacing:0.14em;color:#6f6f7e;margin:5px 0 1px;">'
                +   '\u041B\u0418\u041A\u0412\u0418\u0414\u0410\u0426\u0418\u042F \u041E\u0422 \u041F\u0420\u041E\u0413\u041D\u041E\u0417\u0410</div>'
                + '<div style="font-size:0.9em;font-weight:600;color:var(--accent);">'
                +   '<span style="color:var(--green);">LONG </span>' + currentLev + 'X: '
                +   fmtP(pred * (1 - 1 / currentLev + LIQ_MMR)) + '</div>'
                + '<div style="font-size:0.9em;font-weight:600;color:var(--accent);">'
                +   '<span style="color:var(--red);">SHORT </span>' + currentLev + 'X: '
                +   fmtP(pred * (1 + 1 / currentLev - LIQ_MMR)) + '</div>';
        } else {
            liqHtml = '<div style="font-size:0.82em;color:#777;">Беты нет \u2014 прогноз и ликвидации от прогноза недоступны</div>';
        }

        // Min / позиция / Max — одна компактная строка без переносов (правка
        // Босса 09.08). Стрелки-проценты убраны: они ломали вёрстку карточки,
        // а то же самое есть в строке причины и в разделе доски «Диапазон 90д».
        var minClass = dynPos <= 25 ? 'light-blink' : '';
        var minColor = dynPos <= 25 ? 'var(--red)' : 'var(--accent)';
        var maxClass = dynPos >= 75 ? 'light-blink' : '';
        var maxColor = dynPos >= 75 ? 'var(--green)' : 'var(--accent)';
        var rangeHtml = '';
        if (has(minP) && has(maxP) && minP > 0 && maxP > 0) {
            // В ОБЗОРЕ подписи Min/Max и разделители «|» возвращены (правка Босса
            // 09.08). В ЛОНГ/ШОРТ формат остаётся компактным: там правый нижний
            // угол занят FDV, и полная строка не помещается без переноса.
            rangeHtml = '<div class="extra-data range-line' + (sideOn ? '' : ' ov') + '">'
                + (sideOn ? '' : 'Min: ')
                + '<span class="' + minClass + '" style="color:' + minColor + ';">' + fmtP(minP) + '</span>'
                + (sideOn ? ' ' : ' | ')
                + '<span style="color:#fff;font-size:1.1em;font-weight:bold;font-family:monospace;">'
                + dynPos.toFixed(0) + '%</span>'
                + (sideOn ? ' ' : ' | ')
                + (sideOn ? '' : 'Max: ')
                + '<span class="' + maxClass + '" style="color:' + maxColor + ';">' + fmtP(maxP) + '</span>'
                + ' <span style="color:#666;font-size:0.8em;font-style:normal;">90\u0434</span>'
                + '</div>';
        }

        var reasonHtml = '';
        if (sideOn && row.sc && row.sc.reasons.length) {
            reasonHtml = '<div class="reason-line">' + row.sc.reasons.join(' \u00B7 ') + '</div>';
        }

        // Блок входа переехал в полноэкранную доску: карточка остаётся витриной.
        // Подпись кнопки следует за режимом (правка Босса 09.08).
        var entryHtml = '';
        if (sideOn) {
            entryHtml = '<button class="qbtn wide call" onclick="openEntry(\'' + t.name + '\','
                + numAttr(cur) + ',\'' + currentSide + '\')">CRYPTO FUTURE '
                + (isLong ? 'LONG' : 'SHORT') + '</button>';
        }

        var dynPosRounded = Math.round(dynPos);
        var edgeClass = '';
        if (dynPosRounded <= 1)       edgeClass = ' edge-min';
        else if (dynPosRounded >= 99) edgeClass = ' edge-max';

        // Имя монеты — кнопка входа в доску (правка Босса 09.08). В ОБЗОРЕ
        // стороны нет, поэтому она выбирается по положению в диапазоне:
        // нижняя половина -> лонг, верхняя -> шорт. Внутри доски переключается.
        var autoSide = sideOn ? currentSide : (dynPos < 50 ? 'long' : 'short');
        var nameHtml = '<span class="token-name tap" onclick="openEntry(\'' + t.name + '\','
            + numAttr(cur) + ',\'' + autoSide + '\')">' + t.name
            + '<span class="tap-mark">\u25B8</span></span>';

        html += '<div class="card' + edgeClass + '" style="border-left:4px solid ' + p24hColor + ';">'
            + '<div class="card-main">'
            + rankHtml
            + tierHtml
            + fdvAbs
            + '<div class="row">'
            +   '<span>' + nameHtml + badgeHtml
            +     ' <span class="pct-24h" style="color:' + p24hColor + ';">'
            +       (p24 > 0 ? '+' : '') + p24.toFixed(2) + '%</span>'
            +   '</span>'
            +   '<div style="text-align:right;">'
            +     '<div>' + fmtP(cur) + '</div>'
            +     (!has(conf) ? '' :
                   '<div style="font-size:0.72em;font-weight:700;color:' + confColor + ';">Conf ' + conf + '%</div>')
            +     '<div style="font-size:0.66em;font-weight:800;letter-spacing:0.04em;color:' + gc + ';">' + gl + '</div>'
            +   '</div>'
            + '</div>'
            + mismatchHtml
            + '<div style="font-size:1.1em;font-weight:bold;font-style:italic;margin:4px 0;color:' + r2Color + ';">'
            +   '<span style="color:#ccc;">b=' + (hasBeta ? rawBeta.toFixed(2) : 'н/д') + '</span>'
            +   ' / R2: ' + (has(r2_14) ? r2_14.toFixed(2) : 'N/A') + fundHtml
            + '</div>'
            + line90
            + liqHtml
            + rangeHtml
            + reasonHtml
            + (!hasBeta ? '' :
                 '<div class="pred-pct ' + (beta < 0 ? 'blink-text' : '')
               + '" style="color:' + (pPct >= 0 ? 'var(--green)' : 'var(--red)') + ';">'
               + (pPct >= 0 ? '+' : '') + pPct.toFixed(2) + '%</div>'
               + '<div class="pred-val" style="color:' + predColor + ';">'
               + '<span style="font-size:1.5em;font-weight:700;line-height:1;vertical-align:-2px;">' + predArrow + '</span> '
               + fmtP(pred) + '</div>')
            + (volPct === null ? '' :
                 '<div class="vol-value" style="color:' + volColor + ';">Vol: ' + volPct.toFixed(2) + '%</div>')
            + (sideOn ? '' :
                 '<div class="nav-abs">'
               + '<button class="nav-btn" onclick="move(' + row.idx + ',-1)">&#8593;</button>'
               + '<button class="nav-btn" onclick="move(' + row.idx + ',1)" style="margin-left:5px;">&#8595;</button>'
               + '</div>')
            + '</div>'
            + entryHtml
            + '</div>';
    });

    // Полоса свёрнутых монет: сколько скрыто и почему.
    if (sideOn && offRows.length) {
        var offNames = [];
        for (var fi = 0; fi < offRows.length; fi++) offNames.push(offRows[fi].t.name);
        html += '<div class="off-strip" onclick="toggleOff()">'
            + '<span class="off-cnt">' + offRows.length + '</span> '
            + (isLong ? '\u043C\u043E\u043D\u0435\u0442 \u0443 \u0432\u0435\u0440\u0445\u043D\u0435\u0433\u043E \u043A\u0440\u0430\u044F 90\u0434 \u2014 \u043B\u043E\u043D\u0433 \u043D\u0435 \u0440\u0430\u0441\u0441\u043C\u0430\u0442\u0440\u0438\u0432\u0430\u0435\u043C'
                      : '\u043C\u043E\u043D\u0435\u0442 \u0443 \u043D\u0438\u0436\u043D\u0435\u0433\u043E \u043A\u0440\u0430\u044F 90\u0434 \u2014 \u0448\u043E\u0440\u0442 \u043D\u0435 \u0440\u0430\u0441\u0441\u043C\u0430\u0442\u0440\u0438\u0432\u0430\u0435\u043C')
            + '<div class="off-names">' + offNames.join(' \u00B7 ') + '</div>'
            + '<div class="off-act">' + (showOff ? '\u0421\u041A\u0420\u042B\u0422\u042C' : '\u041F\u041E\u041A\u0410\u0417\u0410\u0422\u042C \u0412\u0421\u0401 \u0420\u0410\u0412\u041D\u041E') + '</div>'
            + '</div>';
    }

    var resultsEl = document.getElementById('results');
    if (resultsEl) resultsEl.innerHTML = html;

    renderBoard();
}

function init() {
    applySavedOrder();
    renderButtons();
    fetchBotData();
    refreshMarketData();
    refreshFuturesTickers();
    fetchFundingRates();
    setInterval(refreshMarketData,     30000);
    setInterval(refreshFuturesTickers, 30000);
    setInterval(fetchBotData,         300000);
    setInterval(fetchFundingRates,    300000);
    setInterval(updateFreshnessDisplay, 30000);
}

document.getElementById('slider').oninput = update;

// Кнопки точной настройки цены
// Шаг $500 — достаточно мелко для точного прицеливания,
// достаточно крупно чтобы за 1-2 нажатия перейти на нужный уровень.
var STEP_BTN = 500;

document.getElementById('btn-minus').addEventListener('click', function() {
    var s   = document.getElementById('slider');
    var val = parseInt(s.value, 10) - STEP_BTN;
    if (val < parseInt(s.min, 10)) val = parseInt(s.min, 10);
    s.value = val;
    update();
});

document.getElementById('btn-plus').addEventListener('click', function() {
    var s   = document.getElementById('slider');
    var val = parseInt(s.value, 10) + STEP_BTN;
    if (val > parseInt(s.max, 10)) val = parseInt(s.max, 10);
    s.value = val;
    update();
});

// Удержание кнопки: автоповтор через 400мс с интервалом 100мс
function setupHold(btnId, delta) {
    var btn = document.getElementById(btnId);
    var timer = null;
    var interval = null;
    btn.addEventListener('mousedown',  startHold);
    btn.addEventListener('touchstart', startHold, {passive:true});
    btn.addEventListener('mouseup',    stopHold);
    btn.addEventListener('mouseleave', stopHold);
    btn.addEventListener('touchend',   stopHold);
    function startHold(e) {
        timer = setTimeout(function() {
            interval = setInterval(function() {
                var s   = document.getElementById('slider');
                var val = parseInt(s.value, 10) + delta;
                if (val < parseInt(s.min,10)) val = parseInt(s.min,10);
                if (val > parseInt(s.max,10)) val = parseInt(s.max,10);
                s.value = val;
                update();
            }, 100);
        }, 400);
    }
    function stopHold() {
        clearTimeout(timer);
        clearInterval(interval);
        timer = null; interval = null;
    }
}
setupHold('btn-minus', -STEP_BTN);
setupHold('btn-plus',  +STEP_BTN);

init();
</script>
