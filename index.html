<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="image.PNG">
    <title>Pro Crypto Toll</title>
    <style>
        :root {
            --bg: #0f0f12; --card: #1a1a20; --accent: #f3ba2f;
            --lilac: #bf5af2; --cyan: #0ad1c8; --red: #ff453a;
            --green: #30d158; --text: #ffffff;
        }
        body {
            background-color: var(--bg); color: var(--text);
            font-family: -apple-system, sans-serif; margin: 0;
            padding-top: calc(env(safe-area-inset-top) + 10px);
            padding-left: 10px; padding-right: 10px;
            padding-bottom: calc(env(safe-area-inset-bottom) + 10px);
        }
        .control {
            background: var(--card); padding: 15px; border-radius: 16px;
            border: 1px solid #333; margin-bottom: 15px;
        }
        .btc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        @keyframes rainbow { 0%{filter:hue-rotate(0deg)} 100%{filter:hue-rotate(360deg)} }
        .btc-logo { font-size: 2.4em; color: var(--accent); font-weight: bold; transition: 0.3s; }
        .btc-logo.loading { animation: rainbow 1s linear infinite; }
        @keyframes priceRainbow {
            0%   { color: #f3ba2f; }
            20%  { color: #30d158; }
            40%  { color: #0ad1c8; }
            60%  { color: #bf5af2; }
            80%  { color: #ff453a; }
            100% { color: #f3ba2f; }
        }
        .btc-price.loading { animation: priceRainbow 1.2s linear infinite; }
        .btc-price { color: var(--text); font-size: 1.6em; font-weight: 800; }
        .card {
            background: var(--card); padding: 14px; border-radius: 12px;
            margin-bottom: 8px; border: 1px solid #333; position: relative;
        }
        /* Бегущая линия по контуру при достижении краёв диапазона (1% / 99%) */
        .card.edge-min, .card.edge-max {
            border: 1px solid transparent;
            background-clip: padding-box;
        }
        .card.edge-min::before, .card.edge-max::before {
            content: ''; position: absolute; inset: 0;
            border-radius: 12px; padding: 2px;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            pointer-events: none;
        }
        @keyframes runBorderRed {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        @keyframes runBorderGreen {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .card.edge-min::before {
            background: linear-gradient(90deg, rgba(255,69,58,0) 0%, rgba(255,69,58,1) 25%, rgba(255,255,255,0.9) 50%, rgba(255,69,58,1) 75%, rgba(255,69,58,0) 100%);
            background-size: 200% 100%;
            animation: runBorderRed 1.5s linear infinite;
        }
        .card.edge-max::before {
            background: linear-gradient(90deg, rgba(48,209,88,0) 0%, rgba(48,209,88,1) 25%, rgba(255,255,255,0.9) 50%, rgba(48,209,88,1) 75%, rgba(48,209,88,0) 100%);
            background-size: 200% 100%;
            animation: runBorderGreen 1.5s linear infinite;
        }
        .no-data-card {
            background: var(--card); padding: 14px; border-radius: 12px;
            margin-bottom: 8px; border: 1px solid #333; border-left: 4px solid var(--red);
        }
        .token-name { font-size: 1.2em; font-weight: 800; color: var(--lilac); }
        /* Имя монеты — кнопка входа в доску. Аффорданс минимальный: шеврон. */
        .token-name.tap { cursor: pointer; }
        .token-name.tap:active { opacity: 0.6; }
        .tap-mark { font-size: 0.62em; margin-left: 4px; opacity: 0.65; vertical-align: 1px; }
        /* Диапазон 90д — строго одна строка, без переносов и наездов на
           абсолютный правый столбец карточки (прогноз/цена/Vol). */
        .range-line {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            padding-right: 98px; letter-spacing: -0.01em;
        }
        /* В ОБЗОРЕ справа только стрелки перестановки (~54px), поэтому полная
           подписанная строка Min/Max помещается без переноса. */
        .range-line.ov { padding-right: 62px; font-size: 0.92em; }
        /* FDV в свободном правом нижнем углу карточки (ЛОНГ/ШОРТ). */
        .fdv-abs {
            position: absolute; bottom: 4px; right: 0;
            font-size: 0.76em; font-weight: 700; font-style: italic;
            letter-spacing: 0.01em; white-space: nowrap; pointer-events: none;
        }
        /* Свёрнутые монеты вне сценария */
        .off-strip {
            margin: 6px 0 8px; padding: 12px 14px; cursor: pointer;
            border: 1px dashed #43434f; border-radius: 12px;
            background: linear-gradient(180deg, #191920 0%, #131318 100%);
            font-size: 0.82em; color: #a0a0ae; line-height: 1.4;
        }
        .off-cnt { color: var(--accent); font-weight: 900; font-size: 1.15em; }
        .off-names { color: #82828f; font-size: 0.88em; margin-top: 6px; line-height: 1.55;
                     word-break: break-word; letter-spacing: 0.02em; }
        .off-act {
            color: var(--cyan); font-weight: 800; font-size: 0.85em;
            letter-spacing: 0.1em; margin-top: 6px;
        }
        .row { display: flex; justify-content: space-between; align-items: center; }
        #slider { width: 100%; margin: 10px 0; transition: accent-color 0.3s ease; }
        .lev-container {
            display: grid; grid-template-columns: repeat(6,1fr);
            gap: 4px; margin-bottom: 6px;
        }
        .lev-btn {
            background: #2c2c31; border: none; color: white;
            padding: 8px 0; border-radius: 6px; font-size: 12px; cursor: pointer;
        }
        .lev-btn.active { background: var(--accent); color: #000; font-weight: bold; }
        .stress-container { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; }
        .stress-btn {
            border: none; color: #aaa; padding: 7px 0; border-radius: 6px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            background: #2c2c31; transition: all 0.2s;
        }
        .stress-btn.s-normal { color: #000; background: var(--green); }
        .stress-btn.s-panic  { color: #000; background: var(--accent); }
        .stress-btn.s-crash  { color: #fff; background: var(--red); }
        /* Сторона сделки — единственный явный вход «лонг/шорт» в систему.
           Направление слайдера = сценарий BTC, оно НЕ равно стороне позиции. */
        .side-container { display: grid; grid-template-columns: repeat(2,1fr); gap: 4px; margin-bottom: 6px; }
        .side-btn {
            border: none; color: #aaa; padding: 8px 0; border-radius: 6px;
            font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
            cursor: pointer; background: #2c2c31; transition: all 0.2s;
        }
        .side-btn.a-long  { color: #000; background: var(--green); }
        .side-btn.a-short { color: #fff; background: var(--red); }
        .pin-btn {
            width: 100%; margin-top: 6px; box-sizing: border-box;
            background: #2c2c31; border: 1px solid #444; color: #ccc;
            padding: 9px 6px; border-radius: 8px;
            font-size: 12px; font-weight: 700; cursor: pointer;
        }
        .pin-btn.armed { background: #241f16; border-color: var(--accent); color: var(--accent); }
        .pin-btn.auto-on { background: #16241f; border-color: var(--cyan); color: var(--cyan); }
        .btn-row2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 6px; }
        .btn-row2 .pin-btn { margin-top: 6px; }
        /* Строка «рекомендуемое плечо + риск ликвидации». padding-right — как
           у .lev-block: держит текст левее абсолютного правого столбца. */
        .rec-line { padding-right: 100px; font-size: 0.8em; font-weight: 700; margin: 3px 0 1px; }
        /* Блок расчёта плеча. padding-right держит текст левее абсолютного
           правого столбца карточки (прогноз/цена/Vol) — пересечений нет. */
        .lev-block { padding-right: 100px; margin: 6px 0 4px; line-height: 1.45; }
        .lev-head  { font-size: 0.95em; font-weight: 800; letter-spacing: 0.02em; }
        .lev-sub   { font-size: 0.78em; color: #aaa; }
        .lev-res   { font-size: 0.82em; font-weight: 700; }
        .nav-btn {
            background: #444; border: none; color: #fff;
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        .pct-24h { font-size: 0.6em; font-weight: bold; }
        @keyframes blink { 0%{opacity:1} 50%{opacity:0.2} 100%{opacity:1} }
        .blink-text { animation: blink 1s linear infinite; font-weight: 900; }
        @keyframes lightBlink { 0%{opacity:1} 50%{opacity:0.5} 100%{opacity:1} }
        .light-blink { animation: lightBlink 1.5s ease-in-out infinite; }
        .extra-data { font-size: 0.85em; color: var(--accent); margin-top: 8px; font-style: italic; }
        /* Диапазон BTC 90д — занимает строку, освобождённую штампом обновления */
        .btc-range { font-size: 0.8em; color: var(--accent); font-style: italic; margin-bottom: 10px; }
        /* Компактный штамп свежести данных бота в правом верхнем углу */
        .upd-stamp { font-size: 0.62em; line-height: 1; white-space: nowrap; color: #888; }
        @keyframes blinkRed {
            0%  { opacity:1; }
            50% { opacity:0.15; }
            100%{ opacity:1; }
        }
        @keyframes blinkGreen {
            0%  { opacity:1; }
            50% { opacity:0.4; }
            100%{ opacity:1; }
        }
        .icon-warn {
            display:inline-block;
            color: var(--red) !important;
            animation: blinkRed 0.9s linear infinite;
            font-weight: bold;
        }
        .icon-ok {
            display:inline-block;
            color: var(--green) !important;
            animation: blinkGreen 2s ease-in-out infinite;
        }
        /* Ранг/FDV/тир — левый верхний угол, вне потока (как было).
           Абсолютные элементы карточки считаются от .card-main, а не от
           .card: блок входа растёт ВНИЗ и не сдвигает прогноз/Vol/стрелки. */
        .card-main { position: relative; min-height: 160px; }
        .rank-badge {
            position: absolute; top: 0; left: 0;
            font-size: 0.74em; font-weight: 700; line-height: 1;
            letter-spacing: 0.02em; pointer-events: none;
        }
        .vol-value {
            position: absolute; bottom: 42px; right: 0;
            font-size: 0.9em; font-weight: bold; font-style: italic;
        }
        .pred-pct  { position: absolute; bottom: 90px; right: 0; font-size: 0.9em; font-weight: bold; font-style: italic; }
        .pred-val  { position: absolute; bottom: 66px; right: 0; font-size: 0.9em; font-weight: bold; font-style: italic; }
        .nav-abs   { position: absolute; bottom: 10px; right: 0; }
        .side3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; margin-bottom: 6px; }
        .side-btn.a-none { color: #000; background: #c7c7cc; }
        .dist-line { font-size: 0.8em; margin: 3px 0; color: #aaa; }
        .reason-line { font-size: 0.76em; color: var(--cyan); margin: 3px 0 5px;
                       line-height: 1.35; padding-right: 84px; }
        .qbtn {
            background: #26262c; border: 1px solid #3d3d47; color: #d0d0d8;
            padding: 7px 10px; border-radius: 8px; font-size: 11px;
            font-weight: 700; cursor: pointer; margin-right: 5px; margin-top: 5px;
            letter-spacing: 0.02em;
        }
        .qbtn:active { background: #33333b; }
        .qbtn.wide {
            width: 100%; margin-right: 0; padding: 11px 6px; box-sizing: border-box;
            font-size: 12px; letter-spacing: 0.06em;
        }
        .qbtn.call {
            background: transparent; border: 1px solid var(--accent);
            color: var(--accent); font-weight: 800;
        }
        .qrow { display: flex; flex-wrap: wrap; margin-bottom: 2px; }
        /* Блок входа: не серая простыня, а отдельная «панель прибора» —
           градиент, цветной торец по стороне сделки, крупные ключевые числа. */
        .ent {
            position: relative; overflow: hidden;
            border: 1px solid #35353f; border-radius: 12px;
            padding: 12px 13px 11px; margin: 12px 0 2px;
            background: linear-gradient(180deg, #1e1e26 0%, #131318 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .ent::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
        .ent.s-long::before  { background: var(--green); }
        .ent.s-short::before { background: var(--red); }
        .ent-head {
            font-size: 1.16em; font-weight: 900; letter-spacing: 0.07em;
            margin-bottom: 9px; text-transform: uppercase;
        }
        .ent-line { font-size: 0.87em; margin: 5px 0; color: #dcdce4; }
        .ent-big  { font-size: 1.12em; font-weight: 800; color: var(--accent); letter-spacing: 0.01em; }
        .ent-dim  { color: #7e7e8c; font-weight: 400; font-size: 0.9em; }
        .ent-sub  { font-size: 0.76em; color: #9296a2; margin: 4px 0; line-height: 1.45; }
        .ent-why  { font-size: 0.86em; font-weight: 700; margin: 7px 0 5px; line-height: 1.45; }
        .ent-warn { font-size: 0.78em; color: var(--accent); margin: 4px 0; line-height: 1.4; }
        .liq-row  {
            display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 4px;
            padding: 8px 0; border-top: 1px solid #2c2c36; border-bottom: 1px solid #2c2c36;
        }
        .liq-cell { font-size: 0.86em; font-weight: 800; letter-spacing: 0.01em; }
        .liq-cell.pick { text-decoration: underline; text-underline-offset: 3px; }
        .diag-line { font-size: 0.78em; color: #666; margin: 2px 0 3px; }
        /* Тир кандидата — по центру верха карточки, вне потока (высота карточки
           не меняется). Слева ранг/FDV, справа цена — пересечений нет. */
        .tier-badge {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            font-size: 0.74em; font-weight: 800; line-height: 1;
            letter-spacing: 0.02em; white-space: nowrap; pointer-events: none;
        }
        /* Кнопка вызова доски */
        /* Мягкий золотой пульс — единственный анимированный акцент на карточке.
           2.9 с, без резких скачков яркости: премиальный, не мигалка. */
        @keyframes goldPulse {
            0%   { color: #d9a52f; border-color: rgba(243,186,47,0.38);
                   box-shadow: 0 0 0 rgba(243,186,47,0); }
            50%  { color: #ffd97a; border-color: rgba(243,186,47,0.95);
                   box-shadow: 0 0 20px rgba(243,186,47,0.20), inset 0 0 14px rgba(243,186,47,0.07); }
            100% { color: #d9a52f; border-color: rgba(243,186,47,0.38);
                   box-shadow: 0 0 0 rgba(243,186,47,0); }
        }
        .qbtn.call {
            background: linear-gradient(180deg, rgba(243,186,47,0.14), rgba(243,186,47,0.04));
            border: 1px solid rgba(243,186,47,0.55); color: var(--accent);
            font-weight: 900; letter-spacing: 0.14em;
            animation: goldPulse 2.9s ease-in-out infinite;
        }

        /* ─────────── ДОСКА CRYPTO FUTURE (полный экран) ─────────── */
        #board {
            position: fixed; inset: 0; z-index: 5000; display: none;
            background:
              radial-gradient(90% 55% at 50% 0%, rgba(243,186,47,0.07) 0%, rgba(0,0,0,0) 70%),
              var(--bg);
            overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding-bottom: calc(env(safe-area-inset-bottom) + 28px);
        }
        .bd-top {
            position: sticky; top: 0; z-index: 3; text-align: center;
            padding: calc(env(safe-area-inset-top) + 12px) 54px 12px;
            background: rgba(15,15,18,0.93);
            -webkit-backdrop-filter: saturate(140%) blur(14px);
            backdrop-filter: saturate(140%) blur(14px);
            border-bottom: 1px solid #24242c;
        }
        .bd-title { font-size: 1.02em; font-weight: 900; letter-spacing: 0.14em; }
        .bd-sub   { font-size: 0.64em; color: #9296a4; letter-spacing: 0.1em; margin-top: 3px; }
        .bd-x {
            position: absolute; left: 12px; top: calc(env(safe-area-inset-top) + 8px);
            width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
            background: #23232b; border: 1px solid #3a3a46; color: #d6d6de;
            font-size: 17px; font-weight: 700; line-height: 1; padding: 0;
        }
        .bd-wrap { padding: 0 12px; }
        .bd-sec {
            margin-top: 11px; padding: 13px 14px 14px;
            border: 1px solid #2a2a33; border-radius: 15px;
            background: linear-gradient(180deg, #1c1c23 0%, #141419 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.045);
        }
        /* Заголовок любого блока — по центру (правка Босса 09.08). Единый
           принцип выравнивания, заданный блоком «ДИАПАЗОН 90 ДНЕЙ». */
        .bd-h {
            font-size: 0.63em; font-weight: 900; letter-spacing: 0.2em;
            color: #8f8fa0; text-transform: uppercase; margin-bottom: 11px;
            text-align: center;
        }
        /* Герой тоже центрируется: он и есть главный информационный блок. */
        .bd-vlabel, .bd-vnum, .bd-vstop, .bd-vwhy { text-align: center; }
        /* Герой-вердикт */
        .bd-hero {
            position: relative; overflow: hidden; margin-top: 11px;
            border-radius: 18px; padding: 15px 15px 13px; border: 1px solid #34343f;
            background: linear-gradient(180deg, #1f1f28 0%, #131318 100%);
        }
        /* Подсветка героя семантическая: зелёная = плечо проходит, красная = нет.
           Сторону сделки несут подпись и сегмент ЛОНГ/ШОРТ, а не цвет. */
        .bd-hero::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: radial-gradient(80% 120% at 100% 0%, rgba(48,209,88,0.16) 0%, rgba(0,0,0,0) 62%);
        }
        .bd-hero.s-stop::after {
            background: radial-gradient(80% 120% at 100% 0%, rgba(255,69,58,0.22) 0%, rgba(0,0,0,0) 62%);
        }
        .bd-vlabel { position: relative; z-index: 1; font-size: 0.62em; font-weight: 900;
                     letter-spacing: 0.24em; color: #9292a6; }
        .bd-vnum {
            position: relative; z-index: 1; font-size: 3.4em; font-weight: 900;
            line-height: 0.92; letter-spacing: -0.035em; margin: 2px 0 1px;
            font-variant-numeric: tabular-nums;
        }
        .bd-vstop { position: relative; z-index: 1; font-size: 1.35em; font-weight: 900;
                    line-height: 1.15; letter-spacing: 0.01em; color: var(--red); margin: 4px 0 2px; }
        .bd-vwhy  { position: relative; z-index: 1; font-size: 0.8em; color: #b6b6c6; line-height: 1.4; }
        /* Строка выбранного плеча — единственное место, где живёт нажатая
           кнопка. Отделена рамкой, чтобы её нельзя было спутать с ИТОГОМ. */
        .bd-pick {
            position: relative; z-index: 1; display: flex;
            justify-content: space-between; align-items: baseline;
            margin-top: 11px; padding: 9px 11px;
            border: 1px solid #3a3a46; border-radius: 11px; background: rgba(0,0,0,0.28);
            font-size: 0.86em;
        }
        /* Сегмент ЛОНГ/ШОРТ внутри доски */
        .bd-seg { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr;
                  gap: 6px; margin-top: 12px; }
        .bd-sbtn {
            padding: 9px 0; border-radius: 10px; font-size: 12px; font-weight: 800;
            letter-spacing: 0.1em; cursor: pointer;
            background: #23232b; border: 1px solid #35353f; color: #82828f;
        }
        .bd-sbtn.on-long  { background: var(--green); border-color: var(--green); color: #06210f; }
        .bd-sbtn.on-short { background: var(--red);   border-color: var(--red);   color: #2a0806; }
        /* Строка «метка → значение» */
        .bd-kv { display: flex; justify-content: space-between; align-items: baseline;
                 gap: 10px; margin: 7px 0; font-size: 0.86em; }
        .bd-k  { color: #a2a2b2; }
        .bd-v  { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
        /* Волосяной разделитель между метриками в одной строке значения:
           разводит b= / R2 / rho, не добавляя строке заметной ширины. */
        .bd-msep { display: inline-block; width: 1px; height: 0.82em; margin: 0 5px;
                   background: #4d4d5c; border-radius: 1px; vertical-align: -0.06em; }
        .bd-note { font-size: 0.76em; color: #91919f; line-height: 1.45; margin-top: 8px; }
        .bd-warn { font-size: 0.78em; color: var(--accent); line-height: 1.45; margin-top: 8px; }
        .bd-bad  { font-size: 0.78em; color: var(--red);    line-height: 1.45; margin-top: 8px; }
        /* Точка входа: крупная цена между большими шагами */

        .bd-chip.pen { color: var(--accent); border-color: rgba(243,186,47,0.45); }

        .bd-chip.on { background: rgba(243,186,47,0.16); border-color: rgba(243,186,47,0.6);

        .bd-unit { display: grid; grid-template-columns: 1fr 62px 1fr; gap: 8px; margin-top: 8px; }

           маркером убрана: у краёв она наезжала на МИН/МАКС. */
        /* Единый типографический знак: число компактнее, «%» подтянут к нему.
           Курсив — как у остальных числовых акцентов калькулятора. */
        .bd-rpct {

        .bd-rsub {
            font-size: 0.76em; font-style: italic; color: #ffffff;
            opacity: 0.88; letter-spacing: 0.005em; margin-top: 2px;

        .bd-rng { position: relative; height: 12px; border-radius: 7px; margin: 4px 0 10px;
                  box-shadow: inset 0 1px 3px rgba(0,0,0,0.55); }
        .bd-rmark {
            position: absolute; top: -6px; width: 4px; height: 24px; border-radius: 3px;
            background: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.75); transform: translateX(-2px);
        }
        .bd-rpos {

        /* Экран ввода пароля */
        #lock-screen {

<script>
// ── Защита паролем ──────────────────────────────────────────────────────────
// Пароль запоминается на устройстве через localStorage: вводится один раз,
// потом калькулятор открывается сразу. На чужом устройстве (где localStorage
// пустой) без пароля доступа нет.
(function() {
    var ACCESS_CODE = 'AV777SA';
    var LS_KEY = 'cryptoEngineAccess';

    function unlock() {
        var ls = document.getElementById('lock-screen');
        if (ls) ls.style.display = 'none';
    }

    // Уже разблокировано на этом устройстве?
    try {
        if (localStorage.getItem(LS_KEY) === ACCESS_CODE) {
            unlock();
        }
    } catch(e) {}

    function tryLogin() {
        var inp = document.getElementById('lock-input');
        var err = document.getElementById('lock-error');
        if (!inp) return;
        if (inp.value === ACCESS_CODE) {
            try { localStorage.setItem(LS_KEY, ACCESS_CODE); } catch(e) {}
            if (err) err.innerText = '';
            unlock();
        } else {
            if (err) err.innerText = 'Неверный код, попробуйте снова';
            inp.value = '';
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        var btn = document.getElementById('lock-btn');
        var inp = document.getElementById('lock-input');
        if (btn) btn.addEventListener('click', tryLogin);
        if (inp) inp.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') tryLogin();
        });
    });
})();

// ── Состояние ──────────────────────────────────────────────────────────────
// currentSide — режим экрана. 'none' = обзор рынка (карточки компактные,
// порядок ручной). 'long'/'short' = карточки пересортированы по силе кандидата.
var currentSide   = 'none';
// Режим стресса множит бету и меняет ДИАГНОСТИЧЕСКИЙ прогноз на карточке.
// В решение по плечу (ИТОГ) он не входит — там своя математика.
var currentStress = 'normal';
// Ручной выбор плеча вернулся: им управляются строки LONG/SHORT-ликвидации
// на карточке и проверка «проходит ли выбранное плечо» в блоке входа.
var currentLev    = 3;
// Вход по каждой монете. Сессионное состояние: вчерашний вход с сегодняшними
// данными опаснее ручного счёта, поэтому в localStorage не пишется.
var entryState = {};   // { SYM: { open:true, price:<цена монеты> } }
// Открытая полноэкранная доска CRYPTO FUTURE. Одна монета за раз.
// Тоже сессионное: доска = развёрнутый вход, хранить её между запусками опасно.
var boardSym  = null;
// Сторона ВНУТРИ доски. Отдельно от currentSide: доску можно открыть прямо из
// ОБЗОРА нажатием на имя монеты, не пересортировывая весь список.
var boardSide = 'long';
// Пороги релевантности стороны по положению в 90д-диапазоне (правка Босса 09.08).
// Ниже 25% шорт бессмысленен, выше 75% бессмысленен лонг: Босс торгует
// контртренд от краёв, а не вход в середину уже состоявшегося движения.
var REL_LOW   = 25;
var REL_HIGH  = 75;
// Показывать ли монеты, для которых выбранная сторона нерелевантна.
var showOff   = false;
// Снимок строк последнего рендера — доска берёт данные отсюда, чтобы не
// пересчитывать список заново на каждой перерисовке тикера.
var lastRows  = [];
// Символы монет, реально показанных в списке — для нумерации места в доске.
var lastShownSyms = [];

var STRESS_MULT  = { normal: 1.0, panic: 1.3, crash: 1.8 };
var STRESS_BADGE = { normal: '',   panic: 'b*1.3', crash: 'b*1.8' };
var STRESS_NAME  = { normal: 'Normal', panic: 'Panic', crash: 'Crash' };

// ── Константы риска ────────────────────────────────────────────────────────
// Maintenance margin. 0.0125 подтверждён обратным счётом по трём реальным
// позициям Босса (XMR 1.28%, YFI 1.25%, LIT 1.13%). Прежний 0.01 давал
// ликвидацию ДАЛЬШЕ реальной, то есть ошибался в опасную сторону.
var LIQ_MMR   = 0.0125;
var RISK_Z    = 1.645;    // 10% вероятности касания (принцип отражения)
// Горизонт шума = 7 суток. Прежние 30 суток были самым чувствительным
// параметром системы и в одиночку двигали вердикт на две ступени плеча,
// не будучи связанными ни с одним решением Босса.
var H_NOISE   = 168;
// Окно реакции: сколько часов позиция может стоять без присмотра (сон/работа).
var H_REACT   = 12;
var H_BTC     = 168;      // тот же горизонт для стресса BTC
var L_CAP     = 7;        // математический потолок
var L_MIN     = 2;        // ниже -> «БЕЗ БЕЗОПАСНОГО ПЛЕЧА», 1X не рекомендуем
var L_BASE    = 4;        // базовое плечо Босса — для справочной вероятности
var INV_FLOOR_SD = 2.0;   // пол дистанции инвалидации в дневных сигмах
// Потолок дистанции инвалидации. Если структурный уровень дальше 6 дневных
// сигм (за 7 суток это движение с вероятностью ~2%), это уже не стоп, а
// пожелание: по такому уровню выйти невозможно. Тогда опоры рядом НЕТ,
// дистанция обрезается, и карточка честно об этом предупреждает. Без этого
// потолка вход в середине диапазона давал «БЕЗ ПЛЕЧА» — то есть далёкая
// опора трактовалась как огромный риск вместо отсутствия ориентира.
var INV_CAP_SD   = 6.0;
// Потолок потери на СТОП по марже. Профессиональная замена фиксированному
// «стоп не дальше 10%»: расстояние до стопа задаёт структура монеты, а
// ограничивается не сам стоп, а ПЛЕЧО — стоп нельзя подтягивать в шум.
// 0.35 маржи = при типичной марже в 10% счёта это 3.5% счёта на сделку.
var MAX_MARGIN_LOSS = 0.35;
// Маржа позиции в USDT. Сессионная: вчерашний размер с сегодняшней ценой
// опаснее ручного счёта (тот же принцип, что и с ценой входа).
var posMargin = 100;
// Единица ввода размера: 'usdt' — задаётся маржа, 'coin' — количество монет.
// Сессионное, как и сам размер: вчерашнее количество с сегодняшней ценой — другие деньги.
var sizeMode = 'usdt';
var posQty   = 0;
var SHOW_LEVS = [3, 4, 5];
// Пороги «созревания» шорта. Живут ОДНИМ числом на два места: их читает
// scoreCandidate (штраф счёта) и блок «ШОРТ СОЗРЕЕТ, КОГДА» (что показать
// Боссу). Разъехавшись, они начали бы врать друг про друга.
var EFF_TREND    = 0.6;   // |eff14| выше -> движение идёт прямой линией
var PACE_Z       = 0.25;  // порог, с которого темп считается сломанным
var VOL_ABNORMAL = 2.0;   // vol7/vol90 -> потолок 3X
var VOL_HARD     = 0.02;  // 2%/ч      -> потолок 2X
var VOL_STOP     = 0.03;  // 3%/ч      -> плечо не выдаётся

var botData          = { analysis_data: [], generated_at: null };
var cachedMarketData = [];
var cachedFunding    = {};
var sliderInitialized = false;

var GIST_URL       = 'https://gist.githubusercontent.com/seahomebatumi-ai/3f50574a29bc37434c18cc8480779ccb/raw/coeffs.json';
var STALE_WARN_MIN = 75;
var STALE_CRIT_MIN = 130;

var tokens = [
    {name:'SUI',    s:'SUIUSDT'},   {name:'ONDO',   s:'ONDOUSDT'},
    {name:'LINK',   s:'LINKUSDT'},  {name:'RENDER', s:'RENDERUSDT'},
    {name:'NEAR',   s:'NEARUSDT'},  {name:'YFI',    s:'YFIUSDT'},
    {name:'AAVE',   s:'AAVEUSDT'},  {name:'AVAX',   s:'AVAXUSDT'},
    {name:'FET',    s:'FETUSDT'},   {name:'ENA',    s:'ENAUSDT'},
    {name:'TAO',    s:'TAOUSDT'},   {name:'GRAM',   s:'GRAMUSDT'},
    {name:'XRP',    s:'XRPUSDT'},   {name:'ADA',    s:'ADAUSDT'},
    {name:'TRX',    s:'TRXUSDT'},   {name:'SOL',    s:'SOLUSDT'},
    {name:'BCH',    s:'BCHUSDT'},   {name:'HYPE',   s:'HYPEUSDT', fut:true},

// ── Тикер только по нужным парам ────────────────────────────────────────────
var useSymbolsParam = true;

function marketTickerUrl() {
    if (!useSymbolsParam) return 'https://api.binance.com/api/v3/ticker/24hr';
    var syms = ['BTCUSDT'];
    for (var i = 0; i < tokens.length; i++) {
        if (tokens[i].fut) continue;
        if (syms.indexOf(tokens[i].s) === -1) syms.push(tokens[i].s);
    }
    return 'https://api.binance.com/api/v3/ticker/24hr?symbols='
        + encodeURIComponent(JSON.stringify(syms));
}

// ── Порядок карточек ────────────────────────────────────────────────────────
var ORDER_KEY = 'cryptoEngineTokenOrder';

function applySavedOrder() {
    try {
        var saved = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
        if (!Array.isArray(saved) || !saved.length) return;
        var map = {};
        tokens.forEach(function(t) { map[t.name] = t; });
        var out = [];
        saved.forEach(function(n) { if (map[n]) { out.push(map[n]); delete map[n]; } });
        Object.keys(map).forEach(function(n) { out.push(map[n]); });
        tokens = out;
    } catch(e) {}
}

function saveOrder() {
    try {
        localStorage.setItem(ORDER_KEY, JSON.stringify(tokens.map(function(t){ return t.name; })));
    } catch(e) {}
}

var cachedFutTickers = {};

function refreshFuturesTickers() {
    tokens.forEach(function(t) {
        if (!t.fut) return;
        fetch('https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=' + t.s)
            .then(function(res) {
                if (!res.ok) throw new Error('http ' + res.status);
                return res.json();
            })
            .then(function(d) {
                if (d && d.symbol) { cachedFutTickers[d.symbol] = d; update(); }
            })
            .catch(function() {});
    });

function updateFreshnessDisplay() {
    var el = document.getElementById('last-update');
    if (!el) return;
    if (!botData.generated_at) {
        el.innerText   = 'Нет данных';
        el.style.color = 'var(--red)';
        return;
    }
    var genDate = new Date(botData.generated_at);
    var ageMin  = (Date.now() - genDate.getTime()) / 60000;
    var mins    = Math.max(0, Math.round(ageMin));
    if (ageMin > STALE_CRIT_MIN) {
        el.innerText   = '! Молчит ' + mins + ' мин';
        el.style.color = 'var(--red)';
    } else if (ageMin > STALE_WARN_MIN) {
        el.innerText   = 'Обновлено ' + mins + ' мин';
        el.style.color = 'var(--accent)';
    } else {
        el.innerText   = ageMin < 1 ? 'Обновлено сейчас' : 'Обновлено ' + mins + ' мин';
        el.style.color = '#888';
    }
}

function refreshMarketData(isRetry) {
    var logo = document.getElementById('btc-logo');
    var priceEl = document.getElementById('btc-cur');
    if (logo) logo.classList.add('loading');
    if (priceEl) priceEl.classList.add('loading');
    var wasSymbols = useSymbolsParam;
    fetch(marketTickerUrl())
        .then(function(res) {
            if (!res.ok) throw new Error('http ' + res.status);
            return res.json();
        })
        .then(function(data) {
            if (!data || typeof data.length !== 'number') throw new Error('bad ticker payload');
            cachedMarketData = data;
            if (!sliderInitialized && data.length > 0) {
                var btcObj = null;
                for (var i = 0; i < data.length; i++) {
                    if (data[i].symbol === 'BTCUSDT') { btcObj = data[i]; break; }
                }
                if (btcObj) {
                    document.getElementById('slider').value = Math.round(parseFloat(btcObj.lastPrice));
                    sliderInitialized = true;
                }
            }
            update();
        })
        .catch(function() {
            if (wasSymbols && !isRetry) {
                useSymbolsParam = false;
                refreshMarketData(true);
            }
        })
        .finally(function() {
            setTimeout(function() {
                if (logo) logo.classList.remove('loading');
                if (priceEl) priceEl.classList.remove('loading');
            }, 500);
        });
}

// ── Мелкие утилиты ──────────────────────────────────────────────────────────
function has(v) { return v !== null && v !== undefined && typeof v === 'number' && isFinite(v); }
function firstNum() {
    for (var i = 0; i < arguments.length; i++) if (has(arguments[i])) return arguments[i];
    return null;
}
function clamp01(x) { return Math.max(0, Math.min(1, x)); }
// Точность как была до правки: всегда 4 знака. Так цены на карточке,
// в блоке входа и в строке ликвидаций читаются одним столбцом.
function fmtP(x) {
    if (!isFinite(x)) return '?';
    return x < 0.0001 ? '&lt;0.0001' : '$' + x.toFixed(4);
}
// Число, попадающее в onclick-атрибут: без хвоста плавающей точки.
function numAttr(x) { return Math.round(x * 1e6) / 1e6; }
function pctTxt(x, digits) { return (x >= 0 ? '+' : '') + (x * 100).toFixed(digits === undefined ? 1 : digits) + '%'; }

// ── UI: перестановка карточек (только в режиме обзора) ─────────────────────
function move(idx, dir) {
    var n = idx + dir;
    if (n >= 0 && n < tokens.length) {
        var tmp = tokens[idx]; tokens[idx] = tokens[n]; tokens[n] = tmp;
        saveOrder();
        update();
    }
}

// ── Кнопки панели ───────────────────────────────────────────────────────────
// Сторона и плечо переключаются из ДВУХ мест: верхняя панель и доска.
// Обе точки входа зовут эти функции, поэтому состояние не рассинхронизируется.
function setSide(mode) {
    currentSide = mode;
    // Доска больше не закрывается в ОБЗОРЕ: её открывают нажатием на имя монеты.
    // Смена ЛОНГ/ШОРТ в списке ведёт сторону доски за собой — иначе два разных

    if (mode !== 'none') boardSide = mode;
    var btns = document.querySelectorAll('.side-btn');
    for (var i = 0; i < btns.length; i++) {
        btns[i].className = 'side-btn' + (btns[i].getAttribute('data-mode') === mode ? ' a-' + mode : '');
    }
    update();
}

function setLev(l) {

    var btns = document.querySelectorAll('.lev-btn');
    for (var i = 0; i < btns.length; i++) {

        else btns[i].classList.remove('active');

// ── Управление входом ───────────────────────────────────────────────────────
function entryOf(sym) { return entryState[sym] || null; }

// Положение цены в 90д-диапазоне, 0-100. null, если данных нет.
function rangePos(cd, cur) {
    if (!has(cd.min_price) || !has(cd.max_price)) return null;
    if (!(cd.max_price > cd.min_price) || !(cur > 0)) return null;
    return Math.max(0, Math.min(100, (cur - cd.min_price) / (cd.max_price - cd.min_price) * 100));
}
// Релевантна ли сторона при текущем положении в диапазоне.
function sideRelevant(pos, isLong) {
    if (pos === null) return true;
    return isLong ? (pos <= REL_HIGH) : (pos >= REL_LOW);
}

function openEntry(sym, cur, side) {
    entryState[sym] = { open: true, price: cur };
    if (side) boardSide = side;
    else if (currentSide !== 'none') boardSide = currentSide;
    boardSym = sym;
    update();
}
function closeEntry(sym) {
    delete entryState[sym];
    if (boardSym === sym) boardSym = null;
    document.body.style.overflow = '';
    update();
}
function setMargin(v) {
    v = parseFloat(v);
    if (isFinite(v) && v > 0) { posMargin = v; update(); }
}
function nudgeMargin(mult) {
    var v = posMargin * mult;
    setMargin(v >= 10 ? Math.round(v) : Math.round(v * 100) / 100);
}
function askMargin() {
    var v = prompt('\u041C\u0430\u0440\u0436\u0430 \u0432 USDT', String(posMargin));
    if (v === null) return;
    setMargin(String(v).replace(',', '.'));
}
// Переключение единицы размера. Объём позиции при этом НЕ меняется: второе
// число пересчитывается из первого по тождеству qty·E = маржа·L.
// E приходит атрибутом из доски: цена входа живёт в entryState по монете.
function setSizeMode(m, sym) {
    if (m === sizeMode) return;
    // Цена входа берётся из entryState по монете — точная, без округления
    // атрибутом. Доска открыта => запись в entryState существует всегда.
    var st = entryOf(sym);
    var E  = st ? st.price : 0;
    if (m === 'coin') {
        if (isFinite(E) && E > 0 && currentLev > 0) posQty = posMargin * currentLev / E;
    } else {
        if (isFinite(E) && E > 0 && currentLev > 0 && posQty > 0) posMargin = posQty * E / currentLev;
    }
    sizeMode = m;
    update();
}
function setQty(v) {
    v = parseFloat(v);
    if (isFinite(v) && v > 0) { posQty = v; update(); }
}
// Шаг −/+ и карандаш работают с той единицей, которая сейчас выбрана.
function nudgeSize(mult) {
    if (sizeMode !== 'coin') { nudgeMargin(mult); return; }
    if (!(posQty > 0)) return;
    var q = posQty * mult;
    setQty(q >= 10 ? Math.round(q) : Math.round(q * 10000) / 10000);
}
function askSize(sym) {
    if (sizeMode !== 'coin') { askMargin(); return; }
    var v = prompt('\u041A\u043E\u043B\u0438\u0447\u0435\u0441\u0442\u0432\u043E ' + sym, String(posQty));
    if (v === null) return;
    setQty(String(v).replace(',', '.'));
}
// Деньги: два знака, разряды пробелом — как в отчёте, а не как цена монеты.
function fmtUsd(x) {
    if (!isFinite(x)) return '?';
    var neg = x < 0, a = Math.abs(x);
    var t = a.toFixed(2).split('.');
    t[0] = t[0].replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
    return (neg ? '\u2212$' : '$') + t[0] + '.' + t[1];
}

// Переключение стороны ВНУТРИ доски: список не трогаем.
function setBoardSide(s) { boardSide = s; update(); }
function toggleOff() { showOff = !showOff; update(); }
function setEntry(sym, price) {
    if (!(price > 0)) return;
    entryState[sym] = { open: true, price: price };
    update();
}
function nudgeEntry(sym, mult) {
    var e = entryOf(sym); if (!e) return;
    setEntry(sym, e.price * mult);
}
// prompt() вместо <input>: карточки перерисовываются каждые 30 с по тикеру,
// поле ввода теряло бы фокус прямо во время набора.
function askEntry(sym) {
    var e = entryOf(sym); if (!e) return;
    var v = prompt('Цена входа для ' + sym, String(e.price));
    if (v === null) return;
    v = parseFloat(String(v).replace(',', '.'));
    if (isFinite(v) && v > 0) setEntry(sym, v);
}

// ── Математика риска ────────────────────────────────────────────────────────
function normCdf(x) {
    // Abramowitz-Stegun 7.1.26, точность ~1.5e-7
    var s = x < 0 ? -1 : 1, ax = Math.abs(x) / Math.sqrt(2);
    var t = 1 / (1 + 0.3275911 * ax);
    var y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t
                  - 0.284496736) * t + 0.254829592) * t * Math.exp(-ax * ax);
    return 0.5 * (1 + s * y);
}

function sigmaDay(vol) { return vol * Math.sqrt(24); }

// Композитная оценка доверия к МОДЕЛИ карточки (0-100): 45% R2 текущего
// направления (14d), 25% R2 (90d), 20% согласованность бет, 10% штраф за
// волатильность. Отсутствующие компоненты выпадают с перенормировкой.
function confidenceScore(r2_14, r2_90, rawBeta, beta90, volatility) {
    var parts = [], weights = [];
    if (has(r2_14)) { parts.push(clamp01(r2_14)); weights.push(0.45); }
    if (has(r2_90)) { parts.push(clamp01(r2_90)); weights.push(0.25); }
    if (has(beta90) && has(rawBeta)) {
        var div90 = Math.abs(rawBeta - beta90) / (Math.abs(beta90) || 1);
        parts.push(1 - Math.min(div90, 1)); weights.push(0.20);
    }
    var volPct = (volatility || 0) * 100;
    parts.push(1 - Math.min(volPct / 3, 1)); weights.push(0.10);
    var acc = 0, wsum = 0;
    for (var i = 0; i < parts.length; i++) { acc += parts[i] * weights[i]; wsum += weights[i]; }
    return wsum > 0 ? Math.round(100 * acc / wsum) : null;
}

// Светофор доверия к модели: можно ли использовать прогноз/бету карточки.
// Чисто отображение, ни один расчёт не меняет.
function gateState(conf, r2dir, corr90) {
    if (!has(conf) || conf < 40) return 'red';
    if (!has(r2dir) || r2dir < 0.25) return 'red';
    if (has(corr90) && Math.abs(corr90) < 0.5) return 'red';
    if (conf < 70) return 'yellow';
    return 'green';
}

function liqPrice(E, L, isLong) {
    return isLong ? E * (1 - 1 / L + LIQ_MMR) : E * (1 + 1 / L - LIQ_MMR);
}

// Вероятность КАСАНИЯ ликвидации за hours часов (без стопа, без долива).
function liqTouchProb(vol, L, isLong, hours) {
    if (!has(vol) || vol <= 0) return null;
    var d = 1 / L - LIQ_MMR;
    if (!(d > 0)) return 1;
    var b;
    if (isLong) { if (d >= 1) return 1; b = -Math.log(1 - d); }
    else        { b = Math.log(1 + d); }
    var q = vol * Math.sqrt(hours);
    if (!(q > 0)) return 0;
    return Math.max(0, Math.min(1, 2 * (1 - normCdf(b / q))));
}

// Потолок по СТРУКТУРЕ: ликвидация обязана лежать за уровнем инвалидации
// плюс запас на реакцию (движение за H_REACT часов с вероятностью 90%).
function lStruct(dist, vol) {
    var den = dist + RISK_Z * vol * Math.sqrt(H_REACT) + LIQ_MMR;
    return den > 0 ? 1 / den : null;
}

// Потолок по ШУМУ: 10% вероятности касания за 7 суток, если не выйти вовсе.
function lNoise(vol, isLong) {
    var q = RISK_Z * vol * Math.sqrt(H_NOISE);
    var need = isLong ? (1 - Math.exp(-q)) : (Math.exp(q) - 1);
    var den = need + LIQ_MMR;
    return den > 0 ? 1 / den : null;
}

// Бета для проверки обвала BTC. Для ЛОНГа опасно падение BTC (down-бета),
// для ШОРТа — рост (up-бета). 90д-окно предпочтительнее 14д: 2160 точек
// против 336. Хвостовая бета шумная (типичный R2 < 0.05, ошибка ±30%),
// поэтому она может только УЖЕСТОЧИТЬ проверку и только при R2 >= 0.10.
function advBeta(cd, isLong) {
    var base = isLong ? firstNum(cd.down_beta_90, cd.down_beta)
                      : firstNum(cd.up_beta_90,   cd.up_beta);
    if (base === null) return null;
    var b = Math.abs(base);
    if (has(cd.tail_beta) && has(cd.tail_r2) && cd.tail_r2 >= 0.10) {
        b = Math.max(b, Math.abs(cd.tail_beta));
    }
    return b;
}

// Потолок по ОБВАЛУ BTC: переживёт ли позиция движение BTC на 2 сигмы
// за те же 7 суток. Считается молча, срабатывает редко — только на монетах
// с бетой примерно от 2.
function lBtcCheck(beta, isLong, btcVol) {
    if (!has(beta) || !has(btcVol) || btcVol <= 0) return null;
    var D = 2 * btcVol * Math.sqrt(H_BTC);
    var r = isLong ? -D : D;
    var move = Math.abs(Math.pow(Math.max(1 + r, 1e-9), beta) - 1);
    var den = move + LIQ_MMR;
    return den > 0 ? 1 / den : null;
}

function volRegime(cd) {
    if (!has(cd.vol7) || !has(cd.volatility) || cd.volatility <= 0) return null;
    return cd.vol7 / cd.volatility;
}

// ── Созревание шорта ────────────────────────────────────────────────────────
// «ШОРТ СОЗРЕЕТ, КОГДА» — два условия ТЕМПА, которые прямо сейчас режут счёт
// шорт-кандидата в scoreCandidate. Раньше Босс проверял эти два числа глазами.
// Ноль новых запросов: eff14, r7, r30 и volatility уже приходят от бота.
// Нет ни одного из двух наборов -> null -> блок не рисуется (инвариант 9).
function shortMaturity(cd) {
    var rows = [], done = 0, known = 0;

    // Условие 1. Прямолинейность роста за 14д. Выше EFF_TREND тренд вверх не
    // сломан, и счёт шорта умножается на 0.5 — это самый дорогой штраф.
    if (has(cd.eff14)) {
        var okEff = cd.eff14 <= EFF_TREND;
        known++; if (okEff) done++;
        rows.push({ k: '\u0422\u0440\u0435\u043D\u0434 \u0432\u0432\u0435\u0440\u0445 \u0441\u043B\u043E\u043C\u0430\u0435\u0442\u0441\u044F', ok: okEff,
                    now: cd.eff14.toFixed(2),
                    need: '\u2264' + EFF_TREND.toFixed(2),
                    d: 'eff14 \u2014 \u043D\u0430\u0441\u043A\u043E\u043B\u044C\u043A\u043E \u043F\u0440\u044F\u043C\u043E\u0439 \u043B\u0438\u043D\u0438\u0435\u0439 \u0448\u0451\u043B \u0440\u043E\u0441\u0442 \u0437\u0430 14 \u0434\u043D\u0435\u0439. \u0412\u044B\u0448\u0435 ' + EFF_TREND.toFixed(2) + ' \u0441\u0447\u0451\u0442 \u0448\u043E\u0440\u0442\u0430 \u0434\u0435\u043B\u0438\u0442\u0441\u044F \u043D\u0430 2' });
    } else {
        rows.push({ k: '\u0422\u0440\u0435\u043D\u0434 \u0432\u0432\u0435\u0440\u0445 \u0441\u043B\u043E\u043C\u0430\u0435\u0442\u0441\u044F', ok: null, now: '\u2014', need: '\u2014', d: '\u0431\u043E\u0442 \u043D\u0435 \u0434\u0430\u043B eff14 \u2014 \u0443\u0441\u043B\u043E\u0432\u0438\u0435 \u043D\u0435 \u043F\u0440\u043E\u0432\u0435\u0440\u0435\u043D\u043E' });
    }

    // Условие 2. Темп недели против темпа месяца. Порог тот же, по которому
    // карточка уже пишет «рост выдыхается»: z <= -PACE_Z.
    if (has(cd.r7) && has(cd.r30) && has(cd.volatility) && cd.volatility > 0) {
        var sd7    = sigmaDay(cd.volatility) * Math.sqrt(7);
        var pace   = cd.r30 * (7 / 30);
        var needR7 = pace - PACE_Z * sd7;
        var okPace = cd.r7 <= needR7;
        known++; if (okPace) done++;
        rows.push({ k: '\u0420\u043E\u0441\u0442 \u0432\u044B\u0434\u043E\u0445\u043D\u0435\u0442\u0441\u044F', ok: okPace,
                    now: pctTxt(cd.r7), need: '\u2264' + pctTxt(needR7),
                    d: 'r7 \u043F\u0440\u043E\u0442\u0438\u0432 \u0442\u0435\u043C\u043F\u0430 r30, \u043F\u0435\u0440\u0435\u0441\u0447\u0438\u0442\u0430\u043D\u043D\u043E\u0433\u043E \u043D\u0430 \u0442\u0443 \u0436\u0435 \u043D\u0435\u0434\u0435\u043B\u044E (' + pctTxt(pace) + '), \u0441 \u0437\u0430\u043F\u0430\u0441\u043E\u043C \u0432 \u0447\u0435\u0442\u0432\u0435\u0440\u0442\u044C \u043D\u0435\u0434\u0435\u043B\u044C\u043D\u043E\u0439 \u0441\u0438\u0433\u043C\u044B' });
    } else {
        rows.push({ k: '\u0420\u043E\u0441\u0442 \u0432\u044B\u0434\u043E\u0445\u043D\u0435\u0442\u0441\u044F', ok: null, now: '\u2014', need: '\u2014', d: '\u0431\u043E\u0442 \u043D\u0435 \u0434\u0430\u043B r7/r30 \u2014 \u0443\u0441\u043B\u043E\u0432\u0438\u0435 \u043D\u0435 \u043F\u0440\u043E\u0432\u0435\u0440\u0435\u043D\u043E' });
    }

    if (!known) return null;
    return { rows: rows, done: done, known: known };
}

// ── Уровень инвалидации ─────────────────────────────────────────────────────
// Опора — экстремум последних 30 дней (при их отсутствии в coeffs.json —
// 90-дневный, инвариант 9), сдвинутый на полсигмы за него. Пол 2 дневные
// сигмы обязателен: движение меньше двух сигм — это шум, а не поломка идеи,
// и утверждать, что выйдешь по нему, нельзя.
function invalidationInfo(cd, E, isLong) {
    var vol = cd.volatility;
    if (!has(vol) || vol <= 0 || !(E > 0)) return null;
    var sd  = sigmaDay(vol);
    var ref, src;
    if (isLong) {
        ref = firstNum(cd.min30, cd.min_price);
        src = has(cd.min30) ? 'мин30' : 'мин90';
        if (ref !== null && ref > E) { ref = E; src = 'вход'; }
    } else {
        ref = firstNum(cd.max30, cd.max_price);
        src = has(cd.max30) ? 'макс30' : 'макс90';
        if (ref !== null && ref < E) { ref = E; src = 'вход'; }
    }
    if (ref === null || !(ref > 0)) return null;
    var structPrice = isLong ? ref * (1 - 0.5 * sd) : ref * (1 + 0.5 * sd);
    var dStruct = isLong ? (E - structPrice) / E : (structPrice - E) / E;
    var floorD  = INV_FLOOR_SD * sd;
    var capD    = INV_CAP_SD * sd;
    var capped  = dStruct > capD;
    var dist    = Math.max(Math.min(dStruct, capD), floorD);
    var price   = isLong ? E * (1 - dist) : E * (1 + dist);
    return { dist: dist, price: price, dStruct: dStruct, capped: capped,
             floored: dist > dStruct + 1e-12, sd: sd, ref: ref, src: src };
}

// ── Решение по плечу ────────────────────────────────────────────────────────
function leverageDecision(cd, E, isLong, btcStats) {
    var out = { ok: false, L: null, msg: '', warn: [], parts: null, inv: null,
                binding: '', fix: '' };
    var vol = cd.volatility;
    if (!has(vol) || vol <= 0) { out.msg = 'Бот не дал волатильность'; return out; }
    if (vol >= VOL_STOP) {
        out.msg = 'Волатильность ' + (vol * 100).toFixed(2) + '%/ч — плечо не выдаётся';
        return out;
    }
    var inv = invalidationInfo(cd, E, isLong);
    if (!inv) { out.msg = 'Нет данных для уровня инвалидации'; return out; }
    out.inv = inv;

    var Ls = lStruct(inv.dist, vol);
    var Ln = lNoise(vol, isLong);
    var bA = advBeta(cd, isLong);
    var Lb = lBtcCheck(bA, isLong, btcStats ? btcStats.volatility : null);

    var cands = [{ n: 'структура', v: Ls }, { n: 'шум 7д', v: Ln }];
    if (Lb !== null) cands.push({ n: 'обвал BTC', v: Lb });
    var best = cands[0];
    for (var i = 1; i < cands.length; i++) if (cands[i].v < best.v) best = cands[i];
    out.parts = { struct: Ls, noise: Ln, btc: Lb };
    out.binding = best.n;

    var cap = L_CAP;
    var vr = volRegime(cd);
    if (vr !== null && vr > VOL_ABNORMAL) {
        cap = Math.min(cap, 3);
        out.warn.push('Волатильность за 7д выросла в ' + vr.toFixed(1) + '\u00D7 — потолок 3X');
    }
    if (vol >= VOL_HARD) {
        cap = Math.min(cap, 2);
        out.warn.push('Волатильность ' + (vol * 100).toFixed(2) + '%/ч — потолок 2X');
    }

    var L = Math.floor(Math.min(best.v, cap, L_CAP));
    if (L < L_MIN) {
        out.msg = 'БЕЗ БЕЗОПАСНОГО ПЛЕЧА';
        out.fix = fixHint(cd, E, isLong, best.n, vol, inv);
        return out;
    }
    out.ok = true;
    out.L  = L;
    return out;
}

// Что именно должно измениться, чтобы сетап стал торгуемым.
function fixHint(cd, E, isLong, binding, vol, inv) {
    if (binding === 'структура') {
        if (inv.capped) return 'Опоры рядом нет — вход не спасает, нужен ручной стоп.';
        var buf   = RISK_Z * vol * Math.sqrt(H_REACT);
        var need  = 1 / L_MIN - buf - LIQ_MMR;   // требуемая дистанция для 2X
        if (!(need > 0)) return 'Запас на реакцию уже съедает всё плечо — только спот.';
        var ref = inv.ref;
        var target = isLong ? ref * (1 - 0.5 * inv.sd) / (1 - need)
                            : ref * (1 + 0.5 * inv.sd) / (1 + need);
        if (!(target > 0) || !isFinite(target)) return 'Вход слишком далеко от структуры.';
        return 'Станет 2X при входе ' + (isLong ? 'от ' : 'до ') + fmtP(target) + '.';
    }
    if (binding === 'шум 7д') {
        var q  = -Math.log(1 - (1 / L_MIN - LIQ_MMR));
        var qs = Math.log(1 + (1 / L_MIN - LIQ_MMR));
        var needVol = (isLong ? q : qs) / (RISK_Z * Math.sqrt(H_NOISE));
        return 'Дело в волатильности монеты, вход не поможет: нужна Vol \u2264 '
             + (needVol * 100).toFixed(2) + '%/ч, сейчас ' + (vol * 100).toFixed(2) + '%/ч.';
    }
    return 'Монета слишком резко ходит за BTC — только спот или меньший размер.';
}

// ── Скоринг кандидатов ──────────────────────────────────────────────────────
// ВАЖНО: это инструмент СОРТИРОВКИ внимания («на какие три монеты смотреть
// первыми»), а НЕ сигнал входа. Веса — обоснованный приор, не результат
// бэктеста: исторических данных для проверки в системе пока нет.
function scoreCandidate(cd, sym, cur, p24, qv, isLong) {
    var vol = cd.volatility;
    if (!has(vol) || vol <= 0) return null;
    var mn = cd.min_price, mx = cd.max_price;
    if (!has(mn) || !has(mx) || !(mx > mn) || !(mn > 0) || !(cur > 0)) return null;

    var sd = sigmaDay(vol);
    var parts = [], ws = [], reasons = [];

    if (isLong) {
        // Главный принцип Босса: ближе к минимуму — выше. Меряется в ДНЕВНЫХ
        // СИГМАХ, а не в процентах: 5% над минимумом при sigma 2% — это далеко,
        // при sigma 8% — это фактически на минимуме.
        var dLow = Math.max(0, ((cur - mn) / cur) / sd);
        var pPos = Math.exp(-dLow / 3);
        parts.push(pPos); ws.push(0.50);
        reasons.push({ w: pPos * 0.50, s: dLow < 0.5
            ? 'на минимуме 90д'
            : '+' + ((cur / mn - 1) * 100).toFixed(1) + '% над мин90 (' + dLow.toFixed(1) + '\u03C3)' });
    } else {
        var run  = cur / mn - 1;
        var pRun = clamp01(run / 1.0);
        parts.push(pRun); ws.push(0.35);
        reasons.push({ w: pRun * 0.35, s: '+' + (run * 100).toFixed(0) + '% от мин90' });
        var dHigh = Math.max(0, ((mx - cur) / cur) / sd);
        var pHigh = Math.exp(-dHigh / 3);
        parts.push(pHigh); ws.push(0.20);
        reasons.push({ w: pHigh * 0.20, s: dHigh < 0.5
            ? 'у максимума 90д' : dHigh.toFixed(1) + '\u03C3 до макс90' });
    }

    // Разворот (ЛОНГ) / истощение (ШОРТ): идёт ли движение с прежним темпом.
    if (has(cd.r7) && has(cd.r30)) {
        var pace = cd.r30 * (7 / 30);
        var z    = (cd.r7 - pace) / (sd * Math.sqrt(7));
        var raw  = isLong ? z : -z;
        var pEx  = clamp01((Math.max(-1, Math.min(1, raw)) + 1) / 2);
        parts.push(pEx); ws.push(0.25);
        reasons.push({ w: pEx * 0.25, s: isLong
            ? (raw > PACE_Z ? 'падение замедлилось' : (raw < -PACE_Z ? 'падение ускоряется' : 'темп падения ровный'))
            : (raw > PACE_Z ? 'рост выдыхается'     : (raw < -PACE_Z ? 'рост ускоряется'    : 'темп роста ровный')) });
    }
    // Дивергенция оборота: цена растёт, а оборот ниже нормы — топливо кончается.
    if (!isLong && has(cd.vol_ratio) && has(cd.r7) && cd.r7 > 0 && cd.vol_ratio < 0.9) {
        reasons.push({ w: 0.01, s: 'оборот ниже нормы при росте' });
    }

    // Качество: ликвидность, ранг, стабильность волатильности.
    var qp = [], qw = [];
    if (has(qv) && qv > 0) { qp.push(clamp01(Math.log(qv / 1e6) / Math.log(100))); qw.push(0.4); }
    if (has(cd.rank))      { qp.push(clamp01(1 - (cd.rank - 1) / 150));            qw.push(0.3); }
    var vr = volRegime(cd);
    if (vr !== null)       { qp.push(clamp01(1 - (vr - 1) / 1.5));                 qw.push(0.3); }
    if (qp.length) {
        var qa = 0, qs2 = 0;
        for (var k = 0; k < qp.length; k++) { qa += qp[k] * qw[k]; qs2 += qw[k]; }
        parts.push(qa / qs2); ws.push(isLong ? 0.25 : 0.20);
    }

    var acc = 0, wsum = 0;
    for (var i = 0; i < parts.length; i++) { acc += parts[i] * ws[i]; wsum += ws[i]; }
    if (wsum <= 0) return null;
    var score = 100 * acc / wsum;

    // Штрафы — множители: один фатальный дефект обязан убивать кандидата,
    // а не вычитать из него несколько баллов.
    var mult = 1, flags = [];
    if (vr !== null && vr > VOL_ABNORMAL) { mult *= 0.5; flags.push('волатильность \u00D7' + vr.toFixed(1)); }
    if (has(cd.eff14)) {
        if (isLong && cd.eff14 < -EFF_TREND)  { mult *= 0.6; flags.push('падает прямой линией'); }
        if (!isLong && cd.eff14 > EFF_TREND)  { mult *= 0.5; flags.push('тренд вверх не сломан'); }
    }
    if (isLong && has(cd.fdv_mc) && cd.fdv_mc > 3) {
        mult *= 0.7; flags.push('FDV ' + cd.fdv_mc.toFixed(1) + '\u00D7 — проверить разлоки');
    }
    if (isLong && has(cd.rank) && has(cd.rank_prev) && (cd.rank - cd.rank_prev) >= 5) {
        mult *= 0.8; flags.push('ранг падает');
    }
    if (has(p24)) {
        var m24 = (p24 / 100) / sd;
        if (isLong && m24 < -3)  { mult *= 0.6; flags.push(p24.toFixed(0) + '% за 24ч — нож ещё летит'); }
        if (!isLong && m24 > 3)  { mult *= 0.7; flags.push('+' + p24.toFixed(0) + '% за 24ч — вертикаль'); }
    }
    var fr = cachedFunding[sym];
    if (!isLong && has(fr) && fr > 0.0005) { mult *= 1.05; flags.push('лонги переполнены'); }

    score = Math.max(0, Math.min(100, score * mult));
    reasons.sort(function(a, b) { return b.w - a.w; });
    var top = [];
    for (var r = 0; r < reasons.length && top.length < 2; r++) top.push(reasons[r].s);
    for (var f = 0; f < flags.length && top.length < 4; f++) top.push(flags[f]);
    return { score: score, reasons: top };
}

function tierOf(s) {
    if (s >= 70) return { n: 'Сильный',   c: 'var(--green)' };
    if (s >= 50) return { n: 'Кандидат',  c: 'var(--accent)' };
    if (s >= 35) return { n: 'Наблюдать', c: 'var(--cyan)' };
    return { n: 'Слабый', c: '#888' };
}

// ── Полноэкранная доска CRYPTO FUTURE ───────────────────────────────────────
// Заменяет блок входа внутри карточки. Карточка в режиме ЛОНГ/ШОРТ остаётся
// витриной, доска — рабочим столом: дублирования информации нет по построению.
// Вся математика (leverageDecision / invalidationInfo / liqPrice / liqTouchProb)
// вызывается без изменений — переехало только место отрисовки.
var lastCtx = null;   // снимок сценария последнего рендера (BTC, ratio, стресс)

// Цена без знака доллара — для узких колонок (шесть плеч в ряд).
function fmtPBare(x) {
    var s = fmtP(x);
    return s.charAt(0) === '$' ? s.substring(1) : s;
}

function probColor(p) {
    return p <= 0.10 ? 'var(--green)' : (p <= 0.25 ? 'var(--accent)' : 'var(--red)');
}

function probRow(label, p) {
    if (p === null) return '';
    var c = probColor(p);
    var w = Math.max(2, Math.min(100, Math.round(p * 100)));
    return '<div class="bd-prow">'
         + '<div class="bd-plab">' + label + '</div>'
         + '<div class="bd-track"><div class="bd-fill" style="width:' + w + '%;background:' + c + ';"></div></div>'
         + '<div class="bd-pval" style="color:' + c + ';">'
         + (p < 0.005 ? '&lt;1%' : Math.round(p * 100) + '%') + '</div>'
         + '</div>';
}

function r2Color(v) {
    if (!has(v)) return '#888';
    return v < 0.30 ? 'var(--red)' : (v < 0.60 ? 'var(--accent)' : 'var(--green)');
}

// Совпадает ли сторона доски с режимом списка (тогда row.sc уже посчитан).
function sideAligned(row) {
    return row.sc && currentSide !== 'none' && (currentSide === boardSide);
}

function boardHtml(row, pos) {
    var cd   = row.cd, t = row.t, coin = row.coin;
    var sym  = t.name, pair = t.s;
    var cur  = parseFloat(coin.lastPrice);
    var p24  = parseFloat(coin.priceChangePercent);
    var isLong    = (boardSide === 'long');
    var btcStats  = lastCtx.btcStats;
    var sideName  = isLong ? 'ЛОНГ' : 'ШОРТ';
    var sideColor = isLong ? 'var(--green)' : 'var(--red)';
    // Счёт пересчитывается под сторону ДОСКИ: она может отличаться от режима
    // списка (доску открывают и из ОБЗОРА, и с перевёрнутой стороной).
    var sc = sideAligned(row) ? row.sc
           : scoreCandidate(cd, pair, cur, p24, parseFloat(coin.quoteVolume), isLong);
    var rpos = rangePos(cd, cur);
    var relevant = sideRelevant(rpos, isLong);

    var st = entryOf(sym);
    var E  = st ? st.price : cur;
    var dec = leverageDecision(cd, E, isLong, btcStats);

    // Предупреждения, которые раньше жили в блоке входа.
    if (dec.inv && dec.inv.src === 'вход') {
        dec.warn.push('Нет структуры ' + (isLong ? 'ниже' : 'выше')
                    + ' входа \u2014 размер задан только шумом, опоры для выхода нет');
    }
    if (dec.inv && dec.inv.capped) {
        dec.warn.push('Опора (' + dec.inv.src + ' ' + fmtP(dec.inv.ref) + ') дальше 6\u03C3 \u2014 '
                    + 'по ней стоп не поставить. Плечо ограничено искусственно, выход держи вручную');
    }

    var p24Color = p24 >= 0 ? 'var(--green)' : 'var(--red)';
    var h = '';


    // ── Шапка: название по центру, крестик слева ──
    h += '<div class="bd-top">'
       + '<button class="bd-x" onclick="closeEntry(\'' + sym + '\')">\u2715</button>'
       + '<div class="bd-title"><span style="color:var(--lilac);">' + sym
       + '</span> <span style="color:#4a4a56;">\u00B7</span> <span style="color:' + sideColor + ';">'
       + sideName + '</span></div>'
       + '<div class="bd-sub">' + fmtP(cur) + ' \u00B7 <span style="color:' + p24Color + ';">'
       + (p24 > 0 ? '+' : '') + p24.toFixed(2) + '%</span>'
       + (has(cd.volatility) ? ' \u00B7 Vol ' + (cd.volatility * 100).toFixed(2) + '%/\u0447' : '')
       + '</div></div>';

    h += '<div class="bd-wrap">';


    var sHero = '';
    // ── 1. Вердикт ──
    var okSelHero = dec.ok && currentLev <= dec.L;
    // Цвет героя семантический: зелёный = плечо проходит, красный = нет.
    // Сторону несут подпись и сегмент ЛОНГ/ШОРТ (правка Босса 09.08).
    sHero += '<div class="bd-hero ' + (dec.ok ? 's-pass' : 's-stop') + '">';
    if (dec.ok) {
        sHero += '<div class="bd-vlabel">\u0418\u0422\u041E\u0413 \u00B7 ' + sideName
           + ' \u00B7 \u041F\u041E\u0422\u041E\u041B\u041E\u041A</div>'
           + '<div class="bd-vnum" style="color:var(--green);">' + dec.L + 'X</div>'
           + '<div class="bd-vwhy">\u0416\u0451\u0441\u0442\u0447\u0435 \u0432\u0441\u0435\u0433\u043E \u0440\u0435\u0436\u0435\u0442 \u00AB' + dec.binding
           + '\u00BB. \u042D\u0442\u043E \u043F\u0440\u0435\u0434\u0435\u043B \u0441\u0438\u0441\u0442\u0435\u043C\u044B \u2014 \u043E\u0442 \u043A\u043D\u043E\u043F\u043E\u043A \u043F\u043B\u0435\u0447\u0430 \u043E\u043D \u041D\u0415 \u043C\u0435\u043D\u044F\u0435\u0442\u0441\u044F.</div>';
    } else {
        sHero += '<div class="bd-vlabel">' + sideName + '</div>'
           + '<div class="bd-vstop">' + dec.msg + '</div>'
           + (dec.fix ? '<div class="bd-vwhy">' + dec.fix + '</div>' : '');
    }
    // Строка выбора — единственное место, где живёт нажатая кнопка. Меняется
    // мгновенно вместе со всеми числами ниже.
    sHero += '<div class="bd-pick" style="border-color:' + (okSelHero ? 'rgba(48,209,88,0.45)' : 'rgba(255,69,58,0.45)') + ';">'
       + '<span class="bd-k">\u0412\u044B\u0431\u0440\u0430\u043D\u043E</span>'

    var sRel = '';

    if (!relevant) {
        sRel += '<div class="bd-sec" style="border-color:rgba(255,69,58,0.4);">'
           + '<div class="bd-h">\u0421\u0422\u041E\u0420\u041E\u041D\u0410 \u041F\u0420\u041E\u0422\u0418\u0412 \u0421\u0422\u0420\u0423\u041A\u0422\u0423\u0420\u042B</div>'

           + ' \u0421\u0447\u0451\u0442 \u0438 \u043F\u043B\u0435\u0447\u043E \u043D\u0438\u0436\u0435 \u0441\u0447\u0438\u0442\u0430\u044E\u0442\u0441\u044F \u0447\u0435\u0441\u0442\u043D\u043E, \u043D\u043E \u044D\u0442\u043E \u0432\u0445\u043E\u0434 \u043F\u0440\u043E\u0442\u0438\u0432 \u0442\u0432\u043E\u0435\u0433\u043E \u0436\u0435 \u043F\u0440\u0430\u0432\u0438\u043B\u0430.</div></div>';
    }

    var sWarn = '';
    // ── 2. Предупреждения ──
    if (dec.warn.length) {
        sWarn += '<div class="bd-sec" style="border-color:rgba(243,186,47,0.35);">'
           + '<div class="bd-h">\u0412\u041D\u0418\u041C\u0410\u041D\u0418\u0415</div>';
        for (var w = 0; w < dec.warn.length; w++) {
            sWarn += '<div class="bd-warn" style="margin-top:' + (w ? 8 : 0) + 'px;">\u26A0 ' + dec.warn[w] + '</div>';
        }
        sWarn += '</div>';
    }

    var sWhy = '';
    // ── 3. Почему эта монета ──
    if (sc) {
        var tier = tierOf(sc.score);
        sWhy += '<div class="bd-sec"><div class="bd-h">\u041F\u041E\u0427\u0415\u041C\u0423 \u042D\u0422\u0410 \u041C\u041E\u041D\u0415\u0422\u0410</div>'
           + '<div class="bd-kv"><span class="bd-k">\u041E\u0446\u0435\u043D\u043A\u0430 \u043A\u0430\u043A ' + sideName.toLowerCase() + '-\u043A\u0430\u043D\u0434\u0438\u0434\u0430\u0442\u0430</span>'
           + '<span class="bd-v" style="color:' + tier.c + ';">'

        if (has(cd.rank)) {
            sWhy += '<div class="bd-kv"><span class="bd-k">\u0420\u0430\u043D\u0433 \u043A\u0430\u043F\u0438\u0442\u0430\u043B\u0438\u0437\u0430\u0446\u0438\u0438</span>'
               + '<span class="bd-v">#' + cd.rank + '</span></div>';
        }
        if (has(cd.fdv_mc)) {
            var fC = cd.fdv_mc > 3 ? 'var(--red)' : (cd.fdv_mc >= 1.5 ? 'var(--accent)' : '#9a9aa6');

               + '<span class="bd-v" style="color:' + fC + ';">' + cd.fdv_mc.toFixed(1) + '\u00D7</span></div>';
        }
        if (sc.reasons.length) {
            sWhy += '<div class="bd-note" style="color:var(--cyan);">' + sc.reasons.join(' \u00B7 ') + '</div>';
        }
        // «ШОРТ СОЗРЕЕТ, КОГДА» — только на стороне ШОРТ и только внутри
        // блока ПОЧЕМУ ЭТА МОНЕТА: своей секции не заводим, чтобы не трогать
        // порядок 12 блоков (инвариант 15).
        if (!isLong) {
            var mat = shortMaturity(cd);
            if (mat) {
                var matCol = mat.done === mat.known ? 'var(--green)'
                           : (mat.done > 0 ? 'var(--accent)' : '#8f8fa0');
                sWhy += '<div class="bd-kv" style="border-top:1px solid #2b2b34;'
                   + 'padding-top:11px;margin-top:12px;margin-bottom:6px;">'
                   + '<span class="bd-k" style="font-weight:900;letter-spacing:0.14em;'
                   + 'font-size:0.86em;color:#8f8fa0;">\u0428\u041E\u0420\u0422 \u0421\u041E\u0417\u0420\u0415\u0415\u0422, \u041A\u041E\u0413\u0414\u0410</span>'
                   + '<span class="bd-v" style="color:' + matCol + ';">'
                   + mat.done + ' / ' + mat.known + '</span></div>';
                for (var mi = 0; mi < mat.rows.length; mi++) {
                    var mr  = mat.rows[mi];
                    var mCl = mr.ok === null ? '#6f6f7e'
                            : (mr.ok ? 'var(--green)' : 'var(--accent)');
                    var mIc = mr.ok === null ? '?' : (mr.ok ? '\u2713' : '\u2715');
                    sWhy += '<div class="bd-kv" style="margin-bottom:1px;">'
                       + '<span class="bd-k" style="color:' + mCl + ';">'
                       + mIc + ' ' + mr.k + '</span>'

                var matTxt;
                if (mat.known < 2) {
                    matTxt = '\u041F\u0440\u043E\u0432\u0435\u0440\u0435\u043D\u043E \u043E\u0434\u043D\u043E \u0443\u0441\u043B\u043E\u0432\u0438\u0435 \u0438\u0437 \u0434\u0432\u0443\u0445 \u2014 \u0432\u0442\u043E\u0440\u043E\u0433\u043E \u043D\u0435\u0442 \u0432 \u0434\u0430\u043D\u043D\u044B\u0445 \u0431\u043E\u0442\u0430. '
                           + (mat.done ? '\u041F\u0440\u043E\u0432\u0435\u0440\u0435\u043D\u043D\u043E\u0435 \u0432\u044B\u043F\u043E\u043B\u043D\u0435\u043D\u043E.' : '\u041F\u0440\u043E\u0432\u0435\u0440\u0435\u043D\u043D\u043E\u0435 \u043D\u0435 \u0432\u044B\u043F\u043E\u043B\u043D\u0435\u043D\u043E.');
                } else if (mat.done === 2) {
                    matTxt = '\u041E\u0431\u0430 \u0443\u0441\u043B\u043E\u0432\u0438\u044F \u0432\u044B\u043F\u043E\u043B\u043D\u0435\u043D\u044B \u2014 \u0442\u0435\u043C\u043F \u0440\u043E\u0441\u0442\u0430 \u0441\u043B\u043E\u043C\u0430\u043D. \u0414\u0430\u043B\u044C\u0448\u0435 \u0440\u0435\u0448\u0430\u044E\u0442 \u0443\u0440\u043E\u0432\u0435\u043D\u044C \u0432\u0445\u043E\u0434\u0430 \u0438 \u043F\u043E\u0442\u043E\u043B\u043E\u043A \u043F\u043B\u0435\u0447\u0430.';

                }
                sWhy += '<div class="bd-note" style="color:' + matCol + ';">'
                   + matTxt
                   + '</div>'
                   + '<div class="bd-note">\u042D\u0442\u043E \u0443\u0441\u043B\u043E\u0432\u0438\u044F \u0422\u0415\u041C\u041F\u0410, \u0430 \u043D\u0435 \u0446\u0435\u043D\u044B: \u043E\u043D\u0438 \u043D\u0435 \u0437\u0430\u043C\u0435\u043D\u044F\u044E\u0442 \u0443\u0440\u043E\u0432\u0435\u043D\u044C \u0432\u0445\u043E\u0434\u0430 \u0438 \u043D\u0435 \u043E\u0442\u043C\u0435\u043D\u044F\u044E\u0442 \u043F\u043E\u0442\u043E\u043B\u043E\u043A \u043F\u043B\u0435\u0447\u0430.</div>';
            }

        sWhy += '<div class="bd-note">\u042D\u0442\u043E \u043F\u043E\u0440\u044F\u0434\u043E\u043A \u0432\u043D\u0438\u043C\u0430\u043D\u0438\u044F, \u0430 \u043D\u0435 \u0441\u0438\u0433\u043D\u0430\u043B \u0432\u0445\u043E\u0434\u0430: \u0441\u0447\u0451\u0442 \u0433\u043E\u0432\u043E\u0440\u0438\u0442, \u043D\u0430 \u043A\u0430\u043A\u0438\u0435 \u043C\u043E\u043D\u0435\u0442\u044B \u0441\u043C\u043E\u0442\u0440\u0435\u0442\u044C \u043F\u0435\u0440\u0432\u044B\u043C\u0438.</div>'
           + '</div>';
    }

    var sEntry = '';
    // ── 4. Точка входа ──
    var q = isLong ? [['\u0440\u044B\u043D\u043E\u043A',1],['\u22123%',0.97],['\u22125%',0.95],['\u221210%',0.90]]
                   : [['\u0440\u044B\u043D\u043E\u043A',1],['+3%',1.03],['+5%',1.05],['+10%',1.10]];
    // Подсветка нажатой кнопки (правка Босса 10.08): ровно одна из пяти горит
    // всегда. Допуск 0.25% = половина шага кнопок -/+ : мелкий тик цены с биржи
    // подсветку не гасит, а собственный сдвиг входа — гасит.
    var qh = '', qHit = false;
    for (var i = 0; i < q.length; i++) {
        var qPrice = cur * q[i][1];
        var qOn    = (cur > 0) && Math.abs(E / cur - q[i][1]) < 0.0025;
        if (qOn) qHit = true;
        qh += '<button class="bd-chip' + (qOn ? ' on' : '') + '" onclick="setEntry(\'' + sym + '\','
            + numAttr(qPrice) + ')">' + q[i][0] + '</button>';
    }
    // Карандаш горит, когда цена входа не совпала ни с одной готовой кнопкой:
    // это и есть состояние «своя цена».
    qh += '<button class="bd-chip pen' + (qHit ? '' : ' on') + '" '
        + 'onclick="askEntry(\'' + sym + '\')">\u270E</button>';
    sEntry += '<div class="bd-sec"><div class="bd-h">\u0422\u041E\u0427\u041A\u0410 \u0412\u0425\u041E\u0414\u0410</div>'

       + '<button class="bd-step" onclick="nudgeEntry(\'' + sym + '\',0.995)">\u2212</button>'
       + '<div class="bd-pricebox" onclick="askEntry(\'' + sym + '\')">'
       +   '<div class="bd-price">' + fmtP(E) + '</div>'
       +   '<div class="bd-pricesub">' + pctTxt(E / cur - 1, 1) + ' \u041A \u0420\u042B\u041D\u041A\u0423 \u00B7 \u041D\u0410\u0416\u041C\u0418 \u2192 \u0421\u0412\u041E\u042F</div>'

       + '</div>'
       + '<div class="bd-chips">' + qh + '</div>'
       + '<div class="bd-note">\u0428\u0430\u0433 \u043A\u043D\u043E\u043F\u043E\u043A \u2212/+ \u2014 0.5%. \u041E\u0442 \u044D\u0442\u043E\u0439 \u0446\u0435\u043D\u044B \u0441\u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044F \u0432\u0441\u0451 \u043D\u0438\u0436\u0435; \u0441\u0446\u0435\u043D\u0430\u0440\u0438\u0439 BTC \u043D\u0430 \u043F\u043B\u0435\u0447\u043E \u043D\u0435 \u0432\u043B\u0438\u044F\u0435\u0442.</div>'
       + '</div>';

    // ── 4b. Размер позиции ──
    // Два входа вместо одного (правка Босса 09.08): размер задаётся ЛИБО
    // маржей в USDT, ЛИБО количеством монет. Быстрые суммы 50/100/250/500
    // убраны: они были жёстко привязаны к USDT и в монетах смысла не имеют.
    // Тождество: notional = qty·E = маржа·L. Задаётся одно число, второе
    // выводится — поэтому переключение единицы НЕ двигает объём позиции.
    // mrg — действующая маржа в обоих режимах; в режиме USDT mrg === posMargin,
    // поэтому все расчёты ниже при старом поведении дают те же числа.
    var isCoin = (sizeMode === 'coin');
    var notional, qty, mrg;
    if (isCoin) {
        qty      = (isFinite(posQty) && posQty > 0) ? posQty
                 : (E > 0 ? posMargin * currentLev / E : 0);
        notional = qty * E;
        mrg      = currentLev > 0 ? notional / currentLev : 0;
    } else {
        mrg      = posMargin;
        notional = mrg * currentLev;
        qty      = E > 0 ? notional / E : 0;
    }
    var qtyTxt = qty >= 1000 ? Math.round(qty).toLocaleString()
                             : qty.toFixed(qty >= 1 ? 2 : 4);
    var sSize = '';
    sSize += '<div class="bd-sec"><div class="bd-h">\u0420\u0410\u0417\u041C\u0415\u0420 \u041F\u041E\u0417\u0418\u0426\u0418\u0418</div>'
       + '<div class="bd-ent">'
       + '<button class="bd-step" onclick="nudgeSize(0.9)">\u2212</button>'
       + '<div class="bd-pricebox" onclick="askSize(\'' + sym + '\')">'
       +   '<div class="bd-price">' + (isCoin ? qtyTxt : fmtUsd(mrg).replace('$', ''))
       +   '<span class="bd-cur"> ' + (isCoin ? sym : 'USDT') + '</span></div>'
       +   '<div class="bd-pricesub">'
       +   (isCoin ? '\u041A\u041E\u041B\u0418\u0427\u0415\u0421\u0422\u0412\u041E \u00B7 \u041D\u0410\u0416\u041C\u0418 \u2192 \u0421\u0412\u041E\u0401'
                  : '\u041C\u0410\u0420\u0416\u0410 \u00B7 \u041D\u0410\u0416\u041C\u0418 \u2192 \u0421\u0412\u041E\u042F')
       +   '</div>'
       + '</div>'
       + '<button class="bd-step" onclick="nudgeSize(1.1)">+</button>'
       + '</div>'
       // Сетка 1fr / auto / 1fr — карандаш геометрически ровно по центру.
       + '<div class="bd-unit">'
       +   '<button class="bd-ubtn' + (isCoin ? ' on' : '') + '" onclick="setSizeMode(\'coin\',\''
       +   sym + '\')">\u041C\u041E\u041D\u0415\u0422\u042B</button>'
       +   '<button class="bd-upen" onclick="askSize(\'' + sym + '\')">\u270E</button>'
       +   '<button class="bd-ubtn' + (isCoin ? '' : ' on') + '" onclick="setSizeMode(\'usdt\',\''
       +   sym + '\')">USDT</button>'
       + '</div>'
       + '<div class="bd-kv" style="margin-top:11px;"><span class="bd-k">\u041E\u0431\u044A\u0451\u043C \u043F\u0440\u0438 ' + currentLev + 'X</span>'
       + '<span class="bd-v">' + fmtUsd(notional) + '</span></div>'
       + '<div class="bd-kv"><span class="bd-k">'
       + (isCoin ? '\u041C\u0430\u0440\u0436\u0430 \u043F\u0440\u0438 ' + currentLev + 'X'
                 : '\u041A\u043E\u043B\u0438\u0447\u0435\u0441\u0442\u0432\u043E') + '</span>'
       + '<span class="bd-v">' + (isCoin ? fmtUsd(mrg) : qtyTxt + ' ' + sym) + '</span></div>'
       + '</div>';

    // ── 4c. Результат в деньгах ──
    var sLoss = '', sWin = '';
    if (dec.inv) {
        var stopP    = dec.inv.price;
        var lossStop = qty * Math.abs(E - stopP);
        var lossStopPct = mrg > 0 ? lossStop / mrg : 0;
        var liqP     = liqPrice(E, currentLev, isLong);
        var lossLiq  = qty * Math.abs(E - liqP);
        var lossLiqPct = mrg > 0 ? lossLiq / mrg : 0;
        var stopCol  = lossStopPct > MAX_MARGIN_LOSS ? 'var(--red)' : 'var(--accent)';

        sLoss += '<div class="bd-sec"><div class="bd-h">\u0415\u0421\u041B\u0418 \u0418\u0414\u0415\u042F \u041D\u0415 \u0421\u0420\u0410\u0411\u041E\u0422\u0410\u0415\u0422</div>'
           + '<div class="bd-kv"><span class="bd-k">\u0412\u044B\u0445\u043E\u0434 \u043F\u043E \u0441\u0442\u043E\u043F\u0443 ' + fmtP(stopP) + '</span>'
           + '<span class="bd-v" style="color:' + stopCol + ';">\u2212' + fmtUsd(lossStop).replace('$', '$') + '</span></div>'
           + '<div class="bd-kv" style="margin-top:0;"><span class="bd-k"></span>'
           + '<span class="bd-v" style="color:' + stopCol + ';font-size:0.9em;">'
           + (lossStopPct * 100).toFixed(1) + '% \u043C\u0430\u0440\u0436\u0438</span></div>'
           + '<div class="bd-kv" style="margin-top:9px;"><span class="bd-k">\u0415\u0441\u043B\u0438 \u0441\u0442\u043E\u043F \u043D\u0435 \u0441\u0440\u0430\u0431\u043E\u0442\u0430\u043B: \u043B\u0438\u043A\u0432\u0438\u0434\u0430\u0446\u0438\u044F ' + fmtP(liqP) + '</span>'
           + '<span class="bd-v" style="color:var(--red);">\u2212' + fmtUsd(lossLiq) + '</span></div>'
           + '<div class="bd-kv" style="margin-top:0;"><span class="bd-k"></span>'
           + '<span class="bd-v" style="color:var(--red);font-size:0.9em;">'
           + (lossLiqPct * 100).toFixed(1) + '% \u043C\u0430\u0440\u0436\u0438</span></div>';

        // Правило риска маржи: плечо подгоняется под стоп, а не стоп под плечо.
        var Lmoney = dec.inv.dist > 0 ? MAX_MARGIN_LOSS / dec.inv.dist : null;
        if (lossStopPct > MAX_MARGIN_LOSS && Lmoney !== null) {
            var Lfit = Math.floor(Lmoney);
            sLoss += '<div class="bd-bad">\u26A0 \u041F\u0440\u0438 ' + currentLev + 'X \u0441\u0442\u0440\u0443\u043A\u0442\u0443\u0440\u043D\u044B\u0439 \u0441\u0442\u043E\u043F \u0441\u0442\u043E\u0438\u0442 '
               + (lossStopPct * 100).toFixed(0) + '% \u043C\u0430\u0440\u0436\u0438 \u2014 \u0432\u044B\u0448\u0435 \u043F\u043E\u0440\u043E\u0433\u0430 '
               + Math.round(MAX_MARGIN_LOSS * 100) + '%. '
               + (Lfit >= L_MIN
                   ? '\u041F\u043E\u0434\u0442\u044F\u0433\u0438\u0432\u0430\u0442\u044C \u0441\u0442\u043E\u043F \u0431\u043B\u0438\u0436\u0435 \u041D\u0415\u041B\u044C\u0417\u042F \u2014 \u0442\u0430\u043C \u0448\u0443\u043C. \u0421\u043D\u0438\u0437\u044C \u043F\u043B\u0435\u0447\u043E \u0434\u043E ' + Lfit + 'X.'
                   : '\u0414\u0430\u0436\u0435 ' + L_MIN + 'X \u043D\u0435 \u0443\u043A\u043B\u0430\u0434\u044B\u0432\u0430\u0435\u0442\u0441\u044F \u2014 \u044D\u0442\u043E \u0441\u0434\u0435\u043B\u043A\u0430 \u0434\u043B\u044F \u0441\u043F\u043E\u0442\u0430 \u0438\u043B\u0438 \u043C\u0435\u043D\u044C\u0448\u0435\u0433\u043E \u0440\u0430\u0437\u043C\u0435\u0440\u0430.')
               + '</div>';
        } else {
            sLoss += '<div class="bd-note">\u0421\u0442\u043E\u043F \u0443\u043A\u043B\u0430\u0434\u044B\u0432\u0430\u0435\u0442\u0441\u044F \u0432 \u043F\u043E\u0440\u043E\u0433 '
               + Math.round(MAX_MARGIN_LOSS * 100) + '% \u043C\u0430\u0440\u0436\u0438 \u043D\u0430 \u0441\u0434\u0435\u043B\u043A\u0443.</div>';
        }
        sLoss += '</div>';

        // ── 4d. Цель и соотношение риск/прибыль ──
        var tgt = isLong ? cd.max_price : cd.min_price;
        var tgtOk = has(tgt) && (isLong ? tgt > E : tgt < E && tgt > 0);
        sWin += '<div class="bd-sec"><div class="bd-h">\u0415\u0421\u041B\u0418 \u0421\u0420\u0410\u0411\u041E\u0422\u0410\u0415\u0422</div>';
        if (tgtOk) {
            var win    = qty * Math.abs(tgt - E);
            var winPct = mrg > 0 ? win / mrg : 0;
            var rr     = lossStop > 0 ? win / lossStop : null;
            sWin += '<div class="bd-kv"><span class="bd-k">\u0426\u0435\u043B\u044C \u2014 '

            if (rr !== null) {

                sWin += '<div class="bd-kv" style="border-top:1px solid #2b2b34;padding-top:9px;margin-top:10px;">'
                   + '<span class="bd-k">\u0420\u0438\u0441\u043A / \u043F\u0440\u0438\u0431\u044B\u043B\u044C</span>'
                   + '<span class="bd-v" style="color:' + rrCol + ';">1 : ' + rr.toFixed(1) + '</span></div>';
