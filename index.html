<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="image.PNG">
    <title>Pro Crypto Toll</title>
    <style>
        :root {
            --bg: #0f0f12; --card: #1a1a20; --accent: #f3ba2f;
            --lilac: #bf5af2; --cyan: #0ad1c8; --red: #ff453a;
            --green: #30d158; --text: #ffffff;
        }
        body {
            background-color: var(--bg); color: var(--text);
            font-family: -apple-system, sans-serif; margin: 0;
            padding-top: calc(env(safe-area-inset-top) + 10px);
            padding-left: 10px; padding-right: 10px;
            padding-bottom: calc(env(safe-area-inset-bottom) + 10px);
        }
        .control {
            background: var(--card); padding: 15px; border-radius: 16px;
            border: 1px solid #333; margin-bottom: 15px;
        }
        .btc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        @keyframes rainbow { 0%{filter:hue-rotate(0deg)} 100%{filter:hue-rotate(360deg)} }
        .btc-logo { font-size: 2.4em; color: var(--accent); font-weight: bold; transition: 0.3s; }
        .btc-logo.loading { animation: rainbow 1s linear infinite; }
        @keyframes priceRainbow {
            0%   { color: #f3ba2f; }
            20%  { color: #30d158; }
            40%  { color: #0ad1c8; }
            60%  { color: #bf5af2; }
            80%  { color: #ff453a; }
            100% { color: #f3ba2f; }
        }
        .btc-price.loading { animation: priceRainbow 1.2s linear infinite; }
        .btc-price { color: var(--text); font-size: 1.6em; font-weight: 800; }
        .card {
            background: var(--card); padding: 14px; border-radius: 12px;
            margin-bottom: 8px; border: 1px solid #333; position: relative;
        }
        /* Бегущая линия по контуру при достижении краёв диапазона (1% / 99%) */
        .card.edge-min, .card.edge-max {
            border: 1px solid transparent;
            background-clip: padding-box;
        }
        .card.edge-min::before, .card.edge-max::before {
            content: ''; position: absolute; inset: 0;
            border-radius: 12px; padding: 2px;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            pointer-events: none;
        }
        @keyframes runBorderRed {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        @keyframes runBorderGreen {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .card.edge-min::before {
            background: linear-gradient(90deg, rgba(255,69,58,0) 0%, rgba(255,69,58,1) 25%, rgba(255,255,255,0.9) 50%, rgba(255,69,58,1) 75%, rgba(255,69,58,0) 100%);
            background-size: 200% 100%;
            animation: runBorderRed 1.5s linear infinite;
        }
        .card.edge-max::before {
            background: linear-gradient(90deg, rgba(48,209,88,0) 0%, rgba(48,209,88,1) 25%, rgba(255,255,255,0.9) 50%, rgba(48,209,88,1) 75%, rgba(48,209,88,0) 100%);
            background-size: 200% 100%;
            animation: runBorderGreen 1.5s linear infinite;
        }
        .no-data-card {
            background: var(--card); padding: 14px; border-radius: 12px;
            margin-bottom: 8px; border: 1px solid #333; border-left: 4px solid var(--red);
        }
        .token-name { font-size: 1.2em; font-weight: 800; color: var(--lilac); }
        .row { display: flex; justify-content: space-between; align-items: center; }
        #slider { width: 100%; margin: 10px 0; transition: accent-color 0.3s ease; }
        .lev-container {
            display: grid; grid-template-columns: repeat(6,1fr);
            gap: 4px; margin-bottom: 6px;
        }
        .lev-btn {
            background: #2c2c31; border: none; color: white;
            padding: 8px 0; border-radius: 6px; font-size: 12px; cursor: pointer;
        }
        .lev-btn.active { background: var(--accent); color: #000; font-weight: bold; }
        .stress-container { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; }
        .stress-btn {
            border: none; color: #aaa; padding: 7px 0; border-radius: 6px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            background: #2c2c31; transition: all 0.2s;
        }
        .stress-btn.s-normal { color: #000; background: var(--green); }
        .stress-btn.s-panic  { color: #000; background: var(--accent); }
        .stress-btn.s-crash  { color: #fff; background: var(--red); }
        /* Сторона сделки — единственный явный вход «лонг/шорт» в систему.
           Направление слайдера = сценарий BTC, оно НЕ равно стороне позиции. */
        .side-container { display: grid; grid-template-columns: repeat(2,1fr); gap: 4px; margin-bottom: 6px; }
        .side-btn {
            border: none; color: #aaa; padding: 8px 0; border-radius: 6px;
            font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
            cursor: pointer; background: #2c2c31; transition: all 0.2s;
        }
        .side-btn.a-long  { color: #000; background: var(--green); }
        .side-btn.a-short { color: #fff; background: var(--red); }
        .pin-btn {
            width: 100%; margin-top: 6px; box-sizing: border-box;
            background: #2c2c31; border: 1px solid #444; color: #ccc;
            padding: 9px 6px; border-radius: 8px;
            font-size: 12px; font-weight: 700; cursor: pointer;
        }
        .pin-btn.armed { background: #241f16; border-color: var(--accent); color: var(--accent); }
        .pin-btn.auto-on { background: #16241f; border-color: var(--cyan); color: var(--cyan); }
        .btn-row2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 6px; }
        .btn-row2 .pin-btn { margin-top: 6px; }
        /* Строка «рекомендуемое плечо + риск ликвидации». padding-right — как
           у .lev-block: держит текст левее абсолютного правого столбца. */
        .rec-line { padding-right: 100px; font-size: 0.8em; font-weight: 700; margin: 3px 0 1px; }
        /* Блок расчёта плеча. padding-right держит текст левее абсолютного
           правого столбца карточки (прогноз/цена/Vol) — пересечений нет. */
        .lev-block { padding-right: 100px; margin: 6px 0 4px; line-height: 1.45; }
        .lev-head  { font-size: 0.95em; font-weight: 800; letter-spacing: 0.02em; }
        .lev-sub   { font-size: 0.78em; color: #aaa; }
        .lev-res   { font-size: 0.82em; font-weight: 700; }
        .nav-btn {
            background: #444; border: none; color: #fff;
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        .pct-24h { font-size: 0.6em; font-weight: bold; }
        @keyframes blink { 0%{opacity:1} 50%{opacity:0.2} 100%{opacity:1} }
        .blink-text { animation: blink 1s linear infinite; font-weight: 900; }
        @keyframes lightBlink { 0%{opacity:1} 50%{opacity:0.5} 100%{opacity:1} }
        .light-blink { animation: lightBlink 1.5s ease-in-out infinite; }
        .extra-data { font-size: 0.85em; color: var(--accent); margin-top: 8px; font-style: italic; }
        /* Диапазон BTC 90д — занимает строку, освобождённую штампом обновления */
        .btc-range { font-size: 0.8em; color: var(--accent); font-style: italic; margin-bottom: 10px; }
        /* Компактный штамп свежести данных бота в правом верхнем углу */
        .upd-stamp { font-size: 0.62em; line-height: 1; white-space: nowrap; color: #888; }
        @keyframes blinkRed {
            0%  { opacity:1; }
            50% { opacity:0.15; }
            100%{ opacity:1; }
        }
        @keyframes blinkGreen {
            0%  { opacity:1; }
            50% { opacity:0.4; }
            100%{ opacity:1; }
        }
        .icon-warn {
            display:inline-block;
            color: var(--red) !important;
            animation: blinkRed 0.9s linear infinite;
            font-weight: bold;
        }
        .icon-ok {
            display:inline-block;
            color: var(--green) !important;
            animation: blinkGreen 2s ease-in-out infinite;
        }
        /* Ранг/FDV/тир — обычная первая строка карточки (не absolute:
           высота карточки теперь переменная из-за блока входа). */
        .rank-badge {
            display: block; margin-bottom: 3px;
            font-size: 0.74em; font-weight: 700; line-height: 1; letter-spacing: 0.02em;
        }
        .side3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; margin-bottom: 6px; }
        .side-btn.a-none { color: #000; background: #c7c7cc; }
        .adv-btn {
            width: 100%; box-sizing: border-box; background: #2c2c31;
            border: 1px solid #444; color: #999; padding: 7px 6px;
            border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer;
        }
        .adv-btn.on { border-color: var(--cyan); color: var(--cyan); }
        .adv-note { font-size: 0.68em; color: #666; margin-top: 8px; line-height: 1.35; }
        .dist-line { font-size: 0.8em; margin: 3px 0; color: #aaa; }
        .reason-line { font-size: 0.76em; color: var(--cyan); margin: 3px 0 5px; line-height: 1.35; }
        .qbtn {
            background: #2c2c31; border: 1px solid #444; color: #ccc;
            padding: 6px 9px; border-radius: 7px; font-size: 11px;
            font-weight: 700; cursor: pointer; margin-right: 4px; margin-top: 4px;
        }
        .qbtn.wide { width: 100%; margin-right: 0; padding: 9px 6px; box-sizing: border-box; }
        .qrow { display: flex; flex-wrap: wrap; margin-bottom: 2px; }
        .ent {
            border: 1px solid #3a3a42; border-radius: 10px;
            padding: 9px 10px; margin: 6px 0 4px; background: #15151a;
        }
        .ent-head { font-size: 1.0em; font-weight: 800; letter-spacing: 0.02em; margin-bottom: 4px; }
        .ent-line { font-size: 0.84em; margin: 3px 0; }
        .ent-dim  { color: #777; font-size: 0.92em; }
        .ent-sub  { font-size: 0.74em; color: #999; margin: 3px 0; line-height: 1.4; }
        .ent-why  { font-size: 0.8em; font-weight: 600; margin: 4px 0; line-height: 1.4; }
        .ent-warn { font-size: 0.76em; color: var(--accent); margin: 3px 0; }
        .liq-row  { display: flex; flex-wrap: wrap; gap: 8px; margin: 5px 0 3px; }
        .liq-cell { font-size: 0.8em; font-weight: 700; }
        .diag {
            font-size: 0.72em; color: #7a7a82; margin-top: 6px;
            border-top: 1px dashed #333; padding-top: 5px; line-height: 1.5;
        }
        .nav-row { text-align: right; margin-top: 6px; }
        /* Экран ввода пароля */
        #lock-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px;
        }
        #lock-screen .lock-box {
            background: var(--card); border: 1px solid #333;
            border-radius: 16px; padding: 28px 22px;
            width: 100%; max-width: 360px; text-align: center;
        }
        #lock-screen .lock-logo { font-size: 2.6em; color: var(--accent); font-weight: bold; margin-bottom: 6px; }
        #lock-screen .lock-title {
            font-size: 1.15em; font-weight: 700; margin-bottom: 18px;
            color: var(--text); letter-spacing: 0.02em;
            word-break: keep-all; line-height: 1.35;
        }
        #lock-input {
            width: 100%; box-sizing: border-box;
            background: #2c2c31; border: 1px solid #444;
            color: var(--text); font-size: 1.1em;
            padding: 12px 14px; border-radius: 10px;
            text-align: center; letter-spacing: 0.05em;
            margin-bottom: 12px; outline: none;
        }
        #lock-input:focus { border-color: var(--accent); }
        #lock-btn {
            width: 100%; background: var(--accent); color: #000;
            font-size: 1.05em; font-weight: 700; border: none;
            padding: 12px; border-radius: 10px; cursor: pointer;
        }
        #lock-error { color: var(--red); font-size: 0.85em; margin-top: 10px; min-height: 18px; }
    </style>
</head>
<body>

<div id="lock-screen">
    <div class="lock-box">
        <div class="lock-logo">&#8383;</div>
        <div class="lock-title">🜲 𝒫𝓇ℴ⇝𝒞𝓇𝒾𝓅𝓉ℴ⇝𝒯ℴ𝓁𝓁 🜲</div>
        <input type="password" id="lock-input" placeholder="Введите код доступа" autocomplete="off" inputmode="text">
        <button id="lock-btn">Войти</button>
        <div id="lock-error"></div>
    </div>
</div>

<div class="control">
    <div class="btc-header">
        <span id="btc-logo" class="btc-logo">&#8383;</span>
        <span id="btc-cur" class="btc-price">...</span>
        <span id="btc-24h" style="font-weight:bold;">0.00%</span>
        <div style="margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
            <div id="last-update" class="upd-stamp">...</div>
            <div id="status-dot" style="width:12px;height:12px;border-radius:50%;background:#666;"></div>
        </div>
    </div>
    <div id="btc-range" class="btc-range">Диапазон BTC 90д: ...</div>
    <div class="side3" id="sideContainer"></div>
    <button id="adv-btn" class="adv-btn">Диагностика &#9662;</button>
    <div id="adv-panel" style="display:none;">
        <div class="row" style="margin:10px 0 4px;">
            <div style="font-weight:600;">
                <span id="btc-target">Прогноз BTC: ...</span><span id="btc-target-arrow" style="font-size:1.3em;font-weight:700;line-height:1;vertical-align:-2px;margin-left:4px;"></span>
            </div>
            <div style="text-align:right;">
                <div id="btc-pct" style="font-weight:bold;color:#ffffff;">0.00%</div>
                <div id="dir-indicator" style="font-size:0.75em;font-weight:800;color:#888;">&#8212;&#8212;</div>
            </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin:6px 0;">
            <button id="btn-minus" style="
                background:#2c1f1f;border:1px solid var(--red);color:var(--red);
                font-size:1.4em;font-weight:900;width:38px;height:38px;
                border-radius:8px;cursor:pointer;flex-shrink:0;
                display:flex;align-items:center;justify-content:center;
                line-height:1;">&#8722;</button>
            <input type="range" id="slider" min="20000" max="150000" step="100"
                   style="flex:1;margin:0;">
            <button id="btn-plus" style="
                background:#1a2a1f;border:1px solid var(--green);color:var(--green);
                font-size:1.4em;font-weight:900;width:38px;height:38px;
                border-radius:8px;cursor:pointer;flex-shrink:0;
                display:flex;align-items:center;justify-content:center;
                line-height:1;">&#43;</button>
        </div>
        <div class="stress-container" id="stressContainer"></div>
        <div class="adv-note">Сценарий BTC и режимы Normal/Panic/Crash влияют ТОЛЬКО на диагностические строки карточек. На решение по плечу они не влияют.</div>
    </div>
</div>

<div id="results">Загрузка данных...</div>

<script>
// ── Защита паролем ──────────────────────────────────────────────────────────
// Пароль запоминается на устройстве через localStorage: вводится один раз,
// потом калькулятор открывается сразу. На чужом устройстве (где localStorage
// пустой) без пароля доступа нет.
(function() {
    var ACCESS_CODE = 'AV777SA';
    var LS_KEY = 'cryptoEngineAccess';

    function unlock() {
        var ls = document.getElementById('lock-screen');
        if (ls) ls.style.display = 'none';
    }

    // Уже разблокировано на этом устройстве?
    try {
        if (localStorage.getItem(LS_KEY) === ACCESS_CODE) {
            unlock();
        }
    } catch(e) {}

    function tryLogin() {
        var inp = document.getElementById('lock-input');
        var err = document.getElementById('lock-error');
        if (!inp) return;
        if (inp.value === ACCESS_CODE) {
            try { localStorage.setItem(LS_KEY, ACCESS_CODE); } catch(e) {}
            if (err) err.innerText = '';
            unlock();
        } else {
            if (err) err.innerText = 'Неверный код, попробуйте снова';
            inp.value = '';
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        var btn = document.getElementById('lock-btn');
        var inp = document.getElementById('lock-input');
        if (btn) btn.addEventListener('click', tryLogin);
        if (inp) inp.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') tryLogin();
        });
    });
})();

// ── Состояние ──────────────────────────────────────────────────────────────
// currentSide — режим экрана. 'none' = обзор рынка (карточки компактные,
// порядок ручной). 'long'/'short' = карточки пересортированы по силе кандидата.
var currentSide   = 'none';
// Режим стресса живёт ТОЛЬКО в диагностике: он множит бету и меняет
// диагностический прогноз, но НЕ участвует в решении по плечу.
var currentStress = 'normal';
var advOpen       = false;
// Вход по каждой монете. Сессионное состояние: вчерашний вход с сегодняшними
// данными опаснее ручного счёта, поэтому в localStorage не пишется.
var entryState = {};   // { SYM: { open:true, price:<цена монеты> } }

var STRESS_MULT  = { normal: 1.0, panic: 1.3, crash: 1.8 };
var STRESS_BADGE = { normal: '',   panic: 'b*1.3', crash: 'b*1.8' };
var STRESS_NAME  = { normal: 'Normal', panic: 'Panic', crash: 'Crash' };

// ── Константы риска ────────────────────────────────────────────────────────
// Maintenance margin. 0.0125 подтверждён обратным счётом по трём реальным
// позициям Босса (XMR 1.28%, YFI 1.25%, LIT 1.13%). Прежний 0.01 давал
// ликвидацию ДАЛЬШЕ реальной, то есть ошибался в опасную сторону.
var LIQ_MMR   = 0.0125;
var RISK_Z    = 1.645;    // 10% вероятности касания (принцип отражения)
// Горизонт шума = 7 суток. Прежние 30 суток были самым чувствительным
// параметром системы и в одиночку двигали вердикт на две ступени плеча,
// не будучи связанными ни с одним решением Босса.
var H_NOISE   = 168;
// Окно реакции: сколько часов позиция может стоять без присмотра (сон/работа).
var H_REACT   = 12;
var H_BTC     = 168;      // тот же горизонт для стресса BTC
var L_CAP     = 7;        // математический потолок
var L_MIN     = 2;        // ниже -> «БЕЗ БЕЗОПАСНОГО ПЛЕЧА», 1X не рекомендуем
var L_BASE    = 4;        // базовое плечо Босса — для справочной вероятности
var INV_FLOOR_SD = 2.0;   // пол дистанции инвалидации в дневных сигмах
// Потолок дистанции инвалидации. Если структурный уровень дальше 6 дневных
// сигм (за 7 суток это движение с вероятностью ~2%), это уже не стоп, а
// пожелание: по такому уровню выйти невозможно. Тогда опоры рядом НЕТ,
// дистанция обрезается, и карточка честно об этом предупреждает. Без этого
// потолка вход в середине диапазона давал «БЕЗ ПЛЕЧА» — то есть далёкая
// опора трактовалась как огромный риск вместо отсутствия ориентира.
var INV_CAP_SD   = 6.0;
var SHOW_LEVS = [3, 4, 5];
var VOL_ABNORMAL = 2.0;   // vol7/vol90 -> потолок 3X
var VOL_HARD     = 0.02;  // 2%/ч      -> потолок 2X
var VOL_STOP     = 0.03;  // 3%/ч      -> плечо не выдаётся

var botData          = { analysis_data: [], generated_at: null };
var cachedMarketData = [];
var cachedFunding    = {};
var sliderInitialized = false;

var GIST_URL       = 'https://gist.githubusercontent.com/seahomebatumi-ai/3f50574a29bc37434c18cc8480779ccb/raw/coeffs.json';
var STALE_WARN_MIN = 75;
var STALE_CRIT_MIN = 130;

var tokens = [
    {name:'SUI',    s:'SUIUSDT'},   {name:'ONDO',   s:'ONDOUSDT'},
    {name:'LINK',   s:'LINKUSDT'},  {name:'RENDER', s:'RENDERUSDT'},
    {name:'NEAR',   s:'NEARUSDT'},  {name:'YFI',    s:'YFIUSDT'},
    {name:'AAVE',   s:'AAVEUSDT'},  {name:'AVAX',   s:'AVAXUSDT'},
    {name:'FET',    s:'FETUSDT'},   {name:'ENA',    s:'ENAUSDT'},
    {name:'TAO',    s:'TAOUSDT'},   {name:'GRAM',   s:'GRAMUSDT'},
    {name:'XRP',    s:'XRPUSDT'},   {name:'ADA',    s:'ADAUSDT'},
    {name:'TRX',    s:'TRXUSDT'},   {name:'SOL',    s:'SOLUSDT'},
    {name:'BCH',    s:'BCHUSDT'},   {name:'HYPE',   s:'HYPEUSDT', fut:true},
    {name:'SKY',    s:'SKYUSDT'},   {name:'ETH',    s:'ETHUSDT'},
    {name:'HBAR',   s:'HBARUSDT'},  {name:'XLM',    s:'XLMUSDT'},
    {name:'ALGO',   s:'ALGOUSDT'},  {name:'BNB',    s:'BNBUSDT'},
    // ZEC / UNI — спот-пары Binance есть, идут в ?symbols= штатно.
    // XMR — спот делистнут Binance (2024) => fut:true.
    // LIT — статус спот-пары не подтверждён => fut:true.
    // Правило: неподтверждённый символ НИКОГДА не кладём в спот-?symbols=
    // (HTTP 400 роняет ВЕСЬ спот-тикер на 1.2 МБ — инвариант 5).
    {name:'ZEC',    s:'ZECUSDT'},   {name:'UNI',    s:'UNIUSDT'},
    {name:'XMR',    s:'XMRUSDT', fut:true},
    {name:'LIT',    s:'LITUSDT', fut:true}
];

var useSymbolsParam = true;

function marketTickerUrl() {
    if (!useSymbolsParam) return 'https://api.binance.com/api/v3/ticker/24hr';
    var syms = ['BTCUSDT'];
    for (var i = 0; i < tokens.length; i++) {
        if (tokens[i].fut) continue;
        if (syms.indexOf(tokens[i].s) === -1) syms.push(tokens[i].s);
    }
    return 'https://api.binance.com/api/v3/ticker/24hr?symbols='
        + encodeURIComponent(JSON.stringify(syms));
}

var ORDER_KEY = 'cryptoEngineTokenOrder';

function applySavedOrder() {
    try {
        var saved = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
        if (!Array.isArray(saved) || !saved.length) return;
        var map = {};
        tokens.forEach(function(t) { map[t.name] = t; });
        var out = [];
        saved.forEach(function(n) { if (map[n]) { out.push(map[n]); delete map[n]; } });
        Object.keys(map).forEach(function(n) { out.push(map[n]); });
        tokens = out;
    } catch(e) {}
}

function saveOrder() {
    try {
        localStorage.setItem(ORDER_KEY, JSON.stringify(tokens.map(function(t){ return t.name; })));
    } catch(e) {}
}

    tokens.forEach(function(t) {
        if (!t.fut) return;
        fetch('https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=' + t.s)
            .then(function(res) {

                return res.json();

            })

function updateFreshnessDisplay() {
    var el = document.getElementById('last-update');
    if (!el) return;
    if (!botData.generated_at) {
        el.innerText   = 'Нет данных';
        el.style.color = 'var(--red)';
        return;
    }
    var genDate = new Date(botData.generated_at);
    var ageMin  = (Date.now() - genDate.getTime()) / 60000;
    var mins    = Math.max(0, Math.round(ageMin));
    if (ageMin > STALE_CRIT_MIN) {
        el.innerText   = '! Молчит ' + mins + ' мин';
        el.style.color = 'var(--red)';
    } else if (ageMin > STALE_WARN_MIN) {
        el.innerText   = 'Обновлено ' + mins + ' мин';
        el.style.color = 'var(--accent)';
    } else {
        el.innerText   = ageMin < 1 ? 'Обновлено сейчас' : 'Обновлено ' + mins + ' мин';
        el.style.color = '#888';
    }
}

function refreshMarketData(isRetry) {
    var logo = document.getElementById('btc-logo');
    var priceEl = document.getElementById('btc-cur');
    if (logo) logo.classList.add('loading');
    if (priceEl) priceEl.classList.add('loading');
    var wasSymbols = useSymbolsParam;
    fetch(marketTickerUrl())
        .then(function(res) {
            if (!res.ok) throw new Error('http ' + res.status);
            return res.json();
        })
        .then(function(data) {
            if (!data || typeof data.length !== 'number') throw new Error('bad ticker payload');
            cachedMarketData = data;
            if (!sliderInitialized && data.length > 0) {
                var btcObj = null;
                for (var i = 0; i < data.length; i++) {
                    if (data[i].symbol === 'BTCUSDT') { btcObj = data[i]; break; }
                }
                if (btcObj) {
                    document.getElementById('slider').value = Math.round(parseFloat(btcObj.lastPrice));
                    sliderInitialized = true;
                }
            }
            update();
        })
        .catch(function() {
            if (wasSymbols && !isRetry) {
                useSymbolsParam = false;
                refreshMarketData(true);
            }
        })
        .finally(function() {
            setTimeout(function() {
                if (logo) logo.classList.remove('loading');
                if (priceEl) priceEl.classList.remove('loading');
            }, 500);
        });
}

// ── Мелкие утилиты ──────────────────────────────────────────────────────────
function has(v) { return v !== null && v !== undefined && typeof v === 'number' && isFinite(v); }
function firstNum() {
    for (var i = 0; i < arguments.length; i++) if (has(arguments[i])) return arguments[i];
    return null;
}
function clamp01(x) { return Math.max(0, Math.min(1, x)); }
function fmtP(x) {
    if (!isFinite(x)) return '?';
    if (x >= 100) return '$' + x.toFixed(2);
    if (x >= 1)   return '$' + x.toFixed(4);
    return x < 0.000001 ? '&lt;0.000001' : '$' + x.toFixed(6);
}
// Число, попадающее в onclick-атрибут: без хвоста плавающей точки.
function numAttr(x) { return Math.round(x * 1e6) / 1e6; }
function pctTxt(x, digits) { return (x >= 0 ? '+' : '') + (x * 100).toFixed(digits === undefined ? 1 : digits) + '%'; }

// ── UI: перестановка карточек (только в режиме обзора) ─────────────────────
function move(idx, dir) {
    var n = idx + dir;
    if (n >= 0 && n < tokens.length) {
        var tmp = tokens[idx]; tokens[idx] = tokens[n]; tokens[n] = tmp;
        saveOrder();
        update();
    }
}

// ── Управление входом ───────────────────────────────────────────────────────
function entryOf(sym) { return entryState[sym] || null; }

function openEntry(sym, cur) {
    entryState[sym] = { open: true, price: cur };
    update();
}
function closeEntry(sym) { delete entryState[sym]; update(); }
function setEntry(sym, price) {
    if (!(price > 0)) return;
    entryState[sym] = { open: true, price: price };
    update();
}
function nudgeEntry(sym, mult) {
    var e = entryOf(sym); if (!e) return;
    setEntry(sym, e.price * mult);
}
// prompt() вместо <input>: карточки перерисовываются каждые 30 с по тикеру,
// поле ввода теряло бы фокус прямо во время набора.
function askEntry(sym) {

    var v = prompt('Цена входа для ' + sym, String(e.price));
    if (v === null) return;
    v = parseFloat(String(v).replace(',', '.'));
    if (isFinite(v) && v > 0) setEntry(sym, v);
}

// ── Математика риска ────────────────────────────────────────────────────────
function normCdf(x) {
    // Abramowitz-Stegun 7.1.26, точность ~1.5e-7
    var s = x < 0 ? -1 : 1, ax = Math.abs(x) / Math.sqrt(2);
    var t = 1 / (1 + 0.3275911 * ax);
    var y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t
                  - 0.284496736) * t + 0.254829592) * t * Math.exp(-ax * ax);
    return 0.5 * (1 + s * y);
}

function sigmaDay(vol) { return vol * Math.sqrt(24); }

function liqPrice(E, L, isLong) {
    return isLong ? E * (1 - 1 / L + LIQ_MMR) : E * (1 + 1 / L - LIQ_MMR);
}

// Вероятность КАСАНИЯ ликвидации за hours часов (без стопа, без долива).
function liqTouchProb(vol, L, isLong, hours) {
    if (!has(vol) || vol <= 0) return null;
    var d = 1 / L - LIQ_MMR;
    if (!(d > 0)) return 1;
    var b;
    if (isLong) { if (d >= 1) return 1; b = -Math.log(1 - d); }
    else        { b = Math.log(1 + d); }
    var q = vol * Math.sqrt(hours);
    if (!(q > 0)) return 0;
    return Math.max(0, Math.min(1, 2 * (1 - normCdf(b / q))));
}

// Потолок по СТРУКТУРЕ: ликвидация обязана лежать за уровнем инвалидации
// плюс запас на реакцию (движение за H_REACT часов с вероятностью 90%).
function lStruct(dist, vol) {
    var den = dist + RISK_Z * vol * Math.sqrt(H_REACT) + LIQ_MMR;
    return den > 0 ? 1 / den : null;
}

// Потолок по ШУМУ: 10% вероятности касания за 7 суток, если не выйти вовсе.
function lNoise(vol, isLong) {
    var q = RISK_Z * vol * Math.sqrt(H_NOISE);
    var need = isLong ? (1 - Math.exp(-q)) : (Math.exp(q) - 1);
    var den = need + LIQ_MMR;
    return den > 0 ? 1 / den : null;
}

// Бета для проверки обвала BTC. Для ЛОНГа опасно падение BTC (down-бета),
// для ШОРТа — рост (up-бета). 90д-окно предпочтительнее 14д: 2160 точек
// против 336. Хвостовая бета шумная (типичный R2 < 0.05, ошибка ±30%),
// поэтому она может только УЖЕСТОЧИТЬ проверку и только при R2 >= 0.10.
function advBeta(cd, isLong) {
    var base = isLong ? firstNum(cd.down_beta_90, cd.down_beta)
                      : firstNum(cd.up_beta_90,   cd.up_beta);
    if (base === null) return null;
    var b = Math.abs(base);
    if (has(cd.tail_beta) && has(cd.tail_r2) && cd.tail_r2 >= 0.10) {
        b = Math.max(b, Math.abs(cd.tail_beta));
    }
    return b;
}

// Потолок по ОБВАЛУ BTC: переживёт ли позиция движение BTC на 2 сигмы
// за те же 7 суток. Считается молча, срабатывает редко — только на монетах
// с бетой примерно от 2.
function lBtcCheck(beta, isLong, btcVol) {
    if (!has(beta) || !has(btcVol) || btcVol <= 0) return null;
    var D = 2 * btcVol * Math.sqrt(H_BTC);
    var r = isLong ? -D : D;
    var move = Math.abs(Math.pow(Math.max(1 + r, 1e-9), beta) - 1);
    var den = move + LIQ_MMR;
    return den > 0 ? 1 / den : null;
}

function volRegime(cd) {
    if (!has(cd.vol7) || !has(cd.volatility) || cd.volatility <= 0) return null;
    return cd.vol7 / cd.volatility;
}

// ── Уровень инвалидации ─────────────────────────────────────────────────────
// Опора — экстремум последних 30 дней (при их отсутствии в coeffs.json —
// 90-дневный, инвариант 9), сдвинутый на полсигмы за него. Пол 2 дневные
// сигмы обязателен: движение меньше двух сигм — это шум, а не поломка идеи,
// и утверждать, что выйдешь по нему, нельзя.
function invalidationInfo(cd, E, isLong) {
    var vol = cd.volatility;
    if (!has(vol) || vol <= 0 || !(E > 0)) return null;
    var sd  = sigmaDay(vol);
    var ref, src;
    if (isLong) {
        ref = firstNum(cd.min30, cd.min_price);
        src = has(cd.min30) ? 'мин30' : 'мин90';
        if (ref !== null && ref > E) { ref = E; src = 'вход'; }
    } else {
        ref = firstNum(cd.max30, cd.max_price);
        src = has(cd.max30) ? 'макс30' : 'макс90';
        if (ref !== null && ref < E) { ref = E; src = 'вход'; }
    }
    if (ref === null || !(ref > 0)) return null;
    var structPrice = isLong ? ref * (1 - 0.5 * sd) : ref * (1 + 0.5 * sd);
    var dStruct = isLong ? (E - structPrice) / E : (structPrice - E) / E;
    var floorD  = INV_FLOOR_SD * sd;
    var capD    = INV_CAP_SD * sd;
    var capped  = dStruct > capD;
    var dist    = Math.max(Math.min(dStruct, capD), floorD);
    var price   = isLong ? E * (1 - dist) : E * (1 + dist);
    return { dist: dist, price: price, dStruct: dStruct, capped: capped,
             floored: dist > dStruct + 1e-12, sd: sd, ref: ref, src: src };
}

// ── Решение по плечу ────────────────────────────────────────────────────────
function leverageDecision(cd, E, isLong, btcStats) {
    var out = { ok: false, L: null, msg: '', warn: [], parts: null, inv: null,
                binding: '', fix: '' };
    var vol = cd.volatility;
    if (!has(vol) || vol <= 0) { out.msg = 'Бот не дал волатильность'; return out; }
    if (vol >= VOL_STOP) {
        out.msg = 'Волатильность ' + (vol * 100).toFixed(2) + '%/ч — плечо не выдаётся';
        return out;
    }
    var inv = invalidationInfo(cd, E, isLong);
    if (!inv) { out.msg = 'Нет данных для уровня инвалидации'; return out; }
    out.inv = inv;

    var Ls = lStruct(inv.dist, vol);
    var Ln = lNoise(vol, isLong);
    var bA = advBeta(cd, isLong);
    var Lb = lBtcCheck(bA, isLong, btcStats ? btcStats.volatility : null);

    var cands = [{ n: 'структура', v: Ls }, { n: 'шум 7д', v: Ln }];
    if (Lb !== null) cands.push({ n: 'обвал BTC', v: Lb });
    var best = cands[0];
    for (var i = 1; i < cands.length; i++) if (cands[i].v < best.v) best = cands[i];
    out.parts = { struct: Ls, noise: Ln, btc: Lb };
    out.binding = best.n;

    var cap = L_CAP;
    var vr = volRegime(cd);
    if (vr !== null && vr > VOL_ABNORMAL) {
        cap = Math.min(cap, 3);
        out.warn.push('Волатильность за 7д выросла в ' + vr.toFixed(1) + '\u00D7 — потолок 3X');
    }
    if (vol >= VOL_HARD) {
        cap = Math.min(cap, 2);
        out.warn.push('Волатильность ' + (vol * 100).toFixed(2) + '%/ч — потолок 2X');
    }

    var L = Math.floor(Math.min(best.v, cap, L_CAP));
    if (L < L_MIN) {
        out.msg = 'БЕЗ БЕЗОПАСНОГО ПЛЕЧА';
        out.fix = fixHint(cd, E, isLong, best.n, vol, inv);
        return out;
    }
    out.ok = true;
    out.L  = L;
    return out;
}

// Что именно должно измениться, чтобы сетап стал торгуемым.
function fixHint(cd, E, isLong, binding, vol, inv) {
    if (binding === 'структура') {
        if (inv.capped) return 'Опоры рядом нет — вход не спасает, нужен ручной стоп.';
        var buf   = RISK_Z * vol * Math.sqrt(H_REACT);
        var need  = 1 / L_MIN - buf - LIQ_MMR;   // требуемая дистанция для 2X
        if (!(need > 0)) return 'Запас на реакцию уже съедает всё плечо — только спот.';
        var ref = inv.ref;
        var target = isLong ? ref * (1 - 0.5 * inv.sd) / (1 - need)
                            : ref * (1 + 0.5 * inv.sd) / (1 + need);
        if (!(target > 0) || !isFinite(target)) return 'Вход слишком далеко от структуры.';
        return 'Станет 2X при входе ' + (isLong ? 'от ' : 'до ') + fmtP(target) + '.';
    }
    if (binding === 'шум 7д') {
        var q  = -Math.log(1 - (1 / L_MIN - LIQ_MMR));
        var qs = Math.log(1 + (1 / L_MIN - LIQ_MMR));
        var needVol = (isLong ? q : qs) / (RISK_Z * Math.sqrt(H_NOISE));
        return 'Дело в волатильности монеты, вход не поможет: нужна Vol \u2264 '
             + (needVol * 100).toFixed(2) + '%/ч, сейчас ' + (vol * 100).toFixed(2) + '%/ч.';
    }
    return 'Монета слишком резко ходит за BTC — только спот или меньший размер.';
}

// ── Скоринг кандидатов ──────────────────────────────────────────────────────
// ВАЖНО: это инструмент СОРТИРОВКИ внимания («на какие три монеты смотреть
// первыми»), а НЕ сигнал входа. Веса — обоснованный приор, не результат
// бэктеста: исторических данных для проверки в системе пока нет.
function scoreCandidate(cd, sym, cur, p24, qv, isLong) {
    var vol = cd.volatility;
    if (!has(vol) || vol <= 0) return null;
    var mn = cd.min_price, mx = cd.max_price;
    if (!has(mn) || !has(mx) || !(mx > mn) || !(mn > 0) || !(cur > 0)) return null;

    var sd = sigmaDay(vol);
    var parts = [], ws = [], reasons = [];

    if (isLong) {
        // Главный принцип Босса: ближе к минимуму — выше. Меряется в ДНЕВНЫХ
        // СИГМАХ, а не в процентах: 5% над минимумом при sigma 2% — это далеко,
        // при sigma 8% — это фактически на минимуме.
        var dLow = Math.max(0, ((cur - mn) / cur) / sd);
        var pPos = Math.exp(-dLow / 3);
        parts.push(pPos); ws.push(0.50);
        reasons.push({ w: pPos * 0.50, s: dLow < 0.5
            ? 'на минимуме 90д'
            : '+' + ((cur / mn - 1) * 100).toFixed(1) + '% над мин90 (' + dLow.toFixed(1) + '\u03C3)' });
    } else {
        var run  = cur / mn - 1;
        var pRun = clamp01(run / 1.0);
        parts.push(pRun); ws.push(0.35);
        reasons.push({ w: pRun * 0.35, s: '+' + (run * 100).toFixed(0) + '% от мин90' });
        var dHigh = Math.max(0, ((mx - cur) / cur) / sd);
        var pHigh = Math.exp(-dHigh / 3);
        parts.push(pHigh); ws.push(0.20);
        reasons.push({ w: pHigh * 0.20, s: dHigh < 0.5
            ? 'у максимума 90д' : dHigh.toFixed(1) + '\u03C3 до макс90' });
    }

    // Разворот (ЛОНГ) / истощение (ШОРТ): идёт ли движение с прежним темпом.
    if (has(cd.r7) && has(cd.r30)) {
        var pace = cd.r30 * (7 / 30);
        var z    = (cd.r7 - pace) / (sd * Math.sqrt(7));
        var raw  = isLong ? z : -z;
        var pEx  = clamp01((Math.max(-1, Math.min(1, raw)) + 1) / 2);
        parts.push(pEx); ws.push(0.25);
        reasons.push({ w: pEx * 0.25, s: isLong
            ? (raw > 0.25 ? 'падение замедлилось' : (raw < -0.25 ? 'падение ускоряется' : 'темп падения ровный'))
            : (raw > 0.25 ? 'рост выдыхается'     : (raw < -0.25 ? 'рост ускоряется'    : 'темп роста ровный')) });
    }
    // Дивергенция оборота: цена растёт, а оборот ниже нормы — топливо кончается.
    if (!isLong && has(cd.vol_ratio) && has(cd.r7) && cd.r7 > 0 && cd.vol_ratio < 0.9) {
        reasons.push({ w: 0.01, s: 'оборот ниже нормы при росте' });
    }

    // Качество: ликвидность, ранг, стабильность волатильности.
    var qp = [], qw = [];
    if (has(qv) && qv > 0) { qp.push(clamp01(Math.log(qv / 1e6) / Math.log(100))); qw.push(0.4); }
    if (has(cd.rank))      { qp.push(clamp01(1 - (cd.rank - 1) / 150));            qw.push(0.3); }
    var vr = volRegime(cd);
    if (vr !== null)       { qp.push(clamp01(1 - (vr - 1) / 1.5));                 qw.push(0.3); }
    if (qp.length) {
        var qa = 0, qs2 = 0;
        for (var k = 0; k < qp.length; k++) { qa += qp[k] * qw[k]; qs2 += qw[k]; }
        parts.push(qa / qs2); ws.push(isLong ? 0.25 : 0.20);
    }

    var acc = 0, wsum = 0;
    for (var i = 0; i < parts.length; i++) { acc += parts[i] * ws[i]; wsum += ws[i]; }
    if (wsum <= 0) return null;
    var score = 100 * acc / wsum;

    // Штрафы — множители: один фатальный дефект обязан убивать кандидата,
    // а не вычитать из него несколько баллов.
    var mult = 1, flags = [];
    if (vr !== null && vr > VOL_ABNORMAL) { mult *= 0.5; flags.push('волатильность \u00D7' + vr.toFixed(1)); }
    if (has(cd.eff14)) {
        if (isLong && cd.eff14 < -0.6)  { mult *= 0.6; flags.push('падает прямой линией'); }
        if (!isLong && cd.eff14 > 0.6)  { mult *= 0.5; flags.push('тренд вверх не сломан'); }
    }
    if (isLong && has(cd.fdv_mc) && cd.fdv_mc > 3) {
        mult *= 0.7; flags.push('FDV ' + cd.fdv_mc.toFixed(1) + '\u00D7 — проверить разлоки');
    }
    if (isLong && has(cd.rank) && has(cd.rank_prev) && (cd.rank - cd.rank_prev) >= 5) {
        mult *= 0.8; flags.push('ранг падает');
    }
    if (has(p24)) {
        var m24 = (p24 / 100) / sd;
        if (isLong && m24 < -3)  { mult *= 0.6; flags.push(p24.toFixed(0) + '% за 24ч — нож ещё летит'); }
        if (!isLong && m24 > 3)  { mult *= 0.7; flags.push('+' + p24.toFixed(0) + '% за 24ч — вертикаль'); }
    }
    var fr = cachedFunding[sym];
    if (!isLong && has(fr) && fr > 0.0005) { mult *= 1.05; flags.push('лонги переполнены'); }

    score = Math.max(0, Math.min(100, score * mult));
    reasons.sort(function(a, b) { return b.w - a.w; });
    var top = [];
    for (var r = 0; r < reasons.length && top.length < 2; r++) top.push(reasons[r].s);
    for (var f = 0; f < flags.length && top.length < 4; f++) top.push(flags[f]);
    return { score: score, reasons: top };
}

function tierOf(s) {
    if (s >= 70) return { n: 'Сильный',   c: 'var(--green)' };
    if (s >= 50) return { n: 'Кандидат',  c: 'var(--accent)' };
    if (s >= 35) return { n: 'Наблюдать', c: 'var(--cyan)' };
    return { n: 'Слабый', c: '#888' };
}

// ── Блок входа (раскрытая карточка) ─────────────────────────────────────────
function entryBlock(cd, sym, pair, cur, isLong, btcStats) {
    var st = entryOf(sym);
    if (!st) return '';
    var E = st.price;
    var sideName  = isLong ? 'ЛОНГ' : 'ШОРТ';
    var sideColor = isLong ? 'var(--green)' : 'var(--red)';
    var dec = leverageDecision(cd, E, isLong, btcStats);

    var h = '<div class="ent">';

    // Строка 1 — ОТВЕТ.
    if (dec.ok) {
        h += '<div class="ent-head" style="color:' + sideColor + ';">'
           + sideName + ' \u00B7 ИТОГ ' + dec.L + 'X</div>';
    } else {
        h += '<div class="ent-head" style="color:var(--red);">'
           + sideName + ' \u00B7 ' + dec.msg + '</div>';
        if (dec.fix) h += '<div class="ent-sub" style="color:var(--accent);">' + dec.fix + '</div>';
    }

    // Вход и его подстройка.
    var q = isLong ? [['рынок',1],['\u22123%',0.97],['\u22125%',0.95],['\u221210%',0.90]]
                   : [['рынок',1],['+3%',1.03],['+5%',1.05],['+10%',1.10]];
    var qh = '';
    for (var i = 0; i < q.length; i++) {
        qh += '<button class="qbtn" onclick="setEntry(\'' + sym + '\',' + numAttr(cur * q[i][1]) + ')">'
            + q[i][0] + '</button>';
    }
    h += '<div class="ent-line">Вход <b>' + fmtP(E) + '</b> '
       + '<span class="ent-dim">(' + pctTxt(E / cur - 1, 1) + ' к рынку)</span></div>'
       + '<div class="qrow">' + qh
       + '<button class="qbtn" onclick="nudgeEntry(\'' + sym + '\',0.995)">\u2212</button>'
       + '<button class="qbtn" onclick="nudgeEntry(\'' + sym + '\',1.005)">+</button>'
       + '<button class="qbtn" onclick="askEntry(\'' + sym + '\')">\u270E</button>'
       + '</div>';

    if (dec.inv && dec.inv.src === 'вход') {
        dec.warn.push('Нет структуры ' + (isLong ? 'ниже' : 'выше')
                    + ' входа \u2014 размер задан только шумом, опоры для выхода нет');
    }
    if (dec.inv && dec.inv.capped) {
        dec.warn.push('Опора (' + dec.inv.src + ' ' + fmtP(dec.inv.ref) + ') дальше 6\u03C3 \u2014 '
                    + 'по ней стоп не поставить. Плечо ограничено искусственно, выход держи вручную');
    }
    if (dec.inv) {
        var invLbl = dec.inv.capped ? 'опоры рядом нет, взято 6\u03C3'
                   : (dec.inv.floored ? 'шумовой пол 2\u03C3'
                                      : dec.inv.src + ' ' + (isLong ? '\u2212' : '+') + '\u00BD\u03C3');
        h += '<div class="ent-line">Идея мертва при ' + fmtP(dec.inv.price)
           + ' <span class="ent-dim">(' + invLbl
           + ', ' + (dec.inv.dist * 100).toFixed(1) + '% от входа)</span></div>';
    }

    // Ликвидации: 3X / 4X / 5X плюс ИТОГ, если он вне этого набора.
    var levs = SHOW_LEVS.slice();
    if (dec.ok && levs.indexOf(dec.L) === -1) { levs.push(dec.L); levs.sort(function(a,b){return a-b;}); }
    var lh = '';
    for (var j = 0; j < levs.length; j++) {
        var L  = levs[j];
        var lp = liqPrice(E, L, isLong);
        var okL = dec.ok && L <= dec.L;
        lh += '<span class="liq-cell" style="color:' + (okL ? 'var(--green)' : 'var(--red)') + ';">'
            + L + 'X ' + fmtP(lp) + (okL ? ' \u2713' : ' \u2715') + '</span>';
    }
    h += '<div class="liq-row">' + lh + '</div>';

    // Причина одной фразой.
    if (dec.ok) {
        var liqL = liqPrice(E, dec.L, isLong);
        var gap  = isLong ? (dec.inv.price - liqL) / dec.inv.price
                          : (liqL - dec.inv.price) / dec.inv.price;
        h += '<div class="ent-why" style="color:var(--green);">' + dec.L
           + 'X приемлемо: ликвидация ' + fmtP(liqL) + ' на ' + (gap * 100).toFixed(1)
           + '% дальше уровня, где идея мертва.</div>';
        if (dec.L < 4) {
            h += '<div class="ent-why" style="color:var(--accent);">4X не рекомендуется: ограничитель \u2014 '
               + dec.binding + '.</div>';
        }
    }

    // Из чего получен ответ.
    if (dec.parts) {
        var pl = 'структура ' + (dec.parts.struct === null ? 'н/д' : dec.parts.struct.toFixed(1) + 'X')
               + ' \u00B7 шум 7д ' + (dec.parts.noise === null ? 'н/д' : dec.parts.noise.toFixed(1) + 'X');
        if (dec.parts.btc !== null) pl += ' \u00B7 обвал BTC ' + dec.parts.btc.toFixed(1) + 'X';
        pl += ' \u2192 ' + dec.binding;
        h += '<div class="ent-sub">' + pl + '</div>';
    }

    // Вероятность — одной понятной фразой, без шифра.
    var Lp = dec.ok ? dec.L : L_BASE;
    var p7 = liqTouchProb(cd.volatility, Lp, isLong, 168);
    if (p7 !== null) {
        var p14 = liqTouchProb(cd.volatility, Lp, isLong, 336);
        h += '<div class="ent-sub">Если держать ' + Lp
           + 'X без стопа и без долива маржи, шанс задеть ликвидацию: за 7 дней '
           + (p7 < 0.005 ? '&lt;1' : Math.round(p7 * 100)) + '%, за 14 дней '
           + (p14 < 0.005 ? '&lt;1' : Math.round(p14 * 100)) + '%.</div>';
    }

    // Funding как стоимость удержания. Ключ — ПАРА Binance (XMRUSDT),
    // а не имя монеты: cachedFunding заполняется из fapi по символам.
    var fr = cachedFunding[pair];
    if (has(fr)) {
        var payMe = isLong ? (fr < 0) : (fr > 0);
        var cost  = Math.abs(fr) * 21 * Lp * 100;
        h += '<div class="ent-sub" style="color:' + (payMe ? 'var(--green)' : 'var(--red)') + ';">'
           + 'Funding ' + (fr >= 0 ? '+' : '') + (fr * 100).toFixed(4) + '%/8ч \u2014 '
           + (payMe ? 'платят мне ' : 'плачу я ') + cost.toFixed(2) + '% маржи за 7 дней при ' + Lp + 'X</div>';
    }

    for (var w = 0; w < dec.warn.length; w++) {
        h += '<div class="ent-warn">\u26A0 ' + dec.warn[w] + '</div>';
    }

    h += '<button class="qbtn wide" onclick="closeEntry(\'' + sym + '\')">Свернуть</button>';
    h += '</div>';
    return h;
}

// ── Диагностический блок карточки (только при открытой диагностике) ────────
function diagBlock(cd, ratio, cur) {
    var rawBeta = ratio >= 0 ? cd.up_beta : cd.down_beta;
    var r2_14   = ratio >= 0 ? cd.up_r2   : cd.down_r2;
    var beta90  = ratio >= 0 ? cd.up_beta_90 : cd.down_beta_90;
    var r2_90   = ratio >= 0 ? cd.up_r2_90   : cd.down_r2_90;
    var h = '<div class="diag">';
    if (has(rawBeta)) {
        var beta   = rawBeta * STRESS_MULT[currentStress];
        var growth = Math.pow(Math.max(1 + ratio, 1e-9), beta);
        var pred   = Math.max(cur * growth, 1e-8);
        var r2Color = !has(r2_14) ? '#888' : (r2_14 < 0.30 ? 'var(--red)' : (r2_14 < 0.60 ? '#f3ba2f' : 'var(--green)'));
        h += '<div>b=' + rawBeta.toFixed(2)
           + ' / <span style="color:' + r2Color + ';">R2 ' + (has(r2_14) ? r2_14.toFixed(2) : 'н/д') + '</span>'
           + ' \u00B7 прогноз ' + fmtP(pred) + ' (' + pctTxt(growth - 1, 2) + ', ' + STRESS_NAME[currentStress] + ')</div>';
    } else {
        h += '<div style="color:#888;">Беты 14д нет — связь с BTC не измеряется</div>';
    }
    if (has(beta90)) {
        var r90c = !has(r2_90) ? '#888' : (r2_90 < 0.30 ? 'var(--red)' : (r2_90 < 0.60 ? '#f3ba2f' : 'var(--green)'));
        h += '<div>90д: b=' + beta90.toFixed(2)
           + ' / <span style="color:' + r90c + ';">R2 ' + (has(r2_90) ? r2_90.toFixed(2) : 'н/д') + '</span>'
           + (has(cd.corr_90) ? ' / \u03C1=' + cd.corr_90.toFixed(2) : '') + '</div>';
    }
    if (has(cd.tail_beta)) {
        h += '<div>хвост BTC: b=' + cd.tail_beta.toFixed(2)
           + (has(cd.tail_r2) ? ' / R2 ' + cd.tail_r2.toFixed(2) : '')
           + ' <span style="color:#666;">(оценка шумная, только ужесточает)</span></div>';
    }
    var bits = [];
    if (has(cd.r7))        bits.push('7д ' + pctTxt(cd.r7, 1));
    if (has(cd.r14))       bits.push('14д ' + pctTxt(cd.r14, 1));
    if (has(cd.r30))       bits.push('30д ' + pctTxt(cd.r30, 1));
    if (has(cd.eff14))     bits.push('эфф14 ' + cd.eff14.toFixed(2));
    var vr = volRegime(cd);
    if (vr !== null)       bits.push('vol7/90 ' + vr.toFixed(2));
    if (has(cd.vol_ratio)) bits.push('оборот \u00D7' + cd.vol_ratio.toFixed(2));
    if (bits.length) h += '<div>' + bits.join(' \u00B7 ') + '</div>';
    if (has(cd.min30) && has(cd.max30)) {
        h += '<div>30д: ' + fmtP(cd.min30) + ' \u2026 ' + fmtP(cd.max30) + '</div>';
    } else {
        h += '<div style="color:var(--accent);">Нет полей 30д — бот старой версии, инвалидация по 90д</div>';
    }
    h += '</div>';
    return h;
}

// ── Главный рендер ──────────────────────────────────────────────────────────
function update() {
    if (!cachedMarketData.length) return;
    var btcObj = null;
    for (var i = 0; i < cachedMarketData.length; i++) {
        if (cachedMarketData[i].symbol === 'BTCUSDT') { btcObj = cachedMarketData[i]; break; }
    }
    if (!btcObj) return;

    var btc    = parseFloat(btcObj.lastPrice);
    var btc24h = parseFloat(btcObj.priceChangePercent);
    var slider = document.getElementById('slider');
    var target = slider ? parseFloat(slider.value) : btc;
    if (!isFinite(target) || target <= 0) target = btc;
    var ratio  = (target - btc) / btc;

    if (slider) slider.style.accentColor = ratio > 0 ? 'var(--green)' : (ratio < 0 ? 'var(--red)' : 'var(--accent)');

    var elCur = document.getElementById('btc-cur');
    if (elCur) elCur.innerText = '$' + Math.round(btc).toLocaleString();

    var el24h = document.getElementById('btc-24h');
    if (el24h) {
        el24h.innerText   = (btc24h >= 0 ? '+' : '') + btc24h.toFixed(2) + '%';
        el24h.style.color = btc24h >= 0 ? 'var(--green)' : 'var(--red)';
    }

    var btcDirColor = ratio >= 0 ? 'var(--green)' : 'var(--red)';
    var elTarget = document.getElementById('btc-target');
    if (elTarget) {
        elTarget.innerText   = 'Прогноз BTC: $' + target.toLocaleString();
        elTarget.style.color = btcDirColor;
    }
    var elTargetArrow = document.getElementById('btc-target-arrow');
    if (elTargetArrow) {
        elTargetArrow.innerText   = ratio >= 0 ? '\u219F' : '\u21A1';
        elTargetArrow.style.color = btcDirColor;
    }
    var elPct = document.getElementById('btc-pct');
    if (elPct) {
        elPct.innerText   = (ratio >= 0 ? '+' : '') + (ratio * 100).toFixed(2) + '%';
        elPct.style.color = ratio > 0 ? 'var(--green)' : (ratio < 0 ? 'var(--red)' : '#ffffff');
    }
    var dirEl = document.getElementById('dir-indicator');
    if (dirEl) {
        if (ratio > 0.005)       { dirEl.innerText = 'BTC ВВЕРХ'; dirEl.style.color = 'var(--green)'; }
        else if (ratio < -0.005) { dirEl.innerText = 'BTC ВНИЗ';  dirEl.style.color = 'var(--red)'; }
        else                     { dirEl.innerText = '--';        dirEl.style.color = '#888'; }
    }
    var btnM = document.getElementById('btn-minus');
    var btnP = document.getElementById('btn-plus');
    if (btnM && btnP) {
        if (ratio < -0.005) {
            btnM.style.color='var(--red)';   btnM.style.borderColor='var(--red)';
            btnP.style.color='#444';         btnP.style.borderColor='#444';
        } else if (ratio > 0.005) {
            btnP.style.color='var(--green)'; btnP.style.borderColor='var(--green)';
            btnM.style.color='#444';         btnM.style.borderColor='#444';
        } else {
            btnM.style.color='#777'; btnM.style.borderColor='#555';
            btnP.style.color='#777'; btnP.style.borderColor='#555';
        }
    }

    // Диапазон BTC 90д — данные бота, старый coeffs.json переживается (инв. 9).
    var btcStats = botData.btc || null;
    var brEl = document.getElementById('btc-range');
    if (brEl) {
        if (btcStats && btcStats.max_price > btcStats.min_price) {
            var bPos = Math.max(0, Math.min(100, (btc - btcStats.min_price) / (btcStats.max_price - btcStats.min_price) * 100));
            var bMinCls = bPos <= 25 ? 'light-blink' : '';
            var bMinCol = bPos <= 25 ? 'var(--red)' : 'var(--accent)';
            var bMaxCls = bPos >= 75 ? 'light-blink' : '';
            var bMaxCol = bPos >= 75 ? 'var(--green)' : 'var(--accent)';
            brEl.innerHTML = 'Min: <span class="' + bMinCls + '" style="color:' + bMinCol + ';">$'
                + Math.round(btcStats.min_price).toLocaleString() + '</span>'
                + ' | <span style="color:#fff;font-size:1.05em;font-weight:bold;font-family:monospace;margin:0 4px;">'
                + bPos.toFixed(0) + '%</span> | '
                + 'Max: <span class="' + bMaxCls + '" style="color:' + bMaxCol + ';">$'
                + Math.round(btcStats.max_price).toLocaleString() + '</span>'
                + ' <span style="color:#666;font-size:0.8em;font-style:normal;">90д</span>';
        } else {
            brEl.innerHTML = '<span style="color:#666;">Диапазон BTC 90д: нет данных бота</span>';
        }
    }

    var isLong = currentSide === 'long';
    var sideOn = currentSide !== 'none';

    // --- Сбор строк ---
    var rows = [];
    tokens.forEach(function(t, idx) {
        var coin = null;
        if (t.fut) {
            coin = cachedFutTickers[t.s] || null;
        } else {
            for (var j = 0; j < cachedMarketData.length; j++) {
                if (cachedMarketData[j].symbol === t.s) { coin = cachedMarketData[j]; break; }
            }
        }
        var row = { t: t, idx: idx, coin: coin, cd: null, state: 'ok', sc: null };
        if (!coin) { row.state = 'nopair'; rows.push(row); return; }

        var trades24 = parseFloat(coin.count);
        var bidP     = parseFloat(coin.bidPrice);
        var askP     = parseFloat(coin.askPrice);
        if (trades24 === 0 || (bidP === 0 && askP === 0)) { row.state = 'dead'; rows.push(row); return; }

        if (botData.analysis_data) {
            for (var k = 0; k < botData.analysis_data.length; k++) {
                if (botData.analysis_data[k].symbol === t.name) { row.cd = botData.analysis_data[k]; break; }
            }
        }
        if (!row.cd || row.cd.error) { row.state = 'nodata'; rows.push(row); return; }

        if (sideOn) {
            row.sc = scoreCandidate(row.cd, t.s, parseFloat(coin.lastPrice),
                                    parseFloat(coin.priceChangePercent),
                                    parseFloat(coin.quoteVolume), isLong);
        }
        rows.push(row);
    });

    // Сортировка по силе кандидата. Проблемные карточки уходят вниз.
    if (sideOn) {
        rows.sort(function(a, b) {
            var ga = (a.sc && has(a.sc.score)) ? a.sc.score : -1;
            var gb = (b.sc && has(b.sc.score)) ? b.sc.score : -1;
            if (Math.abs(gb - ga) > 0.05) return gb - ga;
            var ra = (a.cd && has(a.cd.rank)) ? a.cd.rank : 9999;
            var rb = (b.cd && has(b.cd.rank)) ? b.cd.rank : 9999;
            if (ra !== rb) return ra - rb;
            var va = (a.cd && has(a.cd.volatility)) ? a.cd.volatility : 9;
            var vb = (b.cd && has(b.cd.volatility)) ? b.cd.volatility : 9;
            return va - vb;
        });
    }

    var stressBadge = STRESS_BADGE[currentStress];
    var badgeColor  = currentStress === 'panic' ? 'var(--accent)' : 'var(--red)';
    var html = '';

    rows.forEach(function(row, pos) {
        var t = row.t;
        if (row.state === 'nopair') {
            html += '<div class="no-data-card">'
                + '<div class="token-name">' + t.name + ' <span style="color:var(--red);font-size:0.7em;">НЕТ ПАРЫ</span></div>'
                + '<div style="font-size:0.85em;color:#888;margin-top:4px;">' + t.s + ' отсутствует в тикере Binance &mdash; делистинг или смена тикера</div>'
                + '</div>';
            return;
        }
        if (row.state === 'dead') {
            var frozenP = parseFloat(row.coin.lastPrice);
            html += '<div class="no-data-card">'
                + '<div class="token-name">' + t.name + ' <span class="light-blink" style="color:var(--red);font-size:0.7em;">ТОРГИ ОСТАНОВЛЕНЫ</span></div>'
                + '<div style="font-size:0.85em;color:#888;margin-top:4px;">Цена заморожена: $' + (isFinite(frozenP) ? frozenP.toFixed(4) : '?')
                + ' &mdash; расчёты отключены (0 сделок / пустой стакан). Возможна миграция тикера.</div>'
                + '</div>';
            return;
        }
        if (row.state === 'nodata') {
            html += '<div class="no-data-card">'
                + '<div class="token-name">' + t.name + ' <span style="color:var(--red);font-size:0.7em;">НЕТ ДАННЫХ</span></div>'
                + '<div style="font-size:0.85em;color:#888;margin-top:4px;">Бот не дал валидных метрик</div>'
                + '</div>';
            return;
        }

        var cd   = row.cd;
        var coin = row.coin;
        var cur  = parseFloat(coin.lastPrice);
        var p24  = parseFloat(coin.priceChangePercent);
        var minP = cd.min_price, maxP = cd.max_price;

        var srcMismatch = has(maxP) && maxP > 0
            && (cur > maxP * 1.5 || cur < minP * 0.5);
        var mismatchHtml = srcMismatch
            ? '<div style="color:#f3ba2f;font-weight:600;font-size:0.75em;margin:2px 0;">&#9888; Расхождение источников: цена вне 90д-диапазона бота &mdash; проверь пару/ID</div>'
            : '';

        var dynPos = (has(minP) && has(maxP) && (maxP - minP) > 0)
            ? Math.max(0, Math.min(100, ((cur - minP) / (maxP - minP)) * 100)) : 0;

        // Бейдж ранга + FDV.
        var badgeInner = '';
        if (has(cd.rank)) {
            var rPrev = cd.rank_prev, rColor = '#ccc', rArrow = '';
            if (has(rPrev) && rPrev !== cd.rank) {
                var rDelta = rPrev - cd.rank;
                if (rDelta > 0) { rColor = 'var(--green)'; rArrow = '\u2191' + rDelta; }
                else            { rColor = 'var(--red)';   rArrow = '\u2193' + (-rDelta); }
            }
            badgeInner += '<span style="color:' + rColor + ';">#' + cd.rank + rArrow + '</span>';
        }
        if (has(cd.fdv_mc)) {
            var fColor = cd.fdv_mc > 3 ? 'var(--red)' : (cd.fdv_mc >= 1.5 ? 'var(--accent)' : '#888');
            badgeInner += '<span style="color:' + fColor + ';margin-left:6px;">FDV '
                + cd.fdv_mc.toFixed(1) + '\u00D7</span>';
        }
        if (sideOn && row.sc) {
            var tier = tierOf(row.sc.score);
            badgeInner += '<span style="color:' + tier.c + ';margin-left:8px;font-weight:800;">#'
                + (pos + 1) + ' ' + tier.n + ' ' + Math.round(row.sc.score) + '</span>';
        }
        var rankHtml = badgeInner ? '<div class="rank-badge">' + badgeInner + '</div>' : '';

        var badgeHtml = (advOpen && stressBadge)
            ? '<span style="font-size:0.6em;color:' + badgeColor + ';font-weight:bold;margin-left:5px;">' + stressBadge + '</span>'
            : '';

        var p24hColor = p24 >= 0 ? 'var(--green)' : 'var(--red)';
        var volPct    = has(cd.volatility) ? cd.volatility * 100 : null;
        var volColor  = volPct === null ? '#888'
            : (volPct > 1.5 ? 'var(--lilac)' : (volPct > 1.0 ? 'var(--cyan)' : '#888'));

        var minClass = dynPos <= 25 ? 'light-blink' : '';
        var minColor = dynPos <= 25 ? 'var(--red)' : 'var(--accent)';
        var maxClass = dynPos >= 75 ? 'light-blink' : '';
        var maxColor = dynPos >= 75 ? 'var(--green)' : 'var(--accent)';

        var dynPosRounded = Math.round(dynPos);
        var edgeClass = '';
        if (dynPosRounded <= 1)       edgeClass = ' edge-min';
        else if (dynPosRounded >= 99) edgeClass = ' edge-max';

        // Строка расстояний — прямое кодирование правил отбора Босса.
        var distHtml = '';
        if (has(minP) && has(maxP) && minP > 0 && maxP > 0) {
            var upFromMin = (cur / minP - 1) * 100;
            var dnFromMax = (cur / maxP - 1) * 100;
            var upColor = upFromMin >= 60 ? 'var(--red)' : (upFromMin <= 10 ? 'var(--green)' : '#aaa');
            var dnColor = dnFromMax <= -40 ? 'var(--green)' : (dnFromMax >= -10 ? 'var(--red)' : '#aaa');
            distHtml = '<div class="dist-line">'
                + 'от мин90 <span style="color:' + upColor + ';font-weight:700;">+' + upFromMin.toFixed(1) + '%</span>'
                + ' \u00B7 до макс90 <span style="color:' + dnColor + ';font-weight:700;">' + dnFromMax.toFixed(1) + '%</span>'
                + (volPct === null ? '' : ' \u00B7 <span style="color:' + volColor + ';">Vol ' + volPct.toFixed(2) + '%</span>')
                + '</div>';
        }

        var reasonHtml = '';
        if (sideOn && row.sc && row.sc.reasons.length) {
            reasonHtml = '<div class="reason-line">' + row.sc.reasons.join(' \u00B7 ') + '</div>';
        }

        var entryHtml = '';
        if (sideOn) {
            entryHtml = entryOf(t.name)
                ? entryBlock(cd, t.name, t.s, cur, isLong, btcStats)
                : '<button class="qbtn wide" onclick="openEntry(\'' + t.name + '\',' + numAttr(cur) + ')">Разобрать вход \u2192</button>';
        }

        html += '<div class="card' + edgeClass + '" style="border-left:4px solid ' + p24hColor + ';">'
            + rankHtml
            + '<div class="row">'
            +   '<span class="token-name">' + t.name + badgeHtml
            +     ' <span class="pct-24h" style="color:' + p24hColor + ';">'
            +       (p24 > 0 ? '+' : '') + p24.toFixed(2) + '%</span>'
            +   '</span>'
            +   '<div style="text-align:right;"><div style="font-weight:700;">' + fmtP(cur) + '</div></div>'
            + '</div>'
            + mismatchHtml
            + distHtml
            + '<div class="extra-data">'
            +   'Min: <span class="' + minClass + '" style="color:' + minColor + ';">' + fmtP(minP) + '</span>'
            +   ' | <span style="color:#fff;font-size:1.1em;font-weight:bold;font-family:monospace;margin:0 4px;">'
            +     dynPos.toFixed(0) + '%</span> | '
            +   'Max: <span class="' + maxClass + '" style="color:' + maxColor + ';">' + fmtP(maxP) + '</span>'
            + '</div>'
            + reasonHtml
            + entryHtml
            + (advOpen ? diagBlock(cd, ratio, cur) : '')
            + (sideOn ? '' :
                 '<div class="nav-row">'
               + '<button class="nav-btn" onclick="move(' + row.idx + ',-1)">&#8593;</button>'
               + '<button class="nav-btn" onclick="move(' + row.idx + ',1)" style="margin-left:5px;">&#8595;</button>'
               + '</div>')
            + '</div>';
    });

    var resultsEl = document.getElementById('results');
    if (resultsEl) resultsEl.innerHTML = html;
}

function init() {
    applySavedOrder();
    renderButtons();
    var ab = document.getElementById('adv-btn');
    if (ab) ab.addEventListener('click', toggleAdv);
    fetchBotData();
    refreshMarketData();
    refreshFuturesTickers();
    fetchFundingRates();
    setInterval(refreshMarketData,     30000);
    setInterval(refreshFuturesTickers, 30000);
    setInterval(fetchBotData,         300000);
    setInterval(fetchFundingRates,    300000);
    setInterval(updateFreshnessDisplay, 30000);
}

document.getElementById('slider').oninput = update;

// Кнопки точной настройки цены
// Шаг $500 — достаточно мелко для точного прицеливания,
// достаточно крупно чтобы за 1-2 нажатия перейти на нужный уровень.
var STEP_BTN = 500;

document.getElementById('btn-minus').addEventListener('click', function() {
    var s   = document.getElementById('slider');
    var val = parseInt(s.value, 10) - STEP_BTN;
    if (val < parseInt(s.min, 10)) val = parseInt(s.min, 10);
    s.value = val;
    update();
});

document.getElementById('btn-plus').addEventListener('click', function() {
    var s   = document.getElementById('slider');
    var val = parseInt(s.value, 10) + STEP_BTN;
    if (val > parseInt(s.max, 10)) val = parseInt(s.max, 10);
    s.value = val;
    update();
});

// Удержание кнопки: автоповтор через 400мс с интервалом 100мс
function setupHold(btnId, delta) {
    var btn = document.getElementById(btnId);
    var timer = null;
    var interval = null;
    btn.addEventListener('mousedown',  startHold);
    btn.addEventListener('touchstart', startHold, {passive:true});
    btn.addEventListener('mouseup',    stopHold);
    btn.addEventListener('mouseleave', stopHold);
    btn.addEventListener('touchend',   stopHold);
    function startHold(e) {
        timer = setTimeout(function() {
            interval = setInterval(function() {
                var s   = document.getElementById('slider');
                var val = parseInt(s.value, 10) + delta;
                if (val < parseInt(s.min,10)) val = parseInt(s.min,10);
                if (val > parseInt(s.max,10)) val = parseInt(s.max,10);
                s.value = val;
                update();
            }, 100);
        }, 400);
    }
    function stopHold() {
        clearTimeout(timer);
        clearInterval(interval);
        timer = null; interval = null;
    }
}
setupHold('btn-minus', -STEP_BTN);
setupHold('btn-plus',  +STEP_BTN);

init();
</script>
</body>
</html>
