<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="image.PNG">
    <title>Pro Crypto Toll</title>
    <style>
        :root {
            --bg: #0f0f12; --card: #1a1a20; --accent: #f3ba2f;
            --lilac: #bf5af2; --cyan: #0ad1c8; --red: #ff453a;
            --green: #30d158; --text: #ffffff;
            /* Оранжевый — СОСТОЯНИЕ входа (ЖДАТЬ), не тир счёта. */
            --orange: #ff9f0a;
        }
        body {
            background-color: var(--bg); color: var(--text);
            font-family: -apple-system, sans-serif; margin: 0;
            padding-top: calc(env(safe-area-inset-top) + 10px);
            padding-left: 10px; padding-right: 10px;
            padding-bottom: calc(env(safe-area-inset-bottom) + 10px);
        }
        .control {
            background: var(--card); padding: 15px; border-radius: 16px;
            border: 1px solid #333; margin-bottom: 15px;
        }
        .btc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        @keyframes rainbow { 0%{filter:hue-rotate(0deg)} 100%{filter:hue-rotate(360deg)} }
        .btc-logo { font-size: 2.4em; color: var(--accent); font-weight: bold; transition: 0.3s; }
        .btc-logo.loading { animation: rainbow 1s linear infinite; }
        @keyframes priceRainbow {
            0%   { color: #f3ba2f; }
            20%  { color: #30d158; }
            40%  { color: #0ad1c8; }
            60%  { color: #bf5af2; }
            80%  { color: #ff453a; }
            100% { color: #f3ba2f; }
        }
        .btc-price.loading { animation: priceRainbow 1.2s linear infinite; }
        .btc-price { color: var(--text); font-size: 1.6em; font-weight: 800; }
        .card {
            background: var(--card); padding: 14px; border-radius: 12px;
            margin-bottom: 8px; border: 1px solid #333; position: relative;
        }
        /* Бегущая линия по контуру при достижении краёв диапазона (1% / 99%) */
        .card.edge-min, .card.edge-max {
            border: 1px solid transparent;
            background-clip: padding-box;
        }
        .card.edge-min::before, .card.edge-max::before {
            content: ''; position: absolute; inset: 0;
            border-radius: 12px; padding: 2px;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            pointer-events: none;
        }
        @keyframes runBorderRed {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        @keyframes runBorderGreen {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .card.edge-min::before {
            background: linear-gradient(90deg, rgba(255,69,58,0) 0%, rgba(255,69,58,1) 25%, rgba(255,255,255,0.9) 50%, rgba(255,69,58,1) 75%, rgba(255,69,58,0) 100%);
            background-size: 200% 100%;
            animation: runBorderRed 1.5s linear infinite;
        }
        .card.edge-max::before {
            background: linear-gradient(90deg, rgba(48,209,88,0) 0%, rgba(48,209,88,1) 25%, rgba(255,255,255,0.9) 50%, rgba(48,209,88,1) 75%, rgba(48,209,88,0) 100%);
            background-size: 200% 100%;
            animation: runBorderGreen 1.5s linear infinite;
        }
        .no-data-card {
            background: var(--card); padding: 14px; border-radius: 12px;
            margin-bottom: 8px; border: 1px solid #333; border-left: 4px solid var(--red);
        }
        .token-name { font-size: 1.2em; font-weight: 800; color: var(--lilac); }
        /* Имя монеты — кнопка входа в доску. Аффорданс минимальный: шеврон. */
        .token-name.tap { cursor: pointer; }
        .token-name.tap:active { opacity: 0.6; }
        .tap-mark { font-size: 0.62em; margin-left: 4px; opacity: 0.65; vertical-align: 1px; }
        /* Диапазон 90д — строго одна строка, без переносов и наездов на
           абсолютный правый столбец карточки (прогноз/цена/Vol). */
        .range-line {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            padding-right: 98px; letter-spacing: -0.01em;
        }
        /* В ОБЗОРЕ справа только стрелки перестановки (~54px), поэтому полная
           подписанная строка Min/Max помещается без переноса. */
        .range-line.ov { padding-right: 62px; font-size: 0.92em; }
        /* FDV в свободном правом нижнем углу карточки (ЛОНГ/ШОРТ). */
        .fdv-abs {
            position: absolute; bottom: 4px; right: 0;
            font-size: 0.76em; font-weight: 700; font-style: italic;
            letter-spacing: 0.01em; white-space: nowrap; pointer-events: none;
        }
        /* Свёрнутые монеты вне сценария */
        .off-strip {
            margin: 6px 0 8px; padding: 12px 14px; cursor: pointer;
            border: 1px dashed #43434f; border-radius: 12px;
            background: linear-gradient(180deg, #191920 0%, #131318 100%);
            font-size: 0.82em; color: #a0a0ae; line-height: 1.4;
        }
        .off-cnt { color: var(--accent); font-weight: 900; font-size: 1.15em; }
        .off-names { color: #82828f; font-size: 0.88em; margin-top: 6px; line-height: 1.55;
                     word-break: break-word; letter-spacing: 0.02em; }
        .off-act {
            color: var(--cyan); font-weight: 800; font-size: 0.85em;
            letter-spacing: 0.1em; margin-top: 6px;
        }
        .row { display: flex; justify-content: space-between; align-items: center; }
        #slider { width: 100%; margin: 10px 0; transition: accent-color 0.3s ease; }
        .lev-container {
            display: grid; grid-template-columns: repeat(6,1fr);
            gap: 4px; margin-bottom: 6px;
        }
        .lev-btn {
            background: #2c2c31; border: none; color: white;
            padding: 8px 0; border-radius: 6px; font-size: 12px; cursor: pointer;
        }
        .lev-btn.active { background: var(--accent); color: #000; font-weight: bold; }
        .stress-container { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; }
        .stress-btn {
            border: none; color: #aaa; padding: 7px 0; border-radius: 6px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            background: #2c2c31; transition: all 0.2s;
        }
        .stress-btn.s-normal { color: #000; background: var(--green); }
        .stress-btn.s-panic  { color: #000; background: var(--accent); }
        .stress-btn.s-crash  { color: #fff; background: var(--red); }
        .side-btn {
            border: none; color: #aaa; padding: 8px 0; border-radius: 6px;
            font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
            cursor: pointer; background: #2c2c31; transition: all 0.2s;
        }
        .side-btn.a-long  { color: #000; background: var(--green); }
        .side-btn.a-short { color: #fff; background: var(--red); }
        .nav-btn {
            background: #444; border: none; color: #fff;
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        .pct-24h { font-size: 0.6em; font-weight: bold; }
        @keyframes blink { 0%{opacity:1} 50%{opacity:0.2} 100%{opacity:1} }
        .blink-text { animation: blink 1s linear infinite; font-weight: 900; }
        @keyframes lightBlink { 0%{opacity:1} 50%{opacity:0.5} 100%{opacity:1} }
        .light-blink { animation: lightBlink 1.5s ease-in-out infinite; }
        .extra-data { font-size: 0.85em; color: var(--accent); margin-top: 8px; font-style: italic; }
        /* Диапазон BTC 90д — занимает строку, освобождённую штампом обновления */
        .btc-range { font-size: 0.8em; color: var(--accent); font-style: italic; margin-bottom: 10px; }
        /* Компактный штамп свежести данных бота в правом верхнем углу */
        .upd-stamp { font-size: 0.62em; line-height: 1; white-space: nowrap; color: #888; }
        /* Ранг/FDV/тир — левый верхний угол, вне потока (как было).
           Абсолютные элементы карточки считаются от .card-main, а не от
           .card: блок входа растёт ВНИЗ и не сдвигает прогноз/Vol/стрелки. */
        .card-main { position: relative; min-height: 160px; }
        .rank-badge {
            position: absolute; top: 0; left: 0;
            font-size: 0.74em; font-weight: 700; line-height: 1;
            letter-spacing: 0.02em; pointer-events: none;
        }
        .vol-value {
            position: absolute; bottom: 42px; right: 0;
            font-size: 0.9em; font-weight: bold; font-style: italic;
        }
        .pred-pct  { position: absolute; bottom: 90px; right: 0; font-size: 0.9em; font-weight: bold; font-style: italic; }
        .pred-val  { position: absolute; bottom: 66px; right: 0; font-size: 0.9em; font-weight: bold; font-style: italic; }
        .nav-abs   { position: absolute; bottom: 10px; right: 0; }
        .side3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; margin-bottom: 6px; }
        .side-btn.a-none { color: #000; background: #c7c7cc; }
        .reason-line { font-size: 0.76em; color: var(--cyan); margin: 3px 0 5px;
                       line-height: 1.35; padding-right: 84px; }
        .qbtn {
            background: #26262c; border: 1px solid #3d3d47; color: #d0d0d8;
            padding: 7px 10px; border-radius: 8px; font-size: 11px;
            font-weight: 700; cursor: pointer; margin-right: 5px; margin-top: 5px;
            letter-spacing: 0.02em;
        }
        .qbtn:active { background: #33333b; }
        .qbtn.wide {
            width: 100%; margin-right: 0; padding: 11px 6px; box-sizing: border-box;
            font-size: 12px; letter-spacing: 0.06em;
        }
        .qbtn.call {
            background: transparent; border: 1px solid var(--accent);
            color: var(--accent); font-weight: 800;
        }
        /* Тир кандидата — по центру верха карточки, вне потока (высота карточки
           не меняется). Слева ранг/FDV, справа цена — пересечений нет. */
        .tier-badge {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            font-size: 0.74em; font-weight: 800; line-height: 1;
            letter-spacing: 0.02em; white-space: nowrap; pointer-events: none;
        }
        /* Кнопка вызова доски */
        /* Мягкий золотой пульс — единственный анимированный акцент на карточке.
           2.9 с, без резких скачков яркости: премиальный, не мигалка. */
        @keyframes goldPulse {
            0%   { color: #d9a52f; border-color: rgba(243,186,47,0.38);
                   box-shadow: 0 0 0 rgba(243,186,47,0); }
            50%  { color: #ffd97a; border-color: rgba(243,186,47,0.95);
                   box-shadow: 0 0 20px rgba(243,186,47,0.20), inset 0 0 14px rgba(243,186,47,0.07); }
            100% { color: #d9a52f; border-color: rgba(243,186,47,0.38);
                   box-shadow: 0 0 0 rgba(243,186,47,0); }
        }
        .qbtn.call {
            background: linear-gradient(180deg, rgba(243,186,47,0.14), rgba(243,186,47,0.04));
            border: 1px solid rgba(243,186,47,0.55); color: var(--accent);
            font-weight: 900; letter-spacing: 0.14em;
            animation: goldPulse 2.9s ease-in-out infinite;
        }

        /* ─────────── ДОСКА CRYPTO FUTURE (полный экран) ─────────── */
        #board {
            position: fixed; inset: 0; z-index: 5000; display: none;
            background:
              radial-gradient(90% 55% at 50% 0%, rgba(243,186,47,0.07) 0%, rgba(0,0,0,0) 70%),
              var(--bg);
            overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding-bottom: calc(env(safe-area-inset-bottom) + 28px);
        }
        .bd-top {
            position: sticky; top: 0; z-index: 3; text-align: center;
            padding: calc(env(safe-area-inset-top) + 12px) 54px 12px;
            background: rgba(15,15,18,0.93);
            -webkit-backdrop-filter: saturate(140%) blur(14px);
            backdrop-filter: saturate(140%) blur(14px);
            border-bottom: 1px solid #24242c;
        }
        .bd-title { font-size: 1.02em; font-weight: 900; letter-spacing: 0.14em; }
        .bd-sub   { font-size: 0.64em; color: #9296a4; letter-spacing: 0.1em; margin-top: 3px; }
        .bd-x {
            position: absolute; left: 12px; top: calc(env(safe-area-inset-top) + 8px);
            width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
            background: #23232b; border: 1px solid #3a3a46; color: #d6d6de;
            font-size: 17px; font-weight: 700; line-height: 1; padding: 0;
        }
        .bd-wrap { padding: 0 12px; }
        /* ─── Металл на рамках доски (10.08) ───────────────────────────────
           Кольцо рисуется ВТОРЫМ слоем фона с background-clip: border-box —
           заливка блока клипуется по padding-box, металл по border-box, в
           щель шириной border и попадает градиент. Так скругления живут
           точно (border-image их ломает), а новых узлов, псевдоэлементов и
           масок не появляется вовсе — на доске, которая целиком
           перерисовывается каждые 30 с, это принципиально.

           ВЫКЛЮЧАТЕЛЬ — :not([style]). Инлайновый style на .bd-sec стоит
           ровно у двух блоков — тревог «СТОРОНА ПРОТИВ СТРУКТУРЫ» (красная)
           и «ВНИМАНИЕ» (янтарная). У них цвет рамки НЕСЁТ СМЫСЛ, металл его
           бы размыл. Читается как «блок без собственного цвета рамки».
           Ловушка: любая новая инлайновая правка стиля на .bd-sec погасит
           на нём металл. Нужен инлайн без потери металла -> вешать класс.

           Блики почти белые намеренно: на 1px при DPR 3 мягкий градиент
           сливается в одну серую линию — «еле заметно». Металл читается
           только внутренним контрастом бликов и провалов. */
        .bd-sec {
            margin-top: 11px; padding: 13px 14px 14px;
            border: 1px solid #2a2a33; border-radius: 15px;
            background: linear-gradient(180deg, #1c1c23 0%, #141419 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.045);
        }
        .bd-sec:not([style]) {
            border-color: transparent;
            background:
              linear-gradient(180deg, #1c1c23 0%, #141419 100%) padding-box,
              linear-gradient(148deg,
                #eef2fa 0%, #97a0b1 9%, #454a55 23%, #2b2e36 37%,
                #b3bccd 51%, #33373f 65%, #7a8394 82%, #e8edf7 100%) border-box;
            box-shadow: inset 0 1px 0 rgba(232,239,250,0.10),
                        inset 0 -1px 0 rgba(0,0,0,0.42);
        }
        /* Заголовок любого блока — по центру (правка Босса 09.08). Единый
           принцип выравнивания, заданный блоком «ДИАПАЗОН 90 ДНЕЙ». */
        .bd-h {
            font-size: 0.63em; font-weight: 900; letter-spacing: 0.2em;
            color: #8f8fa0; text-transform: uppercase; margin-bottom: 11px;
            text-align: center;
        }
        /* Герой тоже центрируется: он и есть главный информационный блок. */
        .bd-vlabel, .bd-vnum, .bd-vstop, .bd-vwhy { text-align: center; }
        /* Герой-вердикт. Тот же металл, что у секций; радиус 18px, поэтому
           кольцо задаётся отдельно, а не общим селектором. Инлайнового style
           у героя нет никогда — он несёт классы s-pass / s-stop. */
        .bd-hero {
            position: relative; overflow: hidden; margin-top: 11px;
            border-radius: 18px; padding: 15px 15px 13px;
            border: 1px solid transparent;
            background:
              linear-gradient(180deg, #1f1f28 0%, #131318 100%) padding-box,
              linear-gradient(148deg,
                #eef2fa 0%, #97a0b1 9%, #454a55 23%, #2b2e36 37%,
                #b3bccd 51%, #33373f 65%, #7a8394 82%, #e8edf7 100%) border-box;
            box-shadow: inset 0 1px 0 rgba(232,239,250,0.10),
                        inset 0 -1px 0 rgba(0,0,0,0.42);
        }
        /* Подсветка героя семантическая: зелёная = плечо проходит, красная = нет.
           Сторону сделки несут подпись и сегмент ЛОНГ/ШОРТ, а не цвет. */
        .bd-hero::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: radial-gradient(80% 120% at 100% 0%, rgba(48,209,88,0.16) 0%, rgba(0,0,0,0) 62%);
        }
        .bd-hero.s-stop::after {
            background: radial-gradient(80% 120% at 100% 0%, rgba(255,69,58,0.22) 0%, rgba(0,0,0,0) 62%);
        }
        .bd-vlabel { position: relative; z-index: 1; font-size: 0.62em; font-weight: 900;
                     letter-spacing: 0.24em; color: #9292a6; }
        .bd-vnum {
            position: relative; z-index: 1; font-size: 3.4em; font-weight: 900;
            line-height: 0.92; letter-spacing: -0.035em; margin: 2px 0 1px;
            font-variant-numeric: tabular-nums;
        }
        .bd-vstop { position: relative; z-index: 1; font-size: 1.35em; font-weight: 900;
                    line-height: 1.15; letter-spacing: 0.01em; color: var(--red); margin: 4px 0 2px; }
        .bd-vwhy  { position: relative; z-index: 1; font-size: 0.8em; color: #b6b6c6; line-height: 1.4; }
        /* Строка выбранного плеча — единственное место, где живёт нажатая
           кнопка. Отделена рамкой, чтобы её нельзя было спутать с ИТОГОМ. */
        .bd-pick {
            position: relative; z-index: 1; display: flex;
            justify-content: space-between; align-items: baseline;
            margin-top: 11px; padding: 9px 11px;
            border: 1px solid #3a3a46; border-radius: 11px; background: rgba(0,0,0,0.28);
            font-size: 0.86em;
        }
        /* Сегмент ЛОНГ/ШОРТ внутри доски */
        .bd-seg { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr;
                  gap: 6px; margin-top: 12px; }
        .bd-sbtn {
            padding: 9px 0; border-radius: 10px; font-size: 12px; font-weight: 800;
            letter-spacing: 0.1em; cursor: pointer;
            background: #23232b; border: 1px solid #35353f; color: #82828f;
        }
        .bd-sbtn.on-long  { background: var(--green); border-color: var(--green); color: #06210f; }
        .bd-sbtn.on-short { background: var(--red);   border-color: var(--red);   color: #2a0806; }
        /* Строка «метка → значение» */
        .bd-kv { display: flex; justify-content: space-between; align-items: baseline;
                 gap: 10px; margin: 7px 0; font-size: 0.86em; }
        .bd-k  { color: #a2a2b2; }
        .bd-v  { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
        /* Волосяной разделитель между метриками в одной строке значения:
           разводит b= / R2 / rho, не добавляя строке заметной ширины. */
        .bd-msep { display: inline-block; width: 1px; height: 0.82em; margin: 0 5px;
                   background: #4d4d5c; border-radius: 1px; vertical-align: -0.06em; }
        .bd-note { font-size: 0.76em; color: #91919f; line-height: 1.45; margin-top: 8px; }
        .bd-warn { font-size: 0.78em; color: var(--accent); line-height: 1.45; margin-top: 8px; }
        .bd-bad  { font-size: 0.78em; color: var(--red);    line-height: 1.45; margin-top: 8px; }
        /* Точка входа: крупная цена между большими шагами */
        .bd-ent { display: grid; grid-template-columns: 58px 1fr 58px; gap: 8px; }
        .bd-step {
            border-radius: 13px; font-size: 1.55em; font-weight: 800; line-height: 1;
            cursor: pointer; background: #23232b; color: #d8d8e2; border: 1px solid #3a3a46;
        }
        .bd-step:active { background: #2f2f3a; }
        .bd-pricebox {
            border-radius: 13px; padding: 9px 6px; cursor: pointer; text-align: center;
            background: #1a1a21; border: 1px dashed #46464f;
        }
        .bd-price { font-size: 1.5em; font-weight: 900; color: var(--accent);
                    font-variant-numeric: tabular-nums; line-height: 1.05; }
        .bd-pricesub { font-size: 0.66em; color: #9a9aa8; margin-top: 3px; letter-spacing: 0.06em; }
        .bd-chips { display: grid; grid-template-columns: repeat(5,1fr); gap: 5px; margin-top: 8px; }
        /* Карандаш: базовый акцентный вид. Стоит ДО .on, чтобы выбранное
           состояние его перекрывало (та же специфичность, побеждает последнее). */
        .bd-chip.pen { color: var(--accent); border-color: rgba(243,186,47,0.45); }
        /* Нажатая кнопка — единый вид со всеми блоками доски (МОНЕТЫ/USDT, плечо). */
        .bd-chip.on { background: rgba(243,186,47,0.16); border-color: rgba(243,186,47,0.6);
                      color: var(--accent); box-shadow: 0 0 0 1px rgba(243,186,47,0.18) inset; }
        .bd-cur { font-size: 0.5em; font-weight: 800; opacity: 0.75; letter-spacing: 0.08em; }
        .bd-chip {
            padding: 9px 0; border-radius: 9px; font-size: 11px; font-weight: 800;
            cursor: pointer; background: #23232b; border: 1px solid #33333d; color: #b7b7c4;
        }
        .bd-chip:active { background: #2f2f3a; }
        /* Единица размера: МОНЕТЫ | карандаш | USDT.
           1fr / auto / 1fr — карандаш стоит ровно в центре при любой ширине экрана. */
        .bd-unit { display: grid; grid-template-columns: 1fr 62px 1fr; gap: 8px; margin-top: 8px; }
        .bd-ubtn {
            padding: 11px 0; border-radius: 11px; font-size: 12px; font-weight: 800;
            letter-spacing: 0.09em; cursor: pointer; background: #23232b;
            border: 1px solid #33333d; color: #8f8f9d;
        }
        .bd-ubtn.on {
            background: rgba(243,186,47,0.15); border-color: rgba(243,186,47,0.65);
            color: var(--accent); box-shadow: 0 0 0 1px rgba(243,186,47,0.18) inset;
        }
        .bd-ubtn:active { background: #2f2f3a; }
        .bd-upen {
            padding: 11px 0; border-radius: 11px; font-size: 15px; line-height: 1;
            cursor: pointer; background: #1c1c23; color: var(--accent);
            border: 1px solid rgba(243,186,47,0.45);
        }
        .bd-upen:active { background: #2f2f3a; }
        /* Лестница уровней */
        .bd-lad { position: relative; padding-left: 20px; margin-top: 2px; }
        .bd-lad::before {
            content: ''; position: absolute; left: 4px; top: 8px; bottom: 10px; width: 2px;
            border-radius: 2px; opacity: 0.55;
            background: linear-gradient(180deg, var(--accent) 0%, #b07a1e 45%, var(--red) 100%);
        }
        .bd-node { position: relative; margin: 11px 0; }
        .bd-node::before {
            content: ''; position: absolute; left: -20px; top: 4px;
            width: 10px; height: 10px; border-radius: 50%;
            background: #15151b; border: 2px solid #55555f;
        }
        .bd-node.n-acc::before { border-color: var(--accent); }
        .bd-node.n-red::before { border-color: var(--red); }
        .bd-nl { font-size: 0.72em; letter-spacing: 0.1em; color: #9797a8; font-weight: 800; }
        .bd-nv { font-size: 1.05em; font-weight: 900; font-variant-numeric: tabular-nums; }
        .bd-nd { font-size: 0.74em; color: #91919f; }
        /* Плечи */
        .bd-levs { display: grid; grid-template-columns: repeat(6,1fr); gap: 5px; }
        .bd-lev {
            padding: 10px 0 8px; border-radius: 10px; cursor: pointer;
            background: #202028; border: 1px solid #33333d; color: #7e7e8c;
            font-size: 12px; font-weight: 900; line-height: 1.15;
        }
        .bd-lev .lp { display: block; font-size: 8.5px; font-weight: 700; margin-top: 3px;
                      letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
        .bd-lev.ok  { border-color: rgba(48,209,88,0.5);  color: var(--green); }
        .bd-lev.bad { border-color: rgba(255,69,58,0.34); color: #b0605a; }
        /* Заливка = выбрано, цвет заливки = проходит/не проходит. */
        .bd-lev.ok.sel  { background: rgba(48,209,88,0.20); border-color: var(--green);
                          color: var(--green); box-shadow: inset 0 0 0 1px rgba(48,209,88,0.5); }
        .bd-lev.bad.sel { background: rgba(255,69,58,0.18); border-color: var(--red);
                          color: var(--red); box-shadow: inset 0 0 0 1px rgba(255,69,58,0.45); }
        /* Полоски вероятности */
        .bd-prow { display: grid; grid-template-columns: 52px 1fr 46px; gap: 9px;
                   align-items: center; margin: 8px 0; }
        .bd-plab { font-size: 0.74em; color: #a2a2b2; font-weight: 700; letter-spacing: 0.06em; }
        .bd-track { height: 7px; border-radius: 5px; background: #26262e; overflow: hidden; }
        .bd-fill  { height: 100%; border-radius: 5px; }
        .bd-pval  { font-size: 0.8em; font-weight: 900; text-align: right;
                    font-variant-numeric: tabular-nums; }
        /* Диапазон 90 дней */
        .bd-center { text-align: center; }
        /* Положение цены — крупное белое число по центру. Плавающая подпись над
           маркером убрана: у краёв она наезжала на МИН/МАКС. */
        /* Единый типографический знак: число компактнее, «%» подтянут к нему.
           Курсив — как у остальных числовых акцентов калькулятора. */
        .bd-rpct {
            text-align: center; color: #fff; font-weight: 900; font-style: italic;
            font-size: 1.78em; line-height: 1; letter-spacing: -0.012em;
            margin: 4px 0 13px; font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 14px rgba(255,255,255,0.13);
        }
        .bd-rpct-s {
            font-size: 0.62em; font-weight: 800; margin-left: 1px;
            opacity: 0.92; letter-spacing: -0.02em;
        }
        /* Подписи «цена выше / ниже на N%» — белые, курсив (правка Босса 09.08) */
        .bd-rsub {
            font-size: 0.76em; font-style: italic; color: #ffffff;
            opacity: 0.88; letter-spacing: 0.005em; margin-top: 2px;
        }
        .bd-rng { position: relative; height: 12px; border-radius: 7px; margin: 4px 0 10px;
                  box-shadow: inset 0 1px 3px rgba(0,0,0,0.55); }
        .bd-rmark {
            position: absolute; top: -6px; width: 4px; height: 24px; border-radius: 3px;
            background: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.75); transform: translateX(-2px);
        }
        .bd-rends { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .bd-rend  { font-size: 0.76em; line-height: 1.35; }
        .bd-rcap  { font-size: 0.8em; letter-spacing: 0.16em; font-weight: 900; }
        .bd-rnum  { font-size: 1.02em; font-weight: 900; font-variant-numeric: tabular-nums; }
        /* Доверие к модели */
        .bd-conf { display: grid; grid-template-columns: 1fr 62px; gap: 11px; align-items: center; }
        .bd-cbar { height: 9px; border-radius: 6px; background: #26262e; overflow: hidden; }
        .bd-cnum { font-size: 1.25em; font-weight: 900; text-align: right;
                   font-variant-numeric: tabular-nums; }
        /* Экран ввода пароля */
        #lock-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px;
        }
        #lock-screen .lock-box {
            background: var(--card); border: 1px solid #333;
            border-radius: 16px; padding: 28px 22px;
            width: 100%; max-width: 360px; text-align: center;
        }
        #lock-screen .lock-logo { font-size: 2.6em; color: var(--accent); font-weight: bold; margin-bottom: 6px; }
        #lock-screen .lock-title {
            font-size: 1.15em; font-weight: 700; margin-bottom: 18px;
            color: var(--text); letter-spacing: 0.02em;
            word-break: keep-all; line-height: 1.35;
        }
        #lock-input {
            width: 100%; box-sizing: border-box;
            background: #2c2c31; border: 1px solid #444;
            color: var(--text); font-size: 1.1em;
            padding: 12px 14px; border-radius: 10px;
            text-align: center; letter-spacing: 0.05em;
            margin-bottom: 12px; outline: none;
        }
        #lock-input:focus { border-color: var(--accent); }
        #lock-btn {
            width: 100%; background: var(--accent); color: #000;
            font-size: 1.05em; font-weight: 700; border: none;
            padding: 12px; border-radius: 10px; cursor: pointer;
        }
        #lock-error { color: var(--red); font-size: 0.85em; margin-top: 10px; min-height: 18px; }
    </style>
</head>
<body>

<div id="lock-screen">
    <div class="lock-box">

        <input type="password" id="lock-input" placeholder="Введите код доступа" autocomplete="off" inputmode="text">

</div>

<div class="control">
    <div class="btc-header">
        <span id="btc-logo" class="btc-logo">&#8383;</span>
        <span id="btc-cur" class="btc-price">...</span>

            <span id="btc-target">Прогноз BTC: ...</span><span id="btc-target-arrow" style="font-size:1.3em;font-weight:700;line-height:1;vertical-align:-2px;margin-left:4px;"></span>
        </div>
        <div style="text-align:right;">
            <div id="btc-pct" style="font-weight:bold;color:#ffffff;">0.00%</div>
            <div id="dir-indicator" style="font-size:0.75em;font-weight:800;color:#888;">&#8212;&#8212;</div>
        </div>
    </div>
    <div id="btc-range" class="btc-range">Диапазон BTC 90д: ...</div>
    <div style="display:flex;align-items:center;gap:6px;margin:6px 0;">
        <button id="btn-minus" style="
            background:#2c1f1f;border:1px solid var(--red);color:var(--red);
            font-size:1.4em;font-weight:900;width:38px;height:38px;
            border-radius:8px;cursor:pointer;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;

               style="flex:1;margin:0;">

            background:#1a2a1f;border:1px solid var(--green);color:var(--green);
            font-size:1.4em;font-weight:900;width:38px;height:38px;
            border-radius:8px;cursor:pointer;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;
            line-height:1;">&#43;</button>
    </div>
    <div class="side3" id="sideContainer"></div>

    <div class="stress-container" id="stressContainer"></div>
</div>

<div id="results">Загрузка данных...</div>

<div id="board"></div>

<script>
// ── Защита паролем ──────────────────────────────────────────────────────────
// Пароль запоминается на устройстве через localStorage: вводится один раз,
// потом калькулятор открывается сразу. На чужом устройстве (где localStorage
// пустой) без пароля доступа нет.
(function() {
    var ACCESS_CODE = 'AV777SA';
    var LS_KEY = 'cryptoEngineAccess';

    function unlock() {
        var ls = document.getElementById('lock-screen');
        if (ls) ls.style.display = 'none';
    }

    // Уже разблокировано на этом устройстве?
    try {
        if (localStorage.getItem(LS_KEY) === ACCESS_CODE) {
            unlock();
        }
    } catch(e) {}

    function tryLogin() {
        var inp = document.getElementById('lock-input');
        var err = document.getElementById('lock-error');
        if (!inp) return;
        if (inp.value === ACCESS_CODE) {
            try { localStorage.setItem(LS_KEY, ACCESS_CODE); } catch(e) {}
            if (err) err.innerText = '';
            unlock();
        } else {
            if (err) err.innerText = 'Неверный код, попробуйте снова';
            inp.value = '';
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        var btn = document.getElementById('lock-btn');
        var inp = document.getElementById('lock-input');
        if (btn) btn.addEventListener('click', tryLogin);
        if (inp) inp.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') tryLogin();
        });
    });
})();

// ── Состояние ──────────────────────────────────────────────────────────────
// currentSide — режим экрана. 'none' = обзор рынка (карточки компактные,
// порядок ручной). 'long'/'short' = карточки пересортированы по силе кандидата.
var currentSide   = 'none';
// Режим стресса множит бету и меняет ДИАГНОСТИЧЕСКИЙ прогноз на карточке.
// В решение по плечу (ИТОГ) он не входит — там своя математика.
var currentStress = 'normal';
// Ручной выбор плеча вернулся: им управляются строки LONG/SHORT-ликвидации
// на карточке и проверка «проходит ли выбранное плечо» в блоке входа.
var currentLev    = 3;
// Вход по каждой монете. Сессионное состояние: вчерашний вход с сегодняшними
// данными опаснее ручного счёта, поэтому в localStorage не пишется.
var entryState = {};   // { SYM: { open:true, price:<цена монеты> } }
// Открытая полноэкранная доска CRYPTO FUTURE. Одна монета за раз.
// Тоже сессионное: доска = развёрнутый вход, хранить её между запусками опасно.
var boardSym  = null;
// Сторона ВНУТРИ доски. Отдельно от currentSide: доску можно открыть прямо из
// ОБЗОРА нажатием на имя монеты, не пересортировывая весь список.
var boardSide = 'long';
// Пороги релевантности стороны по положению в 90д-диапазоне (правка Босса 09.08).
// Ниже 25% шорт бессмысленен, выше 75% бессмысленен лонг: Босс торгует
// контртренд от краёв, а не вход в середину уже состоявшегося движения.
var REL_LOW   = 25;
var REL_HIGH  = 75;
// Показывать ли монеты, для которых выбранная сторона нерелевантна.
var showOff   = false;
// Снимок строк последнего рендера — доска берёт данные отсюда, чтобы не
// пересчитывать список заново на каждой перерисовке тикера.
var lastRows  = [];
// Символы монет, реально показанных в списке — для нумерации места в доске.
var lastShownSyms = [];

var STRESS_MULT  = { normal: 1.0, panic: 1.3, crash: 1.8 };
var STRESS_BADGE = { normal: '',   panic: 'b*1.3', crash: 'b*1.8' };

// ── Константы риска ────────────────────────────────────────────────────────
// Maintenance margin. 0.0125 подтверждён обратным счётом по трём реальным
// позициям Босса (XMR 1.28%, YFI 1.25%, LIT 1.13%). Прежний 0.01 давал
// ликвидацию ДАЛЬШЕ реальной, то есть ошибался в опасную сторону.
var LIQ_MMR   = 0.0125;
var RISK_Z    = 1.645;    // 10% вероятности касания (принцип отражения)
// Горизонт шума = 7 суток. Прежние 30 суток были самым чувствительным
// параметром системы и в одиночку двигали вердикт на две ступени плеча,
// не будучи связанными ни с одним решением Босса.
var H_NOISE   = 168;
// Окно реакции: сколько часов позиция может стоять без присмотра (сон/работа).
var H_REACT   = 12;
var H_BTC     = 168;      // тот же горизонт для стресса BTC
var L_CAP     = 7;        // математический потолок
var L_MIN     = 2;        // ниже -> «БЕЗ БЕЗОПАСНОГО ПЛЕЧА», 1X не рекомендуем
var INV_FLOOR_SD = 2.0;   // пол дистанции инвалидации в дневных сигмах
// Потолок дистанции инвалидации. Если структурный уровень дальше 6 дневных
// сигм (за 7 суток это движение с вероятностью ~2%), это уже не стоп, а
// пожелание: по такому уровню выйти невозможно. Тогда опоры рядом НЕТ,
// дистанция обрезается, и карточка честно об этом предупреждает. Без этого
// потолка вход в середине диапазона давал «БЕЗ ПЛЕЧА» — то есть далёкая
// опора трактовалась как огромный риск вместо отсутствия ориентира.
var INV_CAP_SD   = 6.0;
// Потолок потери на СТОП по марже. Профессиональная замена фиксированному
// «стоп не дальше 10%»: расстояние до стопа задаёт структура монеты, а
// ограничивается не сам стоп, а ПЛЕЧО — стоп нельзя подтягивать в шум.
// 0.35 маржи = при типичной марже в 10% счёта это 3.5% счёта на сделку.
var MAX_MARGIN_LOSS = 0.35;
// Маржа позиции в USDT. Сессионная: вчерашний размер с сегодняшней ценой
// опаснее ручного счёта (тот же принцип, что и с ценой входа).
var posMargin = 100;
// Единица ввода размера: 'usdt' — задаётся маржа, 'coin' — количество монет.
// Сессионное, как и сам размер: вчерашнее количество с сегодняшней ценой — другие деньги.
var sizeMode = 'usdt';
var posQty   = 0;
// Пороги «созревания» шорта. Живут ОДНИМ числом на два места: их читает
// scoreCandidate (штраф счёта) и блок «ШОРТ СОЗРЕЕТ, КОГДА» (что показать
// Боссу). Разъехавшись, они начали бы врать друг про друга.
var EFF_TREND    = 0.6;   // |eff14| выше -> движение идёт прямой линией
var PACE_Z       = 0.25;  // порог, с которого темп считается сломанным
var VOL_ABNORMAL = 2.0;   // vol7/vol90 -> потолок 3X
var VOL_HARD     = 0.02;  // 2%/ч      -> потолок 2X
var VOL_STOP     = 0.03;  // 3%/ч      -> плечо не выдаётся
// Остаток к BTC (res7). Оба числа читаются РОВНО в одном месте — в residual7();
// карточка и доска берут готовый вердикт (инвариант 20).
// На счёт, плечо и ранжирование НЕ влияют: чистое отображение.
// 1.0 — остаток ровно в одну свою недельную сигму. Срабатывает примерно
// в 32% недель случайно: подсвеченных монет хватает для сортировки, но не все подряд.
// Порог 0.5 отвергнут: срабатывал бы в 62% недель, то есть ничего не говорил.
var RES_Z        = 1.0;   // |остаток| в недельных сигмах ОСТАТКА -> «своим ходом»
var RES_R2_CAP   = 0.90;  // потолок R² в √(1−R²): защита от деления на почти ноль

// ── Position protection (§3.11) ────────────────────────────────────────────
// Taker fee of ONE leg, Binance USDⓈ-M. Both legs are priced as taker on
// purpose: a stop exit is a stop-MARKET order, and assuming taker on entry
// as well errs on the safe side of break-even.
var FEE_TAKER   = 0.0005;
// Funding payments inside the 7-day horizon: 3 per day x 7 days. Read by the
// funding block AND by the break-even price - one number per system (inv. 20).
var FUND_PAY_7D = 21;
// Break-even trigger, in units of R (entry -> structural stop). R is the only
// risk unit this system actually measures, so the classic 1R rule costs no
// new assumption. The block always prints the price of acting on it.
var ARM_R       = 1.0;

// ── Движок направления (§3.12) ─────────────────────────────────────────────
// Пороги каскада вето. Ни одно из этих чисел ничего не предсказывает: они
// описывают ГЕОМЕТРИЮ сделки, которая измерима без прогноза. Предсказательный
// слой закрыт измерением (§3.10b), поэтому новых весов ранжирования здесь нет.
// RR_MIN — то же число 2, которое доска уже печатает в «ЕСЛИ СРАБОТАЕТ»:
// «отношение ниже 1:2 означает, что сделка должна угадывать чаще, чем
// ошибаться». Одно число на систему — доска и вето читают отсюда (инв. 20).
var RR_MIN         = 2.0;
// Цель ближе одной НЕДЕЛЬНОЙ сигмы — за правоту не заплатят: рынок доходит
// туда болтанкой. Горизонт H_NOISE, тот же, на котором считается плечо.
var TGT_SIGMA_MIN  = 1.0;
// Удаление входа от 24ч-опоры в ДНЕВНЫХ сигмах. Больше — это погоня: вход
// даётся не по цене сетапа, а по цене после движения.
var ENTRY_CHASE_SD = 0.5;
// Недельный ход BTC в его собственных сигмах, с которого рынок считается
// стрессовым и новых входов не выдаётся вовсе.
var REG_STRESS_Z   = 2.0;
// Окно катализатора в днях: событие дальше него на решение недели не влияет.
var CAT_WINDOW_D   = 14;
// Границы тиров счёта. Единственный читатель — tierOf (имя и цвет), одно
// число на систему (инв. 20). Номер к тиру больше НЕ привязан: место в

// ── Катализаторы (§3.12, слой 3) ───────────────────────────────────────────
// ЕДИНСТВЕННЫЙ внешний вход движка. Заполняется вручную из анализа рынка:
// автоматического источника нет и строить его не оправдано.
// ЖЁСТКОЕ правило: катализатор умеет ТОЛЬКО ветировать сторону. Ни поднять
// счёт, ни отменить вето геометрии он не может. Именно катализатор,
// поставленный выше геометрии, произвёл шорт GRAM на дне диапазона 18.08.
//   d   — дата события, ISO, UTC
//   dir — сторона, КОТОРУЮ событие поддерживает: long | short
//   t   — короткая причина для карточки
// Событие старше суток и дальше CAT_WINDOW_D игнорируется. Разлок всегда
// пишется dir:'short': он ветирует лонг и при этом не создаёт шорт.
// The registry itself no longer lives in this file. It is `catalysts.json` at
// the repository root, loaded once at startup. It moved out because a veto is
// the STRONGEST action in the engine and it was standing on the WEAKEST data in
// the system: three hand-typed strings with no source. Only a `confirmed` entry
// may close a side now; anything else may annotate and nothing more (inv. 39).
// Entry fields: d · dir · kind · t · conf · src · added.
var CATALYSTS  = {};
var CAT_LOADED = false;
var CAT_ERR    = null;

// Install a payload. Kept apart from transport on purpose, so the bench can
// exercise every rejection path without a server. Anything unexpected leaves
// CATALYSTS empty AND CAT_ERR set: an empty registry and an unavailable
// registry are different states and must not render the same (inv. 40).
function catalystsApply(txt) {
    var data;
    try { data = JSON.parse(txt); }
    catch (e) { CAT_ERR = '\u0444\u0430\u0439\u043b \u043d\u0435 \u0440\u0430\u0437\u043e\u0431\u0440\u0430\u043b\u0441\u044f'; return false; }
    if (!data || data.v !== 1) { CAT_ERR = '\u0432\u0435\u0440\u0441\u0438\u044f \u0441\u0445\u0435\u043c\u044b \u043d\u0435 1'; return false; }
    if (!data.items || typeof data.items !== 'object') { CAT_ERR = '\u043d\u0435\u0442 items'; return false; }
    CATALYSTS  = data.items;
    CAT_LOADED = true;
    CAT_ERR    = null;
    return true;
}

// ES5 XHR against a same-origin relative path: no fetch, no arrow functions, no
// template literals — this page runs on the Boss's phone. The board NEVER waits
// on it: update() runs whether or not the file has arrived, and a failed load
// costs the veto layer, not the board.
function loadCatalysts() {
    var xhr;
    try {
        xhr = new XMLHttpRequest();
        xhr.open('GET', 'catalysts.json?t=' + Date.now(), true);
    } catch (e) {
        CAT_ERR = '\u0437\u0430\u043f\u0440\u043e\u0441 \u043d\u0435 \u043e\u0442\u043a\u0440\u044b\u043b\u0441\u044f';
        return;
    }
    xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;
        if (xhr.status !== 200) CAT_ERR = 'HTTP ' + xhr.status;
        else catalystsApply(xhr.responseText);
        update();
    };
    xhr.onerror = function() {
        CAT_ERR = '\u0441\u0435\u0442\u044c \u043d\u0435\u0434\u043e\u0441\u0442\u0443\u043f\u043d\u0430';
        update();
    };
    try { xhr.send(); }
    catch (e) { CAT_ERR = '\u0437\u0430\u043f\u0440\u043e\u0441 \u043d\u0435 \u043e\u0442\u043f\u0440\u0430\u0432\u043b\u0435\u043d'; }
}

function applySavedOrder() {
    try {
        var saved = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
        if (!Array.isArray(saved) || !saved.length) return;
        var map = {};
        tokens.forEach(function(t) { map[t.name] = t; });

        saved.forEach(function(n) { if (map[n]) { out.push(map[n]); delete map[n]; } });
        Object.keys(map).forEach(function(n) { out.push(map[n]); });
        tokens = out;
    } catch(e) {}
}

// Чистая функция: ни DOM, ни собственного чтения часов внутри — состояние
// считается только из возраста данных и переданного момента. Вынесена тем же
// приёмом, что tierBadge / stateMark / verdictNote, чтобы стенд исполнял именно
// продакшн-правило, не подменяя глобальные часы (инв. 21, bench/fresh_bench.js).
//
// Внутри ночного окна возраст сверяется не со STALE_*, а с последним ПЛАНОВЫМ
// прогоном 01:50: допуск прощает ровно один пропущенный час, два пропущенных
// снова дают красный. Что именно пропало за одну ночную дырку, разбирается по
// журналу прогона (строка OK/FAIL бота), а не по бейджу.
function freshnessState(ageMin, now) {
    var mins = Math.max(0, Math.round(ageMin));
    var h    = now.getHours();
    if (h >= 2 && h < SCHED_FIRST_H) {
        var expectedMin = (h - SCHED_LAST_H) * 60 + (now.getMinutes() - SCHED_LAST_M);
        if (ageMin <= expectedMin + STALE_WARN_MIN) {
            return { kind: 'pause', mins: mins };
        }
    }
    if (ageMin > STALE_CRIT_MIN) return { kind: 'crit', mins: mins };
    if (ageMin > STALE_WARN_MIN) return { kind: 'warn', mins: mins };
    return { kind: 'ok', mins: mins };
}

function updateFreshnessDisplay() {
    var el = document.getElementById('last-update');
    if (!el) return;
    if (!botData.generated_at) {
        el.innerText   = 'Нет данных';
        el.style.color = 'var(--red)';
        return;
    }
    var nowDate = new Date();
    var genDate = new Date(botData.generated_at);
    var ageMin  = (nowDate.getTime() - genDate.getTime()) / 60000;
    var st      = freshnessState(ageMin, nowDate);
    var mins    = st.mins;
    if (st.kind === 'crit') {
        el.innerText   = '! Молчит ' + mins + ' мин';
        el.style.color = 'var(--red)';
    } else if (st.kind === 'warn') {
        el.innerText   = 'Обновлено ' + mins + ' мин';
        el.style.color = 'var(--accent)';
    } else if (st.kind === 'pause') {
        el.innerText   = '\u041F\u0430\u0443\u0437\u0430 \u0440\u0430\u0441\u043F\u0438\u0441\u0430\u043D\u0438\u044F \u00B7 '
                       + mins + ' \u043C\u0438\u043D';
        el.style.color = '#888';
    } else {
        el.innerText   = ageMin < 1 ? 'Обновлено сейчас' : 'Обновлено ' + mins + ' мин';
        el.style.color = '#888';
    }
}

function refreshMarketData(isRetry) {
    var logo = document.getElementById('btc-logo');
    var priceEl = document.getElementById('btc-cur');
    if (logo) logo.classList.add('loading');
    if (priceEl) priceEl.classList.add('loading');
    var wasSymbols = useSymbolsParam;
    fetch(marketTickerUrl())
        .then(function(res) {
            if (!res.ok) throw new Error('http ' + res.status);
            return res.json();
        })
        .then(function(data) {
            if (!data || typeof data.length !== 'number') throw new Error('bad ticker payload');
            cachedMarketData = data;
            if (!sliderInitialized && data.length > 0) {
                var btcObj = null;
                for (var i = 0; i < data.length; i++) {
                    if (data[i].symbol === 'BTCUSDT') { btcObj = data[i]; break; }
                }
                if (btcObj) {
                    document.getElementById('slider').value = Math.round(parseFloat(btcObj.lastPrice));
                    sliderInitialized = true;
                }
            }
            update();
        })
        .catch(function() {
            if (wasSymbols && !isRetry) {
                useSymbolsParam = false;
                refreshMarketData(true);
            }
        })
        .finally(function() {
            setTimeout(function() {
                if (logo) logo.classList.remove('loading');
                if (priceEl) priceEl.classList.remove('loading');
            }, 500);
        });
}

// ── Мелкие утилиты ──────────────────────────────────────────────────────────
function has(v) { return v !== null && v !== undefined && typeof v === 'number' && isFinite(v); }
function firstNum() {
    for (var i = 0; i < arguments.length; i++) if (has(arguments[i])) return arguments[i];
    return null;
}
function clamp01(x) { return Math.max(0, Math.min(1, x)); }
// Точность как была до правки: всегда 4 знака. Так цены на карточке,
// в блоке входа и в строке ликвидаций читаются одним столбцом.
function fmtP(x) {
    if (!isFinite(x)) return '?';
    return x < 0.0001 ? '&lt;0.0001' : '$' + x.toFixed(4);
}
// Число, попадающее в onclick-атрибут: без хвоста плавающей точки.
function numAttr(x) { return Math.round(x * 1e6) / 1e6; }
function pctTxt(x, digits) { return (x >= 0 ? '+' : '') + (x * 100).toFixed(digits === undefined ? 1 : digits) + '%'; }

function setSide(mode) {
    currentSide = mode;
    // Доска больше не закрывается в ОБЗОРЕ: её открывают нажатием на имя монеты.
    // Смена ЛОНГ/ШОРТ в списке ведёт сторону доски за собой — иначе два разных

    if (mode !== 'none') boardSide = mode;
